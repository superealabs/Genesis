        extension: "cs"
        content: |
          namespace ${majStart(projectName)}.Specification;

          using System.Linq.Expressions;
          using ${majStart(projectName)}.Models;
          using ${majStart(projectName)}.Models.Dto;
          using ${majStart(projectName)}.Utils;

          public sealed class ${majStart(className)}FilterBuilder : FilterBuilder<${majStart(className)}, ${majStart(className)}Dto>
          {
              public override ${majStart(className)}FilterBuilder Build(${majStart(className)}Dto dto)
              {
              {{tab}}{{#each fields}}{{#if this.isPrimaryKey}}
              {{tab}}AddEquals(e => e.${majStart(this.name)}, dto.${majStart(this.name)});{{elseIf this.isForeignKey}}
              {{tab}}
              {{tab}}AddEquals(e => e.${majStart(this.columnNameField)}, dto.${majStart(this.columnNameField)});  
              {{tab}}if (dto.${majStart(this.name)} is { } ${this.name})
                      {{tab}}AddEquals(e => e.${majStart(this.columnNameField)}, ${this.name}.${toPascalCase(this.referencedPrimaryKeyColumn)});
              {{elseIf this.isTimeTz}}
              {{tab}}AddEqualsTimeOfDay(e => e.${majStart(this.name)}, dto.${majStart(this.name)});
              {{tab}}AddRangeTimeOfDay(e => e.${majStart(this.name)}, dto.${majStart(this.name)}Min, dto.${majStart(this.name)}Max);
              {{elseIf this.isNumeric or this.isDate or this.isTime or this.isDateTime or this.isInterval}}
              {{tab}}AddRange(e => e.${majStart(this.name)},  dto.${majStart(this.name)}Min,  dto.${majStart(this.name)}Max);
              {{tab}}AddEquals(e => e.${majStart(this.name)}, dto.${majStart(this.name)});
              {{elseIf this.isText}}
              {{tab}}AddLike(e => e.${majStart(this.name)}, dto.${majStart(this.name)});
              {{tab}}{{else}}
              {{tab}}AddEquals(e => e.${majStart(this.name)}, dto.${majStart(this.name)});{{/if}}{{#if !@last}}{{newline}}{{/if}}
              {{tab}}{{/each}}
                  return this;
              }
          }
