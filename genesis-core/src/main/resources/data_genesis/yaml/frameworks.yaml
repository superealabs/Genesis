    - fileType: "mainProject"
      fileName: "urls"
      extension: "py"
      content: |
        from django.contrib import admin
        from django.urls import path, include
        from drf_yasg.views import get_schema_view
        from drf_yasg import openapi
        from rest_framework.permissions import AllowAny

        from ${projectName}.api import viewsets

        schema_view = get_schema_view(
            openapi.Info(
                title="${projectName} API",
                default_version='v1',
                description="REST API for ${projectName} with function-based views",
                contact=openapi.Contact(email="admin@${projectName}.com"),
                license=openapi.License(name="MIT License"),
            ),
            public=True,
            permission_classes=(AllowAny,),
        )

        urlpatterns = [
            path('', schema_view.with_ui('swagger', cache_timeout=0), name='schema-swagger-ui'),
            path('admin/', admin.site.urls),
            {{#each entities}}
            path('api/${lowerCase(this)}/', viewsets.${lowerCase(this)}_list_create, name='${lowerCase(this)}-list-create'),
            path('api/${lowerCase(this)}/<int:pk>/', viewsets.${lowerCase(this)}_detail, name='${lowerCase(this)}-detail'),
            {{/each}}
            path('swagger/', schema_view.with_ui('swagger', cache_timeout=0), name='schema-swagger-ui'),
            path('redoc/', schema_view.with_ui('redoc', cache_timeout=0), name='schema-redoc'),
        ]
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}"

    - fileType: "python"
      fileName: "__init__"
      extension: "py"
      content: |
        # Auto-discover and export all function-based views in this package
        import pkgutil
        import importlib
        import inspect
        from types import FunctionType

        __all__ = []

        for _, module_name, _ in pkgutil.iter_modules(__path__):
            module = importlib.import_module(f"{__name__}.{module_name}")
            for name, obj in inspect.getmembers(module):
                if isinstance(obj, FunctionType) and obj.__module__ == module.__name__:
                    globals()[name] = obj
                    __all__.append(name)
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/api/viewsets"

    - fileType: "mainProject"
      fileName: "wsgi"
      extension: "py"
      content: |
        import os
        from django.core.wsgi import get_wsgi_application

        os.environ.setdefault('DJANGO_SETTINGS_MODULE', '${projectName}.settings')
        application = get_wsgi_application()
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}"
