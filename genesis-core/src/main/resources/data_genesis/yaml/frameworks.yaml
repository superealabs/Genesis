    - fileType: "ConstraintDisabler"
      fileName: "ConstraintDisabler"
      extension: "cs"
      content: |
        namespace ${majStart(projectName)}.Utils;
  
        using System;
        using System.Collections.Generic;
        using System.Data;
        using System.Data.Common;
        using System.Linq;
        using System.Text.RegularExpressions;
        {{#if databaseType = SQL Server}}
        using Microsoft.Data.SqlClient;
        {{else}}{{removeLine}}{{/if}}
        {{#if databaseType = MySQL}}
        using MySqlConnector;
        {{else}}{{removeLine}}{{/if}}
        {{#if databaseType = PostgreSQL}}
        using Npgsql;
        {{else}}{{removeLine}}{{/if}}
        {{#if databaseType = Oracle}}
        using Oracle.ManagedDataAccess.Client;
        {{else}}{{removeLine}}{{/if}}
        
        public class ConstraintDisabler
        {
          public enum DbType { PostgreSQL, MySQL, SQLServer, Oracle }
      
          private readonly DbConnection _connection;
          private readonly DbType _dbType;
          private readonly Stack<string> _restoreDdls = new Stack<string>();
          private readonly HashSet<string> _processedTables = new HashSet<string>();

          public ConstraintDisabler(DbConnection connection)
          {
            _connection = connection ?? throw new ArgumentNullException(nameof(connection));
            _dbType = DetectDatabaseType();
          }

          private DbType DetectDatabaseType()
          {
            switch (_connection)
            {
              {{#if databaseType = PostgreSQL}}
              case NpgsqlConnection:
                return DbType.PostgreSQL;
              {{else}}{{removeLine}}{{/if}}
              {{#if databaseType = MySQL}}
              case MySqlConnection:
                  return DbType.MySQL;
              {{else}}{{removeLine}}{{/if}}
              {{#if databaseType = SQL Server}}
              case SqlConnection:
                  return DbType.SQLServer;
              {{else}}{{removeLine}}{{/if}}
              {{#if databaseType = Oracle}}
              case OracleConnection:
                  return DbType.Oracle;
              {{else}}{{removeLine}}{{/if}}
                default:
                  throw new NotSupportedException($"SGBD non pris en charge: {_connection.GetType().Name}");
            }
          }

          public void StartTransaction()
          {
              if (_dbType == DbType.PostgreSQL)
              {
                  using var cmd = _connection.CreateCommand();
                  cmd.CommandText = "SET CONSTRAINTS ALL DEFERRED";
                  cmd.ExecuteNonQuery();
            }
          }

          public void DisableConstraintsForTable(string tableName)
          {
            if (_processedTables.Contains(tableName)) return;
            _processedTables.Add(tableName);
            
            switch (_dbType)
            {
              {{#if databaseType = PostgreSQL}}
              case DbType.PostgreSQL:
                DisablePostgres(tableName);
                break;
              {{else}}{{removeLine}}{{/if}}
              {{#if databaseType = MySQL}}
              case DbType.MySQL:
                DisableMySql(tableName);
                break;
              {{else}}{{removeLine}}{{/if}}
              {{#if databaseType = SQL Server}}
              case DbType.SQLServer:
                DisableSqlServer(tableName);
                break;
              {{else}}{{removeLine}}{{/if}}
              {{#if databaseType = Oracle}}
              case DbType.Oracle:
                DisableOracle(tableName);
                break;
              {{else}}{{removeLine}}{{/if}}
            }
          }

          public void RestoreConstraints()
          {
            Console.WriteLine($"Restoring {_restoreDdls.Count} constraints");
        
            // Separate NOT NULL and other constraints to restore NOT NULL first
            var notNullDdls = new List<string>();
            var otherDdls = new List<string>();
            foreach (var ddl in _restoreDdls)
            {
              if (ddl.Contains("NOT NULL"))
              notNullDdls.Add(ddl);
              else
              otherDdls.Add(ddl);
            }
        
            // Restore NOT NULL constraints first
            foreach (var ddl in notNullDdls)
            {
              try
              {
                Console.WriteLine($"Restoring: {ddl}");
                    using (var cmd = CreateDbCommand(ddl))
                    {
                        cmd.ExecuteNonQuery();
                        Console.WriteLine($"Successfully restored: {ddl}");
                    }
                }
                catch (DbException ex)
                {
                    Console.Error.WriteLine($"Error restoring constraint: {ddl}");
                    Console.Error.WriteLine($"Reason: {ex.Message}");
                }
                catch (InvalidOperationException ex)
                {
                    Console.Error.WriteLine($"Connection issue: {ex.Message}");
                }
            }
        
            // Restore other constraints (CHECK, FOREIGN KEY, UNIQUE)
            foreach (var ddl in otherDdls)
            {
                try
                {
                    Console.WriteLine($"Restoring: {ddl}");
                    using (var cmd = CreateDbCommand(ddl))
                    {
                        cmd.ExecuteNonQuery();
                        Console.WriteLine($"Successfully restored: {ddl}");
                    }
                }
                catch (DbException ex)
                {
                    Console.Error.WriteLine($"Error restoring constraint: {ddl}");
                    Console.Error.WriteLine($"Reason: {ex.Message}");
                }
                catch (InvalidOperationException ex)
                {
                    Console.Error.WriteLine($"Connection issue: {ex.Message}");
                }
            }
        
            _restoreDdls.Clear();
            _processedTables.Clear();
        }

          private DbCommand CreateDbCommand(string commandText)
          {
              switch (_dbType)
              {
                  {{#if databaseType = PostgreSQL}}
                  case DbType.PostgreSQL:
                      return new NpgsqlCommand(commandText, (NpgsqlConnection)_connection);
                  {{else}}{{removeLine}}{{/if}}
                  {{#if databaseType = MySQL}}
                  case DbType.MySQL:
                      return new MySqlCommand(commandText, (MySqlConnection)_connection);
                  {{else}}{{removeLine}}{{/if}}
                  {{#if databaseType = SQL Server}}
                  case DbType.SQLServer:
                      return new SqlCommand(commandText, (SqlConnection)_connection);
                  {{else}}{{removeLine}}{{/if}}
                  {{#if databaseType = Oracle}}
                  case DbType.Oracle:
                      return new OracleCommand(commandText, (OracleConnection)_connection);
                  {{else}}{{removeLine}}{{/if}}
                  default:
                      throw new NotSupportedException($"Unsupported database type: {_dbType}");
              }
          }
          {{#if databaseType = PostgreSQL}}
          private void DisablePostgres(string tableName)
          {
              // 1. Désactiver les contraintes référencées
              var foreignConstraints = new List<(string Name, string SourceTable, string Definition)>();
      
              using (var cmd = new NpgsqlCommand(
                  "SELECT conname, conrelid::regclass::text AS source_table, " +
                  "pg_get_constraintdef(oid) AS definition " +
              "FROM pg_constraint " +
              "WHERE confrelid = @tableName::regclass",
              (NpgsqlConnection)_connection))
              {
                cmd.Parameters.AddWithValue("tableName", tableName);
                using var reader = cmd.ExecuteReader();
                while (reader.Read())
                {
                  foreignConstraints.Add((
                  reader.GetString(0),
                  reader.GetString(1),
                  reader.GetString(2)
                  ));
                }
              }
      
              foreach (var (name, sourceTable, definition) in foreignConstraints)
              {
                _restoreDdls.Push($"ALTER TABLE {sourceTable} ADD CONSTRAINT {name} {definition}");
      
                  using var dropCmd = new NpgsqlCommand(
                      $"ALTER TABLE {sourceTable} DROP CONSTRAINT {name} CASCADE",
                (NpgsqlConnection)_connection);
                dropCmd.ExecuteNonQuery();
              }
      
              // 2. Désactiver les contraintes locales
              var localConstraints = new List<(string Name, string Definition)>();
      
              using (var cmd = new NpgsqlCommand(
              "SELECT conname, pg_get_constraintdef(oid) AS def " +
              "FROM pg_constraint " +
              "WHERE conrelid = @tableName::regclass",
              (NpgsqlConnection)_connection))
              {
                cmd.Parameters.AddWithValue("tableName", tableName);
                using var reader = cmd.ExecuteReader();
                while (reader.Read())
                {
                  localConstraints.Add((
                  reader.GetString(0),
                  reader.GetString(1)
                  ));
                }
              }
      
              foreach (var (name, def) in localConstraints)
              {
                _restoreDdls.Push($"ALTER TABLE {tableName} ADD CONSTRAINT {name} {def}");
      
                  using var dropCmd = new NpgsqlCommand(
                      $"ALTER TABLE {tableName} DROP CONSTRAINT {name} CASCADE",
                (NpgsqlConnection)_connection);
                dropCmd.ExecuteNonQuery();
              }
      
              // 3. Gérer les contraintes NOT NULL
              var notNullColumns = new List<string>();
      
              using (var cmd = new NpgsqlCommand(
              "SELECT a.attname AS column_name " +
              "FROM pg_attribute a " +
              "JOIN pg_class c ON c.oid = a.attrelid " +
              "WHERE c.relname = @tableName " +
              "  AND a.attnotnull " +
              "  AND a.attidentity = '' " +
              "  AND a.attnum > 0 " +
              "  AND NOT a.attisdropped",
              (NpgsqlConnection)_connection))
              {
                cmd.Parameters.AddWithValue("tableName", tableName);
                using var reader = cmd.ExecuteReader();
                while (reader.Read())
                {
                  notNullColumns.Add(reader.GetString(0));
                }
              }
      
              foreach (var colName in notNullColumns)
              {
                _restoreDdls.Push($"ALTER TABLE {tableName} ALTER COLUMN {colName} SET NOT NULL");
                
                using var alterCmd = new NpgsqlCommand(
                $"ALTER TABLE {tableName} ALTER COLUMN {colName} DROP NOT NULL",
                (NpgsqlConnection)_connection);
                alterCmd.ExecuteNonQuery();
              }
          }
          {{else}}{{removeLine}}{{/if}}
          {{#if databaseType = MySQL}}
          private void DisableMySql(string tableName)
          {
            var schema = _connection.Database;
            Console.WriteLine($"[MySQL] Starting constraint disable for table: {tableName}");
      
              try
              {
                  // 1. Collecter toutes les informations d'abord
                  var foreignKeys = new List<Tuple<string, string, string, string>>();
                  var uniqueConstraints = new List<Tuple<string, List<string>>>();
                  var allChecks = new List<Tuple<string, string>>(); // constraint_name, check_clause
                  var notNullColumns = new List<Tuple<string, string, string>>();
                  var defaultConstraints = new List<Tuple<string, string, string, string>>(); // colName, typeDef, defaultValue, extra
        
                  // FOREIGN KEYS
                  Console.WriteLine("[MySQL] Collecting FOREIGN KEYS...");
                     using (var cmd = new MySqlCommand(
                     "SELECT constraint_name, column_name, referenced_table_name, referenced_column_name " +
                     "FROM information_schema.key_column_usage " +
                     "WHERE table_schema = @schema AND table_name = @table " +
                     "AND referenced_table_name IS NOT NULL",
                  (MySqlConnection)_connection))
                  {
                    cmd.Parameters.AddWithValue("@schema", schema);
                    cmd.Parameters.AddWithValue("@table", tableName);
                    
                    using var reader = cmd.ExecuteReader();
                    while (reader.Read())
                    {
                      foreignKeys.Add(Tuple.Create(
                      reader.GetString(0),
                      reader.GetString(1),
                      reader.GetString(2),
                      reader.GetString(3)
                      ));
                    }
                  }
      
                  // UNIQUE Constraints
                  Console.WriteLine("[MySQL] Collecting UNIQUE constraints...");
                  var uniqueConstraintNames = new List<string>();
                  using (var cmd = new MySqlCommand(
                  "SELECT DISTINCT constraint_name " +
                  "FROM information_schema.table_constraints " +
                  "WHERE table_schema = @schema " +
                  "AND table_name = @table " +
                  "AND constraint_type = 'UNIQUE' " +
                  "AND constraint_name != 'PRIMARY'",
                  (MySqlConnection)_connection))
                  {
                    cmd.Parameters.AddWithValue("@schema", schema);
                    cmd.Parameters.AddWithValue("@table", tableName);
                    
                    using var reader = cmd.ExecuteReader();
                    while (reader.Read())
                    {
                      uniqueConstraintNames.Add(reader.GetString(0));
                    }
                  }
      
                  foreach (var name in uniqueConstraintNames)
                  {
                    var columns = new List<string>();
                    Console.WriteLine($"[MySQL] Collecting columns for UNIQUE: {name}");
            
                    using (var colCmd = new MySqlCommand(
                        "SELECT column_name " +
                         "FROM information_schema.key_column_usage " +
                         "WHERE constraint_schema = @schema " +
                         "AND table_name = @table " +
                         "AND constraint_name = @name " +
                         "ORDER BY ordinal_position",
                    (MySqlConnection)_connection))
                    {
                      colCmd.Parameters.AddWithValue("@schema", schema);
                      colCmd.Parameters.AddWithValue("@table", tableName);
                      colCmd.Parameters.AddWithValue("@name", name);
                      
                      using var colReader = colCmd.ExecuteReader();
                      while (colReader.Read())
                      {
                        columns.Add(colReader.GetString(0));
                      }
                    }
        
                    uniqueConstraints.Add(Tuple.Create(name, columns));
                  }

                  Console.WriteLine("[MySQL] Collecting all CHECK constraints...");
                  using (var cmd = new MySqlCommand(
                      "SELECT cc.constraint_name, cc.check_clause " +
                      "FROM information_schema.table_constraints tc " +
                      "JOIN information_schema.check_constraints cc " +
                      "  ON tc.constraint_schema = cc.constraint_schema " +
                      " AND tc.constraint_name = cc.constraint_name " +
                      "WHERE tc.table_schema = @schema " +
                      "  AND tc.table_name = @table " +
                      "  AND tc.constraint_type = 'CHECK'",
                      (MySqlConnection)_connection))
                  {
                      cmd.Parameters.AddWithValue("@schema", schema);
                      cmd.Parameters.AddWithValue("@table", tableName);
                  
                      using var reader = cmd.ExecuteReader();
                      while (reader.Read())
                      {
                          string constraintName = reader.GetString(0);
                          string clause = reader.GetString(1);
                  
                          allChecks.Add(Tuple.Create(constraintName, clause));
                      }
                  }
                  
                  // DEFAULT Constraints (colonnes avec valeur par défaut explicite)
                  Console.WriteLine("[MySQL] Collecting DEFAULT constraints...");
                  
                  using (var cmd = new MySqlCommand(
                      "SELECT column_name, column_type, column_default, extra " +
                      "FROM information_schema.columns " +
                      "WHERE table_schema = @schema " +
                      "  AND table_name = @table " +
                      "  AND column_default IS NOT NULL", // Colonnes avec DEFAULT explicite
                      (MySqlConnection)_connection))
                  {
                      cmd.Parameters.AddWithValue("@schema", schema);
                      cmd.Parameters.AddWithValue("@table", tableName);
                  
                      using var reader = cmd.ExecuteReader();
                      while (reader.Read())
                      {
                          string colName = reader.GetString(0);
                          string typeDef = reader.GetString(1);
                          string defaultValue = reader.IsDBNull(2) ? "" : reader.GetString(2);
                          string extra = reader.IsDBNull(3) ? "" : reader.GetString(3);
                  
                          // Exclure les colonnes auto_increment
                          if (!extra.Contains("auto_increment"))
                          {
                              defaultConstraints.Add(Tuple.Create(colName, typeDef, defaultValue, extra));
                          }
                      }
                  }
      
                  // NOT NULL Constraints
                  using (var cmd = new MySqlCommand(
                  "SELECT column_name, column_type, extra " +
                  "FROM information_schema.columns " +
                  "WHERE table_schema = @schema " +
                  "AND table_name = @table " +
                  "AND is_nullable = 'NO'",
                  (MySqlConnection)_connection))
                  {
                    cmd.Parameters.AddWithValue("@schema", schema);
                    cmd.Parameters.AddWithValue("@table", tableName);
                    
                    using var reader = cmd.ExecuteReader();
                    while (reader.Read())
                    {
                      notNullColumns.Add(Tuple.Create(
                      reader.GetString(0),
                      reader.GetString(1),
                      reader.IsDBNull(2) ? "" : reader.GetString(2)
                        ));
                    }
                  }

                  // 2. Désactiver les contraintes après avoir tout collecté
                  Console.WriteLine($"[MySQL] Found: {foreignKeys.Count} FKs, {uniqueConstraints.Count} UNIQUES, " +
                                          $"{notNullColumns.Count} NOT NULLS, {defaultConstraints.Count} DEFAULTS");

                  // FOREIGN KEYS
                  Console.WriteLine("[MySQL] Disabling FOREIGN KEYS...");
                  foreach (var fk in foreignKeys)
                  {
                    var (name, col, refTable, refCol) = fk;
                    Console.WriteLine($"[MySQL] Disabling FK: {name}");

                    var restoreSQL = $"ALTER TABLE {tableName} " +
                               $"ADD CONSTRAINT `{name}` FOREIGN KEY(`{col}`) " +
                                $"REFERENCES `{refTable}`(`{refCol}`)";
                                                    
                    _restoreDdls.Push(restoreSQL);
                    
                    using var dropCmd = new MySqlCommand(
                      $"ALTER TABLE {tableName} DROP FOREIGN KEY `{name}`",
                      (MySqlConnection)_connection);
                    dropCmd.ExecuteNonQuery();

                    Console.WriteLine($"[MySQL] Disabled FK: {name}");
                  }

                  // UNIQUE Constraints
                  Console.WriteLine("[MySQL] Disabling UNIQUE constraints...");
                  foreach (var uc in uniqueConstraints)
                  {
                    var (name, columns) = uc;
                    Console.WriteLine($"[MySQL] Disabling UNIQUE: {name}");
          
                          var columnsStr = string.Join(",", columns.Select(c => $"`{c}`"));
                          var restoreSQL = $"ALTER TABLE {tableName} " +
                                         $"ADD CONSTRAINT `{name}` UNIQUE ({columnsStr})";
          
                    _restoreDdls.Push(restoreSQL);
          
                    using var dropCmd = new MySqlCommand(
                    $"ALTER TABLE {tableName} DROP INDEX `{name}`",
                              (MySqlConnection)_connection);
                    dropCmd.ExecuteNonQuery();
          
                    Console.WriteLine($"[MySQL] Disabled UNIQUE: {name}");
                  }
                  // Traitement unifié des contraintes CHECK
                  Console.WriteLine("[MySQL] Disabling all CHECK constraints...");
                  foreach (var check in allChecks)
                  {
                    var (constraintName, clause) = check;
                    Console.WriteLine($"[ MySQL ] Processing CHECK: { constraintName }");
              
                    clause = Regex.Unescape(clause);

                    // Nettoyage de la clause (identique au code Java)
                    clause = clause
                      .Replace("_utf8mb4'", "'");            // remplace \' par '

                    // Ajout de parenthèses pour regexp_like
                    if (clause.Contains("regexp_like", StringComparison.OrdinalIgnoreCase))
                    {
                      clause = $"({ clause })";
                    }
    
                    try
                    {
                      // DROP CONSTRAINT
                      using var dropCmd = new MySqlCommand(
                          $"ALTER TABLE { tableName } DROP CONSTRAINT `{ constraintName }`",
                      (MySqlConnection)_connection);
                      dropCmd.ExecuteNonQuery();
                  
                      // Commande de restauration
                      _restoreDdls.Push($"ALTER TABLE { tableName } ADD CONSTRAINT `{ constraintName }` CHECK { clause }");

                      Console.WriteLine($"[ MySQL ] Disabled CHECK: { constraintName }");
                    }
                    catch (Exception ex)
                    {
                        Console.WriteLine($"[ WARNING ] Failed to disable CHECK constraint { constraintName }: { ex.Message }");
                    }
                  }
        
                  // ===== NOUVEAU: DÉSACTIVATION DES DEFAULTS =====
                  Console.WriteLine("[MySQL] Disabling DEFAULT constraints...");
                  foreach (var dc in defaultConstraints)
                  {
                    var (colName, typeDef, defaultValue, extra) = dc;

                    // Formater la valeur par défaut
                    string defaultValueExpr = FormatDefaultValueMySql(defaultValue);

                    // Stocker la commande de restauration (sans supprimer physiquement la contrainte)
                    string restoreSQL = $"ALTER TABLE { tableName } ALTER COLUMN `{ colName }` SET DEFAULT { defaultValueExpr }";
                    _restoreDdls.Push(restoreSQL);

                    Console.WriteLine($"[ MySQL ] Stored DEFAULT restore for: { colName }");
                  }
      
                  // NOT NULL Constraints
                  Console.WriteLine("[MySQL] Disabling NOT NULL constraints...");
                  foreach (var col in notNullColumns)
                  {
                    var (colName, typeDef, extra) = col;
    
                    if (extra.Contains("auto_increment"))
                    {
                      Console.WriteLine($"[MySQL] Skipping AUTO_INCREMENT column: {colName}");
                        continue;
                    }
    
                    Console.WriteLine($"[MySQL] Disabling NOT NULL: {colName}");
    
                    var modifySQL = $"ALTER TABLE {tableName} MODIFY `{colName}` {typeDef}";
                    using var alterCmd = new MySqlCommand(modifySQL, (MySqlConnection)_connection);
                    alterCmd.ExecuteNonQuery();
    
                    _restoreDdls.Push($"{modifySQL} NOT NULL");
                  }

              Console.WriteLine($"[MySQL] Finished constraint disable for table: {tableName}");
            }
            catch (Exception ex)
            {
                Console.WriteLine($"[FATAL ERROR] Failed to disable constraints for {tableName}: {ex.Message}");
                throw;
            }
          }
        
          // Fonction pour formater les valeurs par défaut MySQL
          private string FormatDefaultValueMySql(string defaultValue)
          {
            if (defaultValue == null)
            return "NULL";
        
            // Convertir les fonctions courantes avec parenthèses
            if ("CURDATE()".Equals(defaultValue, StringComparison.OrdinalIgnoreCase))
            {
              return "(CURRENT_DATE)";
            }
            else if ("CURTIME()".Equals(defaultValue, StringComparison.OrdinalIgnoreCase))
            {
              return "(CURRENT_TIME)";
            }
            else if ("NOW()".Equals(defaultValue, StringComparison.OrdinalIgnoreCase) ||
            "CURRENT_TIMESTAMP()".Equals(defaultValue, StringComparison.OrdinalIgnoreCase))
            {
              return "(CURRENT_TIMESTAMP)";
            }
            // Expressions complexes (UUID, fonctions mathématiques, etc.)
            else if (Regex.IsMatch(defaultValue, @"[\(\)]|[\+\-\*/]|(?i)\b(?:UUID|RAND|CONCAT|CAST)\b"))
            {
              return $"({defaultValue})";
            }
            // Valeurs littérales (chaînes, nombres, booléens)
            else
            {
              return defaultValue;
            }
          }
          {{else}}{{removeLine}}{{/if}}
          {{#if databaseType = SQL Server}}
          private void DisableSqlServer(string tableName)
          {
            if (string.IsNullOrWhiteSpace(tableName))
            {
              Console.Error.WriteLine("Table name cannot be null or empty");
              throw new ArgumentException("Table name cannot be null or empty");
            }
        
            // Sanitize table name
            if (!tableName.All(c => char.IsLetterOrDigit(c) || c == '_'))
            {
              Console.Error.WriteLine($"Invalid table name: {tableName}");
              throw new ArgumentException("Invalid table name");
            }
        
            // Get schema (default to dbo)
            string schema = "dbo";
        
            string qualifiedTableName = $"[{schema}].[{tableName}]";
        
            try
            {
              // Begin transaction
              using (var cmd = new SqlCommand("BEGIN TRANSACTION"))
              {
                cmd.ExecuteNonQuery();
              }
            
              // 1. UNIQUE Constraints
              using (var cmd = new SqlCommand(
                "SELECT i.name AS constraint_name, " +
                "STRING_AGG(COL_NAME(ic.object_id, ic.column_id), ',') AS columns " +
                "FROM sys.indexes i " +
                "JOIN sys.index_columns ic ON i.object_id = ic.object_id AND i.index_id = ic.index_id " +
                "JOIN sys.tables t ON i.object_id = t.object_id " +
                "JOIN sys.schemas s ON t.schema_id = s.schema_id " +
                "WHERE i.is_unique = 1 AND i.is_primary_key = 0 " +
                "AND t.name = @tableName AND s.name = @schema " +
                "GROUP BY i.name"))
              {
                cmd.Parameters.AddWithValue("@tableName", tableName);
                cmd.Parameters.AddWithValue("@schema", schema);
                using (var reader = cmd.ExecuteReader())
                {
                  while (reader.Read())
                  {
                    string name = reader["constraint_name"]?.ToString();
                    string columns = reader["columns"]?.ToString();
                    if (string.IsNullOrEmpty(name) || string.IsNullOrEmpty(columns))
                    {
                      Console.WriteLine($"Skipping invalid UNIQUE constraint for table {schema}.{tableName}: name={name}, columns={columns}");
                      continue;
                    }
          
                    string restoreSQL = $"ALTER TABLE {qualifiedTableName} ADD CONSTRAINT [{name}] UNIQUE ([{columns.Replace(",", "],[")}])";
                    _restoreDdls.Push(restoreSQL);
                    using (var dropCmd = CreateDbCommand($"ALTER TABLE {qualifiedTableName} DROP CONSTRAINT [{name}]"))
                    {
                      dropCmd.ExecuteNonQuery();
                      Console.WriteLine($"Dropped UNIQUE constraint [{name}] on table {schema}.{tableName}");
                    }
                  }
                }
              }
          
              // 2. CHECK Constraints
              using (var cmd = new SqlCommand(
                "SELECT cc.name AS name, cc.definition AS def " +
                "FROM sys.check_constraints cc " +
                "JOIN sys.objects t ON cc.parent_object_id = t.object_id " +
                "JOIN sys.schemas s ON t.schema_id = s.schema_id " +
                "WHERE t.name = @tableName AND s.name = @schema"))
              {
                cmd.Parameters.AddWithValue("@tableName", tableName);
                cmd.Parameters.AddWithValue("@schema", schema);
                using (var reader = cmd.ExecuteReader())
                {
                  while (reader.Read())
                  {
                    string name = reader["name"]?.ToString();
                    string def = reader["def"]?.ToString();
                    if (string.IsNullOrEmpty(name) || string.IsNullOrEmpty(def))
                    {
                      Console.WriteLine($"Skipping invalid CHECK constraint for table {schema}.{tableName}: name={name}, def={def}");
                          continue;
                      }
  
                      string restoreSQL = $"ALTER TABLE {qualifiedTableName} ADD CONSTRAINT [{name}] CHECK ({def})";
                      _restoreDdls.Push(restoreSQL);
                      using (var dropCmd = CreateDbCommand($"ALTER TABLE {qualifiedTableName} DROP CONSTRAINT [{name}]"))
                      {
                          dropCmd.ExecuteNonQuery();
                          Console.WriteLine($"Dropped CHECK constraint [{name}] on table {schema}.{tableName}");
                      }
                  }
                }
              }
          
              // 3. FOREIGN KEY Constraints
              using (var cmd = new SqlCommand(
                "SELECT fk.name AS name, " +
                "COL_NAME(fkc.parent_object_id, fkc.parent_column_id) AS col, " +
                "OBJECT_NAME(fk.referenced_object_id) AS refTable, " +
                "COL_NAME(fkc.referenced_object_id, fkc.referenced_column_id) AS refCol " +
                "FROM sys.foreign_keys fk " +
                "JOIN sys.foreign_key_columns fkc ON fk.object_id = fkc.constraint_object_id " +
                "JOIN sys.tables t ON fk.parent_object_id = t.object_id " +
                "JOIN sys.schemas s ON t.schema_id = s.schema_id " +
                "WHERE t.name = @tableName AND s.name = @schema"))
              {
                cmd.Parameters.AddWithValue("@tableName", tableName);
                cmd.Parameters.AddWithValue("@schema", schema);
                using (var reader = cmd.ExecuteReader())
                {
                  while (reader.Read())
                  {
                    string name = reader["name"]?.ToString();
                    string col = reader["col"]?.ToString();
                    string refTable = reader["refTable"]?.ToString();
                    string refCol = reader["refCol"]?.ToString();
                    if (string.IsNullOrEmpty(name) || string.IsNullOrEmpty(col) || string.IsNullOrEmpty(refTable) || string.IsNullOrEmpty(refCol))
                    {
                      Console.WriteLine($"Skipping invalid FOREIGN KEY constraint for table {schema}.{tableName}: name={name}, col={col}, refTable={refTable}, refCol={refCol}");
                      continue;
                    }
      
                    string restoreSQL = $"ALTER TABLE {qualifiedTableName} ADD CONSTRAINT [{name}] FOREIGN KEY ([{col}]) REFERENCES [{refTable}]([{refCol}])";
                    _restoreDdls.Push(restoreSQL);
                    using (var dropCmd = CreateDbCommand($"ALTER TABLE {qualifiedTableName} DROP CONSTRAINT [{name}]"))
                    {
                        dropCmd.ExecuteNonQuery();
                        Console.WriteLine($"Dropped FOREIGN KEY constraint [{name}] on table {schema}.{tableName}");
                    }
                  }
                }
              }
          
              // 4. NOT NULL Constraints (excluding IDENTITY columns)
              using (var cmd = new SqlCommand(
                "SELECT c.name, t.name AS type_name, " +
                "CASE " +
                "  WHEN t.name IN ('decimal', 'numeric') THEN t.name + '(' + CAST(c.precision AS VARCHAR) + ',' + CAST(c.scale AS VARCHAR) + ')' " +
                "  WHEN t.name IN ('varchar', 'nvarchar', 'char', 'nchar') THEN t.name + '(' + CASE WHEN c.max_length = -1 THEN 'MAX' ELSE CAST(c.max_length AS VARCHAR) END + ')' " +
                "  ELSE t.name " +
                "END AS def " +
                "FROM sys.columns c " +
                "JOIN sys.types t ON c.system_type_id = t.system_type_id " +
                "WHERE c.object_id = OBJECT_ID(@qualifiedTableName) AND c.is_nullable = 0 AND c.is_identity = 0"))
              {
                cmd.Parameters.AddWithValue("@qualifiedTableName", $"{schema}.{tableName}");
                using (var reader = cmd.ExecuteReader())
                {
                  while (reader.Read())
                  {
                    string colName = reader["name"]?.ToString();
                    string def = reader["def"]?.ToString();
                    if (string.IsNullOrEmpty(colName) || string.IsNullOrEmpty(def))
                    {
                      Console.WriteLine($"Skipping invalid NOT NULL column for table {schema}.{tableName}: name={colName}, def={def}");
                    continue;
                    }
  
                    string restoreSQL = $"ALTER TABLE {qualifiedTableName} ALTER COLUMN [{colName}] {def} NOT NULL";
                    _restoreDdls.Push(restoreSQL);
                    using (var dropCmd = CreateDbCommand($"ALTER TABLE {qualifiedTableName} ALTER COLUMN [{colName}] {def} NULL"))
                    {
                      dropCmd.ExecuteNonQuery();
                      Console.WriteLine($"Dropped NOT NULL constraint on column [{colName}] in table {schema}.{tableName}");
                    }
                  }
                }
              }
        
              // Commit transaction
              using (var cmd = new SqlCommand("COMMIT TRANSACTION"))
              {
                cmd.ExecuteNonQuery();
              }
            }
            catch (DbException ex)
            {
              // Rollback transaction on error
              try
              {
                using (var cmd = new SqlCommand("ROLLBACK TRANSACTION"))
                {
                  cmd.ExecuteNonQuery();
                }
              }
              catch (DbException rollbackEx)
              {
                Console.Error.WriteLine($"Failed to rollback transaction for table {schema}.{tableName}: {rollbackEx.Message}");
              }
              throw;
            }
          }
          {{else}}{{removeLine}}{{/if}}
          {{#if databaseType = Oracle}}
          public void DisableOracle(string tableName)
          {
            using var getSchemaCmd = _connection.CreateCommand();
            getSchemaCmd.CommandText = "SELECT USER FROM DUAL";
            var schema = getSchemaCmd.ExecuteScalar()?.ToString()?.ToUpper();
            if (string.IsNullOrEmpty(schema)) throw new Exception("Schema not found.");
        
            var tableUpper = tableName.ToUpper();
        
            using var cmd = _connection.CreateCommand();
            cmd.CommandText = @"
            SELECT constraint_name, constraint_type, search_condition, r_constraint_name
            FROM all_constraints ac
            WHERE owner = :schema
            AND table_name = :t_table_name
            AND constraint_type IN ('R', 'C', 'U', 'P')
            AND (
            constraint_name NOT LIKE 'SYS_%'
            OR (
            constraint_name LIKE 'SYS_%'
            AND EXISTS (
            SELECT 1 FROM all_cons_columns acc
            WHERE acc.owner = ac.owner
            AND acc.constraint_name = ac.constraint_name
            )
            )
            )
            ORDER BY constraint_name";
            
            var param1 = cmd.CreateParameter();
            param1.ParameterName = "schema";
            param1.Value = schema;
            cmd.Parameters.Add(param1);
        
            var param2 = cmd.CreateParameter();
            param2.ParameterName = "t_table_name";
            param2.Value = tableUpper;
            cmd.Parameters.Add(param2);
        
            using var reader = cmd.ExecuteReader();
            while (reader.Read())
            {
              var name = reader["CONSTRAINT_NAME"].ToString();
              var type = reader["CONSTRAINT_TYPE"].ToString();
              var searchCond = reader["SEARCH_CONDITION"]?.ToString();
              
              if (type == "P")
              {
                Console.WriteLine($"Constraint {name} ignored (PRIMARY KEY)");
                continue;
              }
              
              if (type == "C" && searchCond != null && searchCond.ToUpper().Contains("IS NOT NULL"))
              {
                Console.WriteLine($"Constraint {name} ignored (NOT NULL implicit)");
                continue;
              }
              
              _restoreDdls.Push($"ALTER TABLE {tableUpper} ENABLE CONSTRAINT {name}");
        
                if (type == "R")
              {
                var fkCols = GetConstraintColumns(schema, name);
                
                foreach (var col in fkCols)
                {
                  try
                  {
                    using var alterCmd = _connection.CreateCommand();
                    alterCmd.CommandText = $"ALTER TABLE {tableUpper} MODIFY ({col} NULL)";
                    alterCmd.ExecuteNonQuery();
                    Console.WriteLine($"Column {tableUpper}.{col} made nullable");
                    
                    _restoreDdls.Push($"ALTER TABLE {tableUpper} MODIFY ({col} NOT NULL)");
                  }
                  catch (Exception ex)
                  {
                    Console.Error.WriteLine($"Error making column {col} nullable: {ex.Message}");
                        }
                    }
                }
        
                try
                {
                    using var disableCmd = _connection.CreateCommand();
                    disableCmd.CommandText = $"ALTER TABLE {tableUpper} DISABLE CONSTRAINT {name}";
                    disableCmd.ExecuteNonQuery();
                    Console.WriteLine($"Constraint {name} disabled");
                  }
                  catch (Exception ex)
                  {
                    Console.Error.WriteLine($"Error disabling constraint {name}: {ex.Message}");
                }
            }
        
            Console.WriteLine($"Processing finished for table {tableUpper}");
          }

                                  
          private List<string> GetConstraintColumns(string schema, string constraintName)
          {
            var columns = new List<string>();
            using var cmd = new OracleCommand(
            "SELECT column_name FROM all_cons_columns " +
            "WHERE owner = :owner AND constraint_name = :constraint",
            (OracleConnection)_connection);
            
            cmd.Parameters.Add(new OracleParameter("owner", schema));
            cmd.Parameters.Add(new OracleParameter("constraint", constraintName));
            
            using var reader = cmd.ExecuteReader();
            while (reader.Read())
            {
              columns.Add(reader.GetString(0));
            }
            return columns;
          }
                                  
          private string GetTableNameForConstraint(string schema, string constraintName)
          {
            using var cmd = new OracleCommand(
            "SELECT table_name FROM all_constraints " +
            "WHERE owner = :owner AND constraint_name = :constraint",
            (OracleConnection)_connection);
            
            cmd.Parameters.Add(new OracleParameter("owner", schema));
            cmd.Parameters.Add(new OracleParameter("constraint", constraintName));
            
            return cmd.ExecuteScalar()?.ToString() ?? string.Empty;
          }
          {{else}}{{removeLine}}{{/if}}
