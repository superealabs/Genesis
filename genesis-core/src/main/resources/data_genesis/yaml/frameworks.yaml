    - fileType: "WebUtils"
      fileName: "WebUtils"
      extension: "cs"
      content: |
        namespace ${majStart(projectName)}.Utils;
          
        using System;
        using System.Linq;
        using System.Reflection;
        using System.Linq.Expressions;
        
        public class WebUtils
        {
            public static readonly string _asc = "asc";
            public static readonly string _desc = "desc";
            public static readonly string _sortCriteriaDelimiter = ";";
            public static readonly string _sortParsDelimiter = ",";
          
            public static IEnumerable<(string PropertyName, bool Ascending)> ParseSortingString(string input)
            {
                return input
                .Split(_sortCriteriaDelimiter, StringSplitOptions.RemoveEmptyEntries)
                .Select(part =>
                {
                  var elements = part.Split(_sortParsDelimiter, StringSplitOptions.TrimEntries);
                    if (elements.Length != 2)
                      throw new ArgumentException("Each sort criteria must have exactly 2 parts: property and direction");
          
                    string propertyName = elements[0];
                    bool ascending = true;
                    if(elements[1].Equals(_asc, StringComparison.OrdinalIgnoreCase)) 
                    {
                        ascending = true;
                    }
                    else if(elements[1].Equals(_desc, StringComparison.OrdinalIgnoreCase))
                    {
                        ascending = false;
                    }
                    else
                    {
                      throw new ArgumentException($"Sort direction must be either '{_asc}' or '{_desc}'");
                    }
          
                    return (propertyName, ascending);
                });
            }
            
            public static IQueryable<T> ApplySort<T>(IQueryable<T> query, 
                  IEnumerable<(string PropertyName, bool Ascending)> sortCriteria)
            {
              var result = query;
              bool isFirst = true;
              
              foreach (var (propertyName, ascending) in sortCriteria)
                {
                  var propertyInfo = typeof(T).GetProperty(propertyName,
                  BindingFlags.IgnoreCase | BindingFlags.Public | BindingFlags.Instance);
                  
                  if (propertyInfo == null)
                    throw new ArgumentException($"Property {propertyName} not found for type {typeof(T).FullName}");
                  
                  var parameter = Expression.Parameter(typeof(T));
                  
                  var property = Expression.Property(parameter, propertyInfo);
                  
                  var lambda = Expression.Lambda(property, parameter);
                  
                  string methodName;
                  if (isFirst)
                  {
                      methodName = ascending ? "OrderBy" : "OrderByDescending";
                                                               isFirst = false;
                  }
                  else
                  {
                      methodName = ascending ? "ThenBy" : "ThenByDescending";
                  }
                  
                  var methodInfo = typeof(Queryable).GetMethods()
                      .Where(m => m.Name == methodName && m.IsGenericMethodDefinition)
                      .Single(m => m.GetParameters().Length == 2);
                  
                  var genericMethod = methodInfo.MakeGenericMethod(typeof(T), propertyInfo.PropertyType);
                  
                  result = (IQueryable<T>)genericMethod.Invoke(null, new object[] { result, lambda });
                }
              
                return result;
            }
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/Utils"

    - fileType: "Generic  file"
      fileName: "IRepository"
      extension: "cs"
      content: |
        namespace ${majStart(projectName)}.Repositories.Generic;
        
        using System.Linq.Expressions;
        
        public interface IRepository<T, in TKey> where T : class
        {
            Task<IEnumerable<T>> GetAllWithIncludes(int page, int pageSize, string? sorting, params Expression<Func<T, object?>>[]? includeProperties);
            Task<T?> GetByIdAsync(TKey id, params Expression<Func<T, object?>>[]? includeProperties);
            Task AddAsync(T entity);
            Task UpdateAsync(T entity);
            Task DeleteAsync(TKey id);
            Task<bool> ExistsAsync(TKey id);
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/Repositories/Generic/"

    - fileType: "Generic Repository file"
      fileName: "Repository"
      extension: "cs"
      content: |
        namespace ${majStart(projectName)}.Repositories.Generic;
        
        using System.ComponentModel.DataAnnotations;
        using System.Linq.Expressions;
        using Microsoft.EntityFrameworkCore;
        using Data;
        using Utils;
        
        public class Repository<T, TKey>: IRepository<T, TKey>, IDisposable, IAsyncDisposable where T : class
        {
        
            private readonly DbSet<T> _dbSet;
            private readonly ${majStart(projectName)}Context _context;
        
            public Repository(${majStart(projectName)}Context context)
            {
                _context = context;
                _dbSet = context.Set<T>();
            }
        
            public async ValueTask DisposeAsync()
            {
                await _context.DisposeAsync();
            }
        
            public void Dispose()
            {
                _context.Dispose();
            }
        
            public async Task<IEnumerable<T>> GetAllWithIncludes(int page, int pageSize, string? sorting, params Expression<Func<T, object?>>[]? includeProperties)
            {
                var query = GetQuery(_dbSet, includeProperties);
                string sortOrder = sorting ?? $"{GetKeyPropertyName()},asc";
                query = WebUtils.ApplySort(query, WebUtils.ParseSortingString(sortOrder));
                // query = query.OrderBy(e => EF.Property<object>(e, GetKeyPropertyName()));
                query = query.Skip(page * pageSize).Take(pageSize);
                return await query.ToListAsync();
            }     
        
            public async Task<T?> GetByIdAsync(TKey id, params Expression<Func<T, object?>>[]? includeProperties)
            {
                var keyPropertyName = GetKeyPropertyName();
                var query = GetQuery(_dbSet, includeProperties);
                return await query.FirstOrDefaultAsync(e => EF.Property<TKey>(e, keyPropertyName)!.Equals(id));
            }
        
            public async Task AddAsync(T entity)
            {
                await _dbSet.AddAsync(entity);
                await _context.SaveChangesAsync();
            }
        
            public async Task UpdateAsync(T entity)
            {
                _context.Entry(entity).State = EntityState.Modified;
                await _context.SaveChangesAsync();
            }
        
            public async Task DeleteAsync(TKey id)
            {
                var entity = await GetByIdAsync(id);
                if (entity == null) 
                    throw new KeyNotFoundException($"Entity with ID {id} not found.");
                _dbSet.Remove(entity);
                await _context.SaveChangesAsync();
            }
        
            public async Task<bool> ExistsAsync(TKey id)
            {
                if (EqualityComparer<TKey>.Default.Equals(id, default)) return false;
        
                var keyPropertyName = GetKeyPropertyName();
        
                if (string.IsNullOrEmpty(keyPropertyName))
                throw new InvalidOperationException($"No key property found for type {typeof(T).Name}");
        
                return await _dbSet.AnyAsync(e =>
                    EF.Property<TKey>(e, keyPropertyName) != null &&
                    EF.Property<TKey>(e, keyPropertyName)!.Equals(id));
            }
        
            private IQueryable<T> GetQuery(IQueryable<T> query, params Expression<Func<T, object?>>[]? includeProperties)
            {
                if (includeProperties != null)
                    foreach (var includeProperty in includeProperties)
                        query = query.Include(includeProperty);
        
                return query;
            }
        
            private string GetKeyPropertyName()
            {
                var keyProperty = typeof(T).GetProperties()
                    .FirstOrDefault(prop => Attribute.IsDefined(prop, typeof(KeyAttribute)));
        
                if (keyProperty == null)
                    throw new InvalidOperationException($"No key property found for type {typeof(T).Name}");
        
                return keyProperty.Name;
            }
        }

      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/Repositories/Generic/"

