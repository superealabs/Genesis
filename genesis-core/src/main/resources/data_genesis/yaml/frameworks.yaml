          from rest_framework.decorators import api_view
          from rest_framework.response import Response
          from rest_framework import status
          from django.shortcuts import get_object_or_404
          from drf_yasg.utils import swagger_auto_schema
          from drf_yasg import openapi
          from ${projectName}.models import ${majStart(className)}
          from ${projectName}.serializers import ${majStart(className)}Serializer

          @swagger_auto_schema(
              method='get',
              operation_summary='List all ${majStart(className)}s',
              operation_description='Retrieve a list of all ${lowerCase(className)}s',
              responses={
                  200: ${majStart(className)}Serializer(many=True),
              },
              tags=['${majStart(className)}']
          )
          @swagger_auto_schema(
              method='post',
              operation_summary='Create a new ${majStart(className)}',
              operation_description='Create a new ${lowerCase(className)} instance',
              request_body=${majStart(className)}Serializer,
              responses={
                  201: ${majStart(className)}Serializer,
                  400: 'Bad request - validation errors',
              },
              tags=['${majStart(className)}']
          )
          @api_view(['GET', 'POST'])
          def ${lowerCase(className)}_list_create(request):
              """
              List all ${lowerCase(className)}s or create a new ${lowerCase(className)}.
              """
              if request.method == 'GET':
                  ${lowerCase(className)}s = ${majStart(className)}.objects.all()
                  serializer = ${majStart(className)}Serializer(${lowerCase(className)}s, many=True)
                  return Response(serializer.data)
              
              elif request.method == 'POST':
                  serializer = ${majStart(className)}Serializer(data=request.data)
                  if serializer.is_valid():
                      serializer.save()
                      return Response(serializer.data, status=status.HTTP_201_CREATED)
                  return Response(serializer.errors, status=status.HTTP_400_BAD_REQUEST)

          @swagger_auto_schema(
              method='get',
              operation_summary='Retrieve a ${majStart(className)}',
              operation_description='Get details of a specific ${lowerCase(className)} by ID',
              manual_parameters=[
                  openapi.Parameter('pk', openapi.IN_PATH, description='${majStart(className)} ID', type=openapi.TYPE_INTEGER),
              ],
              responses={
                  200: ${majStart(className)}Serializer,
                  404: '${majStart(className)} not found',
              },
              tags=['${majStart(className)}']
          )
          @swagger_auto_schema(
              method='put',
              operation_summary='Update a ${majStart(className)} (full)',
              operation_description='Update all fields of a ${lowerCase(className)} instance',
              manual_parameters=[
                  openapi.Parameter('pk', openapi.IN_PATH, description='${majStart(className)} ID', type=openapi.TYPE_INTEGER),
              ],
              request_body=${majStart(className)}Serializer,
              responses={
                  200: ${majStart(className)}Serializer,
                  400: 'Bad request - validation errors',
                  404: '${majStart(className)} not found',
              },
              tags=['${majStart(className)}']
          )
          @swagger_auto_schema(
              method='patch',
              operation_summary='Update a ${majStart(className)} (partial)',
              operation_description='Update specific fields of a ${lowerCase(className)} instance',
              manual_parameters=[
                  openapi.Parameter('pk', openapi.IN_PATH, description='${majStart(className)} ID', type=openapi.TYPE_INTEGER),
              ],
              request_body=${majStart(className)}Serializer,
              responses={
                  200: ${majStart(className)}Serializer,
                  400: 'Bad request - validation errors',
                  404: '${majStart(className)} not found',
              },
              tags=['${majStart(className)}']
          )
          @swagger_auto_schema(
              method='delete',
              operation_summary='Delete a ${majStart(className)}',
              operation_description='Delete a ${lowerCase(className)} instance',
              manual_parameters=[
                  openapi.Parameter('pk', openapi.IN_PATH, description='${majStart(className)} ID', type=openapi.TYPE_INTEGER),
              ],
              responses={
                  204: '${majStart(className)} deleted successfully',
                  404: '${majStart(className)} not found',
              },
              tags=['${majStart(className)}']
          )
          @api_view(['GET', 'PUT', 'PATCH', 'DELETE'])
          def ${lowerCase(className)}_detail(request, pk):
              """
              Retrieve, update or delete a ${lowerCase(className)} instance.
              """
              ${lowerCase(className)} = get_object_or_404(${majStart(className)}, pk=pk)
              
              if request.method == 'GET':
                  serializer = ${majStart(className)}Serializer(${lowerCase(className)})
                  return Response(serializer.data)
              
              elif request.method == 'PUT':
                  serializer = ${majStart(className)}Serializer(${lowerCase(className)}, data=request.data)
                  if serializer.is_valid():
                      serializer.save()
                      return Response(serializer.data)
                  return Response(serializer.errors, status=status.HTTP_400_BAD_REQUEST)
              
              elif request.method == 'PATCH':
                  serializer = ${majStart(className)}Serializer(${lowerCase(className)}, data=request.data, partial=True)
                  if serializer.is_valid():
                      serializer.save()
                      return Response(serializer.data)
                  return Response(serializer.errors, status=status.HTTP_400_BAD_REQUEST)
              
              elif request.method == 'DELETE':
                  ${lowerCase(className)}.delete()
                  return Response(status=status.HTTP_204_NO_CONTENT)
