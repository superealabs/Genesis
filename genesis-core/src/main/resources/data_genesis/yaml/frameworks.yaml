              {{#if isParentTable=true and hasChildrenForm=true}}public async Task<${majStart(className)}> CreateFull${majStart(className)}Async(${majStart(className)} ${minStart(className)}{{#each childrenWithForm}}, IEnumerable<${majStart(this.className)}> ${minStart(this.className)}s{{/each}}) {
                using var transaction = await _dbContext.Database.BeginTransactionAsync();
          
                try
                {
                  _dbContext.Set<${majStart(className)}>().Add(${minStart(className)});
                  await _dbContext.SaveChangesAsync();
                  {{#each childrenWithForm}}// ${majStart(this.className)} details
                  var ${minStart(this.className)}sList = ${minStart(this.className)}s.ToList();
                  foreach (var item in ${minStart(this.className)}sList)
                  {
                      item.${majStart(this.parentColumnNameFiled)} = ${minStart(className)}.${majStart(parentPk)};
                  }
                  _dbContext.Set<${majStart(this.className)}>().AddRange(${minStart(this.className)}sList);
                  await _dbContext.SaveChangesAsync();
                  {{/each}}
      
                  await transaction.CommitAsync();
                  return ${minStart(className)};
                }
                catch (Exception ex)
                {
                  await transaction.RollbackAsync();
                  throw new InternalServerErrorException("Error during atomic creation of ${majStart(className)} and its details.", ex);
                }
              }

              public async Task<${majStart(className)}?> UpdateFull${majStart(className)}Async(
                ${majStart(className)} ${minStart(className)}{{#each childrenWithForm}},
                IEnumerable<${majStart(this.className)}> ${minStart(this.className)}s{{/each}}
              )
              {
                using var transaction = await _dbContext.Database.BeginTransactionAsync();
                try
                {
                  _dbContext.Set<${majStart(className)}>().Update(${minStart(className)});
                  await _dbContext.SaveChangesAsync();
                  
                  {{#each childrenWithForm}}
                  var existing${majStart(this.className)}s = await _dbContext.Set<${majStart(this.className)}>()
                      .Where(d => d.${majStart(this.parentColumnNameFiled)} == ${minStart(className)}.${majStart(parentPk)})
                      .AsNoTracking() // Important pour éviter le tracking par défaut avant la manipulation
                      .ToListAsync();
                  
                  var current${majStart(this.className)}s = ${minStart(this.className)}s.ToList();
                  
                  // a. Éléments à supprimer (ceux qui étaient en DB mais ne sont plus dans la liste reçue)
                  var detailsToDelete = existing${majStart(this.className)}s
                      .Where(e => !current${majStart(this.className)}s.Any(c => c.${majStart(this.childPk)} == e.${majStart(this.childPk)} && e.${majStart(this.childPk)} != default))
                      .ToList();

                  _dbContext.Set<${majStart(this.className)}>().RemoveRange(detailsToDelete);
                  
                  // b. Éléments à ajouter/mettre à jour
                  foreach (var item in current${majStart(this.className)}s)
                  {
                      item.${majStart(this.parentColumnNameFiled)} = ${minStart(className)}.${majStart(parentPk)};
                  
                      if (existing${majStart(this.className)}s.Any(e => e.${majStart(this.childPk)} == item.${majStart(this.childPk)} && item.${majStart(this.childPk)} != default)) 
                      {
                          _dbContext.Entry(item).State = EntityState.Modified;
                      }
                      else 
                      {
                          _dbContext.Set<${majStart(this.className)}>().Add(item);
                      }
                  }
                  
                  await _dbContext.SaveChangesAsync();
                  
                  {{/each}}
                  await transaction.CommitAsync();
                  return ${minStart(className)};
                }
                catch (Exception ex)
                {
                    await transaction.RollbackAsync();
                    throw new InternalServerErrorException("Error during atomic update of ${majStart(className)} and its details.", ex);
                }
              }
             
              public async Task DeleteFull${majStart(className)}Async(${pkColumnType} id)
              {
                using var transaction = await _dbContext.Database.BeginTransactionAsync();
            
                try
                {
                  var ${minStart(className)} = await _dbContext.Set<${majStart(className)}>()
                  .FindAsync(id);
                  
                  if (${minStart(className)} == null)
                  {
                    throw new ResourceNotFoundException("${majStart(className)} not found with ${pkColumn} : " + id);
                  }
                  {{#each childrenWithForm}}
                  var ${minStart(this.className)}sToDelete = await _dbContext.Set<${majStart(this.className)}>()
                  .Where(d => d.${majStart(this.parentColumnNameFiled)} == ${minStart(className)}.${majStart(parentPk)})
                  .ToListAsync();
                  
                  _dbContext.Set<${majStart(this.className)}>().RemoveRange(${minStart(this.className)}sToDelete);
                  await _dbContext.SaveChangesAsync();
                  {{/each}}

                  _dbContext.Set<${majStart(className)}>().Remove(${minStart(className)});
                  await _dbContext.SaveChangesAsync();
                  
                  await transaction.CommitAsync();
                }
                catch (ResourceNotFoundException)
                {
                  await transaction.RollbackAsync();
                  throw;
                }
                catch (Exception ex)
                {
                  await transaction.RollbackAsync();
                  throw new InternalServerErrorException("Error during atomic deletion of ${majStart(className)} and its details.", ex);
                }
              }{{/if}}
          }
        destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/Services/Implementation/"

