      {{tab}}}
    serviceMethodContent: |
      {{tab}}@Override
      {{tab}}public Page<${majStart(className)}> getAll${majStart(className)}(Pageable pageable) {
      {{tab}}    try {
      {{tab}}        return ${minStart(className)}Repository.findAll(pageable);
      {{tab}}    } catch (Exception ex) {
      {{tab}}        throw new InternalServerErrorException("Error while retrieving ${formatReadableLowerCase(className)}", ex);
      {{tab}}    }
      {{tab}}}
      
