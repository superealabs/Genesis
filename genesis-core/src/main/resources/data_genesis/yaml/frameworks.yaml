            private ${majStart(className)}Service service;
            private ${majStart(className)} mockData=new ${majStart(className)}();
          
            @Autowired
            public ${majStart(className)}ApplicationTests(MockMvc mockMvc, ${majStart(className)}Service service){
              this.mockMvc=mockMvc;
              this.service=service;
              {{#each fields}}
              {{#if this.isPrimaryKey}}{{removeLine}}
              {{elseIf this.isForeignKey}}{{removeLine}}
              {{else}}mockData.set${majStart(this.name)}(${this.mockdata});{{/if}}
              {{/each}}
