    - fileType: "mainApp"
      fileName: "urls_api"
      extension: "py"
      content: |
        from django.urls import path
        from . import views_api
        
        urlpatterns = [
            # URLs API pour les modèles générés
            {{#each entities}}
            path('{{lowerCase this}}/', views_api.{{lowerCase this}}_list, name='{{lowerCase this}}_list'),
            path('{{lowerCase this}}/<int:pk>/', views_api.{{lowerCase this}}_detail, name='{{lowerCase this}}_detail'),
            {{/each}}
        ]
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}"

    - fileType: "mainApp"
      fileName: "views_api"
      extension: "py"
      content: |
        from django.shortcuts import render
        from django.http import JsonResponse
        from django.views.decorators.csrf import csrf_exempt
        from django.views.decorators.http import require_http_methods
        from .models import *
        import json
        
        # Vues API pour les modèles générés
        {{#each entities}}
        @csrf_exempt
        @require_http_methods(["GET", "POST"])
        def {{lowerCase this}}_list(request):
            if request.method == 'GET':
                {{lowerCase this}}_objects = {{this}}.objects.all()
                data = [{'id': obj.id{{#each fields}}, '{{name}}': obj.{{name}}{{/each}}} for obj in {{lowerCase this}}_objects]
                return JsonResponse(data, safe=False)
            elif request.method == 'POST':
                try:
                    data = json.loads(request.body)
                    {{lowerCase this}} = {{this}}.objects.create(**data)
                    return JsonResponse({'id': {{lowerCase this}}.id{{#each fields}}, '{{name}}': {{lowerCase this}}.{{name}}{{/each}}}, status=201)
                except Exception as e:
                    return JsonResponse({'error': str(e)}, status=400)
        
        @csrf_exempt
        @require_http_methods(["GET", "PUT", "DELETE"])
        def {{lowerCase this}}_detail(request, pk):
            try:
                {{lowerCase this}} = {{this}}.objects.get(pk=pk)
            except {{this}}.DoesNotExist:
                return JsonResponse({'error': '{{this}} not found'}, status=404)
            
            if request.method == 'GET':
                return JsonResponse({'id': {{lowerCase this}}.id{{#each fields}}, '{{name}}': {{lowerCase this}}.{{name}}{{/each}}})
            elif request.method == 'PUT':
                try:
                    data = json.loads(request.body)
                    for field, value in data.items():
                        setattr({{lowerCase this}}, field, value)
                    {{lowerCase this}}.save()
                    return JsonResponse({'id': {{lowerCase this}}.id{{#each fields}}, '{{name}}': {{lowerCase this}}.{{name}}{{/each}}})
                except Exception as e:
                    return JsonResponse({'error': str(e)}, status=400)
            elif request.method == 'DELETE':
                {{lowerCase this}}.delete()
                return JsonResponse({'message': '{{this}} deleted successfully'}, status=204)
        
        {{/each}}
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}"

    - fileType: "mainApp"
