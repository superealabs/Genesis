      content: |
        namespace ${majStart(projectName)}.Utils;

        public class ApiResponse<T>
        {
            public int Status { get; set; }
            public string Message { get; set; }
            public int ReturnCode { get; set; }
            public T? Data { get; set; }
            public object? Errors { get; set; }
            public DateTime Timestamp { get; set; } = DateTime.UtcNow;

            private ApiResponse(int status, string message, int returnCode, T? data)
            {
                Status = status;
                Message = message;
                ReturnCode = returnCode;
                Data = data;
            }

            /// <summary>
            /// Crée un objet ApiResponse pour une réponse réussie.
            /// </summary>
            public static ApiResponse<T> Success(int status, string message, T? data = default)
            {
                return new ApiResponse<T>(status, message, returnCode: 1, data: data);
            }

            /// <summary>
            /// Crée un objet ApiResponse pour une réponse d'erreur.
            /// </summary>
            public static ApiResponse<T> Error(int status, string message, object? errors = null)
            {
                var response = new ApiResponse<T>(status, message, returnCode: 0, data: default);
                response.Errors = errors; 
                return response;
            }
        }
