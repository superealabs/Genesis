      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}"

    - fileType: "mainApp"
      fileName: "serializers"
      extension: "py"
      content: |
        from rest_framework import serializers
        from django.apps import apps

        # Auto-generate serializers for all Django models
        for model in apps.get_app_config('${projectName}').get_models():
            serializer_name = f"{model.__name__}Serializer"
            serializer_class = type(serializer_name, (serializers.ModelSerializer,), {
                'Meta': type('Meta', (), {
                    'model': model,
                    'fields': '__all__'
                })
            })
            globals()[serializer_name] = serializer_class
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}"

