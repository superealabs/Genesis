    - fileType: "Main"
      fileName: "main"
      extension: "ts"
      content: |
        import "reflect-metadata";
        import { NestFactory } from "@nestjs/core";
        import { AppModule } from "./app.module";
        import { ValidationPipe, VersioningType } from "@nestjs/common";
        import { DocumentBuilder, SwaggerModule } from "@nestjs/swagger";
        import { AllExceptionsFilter } from "./common/filters/AllExceptionsFilter";
      
        async function bootstrap() {
          const app = await NestFactory.create(AppModule);
      
          // Enable CORS
          app.enableCors();
      
          // Global API prefix
          app.setGlobalPrefix("api");
      
          // Versioning
          app.enableVersioning({
            type: VersioningType.URI,
            defaultVersion: "1",
          });
      
          // Global validation pipe
          app.useGlobalPipes(
            new ValidationPipe({
              whitelist: true,
              transform: true,
              forbidNonWhitelisted: false,
            })
          );
      
          // Global exception filter
          app.useGlobalFilters(new AllExceptionsFilter());
      
          // Swagger setup
          const config = new DocumentBuilder()
            .setTitle(process.env.SWAGGER_TITLE || "API")
            .setDescription(process.env.SWAGGER_DESCRIPTION || "Auto-generated CRUD API")
            .setVersion(process.env.SWAGGER_VERSION || "1.0.0")
            {{#if useJWT}}.addBearerAuth(
              {
                type: 'http',
                scheme: 'bearer',
                bearerFormat: 'JWT',
              },
              'jwt',
            ){{/if}}
            .build();
      
          const document = SwaggerModule.createDocument(app, config);
          SwaggerModule.setup("docs", app, document, {
            swaggerOptions: { persistAuthorization: true },
          });
      
          const port = process.env.APP_PORT || 3000;
          await app.listen(port);
          console.log(`Application is running on: http://localhost:${port}/api`);
          console.log(`Swagger docs available at: http://localhost:${port}/docs`);
        }
      
        bootstrap();
      destinationPath: "${destinationFolder}/${majStart(projectName)}/src"
    - fileType: "Export"
      fileName: "export.util"
      extension: "ts"
      content: |
        import { Parser } from "json2csv";
        import puppeteer from "puppeteer";
        
        export class ExportUtil{
          static async exportCSV<T extends object>(data: T[], fields?: (keyof T)[]): Promise<string> {
             if (!data || data.length === 0) {
              return '';
             }
                                                                                     
             const csvFields = fields ?? (Object.keys(data[0]) as (keyof T)[]);
             const parser = new Parser({ fields: csvFields as string[] });
             
            return parser.parse(data);
          }
          static async generatePDF(url: string, fileName: string): Promise<Buffer> {
            const browser = await puppeteer.launch({ headless: true });
            const page = await browser.newPage();
            
            await page.goto(url, { waitUntil: 'networkidle0' });
            await page.emulateMediaType('screen');
              
            const pdfBuffer = Buffer.from(
              await page.pdf({
                path: `${fileName}.pdf`,
                format: 'A4',
                printBackground: true,
              })
            );
            
            await browser.close();
            return pdfBuffer;
          }
        }

