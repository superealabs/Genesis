    - fileType: "mainProject"
      fileName: "create_superuser"
      extension: "py"
      content: |
        #!/usr/bin/env python
        """Script pour créer automatiquement un superutilisateur Django."""
        import os
        import sys
        import django
        from django.contrib.auth import get_user_model

        def create_superuser():
            """Crée un superutilisateur avec des valeurs par défaut."""
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', '${projectName}.settings')
            django.setup()
            
            User = get_user_model()
            
            # Vérifier si un superutilisateur existe déjà
            if User.objects.filter(is_superuser=True).exists():
                print("✅ Un superutilisateur existe déjà.")
                return
            
            # Créer le superutilisateur
            try:
                User.objects.create_superuser(
                    username='admin',
                    email='admin@${projectName}.com',
                    password='admin123'
                )
                print("✅ Superutilisateur créé avec succès!")
                print("   Username: admin")
                print("   Password: admin123")
                print("   Email: admin@${projectName}.com")
            except Exception as e:
                print(f"❌ Erreur lors de la création du superutilisateur: {e}")

        if __name__ == '__main__':
            create_superuser()
      destinationPath: "${destinationFolder}/${majStart(projectName)}/"

    - fileType: "mainProject"
      fileName: "setup_database"
      extension: "py"
      content: |
        #!/usr/bin/env python
        """Script pour initialiser la base de données Django."""
        import os
        import sys
        import django
        from django.core.management import execute_from_command_line

        def setup_database():
            """Initialise la base de données avec les migrations."""
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', '${projectName}.settings')
            
            print("🔄 Initialisation de la base de données...")
            
            # Créer les migrations
            print("📝 Création des migrations...")
            execute_from_command_line(['manage.py', 'makemigrations'])
            
            # Appliquer les migrations
            print("🚀 Application des migrations...")
            execute_from_command_line(['manage.py', 'migrate'])
            
            print("✅ Base de données initialisée avec succès!")

        if __name__ == '__main__':
            setup_database()
      destinationPath: "${destinationFolder}/${majStart(projectName)}/"

    - fileType: "mainProject"
      fileName: "start_project"
      extension: "py"
      content: |
        #!/usr/bin/env python
        """Script de démarrage complet pour le projet Django."""
        import os
        import sys
        import subprocess
        import django
        from django.core.management import execute_from_command_line

        def start_project():
            """Initialise et démarre le projet Django."""
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', '${projectName}.settings')
            
            print("🚀 Démarrage du projet Django ${projectName}")
            print("=" * 50)
            
            # 1. Créer les migrations
            print("📝 Création des migrations...")
            try:
                execute_from_command_line(['manage.py', 'makemigrations'])
                print("✅ Migrations créées avec succès")
            except Exception as e:
                print(f"⚠️  Erreur lors de la création des migrations: {e}")
            
            # 2. Appliquer les migrations
            print("🚀 Application des migrations...")
            try:
                execute_from_command_line(['manage.py', 'migrate'])
                print("✅ Migrations appliquées avec succès")
            except Exception as e:
                print(f"⚠️  Erreur lors de l'application des migrations: {e}")
            
            # 3. Créer le superutilisateur
            print("👤 Création du superutilisateur...")
            try:
