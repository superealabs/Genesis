- id: 5
  languageId: 4
  coreFramework: "NestJS"
  name: "NestJS"
  template: "Template"
  useDB: true
  withGroupId: false
  useCloud: false
  useEurekaServer: false
  isGateway: false
  additionalFiles:
    - fileType: "Exception"
      fileName: "ResourceNotFoundException"
      extension: "ts"
      content: |
        import { HttpException, HttpStatus } from "@nestjs/common";
        export class ResourceNotFoundException extends HttpException {
          constructor(message: string, cause?: Error) {
             super(message, HttpStatus.NOT_FOUND);
             if (cause) {
               (this as any).cause = cause;
             }
          }
        }
      destinationPath: "${ destinationFolder }/${ majStart(projectName) }/src/common/exceptions"
    - fileType: "Util"
      fileName: "WebUtil"
      extension: "ts"
      content: |
        export class WebUtils{ 
          public static readonly DEFAULT_PAGE = 0;
          public static readonly DEFAULT_SIZE = 10;
          public static readonly DEFAULT_SORT_PARAM = "id, asc";
          public static readonly SORT_CRITERIA_DELIMITER = ";";
          public static readonly SORT_PART_DELIMITER = ",";
      
          static parsePaginationAndSort(query: Record<string, any>){
            const page = parseInt(query.page as string) || this.DEFAULT_PAGE;
            const size = parseInt(query.size as string) || this.DEFAULT_SIZE;
            const sortParam = (query.sort as string) || this.DEFAULT_SORT_PARAM;
            
            // example: "id,asc;nom,desc"
            const order: any = {};
            const sortFields = sortParam.split(this.SORT_CRITERIA_DELIMITER);
            for (const field of sortFields) {
              const [key, dir] = field.split(this.SORT_PART_DELIMITER);
              order[key] = dir?.toUpperCase() === "DESC" ? "DESC" : "ASC";
            }
              
            return {page, size, order};
          }
          static buildPageData(data: any, total: number, size: number, page: number){
              return {
              content: data,
              totalElements: total,
              totalPages: Math.ceil(total / size),
              pageNumber: page,
              pageSize: size,
            };
          
          }
        }
      destinationPath: "${ destinationFolder }/${ majStart(projectName) }/src/common/utils"
    - fileType: "Util"
      fileName: "constraint-disabler.service"
      extension: "ts"
      content: |
        import { Injectable, Logger, OnModuleInit } from '@nestjs/common';
        import { InjectConnection } from '@nestjs/typeorm';
        import { Connection, QueryRunner } from 'typeorm';

        export enum DbType {
          POSTGRESQL = 'POSTGRESQL',
          MYSQL = 'MYSQL',
          SQLSERVER = 'SQLSERVER',
          ORACLE = 'ORACLE'
        }

        interface ConstraintInfo {
          name: string;
          table: string;
          definition: string;
          type: 'FOREIGN_KEY' | 'UNIQUE' | 'CHECK' | 'NOT_NULL';
        }

        @Injectable()
        export class ConstraintDisablerService implements OnModuleInit {
          private readonly logger = new Logger(ConstraintDisablerService.name);
          private dbType: DbType | undefined;
          private restoreQueries: string[] = [];
          private processedTables = new Set<string>();

          constructor(
            @InjectConnection() private readonly connection: Connection,
          ) { }

          async onModuleInit() {
            this.dbType = await this.detectDatabaseType();
          }

          private async detectDatabaseType(): Promise<DbType> {
            const queryRunner = this.connection.createQueryRunner();
            try {
              const result = await queryRunner.query('SELECT version() as version');
              const version = result[0]?.version?.toLowerCase() || '';

              if (version.includes('postgresql')) return DbType.POSTGRESQL;
              if (version.includes('mysql')) return DbType.MYSQL;
              if (version.includes('microsoft sql server')) return DbType.SQLSERVER;
              if (version.includes('oracle')) return DbType.ORACLE;

              throw new Error("SGBD non pris en charge");
            } finally {
              await queryRunner.release();
            }
          }

          async startTransaction(): Promise<void> {
            const queryRunner = this.connection.createQueryRunner();
            await queryRunner.startTransaction();

            if (this.dbType === DbType.POSTGRESQL) {
              await queryRunner.query('SET CONSTRAINTS ALL DEFERRED');
            }
          }

          async disableConstraintsForTable(tableName: string): Promise<void> {
            if (this.processedTables.has(tableName)) return;

            this.processedTables.add(tableName);
            this.logger.log("Désactivation des contraintes pour la table: " + tableName);

            switch (this.dbType) {
              case DbType.POSTGRESQL:
                await this.disablePostgresConstraints(tableName);
                break;
              case DbType.MYSQL:
                await this.disableMySQLConstraints(tableName);
                break;
              case DbType.SQLSERVER:
                await this.disableSQLServerConstraints(tableName);
                break;
              case DbType.ORACLE:
                await this.disableOracleConstraints(tableName);
                break;
              default:
                throw new Error("SGBD non supporté: " + this.dbType);
            }
          }

          async restoreConstraints(): Promise<void> {
            this.logger.log("Restauration de " + this.restoreQueries.length + " contraintes");

            const queryRunner = this.connection.createQueryRunner();

            try {
              for (const query of this.restoreQueries.reverse()) {
                try {
                  this.logger.debug("Exécution: " + query);
                  await queryRunner.query(query);
                } catch (error) {
                  this.logger.error("Erreur lors de la restauration:" + query, error);
                }
              }
              this.restoreQueries = [];
              this.processedTables.clear();
            } finally {
              await queryRunner.release();
            }
          }

          private async disablePostgresConstraints(tableName: string): Promise<void> {
            const queryRunner = this.connection.createQueryRunner();

            try {
              // 1. Désactiver les contraintes FOREIGN KEY référencées
              const referencedConstraints = await queryRunner.query(`
                SELECT conname, conrelid::regclass::text AS source_table, 
                       pg_get_constraintdef(oid) AS definition 
                FROM pg_constraint 
                WHERE confrelid = to_regclass($1)
              `, [tableName]);

              for (const constraint of referencedConstraints) {
                const restoreSQL = "ALTER TABLE " + constraint.source_table + " ADD CONSTRAINT " + constraint.conname + " " + constraint.definition;
                this.restoreQueries.push(restoreSQL);

                await queryRunner.query(
                  "ALTER TABLE " + constraint.source_table + " DROP CONSTRAINT " + constraint.conname + " CASCADE"
                );
              }

              // 2. Désactiver les contraintes locales
              const localConstraints = await queryRunner.query(`
                SELECT conname, pg_get_constraintdef(oid) AS definition 
                FROM pg_constraint 
                WHERE conrelid = to_regclass($1)
              `, [tableName]);

              for (const constraint of localConstraints) {
                const restoreSQL = "ALTER TABLE " + tableName + " ADD CONSTRAINT " + constraint.conname + " " + constraint.definition;
                this.restoreQueries.push(restoreSQL);

                await queryRunner.query(
                  "ALTER TABLE " + tableName + " DROP CONSTRAINT " + constraint.conname + " CASCADE"
                );
              }

              // 3. Désactiver les contraintes NOT NULL
              const notNullColumns = await queryRunner.query(`
                SELECT a.attname AS column_name 
                FROM pg_attribute a 
                JOIN pg_class c ON c.oid = a.attrelid 
                WHERE c.relname = $1 
                  AND a.attnotnull 
                  AND a.attidentity = '' 
                  AND a.attnum > 0 
                  AND NOT a.attisdropped
              `, [tableName]);

              for (const column of notNullColumns) {
                const restoreSQL = "ALTER TABLE " + tableName + " ALTER COLUMN " + column.column_name + " SET NOT NULL";
                this.restoreQueries.push(restoreSQL);

                await queryRunner.query(
                  "ALTER TABLE " + tableName + " ALTER COLUMN " + column.column_name + " DROP NOT NULL"
                );
              }
            } finally {
              await queryRunner.release();
            }
          }

          private async disableMySQLConstraints(tableName: string): Promise<void> {
            const queryRunner = this.connection.createQueryRunner();

            try {
              const schema = await queryRunner.query('SELECT DATABASE() as db');
              const dbName = schema[0].db;

              // FOREIGN KEYS
              const foreignKeys = await queryRunner.query(`
                        SELECT constraint_name, column_name, referenced_table_name, referenced_column_name 
                        FROM information_schema.key_column_usage 
                        WHERE table_schema = ? AND table_name = ? AND referenced_table_name IS NOT NULL
                    `, [dbName, tableName]);

              for (const fk of foreignKeys) {
                const restoreSQL = "ALTER TABLE " + tableName + " ADD CONSTRAINT " + fk.constraint_name + " FOREIGN KEY " + fk.column_name + " REFERENCES " + fk.referenced_table_name + " (" + fk.referenced_column_name + ")";
                this.restoreQueries.push(restoreSQL);

                await queryRunner.query(
                  "ALTER TABLE " + tableName + " DROP FOREIGN KEY " + fk.constraint_name
                );
              }

              // Contraintes UNIQUE
              const uniqueConstraints = await queryRunner.query(`
                        SELECT DISTINCT tc.constraint_name 
                        FROM information_schema.table_constraints tc 
                        WHERE tc.table_schema = ? 
                        AND tc.table_name = ? 
                        AND tc.constraint_type = 'UNIQUE' 
                        AND tc.constraint_name != 'PRIMARY'
                    `, [dbName, tableName]);

              for (const unique of uniqueConstraints) {
                const name = unique.constraint_name;

                try {
                  // Récupérer toutes les colonnes de la contrainte UNIQUE
                  const columns = await queryRunner.query(`
                                SELECT column_name 
                                FROM information_schema.key_column_usage 
                                WHERE constraint_schema = ? 
                                AND table_name = ? 
                                AND constraint_name = ? 
                                ORDER BY ordinal_position
                            `, [dbName, tableName, name]);

                  const columnsStr = columns.map((col: any) => '`' + col.column_name + '`').join(',');
                  // Créer la commande de restauration
                  const restoreSQL = "ALTER TABLE " + tableName + " ADD CONSTRAINT " + name + " UNIQUE (" + columnsStr + ")";
                  this.restoreQueries.push(restoreSQL);

                  // Supprimer la contrainte UNIQUE
                  await queryRunner.query("ALTER TABLE DROP INDEX " + name);
                  console.log("Dropped UNIQUE constraint:" + name);

                } catch (error) {
                  console.error("Failed to drop UNIQUE constraint:" + name);
                  console.error("Reason: " + error);
                }
              }

              // Contraintes CHECK
              await this.disableMySQLCheckConstraints(tableName, dbName, queryRunner);

              // Colonnes avec valeur par défaut explicite (sauf auto_increment)
              const columnsWithDefault = await queryRunner.query(
                'SELECT column_name, column_type, data_type, column_default, extra ' +
                'FROM information_schema.columns ' +
                'WHERE table_schema = ? AND table_name = ? ' +
                'AND column_default IS NOT NULL',
                [dbName, tableName]
              );

              for (const col of columnsWithDefault) {
                const colName = col.column_name;
                const typeDef = col.column_type;
                const dataType = col.data_type;
                const defaultValue = col.column_default;
                const extra = col.extra;

                // Exclure les colonnes auto_increment
                if (!extra || !extra.includes('auto_increment')) {
                  // Gestion spéciale de CURDATE() et autres fonctions
                  const defaultValueExpr = this.formatDefaultValueMySQL(defaultValue);

                  // Enregistre la commande de restauration
                  const restoreSQL = 'ALTER TABLE ' + tableName + ' ALTER COLUMN `' + colName + '` SET DEFAULT ' + defaultValueExpr;
                  this.restoreQueries.push(restoreSQL);
                }
              }

              // NOT NULL (sauf colonnes AUTO_INCREMENT)
              const notNullColumns = await queryRunner.query(
                'SELECT column_name, column_type, extra ' +
                'FROM information_schema.columns ' +
                'WHERE table_schema = ? AND table_name = ? AND is_nullable = \'NO\'',
                [dbName, tableName]
              );

              for (const col of notNullColumns) {
                const colName = col.column_name;
                const typeDef = col.column_type;
                const extra = col.extra;

                if (!extra || !extra.includes('auto_increment')) {
                  const modifySQL = 'ALTER TABLE ' + tableName + ' MODIFY `' + colName + '` ' + typeDef;
                  await queryRunner.query(modifySQL);
                  this.restoreQueries.push(modifySQL + ' NOT NULL');
                }
              }

            } finally {
              await queryRunner.release();
            }
          }

          private formatDefaultValueMySQL(defaultValue: string): string {
            if (!defaultValue) return '';

            // Convertir CURDATE() en CURRENT_DATE
            if (defaultValue.toUpperCase() === 'CURDATE()') {
              return '(CURRENT_DATE)';
            }
            // Convertir les autres fonctions courantes si nécessaire
            else if (defaultValue.toUpperCase() === 'CURTIME()') {
              return '(CURRENT_TIME)';
            }
            else if (defaultValue.toUpperCase() === 'NOW()' || defaultValue.toUpperCase() === 'CURRENT_TIMESTAMP()') {
              return '(CURRENT_TIMESTAMP)';
            }
            // Conserver les expressions spéciales entre parenthèses
            else if (defaultValue.startsWith('(') && defaultValue.endsWith(')')) {
              return defaultValue; // e.g. (UUID()), (RAND() * 100)
            }
            // Chaînes de caractères (déjà correctement échappées par MySQL)
            else {
              return defaultValue;
            }
          }

          private async disableMySQLCheckConstraints(tableName: string, schema: string, queryRunner: any): Promise<void> {
            // 1. Contraintes CHECK au niveau TABLE et niveau COLONNE
            const checkConstraints = await queryRunner.query(`
                    SELECT cc.constraint_name, cc.check_clause 
                    FROM information_schema.table_constraints tc 
                    JOIN information_schema.check_constraints cc 
                    ON tc.constraint_schema = cc.constraint_schema 
                    AND tc.constraint_name = cc.constraint_name 
                    WHERE tc.table_schema = ? 
                    AND tc.table_name = ? 
                    AND tc.constraint_type = 'CHECK'
                `, [schema, tableName]);

            for (const ch of checkConstraints) {
              const name = ch.constraint_name;
              let clause = ch.check_clause;

              // Déséscape les caractères Java (similaire à StringEscapeUtils.unescapeJava)
              clause = clause.replace(/\\'/g, "'");
              clause = clause.replace(/_utf8mb4'/g, "'"); // remplace _utf8mb4' par '

              if (clause.toLowerCase().includes('regexp_like')) {
                clause = "(" + clause + ")"; // MySQL nécessite des parenthèses autour de l'expression
              }

              try {
                await queryRunner.query('ALTER TABLE ' + tableName + ' DROP CONSTRAINT `' + name + '`');
                this.restoreQueries.push('ALTER TABLE ' + tableName + ' ADD CONSTRAINT `' + name + '` CHECK ' + clause);
              } catch (error) {
                console.error('Failed to drop table-level CHECK constraint: ' + name);
              }
            }
          }

          private async disableSQLServerConstraints(tableName: string): Promise<void> {
            const queryRunner = this.connection.createQueryRunner();
            const schema = 'dbo';
            const qualifiedTableName = '[' + schema + '].[' + tableName + ']';

            await queryRunner.connect();

            try {
              // Begin transaction
              await queryRunner.query('BEGIN TRANSACTION');

              // 1. UNIQUE Constraints
              const uniqueConstraints = await queryRunner.query(
                'SELECT i.name AS constraint_name, ' +
                'STRING_AGG(COL_NAME(ic.object_id, ic.column_id), \',\') AS columns ' +
                'FROM sys.indexes i ' +
                'JOIN sys.index_columns ic ON i.object_id = ic.object_id AND i.index_id = ic.index_id ' +
                'JOIN sys.tables t ON i.object_id = t.object_id ' +
                'JOIN sys.schemas s ON t.schema_id = s.schema_id ' +
                'WHERE i.is_unique = 1 AND i.is_primary_key = 0 ' +
                'AND t.name = ? AND s.name = ? ' +
                'GROUP BY i.name',
                [tableName, schema]
              );

              for (const unique of uniqueConstraints) {
                const name = unique.constraint_name;
                const columns = unique.columns;

                if (!name || !columns) {
                  console.warn('Skipping invalid UNIQUE constraint for table ' + schema + '.' + tableName + ': name=' + name + ', columns=' + columns);
                  continue;
                }

                const restoreSQL = 'ALTER TABLE ' + qualifiedTableName + ' ADD CONSTRAINT [' + name + '] UNIQUE ([' + columns.replace(/,/g, '],[') + '])';
                this.restoreQueries.push(restoreSQL);

                try {
                  await queryRunner.query('ALTER TABLE ' + qualifiedTableName + ' DROP CONSTRAINT [' + name + ']');
                  console.debug('Dropped UNIQUE constraint [' + name + '] on table ' + schema + '.' + tableName);
                } catch (error) {
                  console.error('Failed to drop UNIQUE constraint [' + name + '] on table ' + schema + '.' + tableName + ': ' + error);
                  throw error;
                }
              }

              // 2. CHECK Constraints
              const checkConstraints = await queryRunner.query(
                'SELECT cc.name AS name, cc.definition AS def ' +
                'FROM sys.check_constraints cc ' +
                'JOIN sys.objects t ON cc.parent_object_id = t.object_id ' +
                'JOIN sys.schemas s ON t.schema_id = s.schema_id ' +
                'WHERE t.name = ? AND s.name = ?',
                [tableName, schema]
              );

              for (const ch of checkConstraints) {
                const name = ch.name;
                const def = ch.def;

                if (!name || !def) {
                  console.warn('Skipping invalid CHECK constraint for table ' + schema + '.' + tableName + ': name=' + name + ', def=' + def);
                  continue;
                }

                const restoreSQL = 'ALTER TABLE ' + qualifiedTableName + ' ADD CONSTRAINT [' + name + '] CHECK (' + def + ')';
                this.restoreQueries.push(restoreSQL);

                try {
                  await queryRunner.query('ALTER TABLE ' + qualifiedTableName + ' DROP CONSTRAINT [' + name + ']');
                  console.debug('Dropped CHECK constraint [' + name + '] on table ' + schema + '.' + tableName);
                } catch (error) {
                  console.error('Failed to drop CHECK constraint [' + name + '] on table ' + schema + '.' + tableName + ': ' + error);
                  throw error;
                }
              }

              // 3. FOREIGN KEY Constraints
              const foreignKeys = await queryRunner.query(
                'SELECT fk.name AS name, ' +
                'COL_NAME(fkc.parent_object_id, fkc.parent_column_id) AS col, ' +
                'OBJECT_NAME(fk.referenced_object_id) AS refTable, ' +
                'COL_NAME(fkc.referenced_object_id, fkc.referenced_column_id) AS refCol ' +
                'FROM sys.foreign_keys fk ' +
                'JOIN sys.foreign_key_columns fkc ON fk.object_id = fkc.constraint_object_id ' +
                'JOIN sys.tables t ON fk.parent_object_id = t.object_id ' +
                'JOIN sys.schemas s ON t.schema_id = s.schema_id ' +
                'WHERE t.name = ? AND s.name = ?',
                [tableName, schema]
              );

              for (const fk of foreignKeys) {
                const name = fk.name;
                const col = fk.col;
                const refTable = fk.refTable;
                const refCol = fk.refCol;

                if (!name || !col || !refTable || !refCol) {
                  console.warn('Skipping invalid FOREIGN KEY constraint for table ' + schema + '.' + tableName + ': name=' + name + ', col=' + col + ', refTable=' + refTable + ', refCol=' + refCol);
                  continue;
                }

                const restoreSQL = 'ALTER TABLE ' + qualifiedTableName + ' ADD CONSTRAINT [' + name + '] FOREIGN KEY ([' + col + ']) REFERENCES [' + refTable + ']([' + refCol + '])';
                this.restoreQueries.push(restoreSQL);

                try {
                  await queryRunner.query('ALTER TABLE ' + qualifiedTableName + ' DROP CONSTRAINT [' + name + ']');
                  console.debug('Dropped FOREIGN KEY constraint [' + name + '] on table ' + schema + '.' + tableName);
                } catch (error) {
                  console.error('Failed to drop FOREIGN KEY constraint [' + name + '] on table ' + schema + '.' + tableName + ': ' + error);
                  throw error;
                }
              }

              // 4. NOT NULL Constraints (excluding IDENTITY columns)
              const notNullColumns = await queryRunner.query(
                'SELECT c.name, t.name AS type_name, ' +
                'CASE ' +
                'WHEN t.name IN (\'decimal\', \'numeric\') THEN t.name + \'(\' + CAST(c.precision AS VARCHAR) + \',\' + CAST(c.scale AS VARCHAR) + \')\' ' +
                'WHEN t.name IN (\'varchar\', \'nvarchar\', \'char\', \'nchar\') THEN t.name + \'(\' + CASE WHEN c.max_length = -1 THEN \'MAX\' ELSE CAST(c.max_length AS VARCHAR) END + \')\' ' +
                'ELSE t.name ' +
                'END AS def ' +
                'FROM sys.columns c ' +
                'JOIN sys.types t ON c.system_type_id = t.system_type_id ' +
                'WHERE c.object_id = OBJECT_ID(?) AND c.is_nullable = 0 AND c.is_identity = 0',
                [qualifiedTableName]
              );

              for (const col of notNullColumns) {
                const colName = col.name;
                const def = col.def;

                if (!colName || !def) {
                  console.warn('Skipping invalid NOT NULL column for table ' + schema + '.' + tableName + ': name=' + colName + ', def=' + def);
                  continue;
                }

                const restoreSQL = 'ALTER TABLE ' + qualifiedTableName + ' ALTER COLUMN [' + colName + '] ' + def + ' NOT NULL';
                this.restoreQueries.push(restoreSQL);

                try {
                  await queryRunner.query('ALTER TABLE ' + qualifiedTableName + ' ALTER COLUMN [' + colName + '] ' + def + ' NULL');
                  console.debug('Dropped NOT NULL constraint on column [' + colName + '] in table ' + schema + '.' + tableName);
                } catch (error) {
                  console.error('Failed to drop NOT NULL constraint on column [' + colName + '] in table ' + schema + '.' + tableName + ': ' + error);
                  throw error;
                }
              }

              // Commit transaction
              await queryRunner.query('COMMIT TRANSACTION');

            } catch (error) {
              // Rollback transaction on error
              try {
                await queryRunner.query('ROLLBACK TRANSACTION');
              } catch (rollbackError) {
                console.error('Failed to rollback transaction for table ' + schema + '.' + tableName + ': ' + rollbackError);
              }
              throw error;
            } finally {
              await queryRunner.release();
            }
            // Close method disableSQLServerConstraints
          }
          private async disableOracleConstraints(tableName: string): Promise<void> {
            const queryRunner = this.connection.createQueryRunner();

            try {
              await queryRunner.connect();

              // Récupération du schema (utilisateur courant)
              const schemaResult = await queryRunner.query('SELECT USER FROM DUAL');
              const schema = schemaResult[0].USER.toUpperCase();
              const tableUpper = tableName.toUpperCase();

              // Récupération des contraintes
              const constraints = await queryRunner.query(
                'SELECT constraint_name, constraint_type, search_condition, r_constraint_name ' +
                'FROM all_constraints ac ' +
                'WHERE owner = ? ' +
                'AND table_name = ? ' +
                'AND constraint_type IN (\'R\', \'C\', \'U\', \'P\') ' +
                'AND ( ' +
                'constraint_name NOT LIKE \'SYS_%\' ' +
                'OR ( ' +
                'constraint_name LIKE \'SYS_%\' ' +
                'AND EXISTS ( ' +
                'SELECT 1 FROM all_cons_columns acc ' +
                'WHERE acc.owner = ac.owner ' +
                'AND acc.constraint_name = ac.constraint_name ' +
                ') ' +
                ') ' +
                ') ' +
                'ORDER BY constraint_name',
                [schema, tableUpper]
              );

              for (const row of constraints) {
                const name = row.CONSTRAINT_NAME;
                const type = row.CONSTRAINT_TYPE;
                const searchCond = row.SEARCH_CONDITION;

                // Ignorer les PRIMARY KEYS
                if (type === 'P') {
                  console.log('Constraint ' + name + ' ignored (PRIMARY KEY)');
                  continue;
                }

                // Ignorer les contraintes NOT NULL implicites
                if (type === 'C' && searchCond && searchCond.toUpperCase().includes('IS NOT NULL')) {
                  console.log('Constraint ' + name + ' ignored (NOT NULL implicit)');
                  continue;
                }

                // Ajouter la commande de restauration
                this.restoreQueries.push('ALTER TABLE ' + tableUpper + ' ENABLE CONSTRAINT ' + name);

                // Traitement spécial pour les FOREIGN KEYS (R)
                if (type === 'R') {
                  // Récupérer les colonnes de la clé étrangère
                  const fkCols = await queryRunner.query(
                    'SELECT column_name FROM all_cons_columns ' +
                    'WHERE owner = ? AND constraint_name = ? ' +
                    'ORDER BY position',
                    [schema, name]
                  );

                  for (const colRow of fkCols) {
                    const col = colRow.COLUMN_NAME;
                    const alterToNull = 'ALTER TABLE ' + tableUpper + ' MODIFY (' + col + ' NULL)';

                    try {
                      await queryRunner.query(alterToNull);
                      console.log('Column ' + tableUpper + '.' + col + ' made nullable');

                      // Ajouter la commande de restauration pour NOT NULL
                      this.restoreQueries.push('ALTER TABLE ' + tableUpper + ' MODIFY (' + col + ' NOT NULL)');
                    } catch (error) {
                      console.error('Error modifying NULL for column ' + col + ': ' + error);
                    }
                  }
                }

                // Désactiver la contrainte
                try {
                  await queryRunner.query('ALTER TABLE ' + tableUpper + ' DISABLE CONSTRAINT ' + name);
                  console.log('Constraint ' + name + ' disabled');
                } catch (error) {
                  console.error('Error disabling constraint ' + name + ': ' + error);
                }
              }

              console.log('Processing finished for table ' + tableUpper);

            } finally {
              await queryRunner.release();
            }
          }
        }

      destinationPath: "${ destinationFolder }/${ majStart(projectName) }/src/common/utils"
    - fileType: "DTO"
      fileName: "RestResponse"
      extension: "ts"
      content: |
        import { ApiProperty } from "@nestjs/swagger";
        export class RestResponse<T> {
          @ApiProperty({example: 200})
          status: number;
          @ApiProperty()
          message: string;
          @ApiProperty({example: 0})
          returnCode: number;
          @ApiProperty()
          data: T | null;
          @ApiProperty()
          timestamp: string;
        
          private constructor(status: number, message: string, returnCode: number, data: T | null) {
            this.status = status;
            this.message = message;
            this.returnCode = returnCode;
            this.data = data;
            this.timestamp = new Date().toISOString();
          }
        
          static buildSuccessResponse<T>(status: number, message: string, data: T): RestResponse<T> {
             const OK = 1;
             return new RestResponse<T>(status, message, OK, data);
          }
        
          static buildErrorResponse<T>(status: number, message: string, data?: T): RestResponse<T> {
             const KO = 0;
             return new RestResponse<T>(status, message, KO, data ?? null);
          }
        }
