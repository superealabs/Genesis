              enabled: true
            java:
              enabled: true
            build:
              enabled: true
        info:
          app:
            name: $[spring.application.name]
            description: "${projectDescription}"
            version: "0.0.1-SNAPSHOT"
            technical:
              spring-boot:
                version: "${frameworkVersion}"
              server:
                port: $[server.port]
        {{/if}}
        logging:
          level:
            root: ${loggingLevel}
            org.springframework.cloud.gateway: ${loggingLevel}

      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/main/resources/"

  configurations:
    - name: "Logging Level"
      variableName: "loggingLevel"
      options:
        - "TRACE"
        - "DEBUG"
        - "INFO"
        - "WARN"
        - "ERROR"
        - "FATAL"
        - "OFF"
      defaultOption: "INFO"
    - name: "Framework Version"
      variableName: "frameworkVersion"
      options:
        - "3.3.6"
        - "3.2.12"
      defaultOption: "3.3.6"

  eurekaClientConfigurations:
    - name: "Eureka Server URL"
      variableName: "eurekaServerURL"
      options:
        - "http://localhost:8761/eureka/"
      defaultOption: "http://localhost:8761/eureka/"


  dependencies:
    - groupId: "org.springframework.cloud"
      artifactId: "spring-cloud-starter-gateway"
      version: "{{removeLine}}"
      scope: "{{removeLine}}"
    - groupId: "org.springframework.boot"
      artifactId: "spring-boot-starter-test"
      version: "{{removeLine}}"
      scope: "test"
    - groupId: "org.springframework.boot"
      artifactId: "spring-boot-starter-webflux"
      version: "{{removeLine}}"
      scope: "{{removeLine}}"
    - groupId: "io.projectreactor"
      artifactId: "reactor-test"
      version: "{{removeLine}}"
      scope: "test"
    - groupId: "org.springframework.boot"
      artifactId: "spring-boot-starter-security"
      version: "{{removeLine}}"
      scope: "{{removeLine}}"
