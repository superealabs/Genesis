    - fileType: "ExceptionFilter"
      fileName: "AllExceptionsFilter"
      extension: "ts"
      content: |
        import { ExceptionFilter, Catch, ArgumentsHost, HttpException, HttpStatus,Logger, } from "@nestjs/common";
        import { Request, Response } from "express";
        import { ResourceNotFoundException } from "../exceptions/ResourceNotFoundException";
        import { RestResponse } from "../dto/RestResponse";
        @Catch()
        export class AllExceptionsFilter implements ExceptionFilter {
          private readonly logger = new Logger(AllExceptionsFilter.name);
          catch(exception: unknown, host: ArgumentsHost) {
            const ctx = host.switchToHttp();
            const response = ctx.getResponse<Response>();
            const request = ctx.getRequest<Request>();
            this.logger.error(
              `Error processing request ${request.method} ${request.url}`,
              (exception as any).stack || exception,
            );
            if (exception instanceof ResourceNotFoundException) {
              const status = exception.getStatus();
              const message = exception.getResponse();
              const responseBody = RestResponse.buildErrorResponse(
              status,
              typeof message === "string" ? message : (message as any)?.message ?? exception.message,
              null
              );
              return response.status(status).json(responseBody);
            }
            if (exception instanceof HttpException) {
              const status = exception.getStatus();
              const message = exception.getResponse();
              const responseBody = RestResponse.buildErrorResponse(
              status,
              typeof message === "string" ? message : (message as any)?.message ?? exception.message,
              null
              );
              return response.status(status).json(responseBody);
            }
            // handle generic error 
            const responseBody = RestResponse.buildErrorResponse(
                HttpStatus.INTERNAL_SERVER_ERROR,
                "An unexpected error occurred",
                null
            );
            return response.status(HttpStatus.INTERNAL_SERVER_ERROR).json(responseBody);
          }
        }
      destinationPath: "${ destinationFolder }/${ majStart(projectName) }/src/common/filters"

