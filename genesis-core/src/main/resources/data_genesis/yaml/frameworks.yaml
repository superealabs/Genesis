    - fileType: "ExceptionFilter"
      fileName: "GlobalExceptionFilter"
      extension: "cs"
      content: |
        namespace ${majStart(projectName)}.Filters;

        using Microsoft.AspNetCore.Mvc;
        using Microsoft.AspNetCore.Mvc.Filters;
        using ${majStart(projectName)}.Exceptions;

        public class GlobalExceptionFilter: IExceptionFilter
        {
            private readonly ILogger<GlobalExceptionFilter> _logger;

            public GlobalExceptionFilter(ILogger<GlobalExceptionFilter> logger)
            {
              _logger = logger;
            }
        
            public void OnException(ExceptionContext context)
            {
                ObjectResult result;
          
                switch (context.Exception)
                {
                    case InternalServerErrorException internalServEx:
                      _logger.LogError(internalServEx, "An internal error occured: {Message}", internalServEx.Message);
                      result = new ObjectResult(new { Message = internalServEx.Message })
                      {
                          StatusCode = StatusCodes.Status500InternalServerError
                      };
                      break;
                    
                    case ResourceNotFoundException notFoundEx:
                      _logger.LogInformation(notFoundEx, "Resource not found: {Message}", notFoundEx.Message);
                      result = new ObjectResult(new { Message = notFoundEx.Message })
                      {
                          StatusCode = StatusCodes.Status404NotFound
                      };
                      break;
                    
                    case ArgumentException argEx:
                      _logger.LogError(argEx, "Illegal argument provided: {Message}", argEx.Message);
                      result = new ObjectResult(new { Message = argEx.Message })
                      {
                          StatusCode = StatusCodes.Status400BadRequest
                      };
                      break;
        
                    case Exception ex:
                      _logger.LogError(ex, "An unexpected error occured: {Message}", ex.Message);
                      result = new ObjectResult(new { Message = "An unexpected error occurred." })
                      {
                          StatusCode = StatusCodes.Status500InternalServerError
                      };
                      break;
                    
                    default:
                      _logger.LogError("An unexpected error occured.");
                      result = new ObjectResult(new { Message = "An unexpected error occurred." })
                      {
                          StatusCode = StatusCodes.Status500InternalServerError
                      };
                      break;
                }
          
                context.Result = result;
                context.ExceptionHandled = true;
            }
        }

