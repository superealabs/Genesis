            name: $[spring.application.name]
            description: "${projectDescription}"
            version: "0.0.1-SNAPSHOT"
            technical:
              spring-boot:
                version: "${frameworkVersion}"
              server:
                port: $[server.port]
              database:
                url: $[spring.datasource.url]
