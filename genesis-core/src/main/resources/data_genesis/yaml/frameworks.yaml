          @ApiProperty({ description: "Total number of elements", example: 50 })
          totalElements: number;

          @ApiProperty({ description: "Total number of pages", example: 5 })
          totalPages: number;

          @ApiProperty({ description: "Page num (0-indexed)", example: 0 })
