  checkMinimumLengthConstraintQuery: |
    WITH constraints AS (
      SELECT 
        cc.name AS constraint_name,
        t.name AS table_name,
        s.name AS schema_name,
        cc.definition
      FROM sys.check_constraints cc
      JOIN sys.tables t ON cc.parent_object_id = t.object_id
      JOIN sys.schemas s ON t.schema_id = s.schema_id
      WHERE t.name = ? AND s.name = ?
    )
    SELECT 
      table_name,
      constraint_name,
      definition,
      
      LTRIM(RTRIM(
        SUBSTRING(
          definition,
          CHARINDEX('LEN([', definition) + 5,
          CHARINDEX(']', definition) - CHARINDEX('LEN([', definition) - 4
          )
      )) AS column_name,
      TRY_CAST(
        SUBSTRING(definition, CHARINDEX('>=', definition) + 2,
        PATINDEX('%[^0-9]%', SUBSTRING(definition, CHARINDEX('>=', definition) + 2, 20) + 'X') - 1
      ) AS INT) AS min_length
    FROM constraints
    WHERE UPPER(definition) LIKE '%LEN(%' AND definition LIKE '%>%';

  checkRegexConstraintQuery: |
    WITH constraints AS (
      SELECT 
        cc.name AS constraint_name,
        t.name AS table_name,
        s.name AS schema_name,
        cc.definition
      FROM sys.check_constraints cc
