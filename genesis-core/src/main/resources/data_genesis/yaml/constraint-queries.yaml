      LTRIM(RTRIM(
        SUBSTRING(
          definition,
          CHARINDEX('[', definition) + 1,
          CHARINDEX(']', definition) - CHARINDEX('[', definition) - 1
      ))) AS column_name,
      -- Pattern LIKE (regex)
      LTRIM(RTRIM(
        SUBSTRING(
          definition,
          CHARINDEX('LIKE', definition) + 6,
          LEN(definition)
        )
      )) AS regex_pattern
    FROM constraints
    WHERE UPPER(definition) LIKE '%LIKE%' AND definition LIKE '%[%]%';



