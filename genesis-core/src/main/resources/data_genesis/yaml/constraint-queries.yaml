                       regexp_matches(cleaned_def, '(\w+)\s*(<)\s*([0-9]+(?:\.[0-9]+)?)', 'g') AS match,
                       regexp_matches(cleaned_def, '([0-9]+(?:\.[0-9]+)?)\s*(>)\s*(\w+)', 'g') AS inverse_match
                FROM cleaned       
