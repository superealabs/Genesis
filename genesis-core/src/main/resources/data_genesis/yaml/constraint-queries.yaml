  checkNotBlankConstraintQuery: |
    WITH check_constraints AS (
                SELECT
                    c.conname AS constraint_name,
                    t.relname AS table_name,
                    pg_get_constraintdef(c.oid) AS constraint_definition
                FROM pg_constraint c
                JOIN pg_class t ON c.conrelid = t.oid
                WHERE c.contype = 'c'
                  AND t.relkind = 'r'
                  AND pg_get_constraintdef(c.oid) ~* '(<>s*''|::texts*<>s*''::text)'
            )
            SELECT
                cc.constraint_name,
                cc.table_name,
                cc.constraint_definition,
                matches[1] AS column_name
            FROM check_constraints cc
            CROSS JOIN LATERAL regexp_matches(
                cc.constraint_definition,
                '(?:trim\s*\(\s*(?:both\s+from\s+)?(\w+)\s*\)|(\w+)|\(?(\w+)\)?::text)\s*<>\s*''(?:::text)?',
                'i'
            ) AS matches
            WHERE cc.table_name = ?
            ORDER BY cc.table_name, column_name;
  checkMinimumLengthConstraintQuery: |
    WITH check_constraints AS (
                SELECT
                    c.conname AS constraint_name,
                    t.relname AS table_name,
                    pg_get_constraintdef(c.oid) AS constraint_definition
                FROM pg_constraint c
                JOIN pg_class t ON c.conrelid = t.oid
                WHERE c.contype = 'c'
                  AND t.relkind = 'r'
                  AND pg_get_constraintdef(c.oid) ~* 'length\s*\('
            )
            SELECT
                cc.constraint_name,
                cc.table_name,
                cc.constraint_definition,
                matches[1] AS column_name,
                matches[3] AS operator,
                matches[4]::int AS min_length
            FROM check_constraints cc
            CROSS JOIN LATERAL regexp_matches(
                cc.constraint_definition,
                'length\s*\(\s*\(*\s*(\w+)\s*\)*\s*(::text)?\s*\)\s*(>=|>)\s*(\d+)',
                'i'
            ) AS matches
            WHERE cc.table_name = ?
            ORDER BY cc.table_name, column_name;
  checkRegexConstraintQuery: |
    WITH check_constraints AS (
            SELECT
                c.conname AS constraint_name,
                t.relname AS table_name,
                pg_get_constraintdef(c.oid) AS constraint_definition
            FROM pg_constraint c
            JOIN pg_class t ON c.conrelid = t.oid
            WHERE c.contype = 'c'
                AND t.relkind = 'r'
                AND pg_get_constraintdef(c.oid) ~ '(::text)?\s*~\*?\s*'''
        ),
        regex_matches AS (
            SELECT
                constraint_name,
                table_name,
                constraint_definition,
                regexp_replace(constraint_definition, E'[()]', '', 'g') AS cleaned_def
            FROM check_constraints
        ),
        parsed AS (
            SELECT
                constraint_name,
                table_name,
                constraint_definition,
                regexp_matches(
                    cleaned_def,
                    E'(\\w+)(::text)?\\s*(~\\*?)\\s*''([^'']+)''(::text)?',
                    'i'
                ) AS match
            FROM regex_matches
        )
        SELECT
            constraint_name,
            table_name,
            match[1] AS column_name,
            match[3] AS operator,
            match[4] AS regex_pattern,
            constraint_definition
        FROM parsed
        WHERE table_name = ?;
- databaseId: 3
  databaseName: "SQL Server"
  checkMinimumConstraintQuery: |
    WITH constraints AS (
      SELECT 
        cc.name AS constraint_name,
        t.name AS table_name,
        s.name AS schema_name,
        cc.definition
      FROM sys.check_constraints cc
      JOIN sys.tables t ON cc.parent_object_id = t.object_id
      JOIN sys.schemas s ON t.schema_id = s.schema_id
      WHERE t.name = ? AND s.name = ?
    )
    SELECT 
      table_name,
      constraint_name,
      definition,
            LTRIM(RTRIM(
        SUBSTRING(definition, CHARINDEX('[', definition) + 1,
        CHARINDEX(']', definition) - CHARINDEX('[', definition) - 1
        )
      )) AS column_name,
      TRY_CAST(
      LTRIM(RTRIM(
        SUBSTRING(
          definition,
          CHARINDEX('>=', definition) + 3,
          CHARINDEX(')', definition + ' ', CHARINDEX('>=', definition)) - CHARINDEX('>=', definition) - 3
        )
      ) )AS FLOAT
    ) AS min_value
