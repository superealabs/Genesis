  checkPastDateConstraintQuery: |
    WITH check_constraints AS (
                SELECT
                    c.conname AS constraint_name,
                    t.relname AS table_name,
                    pg_get_constraintdef(c.oid) AS constraint_definition
                FROM
                    pg_constraint c
                JOIN
                    pg_class t ON c.conrelid = t.oid
                WHERE
                    c.contype = 'c'  -- CHECK
                    AND t.relkind = 'r'  -- tables
                    AND (
                        pg_get_constraintdef(c.oid) ~* '(\w+)\s*(>=)\s*(CURRENT_DATE|CURRENT_TIMESTAMP|NOW\(\))'
                        OR pg_get_constraintdef(c.oid) ~* '(CURRENT_DATE|CURRENT_TIMESTAMP|NOW\(\))\s*(<=)\s*(\w+)'
                    )
            ),
            parsed AS (
                SELECT
                    constraint_name,
                    table_name,
                    constraint_definition,
                    regexp_matches(constraint_definition, '(\w+)\s*(>=)\s*(CURRENT_DATE|CURRENT_TIMESTAMP|NOW\(\))', 'i') AS m1,
                    regexp_matches(constraint_definition, '(CURRENT_DATE|CURRENT_TIMESTAMP|NOW\(\))\s*(<=)\s*(\w+)', 'i') AS m2
                FROM
                    check_constraints
            )
            SELECT
                constraint_name,
                table_name,
                COALESCE(m1[1], m2[3]) AS column_name,
                COALESCE(m1[2], m2[2]) AS operator,
                COALESCE(m1[3], m2[1]) AS date_function
            FROM
                parsed
            WHERE
                table_name = ?
                AND (m1 IS NOT NULL OR m2 IS NOT NULL)
            ORDER BY
                table_name,
                column_name;
