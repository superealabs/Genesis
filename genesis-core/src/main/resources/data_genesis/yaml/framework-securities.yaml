    - fileType: "User Service"
      fileName: "UserService"
      extension: "cs"
      content: |
        namespace ${majStart(projectName)}.Services.Implementation;

        using ${majStart(projectName)}.DTOs;
        using Microsoft.AspNetCore.Identity;      
        using ${majStart(projectName)}.Models;

        public class UserService
        {
            private readonly RoleManager<IdentityRole> _roleManager;
            private readonly TokenBlacklistService _blacklistService;
            private readonly UserManager<ApplicationUser> _userManager;
            private readonly JwtService _jwtService;

            public UserService(
                UserManager<ApplicationUser> userManager, 
                RoleManager<IdentityRole> roleManager, 
                JwtService jwtService,
                TokenBlacklistService blacklistService)
            {
                _userManager = userManager;
                _roleManager = roleManager;
                _jwtService = jwtService;
                _blacklistService = blacklistService;
            }

            public async Task<string> Authenticate(AuthRequest request)
            {
                var user = await _userManager.FindByNameAsync(request.Username);
                if (user != null && await _userManager.CheckPasswordAsync(user, request.Password))
                {
                    return _jwtService.GenerateToken(user.UserName);
                }
                throw new UnauthorizedAccessException("Invalid credentials");
            }

            public async Task<string> Register(RegisterRequest request)
            {
                var user = new ApplicationUser
                {
                    UserName = request.Username,
                    Email = request.Email
                };

                var result = await _userManager.CreateAsync(user, request.Password);
                if (!result.Succeeded)
                    throw new Exception(string.Join(", ", result.Errors.Select(e => e.Description)));
                return user.Id;
            }


            public async Task ChangePassword(string username, PasswordChangeRequest model)
            {
                var user = await _userManager.FindByNameAsync(username);
                if (user == null || !await _userManager.CheckPasswordAsync(user, model.OldPassword))
                    throw new Exception("Invalid current password");

                if (model.NewPassword != model.ConfirmPassword)
                    throw new Exception("Passwords do not match");

                await _userManager.ChangePasswordAsync(user, model.OldPassword, model.NewPassword);
            }

            public async Task UpdateUser(string username, UserUpdateRequest update)
            {
                var user = await _userManager.FindByNameAsync(username);
                if (user == null) throw new Exception("User not found");
                user.Email = update.Email;
                user.UserName = update.Name;
                await _userManager.UpdateAsync(user);
            }

            public async Task<string> RefreshAccessToken(string oldToken)
            {
                var username = _jwtService.ExtractUsername(oldToken); // Vérifie la signature et l'expiration

                // Optionnel : Vous pouvez valider si l'utilisateur existe toujours
                var user = await _userManager.FindByNameAsync(username);
                if (user == null)
                    throw new UnauthorizedAccessException("User not found.");

                // Invalide l'ancien token immédiatement (comme fait dans Spring Boot)
                _blacklistService.InvalidateToken(oldToken); 

                // Génère et retourne un nouveau token
                return _jwtService.GenerateToken(username);
            }

            public void Logout(string token)
            {
                _blacklistService.InvalidateToken(token);
            }

            public async Task<UserResponseDto> GetCurrentUser(string username)
            {
                var user = await _userManager.FindByNameAsync(username);
                if (user == null)
                throw new Exception("User not found.");
                
                var userRoles = await _userManager.GetRolesAsync(user);
                
                return new UserResponseDto
                {
                    Id = user.Id,
                    Username = user.UserName,
                    Email = user.Email,
                    Enabled = user.EmailConfirmed,
                    AccountNonLocked = !user.LockoutEnabled,
                    Authorities = userRoles.Select(role => new AuthorityDto { Authority = role })
                };
            }

            public IEnumerable<IdentityRole> GetAllRoles()
            {
                return _roleManager.Roles.ToList();
            }
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/Services/Implementation"

    - fileType: "Authentication Controller"
      fileName: "AuthController"
      extension: "cs"
      content: |
        namespace ${majStart(projectName)}.Controllers;

        using Microsoft.AspNetCore.Authorization;
        using Microsoft.AspNetCore.Mvc;
        using Microsoft.AspNetCore.Http;
        using ${majStart(projectName)}.DTOs;
        using ${majStart(projectName)}.Utils;
        using ${majStart(projectName)}.Services.Implementation;
        using ${majStart(projectName)}.Models;
        using Swashbuckle.AspNetCore.Annotations;
        using System.Security.Claims;
        using Microsoft.AspNetCore.Identity;

        [ApiController]
        [Route("auth")]
        [Produces("application/json")]
        [Consumes("application/json")]
        [ApiExplorerSettings(GroupName = "v1")]
        [SwaggerTag("Authentication APIs")]
        public class AuthController : ControllerBase
        {
            private readonly UserService _userService;
            private readonly JwtService _jwtService;

            public AuthController(UserService userService, JwtService jwtService)
            {
                _userService = userService;
                _jwtService = jwtService;
            }

            [HttpPost("login")]
            [AllowAnonymous]
            [SwaggerOperation(Summary = "Login", Description = "Authenticate user and return a JWT token")]
            [ProducesResponseType(typeof(ApiResponse<string>), StatusCodes.Status200OK)]
            [ProducesResponseType(typeof(ApiResponse<string>), StatusCodes.Status401Unauthorized)]
            public async Task<IActionResult> Login([FromBody] AuthRequest request)
            {
                try
                {
                    var token = await _userService.Authenticate(request);
                    return Ok(ApiResponse<string>.Success(StatusCodes.Status200OK, "Authentication successful", token));
                }
                catch (UnauthorizedAccessException e) // Attrapez l'exception spécifique de UserService
                {
                    return Unauthorized(ApiResponse<string>.Error(StatusCodes.Status401Unauthorized, e.Message));
                }
                catch (Exception e)
                {
                    // Erreur de serveur ou autre erreur non attendue
                    return StatusCode(StatusCodes.Status500InternalServerError, ApiResponse<string>.Error(StatusCodes.Status500InternalServerError, $"Internal Server Error: {e.Message}"));
                }
            }

            [HttpPost("register")]
            [AllowAnonymous]
            [SwaggerOperation(Summary = "Register", Description = "Register a new user")]
            [ProducesResponseType(typeof(ApiResponse<string>), StatusCodes.Status201Created)]
            [ProducesResponseType(typeof(ApiResponse<string>), StatusCodes.Status400BadRequest)] // 400 pour erreur de validation ou user déjà existant
            public async Task<IActionResult> Register([FromBody] RegisterRequest request)
            {
                try
                {
                    var id = await _userService.Register(request);
                    return StatusCode(StatusCodes.Status201Created, ApiResponse<string>.Success(StatusCodes.Status201Created, "User registered successfully", id));
                }
                catch (Exception e)
                {
                    // L'exception contient les erreurs d'Identity (ex: mot de passe faible, username déjà pris)
                    return BadRequest(ApiResponse<string>.Error(StatusCodes.Status400BadRequest, $"Registration failed: {e.Message}"));
                }
            }

            [HttpPost("change-password")]
            [Authorize]
            [SwaggerOperation(Summary = "Change Password", Description = "Change the password of the logged-in user")]
            [ProducesResponseType(typeof(ApiResponse<string>), StatusCodes.Status200OK)]
            [ProducesResponseType(typeof(ApiResponse<string>), StatusCodes.Status400BadRequest)] // Utilisation de 400
            public async Task<IActionResult> ChangePassword([FromBody] PasswordChangeRequest model)
            {
                try
                {
                    var username = User.Identity?.Name ?? throw new UnauthorizedAccessException("User not authenticated.");
                    await _userService.ChangePassword(username, model);
                    return Ok(ApiResponse<string>.Success(StatusCodes.Status200OK, "Password changed successfully"));
                }
                catch (Exception e)
                {
                    // Peut être une mauvaise validation ou un ancien mot de passe invalide
                    return BadRequest(ApiResponse<string>.Error(StatusCodes.Status400BadRequest, $"Password change failed: {e.Message}"));
                }
            }

            [HttpPatch("update")]
            [Authorize]
            [SwaggerOperation(Summary = "Update User", Description = "Update user information of the logged-in user")]
            [ProducesResponseType(typeof(ApiResponse<string>), StatusCodes.Status200OK)]
            [ProducesResponseType(typeof(ApiResponse<string>), StatusCodes.Status400BadRequest)] // Utilisation de 400
            public async Task<IActionResult> Update([FromBody] UserUpdateRequest model)
            {
                try
                {
                    var username = User.Identity?.Name ?? throw new UnauthorizedAccessException("User not authenticated.");
                    await _userService.UpdateUser(username, model);
                    return Ok(ApiResponse<string>.Success(StatusCodes.Status200OK, "User updated successfully"));
                }
                catch (Exception e)
                {
                    // Peut être un utilisateur non trouvé ou un problème de mise à jour des données
                    return BadRequest(ApiResponse<string>.Error(StatusCodes.Status400BadRequest, $"Update failed: {e.Message}"));
                }
            }

            // --- NOUVEAUX ENDPOINTS (Maintenant supportés) ---

            [HttpGet("roles")]
            [AllowAnonymous]
            [SwaggerOperation(Summary = "Get all available roles", Description = "Retrieve the complete list of roles available in the system.")]
            [ProducesResponseType(typeof(ApiResponse<IEnumerable<IdentityRole>>), StatusCodes.Status200OK)]
            public IActionResult ListRoles()
            {
                var roles = _userService.GetAllRoles();
                return Ok(ApiResponse<IEnumerable<IdentityRole>>.Success(StatusCodes.Status200OK, "Roles retrieved", roles));
            }

            [HttpPost("logout")]
            [Authorize]
            [SwaggerOperation(Summary = "Logout user", Description = "Invalidate the user's JWT token")]
            [ProducesResponseType(typeof(ApiResponse<string>), StatusCodes.Status200OK)]
            [ProducesResponseType(typeof(ApiResponse<string>), StatusCodes.Status400BadRequest)]
            public IActionResult Logout([FromHeader(Name = "Authorization")] string authHeader)
            {
                string token = authHeader?.StartsWith("Bearer ") == true ? authHeader.Substring("Bearer ".Length) : null;

                if (string.IsNullOrEmpty(token))
                {
                    return BadRequest(ApiResponse<string>.Error(StatusCodes.Status400BadRequest, "Invalid Authorization Header"));
                }

                try
                {
                    _userService.Logout(token);
                    return Ok(ApiResponse<string>.Success(StatusCodes.Status200OK, "Logged out successfully", null));
                }
                catch (Exception e)
                {
                    return StatusCode(StatusCodes.Status500InternalServerError, ApiResponse<string>.Error(StatusCodes.Status500InternalServerError, e.Message));
                }
            }

            [HttpGet("current")]
            [Authorize]
            [SwaggerOperation(Summary = "Get current user", Description = "Retrieve details of the currently authenticated user")]
            [ProducesResponseType(typeof(ApiResponse<UserResponseDto>), StatusCodes.Status200OK)]
            [ProducesResponseType(typeof(ApiResponse<string>), StatusCodes.Status400BadRequest)]
            public async Task<IActionResult> CurrentUser()
            {
                var username = User.Identity?.Name;
                if (string.IsNullOrEmpty(username))
                {
                    return BadRequest(ApiResponse<string>.Error(StatusCodes.Status400BadRequest, "No valid user session"));
                }
                try
                {
                    var userDto = await _userService.GetCurrentUser(username);
                    return Ok(ApiResponse<UserResponseDto>.Success(StatusCodes.Status200OK, "User details retrieved", userDto));
                }
                catch (Exception e)
                {
                    return BadRequest(ApiResponse<string>.Error(StatusCodes.Status400BadRequest, $"Error retrieving user: {e.Message}"));
                }
            }

            [HttpPost("refresh")]
            [AllowAnonymous]
            [SwaggerOperation(Summary = "Refresh access token", Description = "Provide the current access-token to obtain a new one; the old one is invalidated.")]
            [ProducesResponseType(typeof(ApiResponse<string>), StatusCodes.Status200OK)]
            [ProducesResponseType(typeof(ApiResponse<string>), StatusCodes.Status401Unauthorized)]
            public async Task<IActionResult> Refresh([FromBody] RefreshRequest request)
            {
                try
                {
                    string newToken = await _userService.RefreshAccessToken(request.RefreshToken); 

                    return Ok(ApiResponse<string>.Success(StatusCodes.Status200OK, "Token refreshed", newToken));
                }
                catch (UnauthorizedAccessException e)
                {
                    return Unauthorized(ApiResponse<string>.Error(StatusCodes.Status401Unauthorized, e.Message));
                }
                catch (Exception e)
                {
                    return StatusCode(StatusCodes.Status500InternalServerError, ApiResponse<string>.Error(StatusCodes.Status500InternalServerError, $"Refresh failed: {e.Message}"));
                }
            }
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/Controllers"

    - fileType: "SQL Schema Bootstrapper Service"
      fileName: "SqlSchemaBootstrapper"
      extension: "cs"
      content: |
        namespace ${majStart(projectName)}.Services.Startup;

        using Microsoft.Extensions.Hosting;
        using Microsoft.Extensions.DependencyInjection;
        using Microsoft.EntityFrameworkCore;
        using System.Data.Common;
        using System.Text.RegularExpressions;
        using ${majStart(projectName)}.Data;
    
        public class SqlSchemaBootstrapper : IHostedService
        {
            private readonly IServiceProvider _provider;
            private const string SchemaFilePath = "Data/identity_schema.sql";

            public SqlSchemaBootstrapper(IServiceProvider provider)
            {
                _provider = provider;
            }

            public async Task StartAsync(CancellationToken cancellationToken)
            {
                using var scope = _provider.CreateScope();
                var context = scope.ServiceProvider.GetRequiredService<${majStart(projectName)}Context>();
                var db = context.Database;
                var conn = db.GetDbConnection();

                try
                {
                    await conn.OpenAsync(cancellationToken);

                    if (!await TableExistsAsync(conn, "AspNetUsers"))
                    {
                        var sqlContent = await File.ReadAllTextAsync(SchemaFilePath, cancellationToken);
                        var commands = Regex.Split(sqlContent, @"^\s*;\s*$", RegexOptions.Multiline)
                                            .Where(s => !string.IsNullOrWhiteSpace(s))
                                            .ToList();

                        using var transaction = await conn.BeginTransactionAsync(cancellationToken);

                        foreach (var sql in commands)
                        {
                            using var command = conn.CreateCommand();
                            command.CommandText = sql.Trim();
                            command.Transaction = transaction;
                            await command.ExecuteNonQueryAsync(cancellationToken);
                        }

                        await transaction.CommitAsync(cancellationToken);

                        Console.WriteLine("[Identity Schema] Tables créées et données 'seedées' automatiquement.");
                    }
                    else
                    {
                        Console.WriteLine("[Identity Schema] Tables déjà existantes.");
                    }
                }
                catch (Exception ex)
                {
                    Console.WriteLine($"[Identity Schema] ERREUR : Échec de l'exécution du script SQL. {ex.Message}");
                }
                finally
                {
                    await conn.CloseAsync();
                }
            }

            public Task StopAsync(CancellationToken cancellationToken) => Task.CompletedTask;

            private async Task<bool> TableExistsAsync(DbConnection connection, string tableName)
            {
                string query = connection.GetType().Name switch
                {
                    var n when n.Contains("Npgsql") => $"SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name = '{tableName.ToLower()}');",
                    var n when n.Contains("MySql") => $"SELECT COUNT(*) FROM information_schema.tables WHERE table_name = '{tableName}';",
                    var n when n.Contains("SqlConnection") => $"SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_NAME = '{tableName}';",
                    var n when n.Contains("Oracle") => $"SELECT COUNT(*) FROM user_tables WHERE table_name = UPPER('{tableName}');",
                    _ => throw new NotSupportedException($"Type de connexion non reconnu : {connection.GetType().Name}")
                };

                using var cmd = connection.CreateCommand();
                cmd.CommandText = query;
                var result = await cmd.ExecuteScalarAsync();
                return Convert.ToInt32(result) > 0;
            }
        }
