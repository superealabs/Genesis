          @JoinColumn({ name: 'role_id' })
          roleidRoleEntity!: RoleEntity;
        
          @BeforeInsert()
            async hashPassword() {
            if (this.password) {
              this.password = await bcrypt.hash(this.password, 10);
            }
          }
          
          async comparePassword(plain: string) {
            return bcrypt.compare(plain, this.password);
          }
        }
