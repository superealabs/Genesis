    - fileType: "JwtAuthenticationFilter"
      fileName: "JwtAuthenticationFilter"
      extension: "java"
      content: |
        package ${groupLink}.${lowerCase(projectName)}.config.security.filters;
  
        import jakarta.servlet.FilterChain;
        import jakarta.servlet.ServletException;
        import jakarta.servlet.http.HttpServletRequest;
        import jakarta.servlet.http.HttpServletResponse;
        import ${groupLink}.${lowerCase(projectName)}.config.security.services.JwtService;
        import ${groupLink}.${lowerCase(projectName)}.config.security.services.TokenBlacklistService;
        import ${groupLink}.${lowerCase(projectName)}.config.security.services.UserInfoService;
        import ${groupLink}.${lowerCase(projectName)}.dto.RestResponse;
        import org.springframework.beans.factory.annotation.Autowired;
        import org.springframework.context.annotation.Lazy;
        import org.springframework.http.HttpStatus;
        import org.springframework.http.MediaType;
        import org.springframework.lang.NonNull;
        import org.springframework.security.authentication.UsernamePasswordAuthenticationToken;
        import org.springframework.security.core.context.SecurityContextHolder;
        import org.springframework.security.core.userdetails.UserDetails;
        import org.springframework.security.web.authentication.WebAuthenticationDetailsSource;
        import org.springframework.stereotype.Component;
        import org.springframework.web.filter.OncePerRequestFilter;
        
        import com.fasterxml.jackson.databind.ObjectMapper;
        
        import java.io.IOException;
        
        @Component
        public class JwtAuthenticationFilter extends OncePerRequestFilter {
          private final JwtService jwtService;
          private final TokenBlacklistService tokenBlacklistService;
          private final UserInfoService userInfoService;
          
          private final ObjectMapper objectMapper;
          
          @Autowired
          public JwtAuthenticationFilter(JwtService jwtService, TokenBlacklistService tokenBlacklistService, @Lazy UserInfoService userInfoService,
          ObjectMapper objectMapper) {
            this.jwtService = jwtService;
            this.tokenBlacklistService = tokenBlacklistService;
            this.userInfoService = userInfoService;
            this.objectMapper = objectMapper;
          }
        
          @Override
          protected void doFilterInternal(HttpServletRequest request, @NonNull HttpServletResponse response, @NonNull FilterChain filterChain)
          throws ServletException, IOException {
    
            String authHeader = request.getHeader("Authorization");
            String username = null;
            String jwt = null;
    
            if (authHeader != null && authHeader.startsWith("Bearer ")) {
              jwt = authHeader.substring(7);
    
              // Vérification blacklist
              if (tokenBlacklistService.isTokenInvalidated(jwt)) {
                sendErrorResponse(response,
                HttpStatus.UNAUTHORIZED,
                "Token has been invalidated");
                return;
              }
    
              try {
                username = jwtService.extractUsername(jwt);
              } catch (Exception e) {
                sendErrorResponse(response,
                  HttpStatus.UNAUTHORIZED,
                  "Invalid token: " + e.getMessage());
                return;
              }
            }

            if (username != null && SecurityContextHolder.getContext().getAuthentication() == null) {
                UserDetails userDetails = userInfoService.loadUserByUsername(username);
                
                try {
                    if (jwtService.validateToken(jwt, userDetails)) {
                        UsernamePasswordAuthenticationToken authToken = new UsernamePasswordAuthenticationToken(
                                userDetails, null, userDetails.getAuthorities());
                        authToken.setDetails(new WebAuthenticationDetailsSource().buildDetails(request));
                        SecurityContextHolder.getContext().setAuthentication(authToken);
                    }
                } catch (Exception e) {
                    sendErrorResponse(response, 
                                     HttpStatus.UNAUTHORIZED, 
                                     "Token validation failed: " + e.getMessage());
                    return;
                }
            }
            filterChain.doFilter(request, response);
          }

          private void sendErrorResponse(HttpServletResponse response, 
                                        HttpStatus status, 
                                        String message) throws IOException {
              RestResponse<String> errorResponse = RestResponse.buildErrorResponse(
                  status,
                  message,
                  null
              );
              
              response.setStatus(status.value());
              response.setContentType(MediaType.APPLICATION_JSON_VALUE);
              response.getWriter().write(objectMapper.writeValueAsString(errorResponse));
          }
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/main/java/${groupLinkPath}/${lowerCase(projectName)}/config/security/filters/"

    - fileType: "SecurityConfig"
      fileName: "SecurityConfig"
      extension: "java"
      content: |
        package ${groupLink}.${lowerCase(projectName)}.config.security.filters;
  
        import ${groupLink}.${lowerCase(projectName)}.config.security.handlers.JwtAccessDeniedHandler;
        import ${groupLink}.${lowerCase(projectName)}.config.security.handlers.JwtAuthEntryPoint;
        import org.springframework.beans.factory.annotation.Autowired;
        import org.springframework.context.annotation.Bean;
        import org.springframework.context.annotation.Configuration;
        import org.springframework.security.authentication.AuthenticationManager;
        import org.springframework.security.authentication.AuthenticationProvider;
        import org.springframework.security.authentication.dao.DaoAuthenticationProvider;
        import org.springframework.security.config.annotation.authentication.configuration.AuthenticationConfiguration;
        import org.springframework.security.config.annotation.method.configuration.EnableMethodSecurity;
        import org.springframework.security.config.annotation.web.builders.HttpSecurity;
        import org.springframework.security.config.annotation.web.configuration.EnableWebSecurity;
        import org.springframework.security.config.annotation.web.configurers.AbstractHttpConfigurer;
        import org.springframework.security.config.http.SessionCreationPolicy;
        import org.springframework.security.core.userdetails.UserDetailsService;
        import org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder;
        import org.springframework.security.crypto.password.PasswordEncoder;
        import org.springframework.security.web.SecurityFilterChain;
        import org.springframework.security.web.access.expression.WebExpressionAuthorizationManager;
        import org.springframework.security.web.authentication.UsernamePasswordAuthenticationFilter;
        import org.springframework.web.cors.CorsConfiguration;
        import org.springframework.web.cors.CorsConfigurationSource;
        import org.springframework.web.cors.UrlBasedCorsConfigurationSource;
        
        import java.util.Arrays;
        import java.util.List;
  
        @Configuration
        @EnableWebSecurity
        @EnableMethodSecurity
        public class SecurityConfig {
          public static final PasswordEncoder passwordEncoder = new BCryptPasswordEncoder(); // Password encoding
          public final UserDetailsService userDetailsService;
          private final JwtAuthenticationFilter authFilter;
          
          //NEW
          private final JwtAuthEntryPoint authenticationEntryPoint;
          private final JwtAccessDeniedHandler accessDeniedHandler;
          
          @Autowired
          public SecurityConfig(JwtAuthenticationFilter authFilter, UserDetailsService userDetailsService,
            JwtAuthEntryPoint authenticationEntryPoint,
            JwtAccessDeniedHandler accessDeniedHandler) {
            this.authFilter = authFilter;
            this.userDetailsService = userDetailsService;
            
            this.authenticationEntryPoint = authenticationEntryPoint;
            this.accessDeniedHandler = accessDeniedHandler;
          }
        
          static CorsConfigurationSource getCorsConfigurationSource(CorsConfiguration configuration) {
                configuration.setAllowedMethods(Arrays.asList("GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"));
                configuration.setAllowedHeaders(List.of("*"));
                configuration.setAllowCredentials(false);
                configuration.setMaxAge(3600L);
        
                UrlBasedCorsConfigurationSource source = new UrlBasedCorsConfigurationSource();
                source.registerCorsConfiguration("/**", configuration);
                return source;
          }
        
          @Bean
          public SecurityFilterChain securityFilterChain(HttpSecurity http) throws Exception {
            http
              .cors(cors -> cors.configurationSource(corsConfigurationSource()))
              .csrf(AbstractHttpConfigurer::disable)
              .authorizeHttpRequests(auth -> auth
                  .requestMatchers("/auth/**", "/welcome/**", "/swagger-ui/**", "/v3/api-docs/**").permitAll()
                  // Autoriser ADMIN sur TOUTES les routes via une expression SpEL
                  .anyRequest().access(new WebExpressionAuthorizationManager(
                      "hasAuthority('ROLE_ADMIN')" 
                  ))
              )
              .sessionManagement(sess -> sess
                      .sessionCreationPolicy(SessionCreationPolicy.STATELESS) // No sessions
              )
              .authenticationProvider(authenticationProvider()) // Custom authentication provider
              .addFilterBefore(authFilter, UsernamePasswordAuthenticationFilter.class) // Add JWT filter
              .exceptionHandling()
                    .authenticationEntryPoint(authenticationEntryPoint)
                    .accessDeniedHandler(accessDeniedHandler);
            return http.build();
          }
      
          @Bean
          public CorsConfigurationSource corsConfigurationSource() {
            CorsConfiguration configuration = new CorsConfiguration();
            configuration.setAllowedOrigins(List.of("*")); // Spécifiez explicitement l'origine
            return getCorsConfigurationSource(configuration);
          }
    
          @Bean
            public PasswordEncoder passwordEncoder() {
            return passwordEncoder; // Password encoding
          }
    
          @Bean
          public AuthenticationProvider authenticationProvider() {
            DaoAuthenticationProvider authenticationProvider = new DaoAuthenticationProvider();
            authenticationProvider.setUserDetailsService(userDetailsService);
            authenticationProvider.setPasswordEncoder(passwordEncoder);
            return authenticationProvider;
          }
    
          @Bean
          public AuthenticationManager authenticationManager(AuthenticationConfiguration config) throws Exception {
            return config.getAuthenticationManager();
          }
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/main/java/${groupLinkPath}/${lowerCase(projectName)}/config/security/filters/"

    - fileType: "UserAuthController"
      fileName: "UserAuthController"
      extension: "java"
      content: |
        package ${groupLink}.${lowerCase(projectName)}.config.security.controllers;
  
        import jakarta.validation.Valid;
        import ${groupLink}.${lowerCase(projectName)}.config.security.models.AuthRequest;
        import ${groupLink}.${lowerCase(projectName)}.config.security.models.PasswordChangeRequest;
        import ${groupLink}.${lowerCase(projectName)}.config.security.models.UserUpdateRequest;
        import ${groupLink}.${lowerCase(projectName)}.config.security.services.JwtService;
        import ${groupLink}.${lowerCase(projectName)}.config.security.services.TokenBlacklistService;
        import ${groupLink}.${lowerCase(projectName)}.config.security.services.UserInfoService;
        import ${groupLink}.${lowerCase(projectName)}.dto.RestResponse;
        import ${groupLink}.${lowerCase(projectName)}.models.UserEntity;
        import org.springframework.beans.factory.annotation.Autowired;
        import org.springframework.http.HttpStatus;
        import org.springframework.http.ResponseEntity;
        import org.springframework.security.core.userdetails.UserDetails;
        import org.springframework.web.bind.annotation.*;
        
        import io.swagger.v3.oas.annotations.Operation;
        import io.swagger.v3.oas.annotations.media.Content;
        import io.swagger.v3.oas.annotations.media.Schema;
        import io.swagger.v3.oas.annotations.responses.ApiResponse;
        import io.swagger.v3.oas.annotations.responses.ApiResponses;
        import io.swagger.v3.oas.annotations.security.SecurityRequirement;
        import io.swagger.v3.oas.annotations.tags.Tag;
        
        @RestController
        @RequestMapping("/auth")
        @Tag(name = "Authentication", description = "Endpoints for user authentication and management")
        public class UserAuthController {
          private final JwtService jwtService;
          private final UserInfoService userInfoService;
          private final TokenBlacklistService tokenBlacklistService;
          
          @Autowired
          public UserAuthController(JwtService jwtService, UserInfoService userInfoService, TokenBlacklistService tokenBlacklistService) {
            this.jwtService = jwtService;
            this.userInfoService = userInfoService;
            this.tokenBlacklistService = tokenBlacklistService;
          }
          
           @Operation(
            security = { @SecurityRequirement(name = "bearerAuth") },
            summary = "Logout user",
            description = "Invalidate the user's JWT token"
          )
          @ApiResponses({
            @ApiResponse(
              responseCode = "200",
              description = "Successfully logged out",
              content = @Content(mediaType = "application/json", schema = @Schema(implementation = RestResponse.class))
            ),
            @ApiResponse(
              responseCode = "400",
              description = "Invalid Authorization header",
              content = @Content(mediaType = "application/json", schema = @Schema(implementation = RestResponse.class))
           )
          })
          @PostMapping("/logout")
          public ResponseEntity<RestResponse<String>> logout(@RequestHeader("Authorization") String authHeader) {
            if (authHeader != null && authHeader.startsWith("Bearer ")) {
              String token = authHeader.substring(7);
              tokenBlacklistService.invalidateToken(token);
              return ResponseEntity.ok(
                RestResponse.buildSuccessResponse(
                  HttpStatus.OK,
                  "Logged out successfully",
                  null
                )
              );
            }
            return ResponseEntity.badRequest().body(
              RestResponse.buildErrorResponse(
                HttpStatus.BAD_REQUEST,
                "Invalid Authorization Header",
                null
              )
            );
          }
        
          @Operation(
            security = { @SecurityRequirement(name = "bearerAuth") },
            summary = "Get current user",
            description = "Retrieve details of the currently authenticated user"
          )
          @ApiResponses({
            @ApiResponse(
              responseCode = "200",
              description = "Successfully retrieved user details",
              content = @Content(mediaType = "application/json", schema = @Schema(implementation = RestResponse.class))
            ),
            @ApiResponse(
              responseCode = "400",
              description = "No valid user session",
              content = @Content(mediaType = "application/json", schema = @Schema(implementation = RestResponse.class))
           )
          })
          @GetMapping("/current")
          public ResponseEntity<RestResponse<UserDetails>> currentUser(@RequestHeader("Authorization") String authHeader) {
            try {
              if (authHeader != null && authHeader.startsWith("Bearer ")) {
                String token = authHeader.substring(7);
                String username = jwtService.extractUsername(token);
                UserDetails userConnected = userInfoService.loadUserByUsername(username);
                return ResponseEntity.ok(
                  RestResponse.buildSuccessResponse(
                    HttpStatus.OK,
                    "User details retrieved",
                    userConnected
                  )
                );
              }
            } catch (Exception e) {
              return ResponseEntity.badRequest().body(
                RestResponse.buildErrorResponse(
                  HttpStatus.BAD_REQUEST,
                  "Error retrieving user: " + e.getMessage(),
                  null
                )
              );
            }
            return ResponseEntity.badRequest().body(
                RestResponse.buildErrorResponse(
                    HttpStatus.BAD_REQUEST,
                    "No user connected",
                    null
                )
            );
          }
        
          @Operation(
              summary = "Register new user",
              description = "Create a new user account"
          )
          @ApiResponses({
            @ApiResponse(
              responseCode = "200",
              description = "User created successfully",
              content = @Content(mediaType = "application/json", schema = @Schema(implementation = RestResponse.class))
            ),
            @ApiResponse(
              responseCode = "400",
              description = "Invalid user data",
              content = @Content(mediaType = "application/json", schema = @Schema(implementation = RestResponse.class))
           )
          })
          @PostMapping("/register")
          public ResponseEntity<RestResponse<String>> addNewUser(@RequestBody UserEntity user) {
            try {
              String result = userInfoService.addUser(user);
              return ResponseEntity.ok(
                RestResponse.buildSuccessResponse(
                  HttpStatus.OK,
                  "User registered successfully",
                  result
                )
              );
            } catch (Exception e) {
              return ResponseEntity.badRequest().body(
                RestResponse.buildErrorResponse(
                  HttpStatus.BAD_REQUEST,
                  "Registration failed: " + e.getMessage(),
                  null
                )
              );
            }
          }

          @Operation(
              summary = "User login",
              description = "Authenticate user and generate JWT token"
          )
          @ApiResponses({
              @ApiResponse(
                  responseCode = "200",
                  description = "Authentication successful",
                  content = @Content(mediaType = "application/json", schema = @Schema(implementation = RestResponse.class))
              ),
              @ApiResponse(
                  responseCode = "401",
                  description = "Invalid credentials",
                  content = @Content(mediaType = "application/json", schema = @Schema(implementation = RestResponse.class))
              )
          })
          @PostMapping("/login")
          public ResponseEntity<RestResponse<String>> authenticateAndGetToken(@Valid @RequestBody AuthRequest authRequest) {
              try {
                  String token = userInfoService.authenticateAndGetToken(authRequest);
                  return ResponseEntity.ok(
                      RestResponse.buildSuccessResponse(
                          HttpStatus.OK,
                          "Authentication successful",
                          token
                      )
                  );
              } catch (Exception e) {
                  return ResponseEntity.status(HttpStatus.UNAUTHORIZED).body(
                      RestResponse.buildErrorResponse(
                          HttpStatus.UNAUTHORIZED,
                          "Authentication failed: " + e.getMessage(),
                          null
                      )
                  );
              }
          }
        
          @Operation(
            security = { @SecurityRequirement(name = "bearerAuth") },
            summary = "Update user information",
            description = "Update the current user's name and email"
          )
          @ApiResponses({
            @ApiResponse(
              responseCode = "200",
              description = "User updated successfully",
              content = @Content(mediaType = "application/json", schema = @Schema(implementation = RestResponse.class))
            ),
            @ApiResponse(
              responseCode = "400",
              description = "Invalid data or update failed",
              content = @Content(mediaType = "application/json", schema = @Schema(implementation = RestResponse.class))
           )
          })
          @PatchMapping("/update")
          public ResponseEntity<RestResponse<String>> updateUser(
          @RequestHeader("Authorization") String authHeader,
          @Valid @RequestBody UserUpdateRequest updateRequest) {
          
            try {
              if (authHeader != null && authHeader.startsWith("Bearer ")) {
                String token = authHeader.substring(7);
                String username = jwtService.extractUsername(token);
                userInfoService.updateUser(username, updateRequest);
          
                return ResponseEntity.ok(
                  RestResponse.buildSuccessResponse(
                    HttpStatus.OK,
                    "User updated successfully",
                    null
                  )
                );
              }
              return ResponseEntity.badRequest().body(
                RestResponse.buildErrorResponse(
                  HttpStatus.BAD_REQUEST,
                  "Invalid Authorization Header",
                  null
                )
              );
          } catch (Exception e) {
            return ResponseEntity.badRequest().body(
            RestResponse.buildErrorResponse(
            HttpStatus.BAD_REQUEST,
            "Update failed: " + e.getMessage(),
                          null
                      )
                  );
              }
          }
        
          @Operation(
            security = { @SecurityRequirement(name = "bearerAuth") },
            summary = "Change user password",
            description = "Change the current user's password. Requires old password, new password and confirmation."
          )
          @ApiResponses({
            @ApiResponse(
              responseCode = "200",
              description = "Password changed successfully",
              content = @Content(mediaType = "application/json", schema = @Schema(implementation = RestResponse.class))
            ),
            @ApiResponse(
              responseCode = "400",
              description = "Invalid data or password change failed",
              content = @Content(mediaType = "application/json", schema = @Schema(implementation = RestResponse.class))
           )
          })
          @PostMapping("/change-password")
          public ResponseEntity<RestResponse<String>> changePassword(
          @RequestHeader("Authorization") String authHeader,
          @Valid @RequestBody PasswordChangeRequest passwordChangeRequest) {
          
            try {
              if (authHeader != null && authHeader.startsWith("Bearer ")) {
                String token = authHeader.substring(7); 
                String username = jwtService.extractUsername(token);
                userInfoService.changeUserPassword(
                  username,
                  passwordChangeRequest.getOldPassword(),
                  passwordChangeRequest.getNewPassword(),
                  passwordChangeRequest.getConfirmPassword()
                );
            
                return ResponseEntity.ok(
                  RestResponse.buildSuccessResponse(
                    HttpStatus.OK,
                    "Password changed successfully",
                    null
                  )
                );
              }
              return ResponseEntity.badRequest().body(
                RestResponse.buildErrorResponse(
                  HttpStatus.BAD_REQUEST,
                  "Invalid Authorization Header",
                  null
                )
              );
            } catch (Exception e) {
              return ResponseEntity.badRequest().body(
                RestResponse.buildErrorResponse(
                  HttpStatus.BAD_REQUEST,
                  "Password change failed: " + e.getMessage(),
                  null
                )
              );
            }
          }
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/main/java/${groupLinkPath}/${lowerCase(projectName)}/config/security/controllers/"

