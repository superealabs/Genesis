    - fileType: "Controller"
      fileName: "auth.controller"
      extension: "ts"
      content: |
        import { Controller, Post, Body, UseGuards, HttpStatus, Get, Headers, Request } from '@nestjs/common';
        import { AuthService } from './auth.service';
        import { LoginDto } from './dto/login.dto';
        import { RegisterDto } from './dto/register.dto';
        import { ApiOperation, ApiTags, ApiResponse, ApiBearerAuth } from '@nestjs/swagger';
        import { RestResponse } from '../../common/dto/RestResponse';
        import { AuthGuard } from '@nestjs/passport';
        import { JwtAuthGuard } from './guards/jwt-auth.guard';

        @ApiTags('auth')
        @Controller('auth')
        export class AuthController {
          constructor(private readonly authService: AuthService) {}

          @ApiOperation({ summary: 'User login', description: "Authenticate user and generate JWT token" })
          @ApiResponse({ status: 201, description: 'Authentication successful' })
          @ApiResponse({ status: 401, description: 'Invalid credentials' })
          @Post('login')
          async login(@Body() loginDto: LoginDto) {
            try {
              return RestResponse.buildSuccessResponse(
                201,
                "Authentication successful",
                await this.authService.login(loginDto)
              );

            } catch (error) {
              return RestResponse.buildErrorResponse(
                400,
                "Registration failed: "+ error,
                null
              );
            }
          }

         @ApiOperation({ summary: 'Register new user', description: "Create a new user account"}) 
         @ApiResponse({ status: 201, description: 'User created successfully' })
         @ApiResponse({ status: 400, description: 'Invalid user data' })
         @Post('register')
          async register(@Body() registerDto: RegisterDto) {
             try {
              return RestResponse.buildSuccessResponse(
                201,
                "User registered successfully",
                await this.authService.register(registerDto)
              );

            } catch (error) {
              return RestResponse.buildErrorResponse(
                400,
                "Registration failed: "+ error,
                null
              );
            }
          }
          @ApiBearerAuth('jwt')
          @UseGuards(JwtAuthGuard)
          @ApiOperation({
            summary: 'Get current user',
            description: 'Retrieve details of the currently authenticated user',
          })
          @ApiResponse({ status: 200, description: 'Successfully retrieved user details', })
          @ApiResponse({ status: 400, description: 'No valid user session' })
          @Get('current')
          async currentUser(@Request() req: any) {
            try {
              const userConnected = (req as any).user;
              if (userConnected) {
                return RestResponse.buildSuccessResponse(
                  HttpStatus.OK,
                  "User details retrieved",
                  userConnected
                );
              }
            } catch (e) {
              return RestResponse.buildErrorResponse(
                HttpStatus.BAD_REQUEST,
                "Error retrieving user: " + (e),
                null
              );
            }
            return RestResponse.buildErrorResponse(
              HttpStatus.BAD_REQUEST,
              "No user connected",
              null
            );
          }
          @ApiBearerAuth('jwt')
          @UseGuards(JwtAuthGuard)
          @ApiOperation({
            summary: 'Logout',
            description: 'Invalidate the provided JWT token (if supported)',
          })
          @ApiResponse({ status: 200, description: 'Logged out successfully' })
          @ApiResponse({ status: 400, description: 'Invalid Authorization Header' })
          @Post('logout')
          async logout(@Headers('authorization') authHeader: string) {
            if (authHeader && authHeader.startsWith('Bearer ')) {
              const token = authHeader.substring(7);
              await this.authService.invalidateToken(token);

              return RestResponse.buildSuccessResponse(
                HttpStatus.OK,
                "Logged out successfully",
                null
              );
            }
            return RestResponse.buildErrorResponse(
              HttpStatus.BAD_REQUEST,
              "Invalid Authorization Header",
              null
            );
          }

        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/modules/auth"
    - fileType: "Service"
      fileName: "auth.service"
      extension: "ts"
      content: |
        import { Injectable, UnauthorizedException } from '@nestjs/common';
        import { JwtService } from '@nestjs/jwt';
        import { InjectRepository } from '@nestjs/typeorm';
        import { Repository } from 'typeorm';
        import { UserEntity } from '../user-entity/user-entity.entity';
        import { JwtPayload } from './interfaces/jwt-payload.interface';
        import { LoginDto } from './dto/login.dto';
        import { RegisterDto } from './dto/register.dto';
        import { RoleEntity } from '../role-entity/role-entity.entity';
        import { BlacklistService } from './blacklist.service';
        @Injectable()
        export class AuthService {
          constructor(
            @InjectRepository(UserEntity)
            private usersRepository: Repository<UserEntity>,
              @InjectRepository(RoleEntity)
            private roleRepository: Repository<RoleEntity>,
            private jwtService: JwtService,
            private blacklistService: BlacklistService,
          ) {}
        
          async validateUser(loginDto: LoginDto): Promise<UserEntity | null> {
             const user = await this.usersRepository.findOne({
             // Authenticate using username (UserEntity.name)
               where: { name: loginDto.name },
               relations: ['roleidRoleEntity'],
             });
             
             if (user && await user.comparePassword(loginDto.password)) {
              return user;
             }
             return null;
          }
          async invalidateToken(token: string): Promise<{ message: string }> {
              this.blacklistService.addToBlacklist(token);
              return { message: 'User logged out successfully' };
          }
          async login(loginDto: LoginDto) {
            const user = await this.validateUser(loginDto);
            if (!user) {
            throw new UnauthorizedException('Invalid credentials');
            }
            
            const payload: JwtPayload = {
              sub: user.id,
              name: user.name,
              role: user.roleidRoleEntity?.name,
            };
            
            return {
            access_token: this.jwtService.sign(payload),
            user: {
                id: user.id,
                name: user.name,
                role: user.roleidRoleEntity?.name,
              },
            };
          }
          
          async register(registerDto: RegisterDto) {
            const existingUser = await this.usersRepository.findOne({
              where: { name: registerDto.name },
            });
            
            if (existingUser) {
              throw new UnauthorizedException('Username already used');
            }
            const user = this.usersRepository.create(registerDto);
            const role = await this.roleRepository.findOne({ where: { id: registerDto.roleId } });
            if (!role) {
              throw new UnauthorizedException('The specified role does not exist');
            }
            user.roleidRoleEntity = role
            console.log(JSON.stringify(user)+" USEEEER")
            
            const savedUser = await this.usersRepository.save(user);
            
            const { password, ...result } = savedUser;
            return result;
          }
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/modules/auth"
    - fileType: "Module"
      fileName: "auth.module"
      extension: "ts"
      content: |
        import { Module } from '@nestjs/common';
        import { JwtModule, JwtSignOptions } from '@nestjs/jwt';
        import { PassportModule } from '@nestjs/passport';
        import { TypeOrmModule } from '@nestjs/typeorm';
        import { AuthService } from './auth.service';
        import { AuthController } from './auth.controller';
        import { JwtStrategy } from './strategies/jwt.strategy';
        import { UserEntity } from '../user-entity/user-entity.entity';
        import { RoleEntity } from '../role-entity/role-entity.entity';
        import { ConfigModule, ConfigService } from '@nestjs/config';
        import { BlacklistService } from './blacklist.service';
        @Module({
          imports: [
            TypeOrmModule.forFeature([UserEntity, RoleEntity]),
            PassportModule,
            PassportModule,
            ConfigModule,
            JwtModule.registerAsync({
              imports: [ConfigModule],
              inject: [ConfigService],
              useFactory: (cfg: ConfigService) => {
                const secret = cfg.getOrThrow<string>('JWT_SECRET');
                const exp = cfg.get<string>('JWT_EXPIRES_IN') ?? '1h';
                const expiresIn = exp as unknown as JwtSignOptions['expiresIn'];
                return {
                  secret,
                  signOptions: { expiresIn },
                };
              },
            }),
          ],
          providers: [AuthService, JwtStrategy, BlacklistService],
          controllers: [AuthController],
          exports: [AuthService, BlacklistService],
          })
          export class AuthModule {}

      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/modules/auth"

    - fileType: "Service"
      fileName: "blacklist.service"
      extension: "ts"
      content: |
        import { Injectable } from '@nestjs/common';

        @Injectable()
        export class BlacklistService {
          private blacklistedTokens = new Set<string>();

          addToBlacklist(token: string): void {
            this.blacklistedTokens.add(token);
          }

          isBlacklisted(token: string): boolean {
            return this.blacklistedTokens.has(token);
          }
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/modules/auth"
  additionalDependencies: [ ]
  metadataBooleanTrueKeys:
    - "useJWT"



