    - fileType: "User Service"
      fileName: "ApplicationUserService"
      extension: "cs"
      content: |
        namespace ${majStart(projectName)}.Services.Implementation;
        
        using ${majStart(projectName)}.Models.Dto;
        using Microsoft.AspNetCore.Identity;
        using ${majStart(projectName)}.Models;
        
        public class ApplicationUserService
        {
        {{tab}}private readonly UserManager<ApplicationUser> _userManager;
          
        {{tab}}public ApplicationUserService(UserManager<ApplicationUser> userManager)
        {{tab}}{
        {{tab}}    _userManager = userManager;
        {{tab}}}
        
        {{tab}}public async Task<bool> Authenticate(AuthRequest request)
        {{tab}}{
        {{tab}}    var user = await _userManager.FindByNameAsync(request.Username);
        {{tab}}    if (user != null && await _userManager.CheckPasswordAsync(user, request.Password))
        {{tab}}    {
        {{tab}}        return true; // Authentication successful
        {{tab}}    }
        {{tab}}    return false; // Invalid credentials
        {{tab}}}
        
        {{tab}}public async Task<string> Register(RegisterRequest request)
        {{tab}}{
        {{tab}}    var user = new ApplicationUser
        {{tab}}    {
        {{tab}}        UserName = request.Username,
        {{tab}}        Email = request.Email
        {{tab}}    };
        
        {{tab}}    var result = await _userManager.CreateAsync(user, request.Password);
        {{tab}}    if (!result.Succeeded)
        {{tab}}        throw new Exception(string.Join(", ", result.Errors.Select(e => e.Description)));
        
        {{tab}}    return user.Id;
        {{tab}}}
        
        {{tab}}public async Task ChangePassword(string username, PasswordChangeRequest model)
        {{tab}}{
        {{tab}}    var user = await _userManager.FindByNameAsync(username);
        {{tab}}    if (user == null || !await _userManager.CheckPasswordAsync(user, model.OldPassword))
        {{tab}}        throw new Exception("Invalid current password");
        
        {{tab}}    if (model.NewPassword != model.ConfirmPassword)
        {{tab}}        throw new Exception("Passwords do not match");
        
        {{tab}}    await _userManager.ChangePasswordAsync(user, model.OldPassword, model.NewPassword);
        {{tab}}}
        
        {{tab}}public async Task UpdateUser(string username, UserUpdateRequest update)
        {{tab}}{
        {{tab}}    var user = await _userManager.FindByNameAsync(username);
        {{tab}}    if (user == null) throw new Exception("User not found");
        
        {{tab}}    user.Email = update.Email;
        {{tab}}    user.UserName = update.Name;
        {{tab}}    await _userManager.UpdateAsync(user);
        {{tab}}}
        }

      destinationPath: "${destinationFolder}/${majStart(projectName)}/Services/Implementation"

    - fileType: "Authentication Controller"
      fileName: "AuthController"
      extension: "cs"
      content: |
        namespace ${majStart(projectName)}.Controllers;
  
        using Microsoft.AspNetCore.Authorization;
        using Microsoft.AspNetCore.Identity;
        using Microsoft.AspNetCore.Mvc;
        using ${majStart(projectName)}.Models.Dto;
        using ${majStart(projectName)}.Models;
        using ${majStart(projectName)}.Services.Implementation;
  
        [AllowAnonymous]
        public class AuthController : Controller
        {
        {{tab}}private readonly UserManager<ApplicationUser> _userManager;
        {{tab}}private readonly SignInManager<ApplicationUser> _signInManager;
        
        {{tab}}public AuthController(UserManager<ApplicationUser> userManager, SignInManager<ApplicationUser> signInManager)
        {{tab}}{
        {{tab}}    _userManager = userManager;
        {{tab}}    _signInManager = signInManager;
        {{tab}}}
  
        {{tab}}[HttpGet]
        {{tab}}public IActionResult Login()
        {{tab}}{
        {{tab}}    return View();
        {{tab}}}
  
        {{tab}}[HttpPost]
        {{tab}}public async Task<IActionResult> Login(AuthRequest model)
        {{tab}}{
        {{tab}}    if (!ModelState.IsValid)
        {{tab}}        return View(model);
        
        {{tab}}    var result = await _signInManager.PasswordSignInAsync(
        {{tab}}        model.Username, model.Password, isPersistent: false, lockoutOnFailure: false);
        
        {{tab}}    if (result.Succeeded)
        {{tab}}    {{#each allEntities}}
        {{tab}}    {{#if @first}}
        {{tab}}        return RedirectToAction("Index", "${this.entityName}");{{/if}}{{/each}}
        
        {{tab}}    ModelState.AddModelError("", "Invalid username or password");
        {{tab}}    return View(model);
        {{tab}}}
  
        {{tab}}[HttpGet]
        {{tab}}public IActionResult Register()
        {{tab}}{
        {{tab}}    return View();
        {{tab}}}
        
        {{tab}}[HttpPost]
        {{tab}}public async Task<IActionResult> Register(RegisterRequest model)
        {{tab}}{
        {{tab}}    if (!ModelState.IsValid)
        {{tab}}        return View(model);
        
        {{tab}}    var user = new ApplicationUser { UserName = model.Username, Email = model.Email };
        {{tab}}    var result = await _userManager.CreateAsync(user, model.Password);
        
        {{tab}}    if (result.Succeeded)
        {{tab}}        return RedirectToAction("Login");
        
        {{tab}}    foreach (var error in result.Errors)
        {{tab}}        ModelState.AddModelError("", error.Description);
        
        {{tab}}    return View(model);
        {{tab}}}
        
        {{tab}}[HttpPost]
        {{tab}}[Authorize]
        {{tab}}public async Task<IActionResult> Logout()
        {{tab}}{
        {{tab}}    await _signInManager.SignOutAsync();
        {{tab}}    return RedirectToAction("Login");
        {{tab}}}
        }

      destinationPath: "${destinationFolder}/${majStart(projectName)}/Controllers"

    - fileType: "Login Page"
      fileName: "Login"
      extension: "cshtml"
      content: |
        @model ${majStart(projectName)}.Models.Dto.AuthRequest

        @{
            Layout = null;
        }
        
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>${majStart(projectName)} | Log in</title>
            <link rel="stylesheet" href="~/css/style.css" asp-append-version="true" />
            <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
        
            body {
                background-color: var(--bg-color);
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            }
            
            .app-name {
                color: var(--primary-color);
            }
            
            .project-logo {
                width: 100%;
                height: 50px;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                padding: 5px;
                box-sizing: border-box;
            }
          
            .project-logo img {
                max-width: 90%; 
                max-height: 90%; 
                width: auto;
                height: auto;
                object-fit: contain;
                object-position: center;
                display: block; 
            }
            
            .login-container {
                background-color: var(--bg-secondary);
                border-radius: var(--border-radius);
                box-shadow: var(--shadow-lg);
                width: 100%;
                max-width: 400px;
                overflow: hidden;
            }
            
            .login-header {
                padding: 30px 20px;
                text-align: center;
                color: var(--text-primary);
            }
            
            .login-header h1 {
                font-size: 24px;
                font-weight: 600;
                margin-bottom: 10px;
            }
            
            .login-header p {
                font-size: 14px;
                opacity: 0.9;
            }
            
            .login-form {
                padding: 0px 30px 30px 30px;
            }
            
            .form-group {
                margin-bottom: 20px;
                position: relative;
            }
            
            .form-group label {
                display: block;
                font-size: 14px;
                margin-bottom: 8px;
                color: var(--text-primary);
                font-weight: 500;
            }
            
            .form-group input {
                width: 100%;
                padding: 0.65rem 3rem 0.65rem 1rem;
                border: 1px solid var(--border-color);
                border-radius: var(--border-radius);
                font-size: 14px;
                transition: border-color 0.3s;
            }
            
            .form-group input:focus {
                border-color: var(--primary-color);
                outline: none;
                box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
            }
            
            .input-icon {
                position: absolute;
                right: 1rem;
                top: 72%;
                transform: translateY(-50%);
                color: var(--text-secondary);
            }
            
            .login-form .btn-primary {
                width: 100%;
            }
            
            .error-message {
                margin: 25px;
                color: #e74c3c;
                font-size: 14px;
            }
            
            .password-toggle {
                background: none;
                border: none;
                cursor: pointer;
                padding: 0;
            }
            
            .password-toggle svg {
                display: none;
            }
            
            .password-toggle svg.active {
                display: block;
            }
            </style>
        </head>
        
        <body>
            <div class="login-container">
                <div class="login-header">
        
                {{#if useLogoLink or hasLogo}}
                <div class="project-logo">
                    <img src="~/images${logoUrl}"
                        alt="">
                </div>
                {{else}}
                    <h1 class="app-name">${majStart(projectName)}</h1>
                {{/if}}
        
                </div>
                @if (!ViewData.ModelState.IsValid)
                {
                    <div class="error-message">
                    @foreach (var error in ViewData.ModelState.Values.SelectMany(v => v.Errors))
                    {
                        <p>@error.ErrorMessage</p>
                    }
                    </div>
                }
                <form class="login-form" asp-action="Login" method="post">
                    <div class="form-group">
                        <label asp-for="Username" data-i18n="username"></label>
                        <input type="text" asp-for="Username" required>
                        <div class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24">
                                <path fill="currentColor" fill-rule="evenodd" d="M8 11a4 4 0 0 1 4-4h1a4 4 0 0 1 4 4v2a4 4 0 0 1-4 4h-1a4 4 0 0 1-4-4v-2Zm4-2a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-1Z" clip-rule="evenodd"></path>
                                <path fill="currentColor" fill-rule="evenodd" d="M3 11.5A8.5 8.5 0 0 1 11.5 3H14a7 7 0 0 1 7 7v4a3 3 0 1 1-6 0v-2h2v2a1 1 0 1 0 2 0v-4a5 5 0 0 0-5-5h-2.5A6.5 6.5 0 0 0 5 11.5v1a6.5 6.5 0 0 0 6.5 6.5h2.923a6.5 6.5 0 0 0 3.344-.926l.718-.432 1.03 1.716-.72.43A8.5 8.5 0 0 1 14.424 21H11.5A8.5 8.5 0 0 1 3 12.5v-1Z" clip-rule="evenodd"></path>
                            </svg>
                        </div>
                    </div>
                
                    <div class="form-group">
                        <label asp-for="Password" data-i18n="password"></label>
                        <input type="password" asp-for="Password" id="password-input" required>
                        <button type="button" class="input-icon password-toggle" id="password-toggle">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" id="eye-open" class="active">
                                <g fill="none" fill-rule="evenodd" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" transform="translate(1 1)">
                                <path d="M0 8s4-8 11-8 11 8 11 8-4 8-11 8S0 8 0 8z"></path>
                                <circle cx="11" cy="8" r="3"></circle>
                                </g>
                            </svg>
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" id="eye-closed">
                                <g fill="none" fill-rule="evenodd" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"></path>
                                </g>
                            </svg>
                        </button>
                    </div>
                
                    <button type="submit" class="btn btn-primary btn-md btn-login" data-i18n="login"></button>
                </form>
            </div>
            
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    const passwordToggle = document.getElementById('password-toggle');
                    const passwordInput = document.getElementById('password-input');
                    const eyeOpen = document.getElementById('eye-open');
                    const eyeClosed = document.getElementById('eye-closed');
                
                    passwordToggle.addEventListener('click', function() {
                        if (passwordInput.type === 'password') {
                            passwordInput.type = 'text';
                            eyeOpen.classList.remove('active');
                            eyeClosed.classList.add('active');
                        } else {
                            passwordInput.type = 'password';
                            eyeClosed.classList.remove('active');
                            eyeOpen.classList.add('active');
                        }
                    });
                });
            </script>
            <script src="~/js/index.js"></script>
            <script src="~/js/lang.js"></script>
        </body>
        </html>

      destinationPath: "${destinationFolder}/${majStart(projectName)}/Views/Auth"

    - fileType: "SQL Schema Bootstrapper Service"
      fileName: "SqlSchemaBootstrapper"
      extension: "cs"
      content: |
        namespace ${majStart(projectName)}.Services.Startup;

        using Microsoft.Extensions.Hosting;
        using Microsoft.Extensions.DependencyInjection;
        using Microsoft.EntityFrameworkCore;
        using System.Data.Common;
        using ${majStart(projectName)}.Data;
        
        public class SqlSchemaBootstrapper : IHostedService
        {
            private readonly IServiceProvider _provider;
            private const string SchemaFilePath = "Data/identity_schema.sql"; // chemin du script SQL

            public SqlSchemaBootstrapper(IServiceProvider provider)
            {
                _provider = provider;
            }

            public async Task StartAsync(CancellationToken cancellationToken)
            {
                using var scope = _provider.CreateScope();
                var context = scope.ServiceProvider.GetRequiredService<${majStart(projectName)}Context>();
                var db = context.Database;
                var conn = db.GetDbConnection();

                try
                {
                    await conn.OpenAsync(cancellationToken);

                    if (!await TableExistsAsync(conn, "AspNetUsers"))
                    {
                        var sql = await File.ReadAllTextAsync(SchemaFilePath, cancellationToken);
                        using var command = conn.CreateCommand();
                        command.CommandText = sql;
                        await command.ExecuteNonQueryAsync(cancellationToken);

                        Console.WriteLine("[Identity Schema] Tables créées automatiquement.");
                    }
                    else
                    {
                        Console.WriteLine("[Identity Schema] Tables déjà existantes.");
                    }
                }
                catch (Exception ex)
                {
                    Console.WriteLine($"[Identity Schema] ERREUR : {ex.Message}");
                }
                finally
                {
                    await conn.CloseAsync();
                }
            }

            public Task StopAsync(CancellationToken cancellationToken) => Task.CompletedTask;

            private async Task<bool> TableExistsAsync(DbConnection connection, string tableName)
            {
                string query = connection.GetType().Name switch
                {
                    var n when n.Contains("Npgsql") => $"SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name = '{tableName.ToLower()}');",
                    var n when n.Contains("MySql") => $"SELECT COUNT(*) FROM information_schema.tables WHERE table_name = '{tableName}';",
                    var n when n.Contains("SqlConnection") => $"SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_NAME = '{tableName}';",
                    var n when n.Contains("Oracle") => $"SELECT COUNT(*) FROM user_tables WHERE table_name = UPPER('{tableName}');",
                    _ => throw new NotSupportedException($"Type de connexion non reconnu : {connection.GetType().Name}")
                };

                using var cmd = connection.CreateCommand();
                cmd.CommandText = query;
                var result = await cmd.ExecuteScalarAsync();
                return Convert.ToInt32(result) > 0;
            }
        
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/Services/Startup"

