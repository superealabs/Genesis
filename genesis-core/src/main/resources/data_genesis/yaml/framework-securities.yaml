        import * as bcrypt from 'bcryptjs';
        @Entity({ name: 'users' })
        export class UserEntity {
          @PrimaryGeneratedColumn({ type: 'bigint', name: 'id' })
          id!: number;
  
          @Column({ name: 'name', type: 'varchar', length: 100, nullable: true })
