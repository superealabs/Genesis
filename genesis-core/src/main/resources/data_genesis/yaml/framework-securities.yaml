- id: 1
  frameworkId: 1
  name: "Spring Security - JWT"
  securityFiles:
    - fileType: "Type User Entity"
      fileName: "TypeUser"
      extension: "java"
      content: |
        package ${groupLink}.${lowerCase(projectName)}.models;

        import jakarta.persistence.*;
        import lombok.Getter;
        import lombok.Setter;

        @Getter
        @Setter
        @Entity
        @Table(name = "type_user")
        public class TypeUser {
            @Id
            @GeneratedValue(strategy = GenerationType.IDENTITY)
            @Column(name = "id")
            private Long id;

            @Column(name = "name")
            private String name;
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/main/java/${groupLinkPath}/${lowerCase(projectName)}/models"

    - fileType: "Type User Repository"
      fileName: "TypeUserRepository"
      extension: "java"
      content: |
        package ${groupLink}.${lowerCase(projectName)}.repositories;
  
        import ${groupLink}.${lowerCase(projectName)}.models.TypeUser;
        import org.springframework.data.jpa.repository.JpaRepository;
        import java.util.Optional;
        
        public interface TypeUserRepository extends JpaRepository<TypeUser, Long> {
          Optional<TypeUser> findAllByName(String username);
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/main/java/${groupLinkPath}/${lowerCase(projectName)}/repositories"

    - fileType: "User Entity"
      fileName: "User"
      extension: "java"
      content: |
        package ${groupLink}.${lowerCase(projectName)}.models;

        import jakarta.persistence.*;
        import lombok.Getter;
        import lombok.Setter;

        @Getter
        @Setter
        @Entity
        @Table(name = "\"user\"")
        public class User {
            @Id
            @GeneratedValue(strategy = GenerationType.IDENTITY)
            @Column(name = "id")
            private Long id;

            @Column(name = "name")
            private String name;

            @Column(name = "email")
            private String email;

            @Column(name = "password")
            private String password;

            @ManyToOne
            @JoinColumn(name = "type_user_id")
            private TypeUser typeuseridTypeUser;
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/main/java/${groupLinkPath}/${lowerCase(projectName)}/models"


  additionalDependencies:
    - groupId: "org.springframework.boot"
      artifactId: "spring-boot-starter-security"
      version: "{{removeLine}}"
      scope: "{{removeLine}}"
    - groupId: "io.jsonwebtoken"
      artifactId: "jjwt-api"
      version: "0.11.5"
      scope: "{{removeLine}}"
    - groupId: "io.jsonwebtoken"
      artifactId: "jjwt-impl"
      version: "0.11.5"
      scope: "{{removeLine}}"
    - groupId: "io.jsonwebtoken"
      artifactId: "jjwt-jackson"
      version: "0.11.5"
      scope: "{{removeLine}}"
