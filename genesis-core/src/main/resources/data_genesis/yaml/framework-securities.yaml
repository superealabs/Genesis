    - fileType: "Guard"
      fileName: "jwt-auth.guard"
      extension: "ts"
      content: |
        import { ExecutionContext, Injectable, UnauthorizedException } from '@nestjs/common';
        import { AuthGuard } from '@nestjs/passport';
        import { BlacklistService } from '../blacklist.service';
          
        @Injectable()
        export class JwtAuthGuard extends AuthGuard('jwt') {
          constructor(private blacklistService: BlacklistService) {
            super();
          }
          
          handleRequest(err: any, user: any, info: any, context: ExecutionContext) {
             const request = context.switchToHttp().getRequest();
             const token = this.extractToken(request);
             
             if (token && this.blacklistService?.isBlacklisted(token)) {
               throw new UnauthorizedException('Token invalidated');
             }
               
             if (err || !user) {
               throw err || new UnauthorizedException((info as any)?.message || 'Unauthorized');
             }
             
             return user;
          }
          
          private extractToken(request: any): string | null {
              const authHeader = request.headers.authorization;
              return authHeader?.startsWith('Bearer ') ? authHeader.substring(7) : null;
          }
        }

      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/modules/auth/guards"
