    - fileType: "Custom implementation of the UserDetails(Spring security class)"
      fileName: "UserInfoDetails"
      extension: "java"
      content: |
        package ${groupLink}.${lowerCase(projectName)}.config.security.models;
  
        import ${groupLink}.${lowerCase(projectName)}.models.User;
        import org.springframework.security.core.GrantedAuthority;
        import org.springframework.security.core.authority.SimpleGrantedAuthority;
        import org.springframework.security.core.userdetails.UserDetails;
        
        import java.util.Collection;
        import java.util.List;
        import java.util.stream.Collectors;
        import java.util.stream.Stream;
        
        public class UserInfoDetails implements UserDetails {
        
          private final String username; // Changed from 'name' to 'username' for clarity
          private final String password;
          private final String email;
          private final List<GrantedAuthority> authorities;
          
          public UserInfoDetails(User user) {
            this.username = user.getName(); // Assuming 'name' is used as 'username'
            this.password = user.getPassword();
            this.email = user.getEmail();
            this.authorities = Stream.of(user.getTypeuseridTypeUser().getName().split(","))
            .map(SimpleGrantedAuthority::new)
            .collect(Collectors.toList());
          }
          
          @Override
          public Collection<? extends GrantedAuthority> getAuthorities() {
            return authorities;
          }
          
          @Override
          public String getPassword() {
            return password;
          }
          
          @Override
          public String getUsername() {
            return username;
          }
          
          @Override
          public boolean isAccountNonExpired() {
            return true; // Implement your logic if you need this
          }
          
          @Override
          public boolean isAccountNonLocked() {
            return true; // Implement your logic if you need this
          }
          
          @Override
          public boolean isCredentialsNonExpired() {
            return true; // Implement your logic if you need this
          }
          
          @Override
          public boolean isEnabled() {
            return true; // Implement your logic if you need this
          }
          
          public String getEmail() {
            return email;
          }
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/main/java/${groupLinkPath}/${lowerCase(projectName)}/config/security/models/"

