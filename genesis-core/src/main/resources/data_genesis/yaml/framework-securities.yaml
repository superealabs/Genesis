            user.roleidRoleEntity = role
            console.log(JSON.stringify(user)+" USEEEER")
            
            const savedUser = await this.usersRepository.save(user);
            
            const { password, ...result } = savedUser;
            return result;
          }
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/modules/auth"
    - fileType: "Module"
      fileName: "auth.module"
      extension: "ts"
      content: |
        import { Module } from '@nestjs/common';
        import { JwtModule, JwtSignOptions } from '@nestjs/jwt';
        import { PassportModule } from '@nestjs/passport';
        import { TypeOrmModule } from '@nestjs/typeorm';
        import { AuthService } from './auth.service';
        import { AuthController } from './auth.controller';
        import { JwtStrategy } from './strategies/jwt.strategy';
        import { UserEntity } from '../user-entity/user-entity.entity';
        import { RoleEntity } from '../role-entity/role-entity.entity';
        import { ConfigModule, ConfigService } from '@nestjs/config';
        import { BlacklistService } from './blacklist.service';
        @Module({
          imports: [
            TypeOrmModule.forFeature([UserEntity, RoleEntity]),
            PassportModule,
            PassportModule,
            ConfigModule,
            JwtModule.registerAsync({
              imports: [ConfigModule],
              inject: [ConfigService],
              useFactory: (cfg: ConfigService) => {
                const secret = cfg.getOrThrow<string>('JWT_SECRET');
                const exp = cfg.get<string>('JWT_EXPIRES_IN') ?? '1h';
                const expiresIn = exp as unknown as JwtSignOptions['expiresIn'];
                return {
                  secret,
                  signOptions: { expiresIn },
                };
              },
            }),
          ],
          providers: [AuthService, JwtStrategy, BlacklistService],
          controllers: [AuthController],
          exports: [AuthService, BlacklistService],
          })
          export class AuthModule {}

      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/modules/auth"

    - fileType: "Service"
      fileName: "blacklist.service"
      extension: "ts"
      content: |
        import { Injectable } from '@nestjs/common';

        @Injectable()
        export class BlacklistService {
          private blacklistedTokens = new Set<string>();

          addToBlacklist(token: string): void {
            this.blacklistedTokens.add(token);
          }

          isBlacklisted(token: string): boolean {
            return this.blacklistedTokens.has(token);
          }
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/modules/auth"
  additionalDependencies: [ ]
  metadataBooleanTrueKeys:
    - "useJWT"


