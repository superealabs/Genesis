    - fileType: "JwtService"
      fileName: "JwtService"
      extension: "java"
      content: |
        package ${groupLink}.${lowerCase(projectName)}.config.security.services;
  
        import io.jsonwebtoken.Claims;
        import io.jsonwebtoken.Jwts;
        import io.jsonwebtoken.SignatureAlgorithm;
        import io.jsonwebtoken.io.Decoders;
        import io.jsonwebtoken.security.Keys;
        import jakarta.annotation.PostConstruct;
        import org.springframework.beans.factory.annotation.Value;
        import org.springframework.security.core.userdetails.UserDetails;
        import org.springframework.stereotype.Component;
        
        import java.security.Key;
        import java.util.Date;
        import java.util.HashMap;
        import java.util.Map;
        import java.util.function.Function;
        
        @Component
        public class JwtService {
          public static String SECRET;
          public static long EXPIRATION_TIME;
          @Value("$[jwt.secret]")
          private String secret;
          @Value("$[jwt.expiration]")
          private long expirationTime;
          
          // Get the signing key for JWT token
          private static Key getSignKey() {
            byte[] keyBytes = Decoders.BASE64.decode(SECRET);
            return Keys.hmacShaKeyFor(keyBytes);
          }
        
          // Extract the expiration date from the token
          public static Date extractExpiration(String token) {
            return extractClaim(token, Claims::getExpiration);
          }
        
          // Extract a claim from the token
          public static <T> T extractClaim(String token, Function<Claims, T> claimsResolver) {
            final Claims claims = extractAllClaims(token);
            return claimsResolver.apply(claims);
          }
        
          // Extract all claims from the token
          private static Claims extractAllClaims(String token) {
            return Jwts.parserBuilder()
            .setSigningKey(getSignKey())
            .build()
            .parseClaimsJws(token)
            .getBody();
          }
        
          @PostConstruct
          public void init() {
            SECRET = secret;
            EXPIRATION_TIME = expirationTime;
          }
        
          // Generate token with given user name
          public String generateToken(String userName) {
            Map<String, Object> claims = new HashMap<>();
            return createToken(claims, userName);
          }
        
          // Create a JWT token with specified claims and subject (user name)
          private String createToken(Map<String, Object> claims, String userName) {
            return Jwts.builder()
            .setClaims(claims)
            .setSubject(userName)
            .setIssuedAt(new Date())
            .setExpiration(new Date(System.currentTimeMillis() + 1000 * EXPIRATION_TIME)) // Token valid for 30 minutes
            .signWith(getSignKey(), SignatureAlgorithm.HS256)
            .compact();
          }
        
          // Extract the username from the token
          public String extractUsername(String token) {
            return extractClaim(token, Claims::getSubject);
          }
        
          // Check if the token is expired
          public Boolean isTokenExpired(String token) {
            return extractExpiration(token).before(new Date());
          }
        
          // Validate the token against user details and expiration
          public Boolean validateToken(String token, UserDetails userDetails) {
            final String username = extractUsername(token);
            return (username.equals(userDetails.getUsername()) && !isTokenExpired(token));
          }
        }

      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/main/java/${groupLinkPath}/${lowerCase(projectName)}/config/security/services/"

    - fileType: "TokenBlacklistService"
      fileName: "TokenBlacklistService"
      extension: "java"
      content: |
        package ${groupLink}.${lowerCase(projectName)}.config.security.services;
  
        import org.springframework.scheduling.annotation.Scheduled;
        import org.springframework.stereotype.Service;
        
        import java.util.concurrent.ConcurrentHashMap;
        
        @Service
        public class TokenBlacklistService {
          private final ConcurrentHashMap<String, Long> invalidatedTokens = new ConcurrentHashMap<>();
          
          public void invalidateToken(String token) {
            // Ajoute le token dans la blacklist avec une durée d'expiration correspondant à sa validité
            long expirationTime = extractExpiration(token);
            invalidatedTokens.put(token, expirationTime);
          }
          
          public boolean isTokenInvalidated(String token) {
            // Vérifie si le token est dans la blacklist
            Long expirationTime = invalidatedTokens.get(token);
            return expirationTime != null && expirationTime > System.currentTimeMillis();
          }
          
          private long extractExpiration(String token) {
            // Méthode pour extraire la date d'expiration du JWT (à implémenter avec JwtService)
            return JwtService.extractExpiration(token).getTime();
          }
          
          // Pour nettoyage automatique (facultatif)
          @Scheduled(fixedRate = 60000) // Chaque minute
          public void cleanExpiredTokens() {
            long now = System.currentTimeMillis();
            invalidatedTokens.entrySet().removeIf(entry -> entry.getValue() < now);
          }
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/main/java/${groupLinkPath}/${lowerCase(projectName)}/config/security/services/"

    - fileType: "UserInfoService"
      fileName: "UserInfoService"
      extension: "java"
      content: |
        package ${groupLink}.${lowerCase(projectName)}.config.security.services;
  
        import ${groupLink}.${lowerCase(projectName)}.config.security.models.AuthRequest;
        import ${groupLink}.${lowerCase(projectName)}.config.security.models.UserInfoDetails;
        import ${groupLink}.${lowerCase(projectName)}.config.security.models.UserUpdateRequest;
        import ${groupLink}.${lowerCase(projectName)}.models.UserEntity;
        import ${groupLink}.${lowerCase(projectName)}.repositories.UserEntityRepository;
        import org.springframework.beans.factory.annotation.Autowired;
        import org.springframework.context.annotation.Lazy;
        import org.springframework.security.authentication.AuthenticationManager;
        import org.springframework.security.authentication.UsernamePasswordAuthenticationToken;
        import org.springframework.security.core.Authentication;
        import org.springframework.security.core.userdetails.UserDetails;
        import org.springframework.security.core.userdetails.UserDetailsService;
        import org.springframework.security.core.userdetails.UsernameNotFoundException;
        import org.springframework.stereotype.Service;
        
        import java.util.Optional;
        
        import static ${groupLink}.${lowerCase(projectName)}.config.security.filters.SecurityConfig.passwordEncoder;
        
        @Service
        public class UserInfoService implements UserDetailsService {
          private final UserEntityRepository repository;
          private final JwtService jwtService;
          private final AuthenticationManager authenticationManager;
          
          @Autowired
          public UserInfoService(UserEntityRepository repository, JwtService jwtService, @Lazy AuthenticationManager authenticationManager) {
            this.repository = repository;
            this.jwtService = jwtService;
            this.authenticationManager = authenticationManager;
          }
          
          @Override
          public UserDetails loadUserByUsername(String username) throws UsernameNotFoundException {
            Optional<UserEntity> userDetail = repository.findAllByName(username); // Assuming 'email' is used as username
          
            // Converting UserInfo to UserDetails
            return userDetail.map(UserInfoDetails::new)
              .orElseThrow(() -> new UsernameNotFoundException("User not found: " + username));
          }
        
          public String addUser(UserEntity user) {
              // Encode password before saving the user
              user.setPassword(passwordEncoder.encode(user.getPassword()));
              repository.save(user);
              return "User Added Successfully";
          }
          
          public String authenticateAndGetToken(AuthRequest authRequest) {
            System.out.println("Received username: " + authRequest.username());
            System.out.println("Received password: " + authRequest.password());
    
            Authentication authentication = authenticationManager.authenticate(
                    new UsernamePasswordAuthenticationToken(authRequest.username(), authRequest.password())
            );
            if (authentication.isAuthenticated()) {
                return jwtService.generateToken(authRequest.username());
            } else {
                throw new UsernameNotFoundException("Invalid user request!");
            }
          }
          
          // Ajoutez ces méthodes dans UserInfoService
          public void updateUser(String username, UserUpdateRequest updateRequest) {
            UserEntity user = repository.findUserByName(username);
            if (user == null) {
              throw new UsernameNotFoundException("User not found: " + username);
            }
            
            if (updateRequest.getName() != null) {
                user.setName(updateRequest.getName());
            }
            if (updateRequest.getEmail() != null) {
                user.setEmail(updateRequest.getEmail());
            }
                
            repository.save(user);
          }
        
          public void changeUserPassword(
                  String username, 
                  String oldPassword, 
                  String newPassword, 
                  String confirmPassword) {
            
            if (!newPassword.equals(confirmPassword)) {
                throw new IllegalArgumentException("New password and confirmation do not match");
            }
          
            UserEntity user = repository.findUserByName(username);
            if (user == null) {
              throw new UsernameNotFoundException("User not found: " + username);
            }
                
            // Vérifier l'ancien mot de passe
            if (!passwordEncoder.matches(oldPassword, user.getPassword())) {
              throw new IllegalArgumentException("Old password is incorrect");
            }
          
            user.setPassword(passwordEncoder.encode(newPassword));
            repository.save(user);
          }
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/main/java/${groupLinkPath}/${lowerCase(projectName)}/config/security/services/"

    - fileType: "JwtAccessDeniedHandler"
      fileName: "JwtAccessDeniedHandler"
      extension: "java"
      content: |
        package ${groupLink}.${lowerCase(projectName)}.config.security.handlers;

        import java.io.IOException;

        import ${groupLink}.${lowerCase(projectName)}.dto.RestResponse;
        import org.springframework.http.HttpStatus;
        import org.springframework.http.MediaType;
        import org.springframework.security.access.AccessDeniedException;
        import org.springframework.security.web.access.AccessDeniedHandler;
        import org.springframework.stereotype.Component;

        import com.fasterxml.jackson.databind.ObjectMapper;

        import jakarta.servlet.http.HttpServletRequest;
        import jakarta.servlet.http.HttpServletResponse;
        
        @Component
        public class JwtAccessDeniedHandler implements AccessDeniedHandler {

            private final ObjectMapper objectMapper;

            // Injection de l'ObjectMapper via le constructeur
            public JwtAccessDeniedHandler(ObjectMapper objectMapper) {
                this.objectMapper = objectMapper;
            }

            @Override
            public void handle(HttpServletRequest request,
                               HttpServletResponse response,
                               AccessDeniedException ex) throws IOException {

                // Création de la réponse standardisée
                RestResponse<Void> restResponse = RestResponse.buildErrorResponse(
                    HttpStatus.FORBIDDEN,
                    ex.getMessage(),
                    null
                );

                // Conversion en JSON
                String jsonResponse = objectMapper.writeValueAsString(restResponse);

                // Configuration de la réponse HTTP
                response.setContentType(MediaType.APPLICATION_JSON_VALUE);
                response.setStatus(HttpServletResponse.SC_FORBIDDEN);
                response.getWriter().write(jsonResponse);
            }
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/src/main/java/${groupLinkPath}/${lowerCase(projectName)}/config/security/handlers/"

    - fileType: "JwtAuthEntryPoint"
      fileName: "JwtAuthEntryPoint"
      extension: "java"
      content: |
        package ${groupLink}.${lowerCase(projectName)}.config.security.handlers;

        import java.io.IOException;

        import ${groupLink}.${lowerCase(projectName)}.dto.RestResponse;
        import org.springframework.http.HttpStatus;
        import org.springframework.http.MediaType;
        import org.springframework.security.core.AuthenticationException;
        import org.springframework.security.web.AuthenticationEntryPoint;
        import org.springframework.stereotype.Component;

        import com.fasterxml.jackson.databind.ObjectMapper;

        import jakarta.servlet.http.HttpServletRequest;
        import jakarta.servlet.http.HttpServletResponse;
        
        @Component
        public class JwtAuthEntryPoint implements AuthenticationEntryPoint {

            private final ObjectMapper objectMapper;

            public JwtAuthEntryPoint(ObjectMapper objectMapper) {
                this.objectMapper = objectMapper;
            }

            @Override
            public void commence(HttpServletRequest request, 
                                 HttpServletResponse response,
                                 AuthenticationException ex) throws IOException {

                // Construire la réponse standardisée
                RestResponse<Void> restResponse = RestResponse.buildErrorResponse(
                    HttpStatus.UNAUTHORIZED,
                    ex.getMessage(),
                    null  // Aucune donnée supplémentaire
                );

                // Convertir en JSON
                String jsonResponse = objectMapper.writeValueAsString(restResponse);

                // Configurer la réponse HTTP
                response.setContentType(MediaType.APPLICATION_JSON_VALUE);
                response.setStatus(HttpServletResponse.SC_UNAUTHORIZED);
                response.getWriter().write(jsonResponse);
            }
        }
