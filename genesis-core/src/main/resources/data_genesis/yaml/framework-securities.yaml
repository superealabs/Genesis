    - fileType: "JWT Service"
      fileName: "JwtService"
      extension: "cs"
      content: |
        namespace ${majStart(projectName)}.Services.Implementation;
        
        using System.IdentityModel.Tokens.Jwt;
        using System.Security.Claims;
        using System.Text;
        using Microsoft.Extensions.Configuration;
        using Microsoft.IdentityModel.Tokens;
        
        public class JwtService
        {
            private readonly IConfiguration _config;
            private readonly SymmetricSecurityKey _signingKey;
            private readonly TokenValidationParameters _validationParameters;

            public JwtService(IConfiguration config)
            {
                _config = config;
                var keyBytes = Convert.FromBase64String(_config["Jwt:SecretKey"]!);
                _signingKey = new SymmetricSecurityKey(keyBytes);

                _validationParameters = new TokenValidationParameters
                {
                    ValidateIssuerSigningKey = true,
                    IssuerSigningKey = _signingKey,
                    ValidateIssuer = false,
                    ValidateAudience = false,
                    ClockSkew = TimeSpan.Zero // Pour une expiration stricte
                };
            }

            public string GenerateToken(string username)
            {
                var claims = new[]
                {
                    new Claim(JwtRegisteredClaimNames.Sub, username),
                    new Claim(JwtRegisteredClaimNames.Jti, Guid.NewGuid().ToString())
                };

                var creds = new SigningCredentials(_signingKey, SecurityAlgorithms.HmacSha256);

                var token = new JwtSecurityToken(
                    claims: claims,
                    expires: DateTime.UtcNow.AddMinutes(30),
                    signingCredentials: creds
                );
                return new JwtSecurityTokenHandler().WriteToken(token);
            }

            public ClaimsPrincipal ValidateToken(string token)
            {
                // Tente de valider le token et retourne le principal
                try
                {
                    return new JwtSecurityTokenHandler().ValidateToken(token, _validationParameters, out _);
                }
                catch (SecurityTokenException)
                {
                    throw new UnauthorizedAccessException("Invalid or expired token.");
                }
            }

            public string ExtractUsername(string token)
            {
                var principal = ValidateToken(token);
                return principal.Identity?.Name ?? throw new UnauthorizedAccessException("Username not found in token.");
            }

            public DateTime? ExtractExpirationDate(string token)
            {
                var tokenHandler = new JwtSecurityTokenHandler();
                if (!tokenHandler.CanReadToken(token)) return null;

                var jwtToken = tokenHandler.ReadJwtToken(token);
                // Le temps d'expiration est en format Unix Time Stamp
                var exp = jwtToken.Claims.FirstOrDefault(c => c.Type == JwtRegisteredClaimNames.Exp)?.Value;

                if (exp != null && long.TryParse(exp, out long expTime))
                {
                    // Convertir le timestamp UNIX en DateTime UTC
                    DateTime dtDateTime = new DateTime(1970, 1, 1, 0, 0, 0, 0, DateTimeKind.Utc);
                    dtDateTime = dtDateTime.AddSeconds(expTime);
                    return dtDateTime;
                }
                return null;
            }
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/Services/Implementation"

    - fileType: "Token Blacklist Service"
      fileName: "TokenBlacklistService"
      extension: "cs"
      content: |
        namespace ${majStart(projectName)}.Services.Implementation;
        
        public class TokenBlacklistService
        {
            private static readonly Dictionary<string, DateTime> InvalidatedTokens = new Dictionary<string, DateTime>();
            private readonly JwtService _jwtService;

            public TokenBlacklistService(JwtService jwtService)
            {
                _jwtService = jwtService;
            }

            public void InvalidateToken(string token)
            {
                var expiration = _jwtService.ExtractExpirationDate(token);
                if (expiration.HasValue)
                {
                    InvalidatedTokens[token] = expiration.Value;
                }
                else
                {
                    InvalidatedTokens[token] = DateTime.UtcNow.AddMinutes(1);
                }
            }

            public bool IsTokenInvalidated(string token)
            {
                if (InvalidatedTokens.TryGetValue(token, out DateTime expirationTime))
                {
                    return expirationTime > DateTime.UtcNow;
                }
                return false;
            }

            public void CleanExpiredTokens()
            {
                var now = DateTime.UtcNow;
                var tokensToRemove = InvalidatedTokens.Where(kvp => kvp.Value <= now).Select(kvp => kvp.Key).ToList();

                foreach (var token in tokensToRemove)
                {
                    InvalidatedTokens.Remove(token);
                }
            }
        }
