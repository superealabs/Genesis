                      {{tab}}AddEquals(e => e.${majStart(this.columnNameField)}, ${this.name}.${toPascalCase(this.referencedPrimaryKeyColumn)});
              {{elseIf this.isTimeTz}}
              {{tab}}AddEqualsTimeOfDay(e => e.${majStart(this.name)}, dto.${majStart(this.name)});
              {{tab}}AddRangeTimeOfDay(e => e.${majStart(this.name)}, dto.${majStart(this.name)}Min, dto.${majStart(this.name)}Max);
              {{elseIf this.isNumeric or this.isDate or this.isTime or this.isDateTime or this.isInterval}}
              {{tab}}AddRange(e => e.${majStart(this.name)},  dto.${majStart(this.name)}Min,  dto.${majStart(this.name)}Max);
              {{tab}}AddEquals(e => e.${majStart(this.name)}, dto.${majStart(this.name)});
              {{elseIf this.isText}}
              {{tab}}AddLike(e => e.${majStart(this.name)}, dto.${majStart(this.name)});
              {{tab}}{{else}}
              {{tab}}AddEquals(e => e.${majStart(this.name)}, dto.${majStart(this.name)});{{/if}}{{#if !@last}}{{newline}}{{/if}}
              {{tab}}{{/each}}
