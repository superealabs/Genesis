    - fileType: "Predicate Builder Util"
      fileName: "PredicateBuilder"
      extension: "cs"
      content: |
        namespace ${majStart(projectName)}.Utils;

        using System.Linq.Expressions;

        public static class PredicateBuilder
        {
            public static Expression<Func<T, bool>> True<T>()  => _ => true;
            public static Expression<Func<T, bool>> False<T>() => _ => false;

            public static Expression<Func<T, bool>> And<T>(
                this Expression<Func<T, bool>> left,
                Expression<Func<T, bool>> right)
            {
                var p = left.Parameters[0];
                var body = Expression.AndAlso(left.Body,
                             Expression.Invoke(right, p));
                return Expression.Lambda<Func<T, bool>>(body, p);
            }
        }
      destinationPath: "${destinationFolder}/Utils"
    - fileType: "FileUtils"
      fileName: "FileUtils"
      extension: "cs"
      content: |
        namespace ${majStart(projectName)}.Utils;

        public static class FileUtils
        {
            public static string DetectMimeType(byte[]? content)
            {
                if (content == null || content.Length == 0)
                    return "application/octet-stream";
        
                // PNG
                if (content.Length >= 4 &&
                    content[0] == 0x89 &&
                    content[1] == 0x50 &&
                    content[2] == 0x4E &&
                    content[3] == 0x47)
                {
                    return "image/png";
                }

                // JPEG
                if (content.Length >= 3 &&
                    content[0] == 0xFF &&
                    content[1] == 0xD8 &&
                    content[2] == 0xFF)
                {
                    return "image/jpeg";
                }

                // GIF
                if (content.Length >= 3 &&
                    content[0] == 0x47 &&
                    content[1] == 0x49 &&
                    content[2] == 0x46)
                {
                    return "image/gif";
                }

                // PDF
                if (content.Length >= 4 &&
                    content[0] == 0x25 &&
                    content[1] == 0x50 &&
                    content[2] == 0x44 &&
                    content[3] == 0x46)
                {
                    return "application/pdf";
                }

                // BMP
                if (content.Length >= 2 &&
                    content[0] == 0x42 &&
                    content[1] == 0x4D)
                {
                    return "image/bmp";
                }

                // WEBP
                if (content.Length >= 12 &&
                    content[0] == 0x52 &&
                    content[1] == 0x49 &&
                    content[2] == 0x46 &&
                    content[3] == 0x46 &&
                    content[8] == 0x57 &&
                    content[9] == 0x45 &&
                    content[10] == 0x42 &&
                    content[11] == 0x50)
                {
                    return "image/webp";
                }

                return "application/octet-stream";
            }

            public static bool IsImage(byte[]? content)
            {
                return DetectMimeType(content).StartsWith("image/");
            }

            public static string BuildFileSource(byte[]? content)
            {
                if (content == null || content.Length == 0)
                    return string.Empty;

                var mimeType = DetectMimeType(content);
                var base64 = Convert.ToBase64String(content);

                return $"data:{mimeType};base64,{base64}";
            }
        }
      destinationPath: "${destinationFolder}/Utils/"

