          from django.views.generic import ListView, DetailView, CreateView, UpdateView, DeleteView, TemplateView
          from django.urls import reverse_lazy
          from django.shortcuts import render, redirect, get_object_or_404
          from django.contrib import messages
          from django.http import JsonResponse
          from django.contrib.auth.views import LoginView as DjangoLoginView, LogoutView as DjangoLogoutView
          from django.contrib.auth.forms import UserCreationForm
          from django.contrib.auth import login
          from django.contrib.auth.decorators import login_required
          from django.utils.decorators import method_decorator

          # Vues d'authentification
          class AuthViews:
              class LoginView(DjangoLoginView):
                  template_name = '${projectName}/auth/login.html'
                  redirect_authenticated_user = True
                  
                  def get_success_url(self):
                      return reverse_lazy('home')
                  
                  def form_valid(self, form):
                      messages.success(self.request, 'Connexion réussie !')
                      return super().form_valid(form)
                  
                  def form_invalid(self, form):
                      messages.error(self.request, 'Nom d\'utilisateur ou mot de passe incorrect.')
                      return super().form_invalid(form)

              class LogoutView(DjangoLogoutView):
                  next_page = reverse_lazy('login')
                  
                  def dispatch(self, request, *args, **kwargs):
                      messages.success(request, 'Vous avez été déconnecté avec succès.')
                      return super().dispatch(request, *args, **kwargs)

              class RegisterView(CreateView):
                  form_class = UserCreationForm
                  template_name = '${projectName}/auth/register.html'
                  success_url = reverse_lazy('login')
                  
                  def form_valid(self, form):
                      response = super().form_valid(form)
                      messages.success(self.request, 'Compte créé avec succès ! Vous pouvez maintenant vous connecter.')
                      return response
                  
                  def form_invalid(self, form):
                      messages.error(self.request, 'Erreur lors de la création du compte. Veuillez vérifier les informations.')
                      return super().form_invalid(form)
