  model:
    toGenerate: true
    modelImports: |
      import jakarta.persistence.*;
      import jakarta.validation.constraints.*;
      import lombok.Getter;
      import lombok.Setter;
      {{#if isView}}import org.hibernate.annotations.Immutable;{{else}}{{removeLine}}{{/if}}
    modelExtends: ""
    modelAnnotations: |
      @Setter
      @Getter
      @Entity
      {{#if isView}}@Immutable{{else}}{{removeLine}}{{/if}}
      @Table(name="${tableName}")
    modelFieldContent: |
      {{tab}}{{#each fields}}
      {{tab}}{{#if this.isIntAndPrimaryKey}}
      {{tab}}@Id
      {{tab}}@GeneratedValue(strategy=GenerationType.IDENTITY)
      {{tab}}@Column(name="${this.columnName}", unique = ${this.isUnique}, nullable = ${this.isNullable}){{elseIf this.isPrimaryKey}}
      {{tab}}@Id
      {{tab}}@org.hibernate.annotations.Generated(org.hibernate.annotations.GenerationTime.INSERT)
      {{tab}}@Column(name="${this.columnName}", unique = ${this.isUnique}, nullable = ${this.isNullable}){{elseIf this.isForeignKey}}
      {{tab}}@ManyToOne
      {{tab}}@JoinColumn(name="${this.columnName}"){{else}}
      {{tab}}@Column(name="${this.columnName}", unique = ${this.isUnique}, nullable = ${this.isNullable}){{/if}}
      {{#if !this.isForeignKey}}{{removeLine}}
      {{tab}}{{#each this.attributeTypeAnnotations}}
      {{tab}}${this}
      {{tab}}{{/each}}{{removeLine}}
      {{tab}}{{#each this.validationAnnotations}}
      {{tab}}${this}
      {{tab}}{{/each}}{{removeLine}}{{/if}}
      {{tab}}private ${this.type} ${this.name};{{#if !@last}}{{newline}}{{/if}}
      {{tab}}{{/each}}
    modelGetterSetter: "{{removeLine}}"
    modelConstructors: "{{removeLine}}"
    modelSavePath: "${destinationFolder}/${majStart(projectName)}/src/main/java/${groupLinkPath}/${lowerCase(projectName)}/models"
    modelPackage: "${groupLink}.${lowerCase(projectName)}.models;"
    modelAdditionalFiles:
      - fileType: "Specification File"
        fileName: "${majStart(className)}Specification"
        extension: "java"
        content: |
          package ${groupLink}.${lowerCase(projectName)}.specification;

          import ${groupLink}.${lowerCase(projectName)}.models.${className};
          import ${groupLink}.${lowerCase(projectName)}.models.dto.${className}Search;
          import ${groupLink}.${lowerCase(projectName)}.utils.WebUtils;
          import org.springframework.data.jpa.domain.Specification;
          import jakarta.persistence.criteria.Predicate;

          import java.util.ArrayList;
          import java.util.List;

          public class ${className}Specification {

              public static Specification<${className}> filter(${className}Search object) {
                  return (root, query, criteriaBuilder) -> {
                      List<Predicate> predicates = new ArrayList<>();
                      {{#each fields}}
                      {{#if this.isPrimaryKey}}
                      if(object.get${majStart(this.name)}()!=null){
                          predicates.add(
                              criteriaBuilder.equal(
                                  ${this.criteriaBuildSnippet}
                              )
                          );
                      }
                      {{elseIf this.isForeignKey}}
                      if(object.get${majStart(this.name)}()!=null){
                          predicates.add(
                              criteriaBuilder.equal(
                                  ${this.criteriaBuildSnippet}
                              )
                          );
                      }
                      {{elseIf this.isText}}
                      WebUtils.addLikeIfPresent(criteriaBuilder, ${this.criteriaBuildSnippet}, predicates);
                      {{elseIf this.isNumeric or this.isDate or this.isTime or this.isDateTime or this.isInterval}}
                      if(object.get${majStart(this.name)}()!=null){
                          predicates.add(
                              criteriaBuilder.equal(
                                  ${this.criteriaBuildSnippet}
                              )
                          );
                      }
                      WebUtils.addInterval(criteriaBuilder, root.get("${this.name}"), object.get${majStart(this.name)}Min(), object.get${majStart(this.name)}Max(), predicates);
                      {{else}}
                      if(object.get${majStart(this.name)}()!=null){
                          predicates.add(
                              criteriaBuilder.equal(
                                  ${this.criteriaBuildSnippet}
                              )
                          );
                      }
                      {{/if}}
                      {{/each}}
                      return criteriaBuilder.and(predicates.toArray(new Predicate[predicates.size()]));
