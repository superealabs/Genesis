        app.UseHttpsRedirection();
        app.UseStaticFiles();
        
        app.UseRouting();
        
        {{#if useJWT}}app.UseAuthentication();{{/if}}
        app.UseAuthorization();
        
        app.MapControllerRoute(
            name: "default",
        {{#each allEntities}}
        {{#if @first}}    
        {{tab}}pattern: "{controller=${this.entityName}}/{action=Index}/{${this.pkColumn}?}");{{/if}}
        {{/each}}
        app.Run();

