              public override async Task<PagedResponse<${majStart(className)}>> GetAllAsync(
                  int page, int pageSize, string? sorting,
                  params Expression<Func<${majStart(className)}, object?>>[]? includes)
              {
                  try
                  {
                      return await _repository.SearchAsync(
                          _ => true, page, pageSize, sorting, includes);
                  }
                  catch (Exception ex)
                  {
                      throw new InternalServerErrorException("Error while retrieving all ${formatReadableLowerCase(className)}", ex);
