      - fileType: "Specification File"
        fileName: "${majStart(className)}FilterBuilder"
        extension: "cs"
        content: |
          namespace ${majStart(projectName)}.Specification;

          using System.Linq.Expressions;
          using ${majStart(projectName)}.Models;
          using ${majStart(projectName)}.Models.Dto;
          using ${majStart(projectName)}.Utils;

          public sealed class ${majStart(className)}FilterBuilder : FilterBuilder<${majStart(className)}, ${majStart(className)}Dto>
          {
              public override ${majStart(className)}FilterBuilder Build(${majStart(className)}Dto dto)
              {
              {{tab}}{{#each fields}}{{#if this.isPrimaryKey}}
              {{tab}}AddEquals(e => e.${majStart(this.name)}, dto.${majStart(this.name)});{{elseIf this.isForeignKey}}
              {{tab}}
              {{tab}}AddEquals(e => e.${majStart(this.columnNameField)}, dto.${majStart(this.columnNameField)});  
              {{tab}}if (dto.${majStart(this.name)} is { } ${this.name})
                      {{tab}}AddEquals(e => e.${majStart(this.columnNameField)}, ${this.name}.${toPascalCase(this.referencedPrimaryKeyColumn)});
              {{elseIf this.isTimeTz}}
              {{tab}}AddEqualsTimeOfDay(e => e.${majStart(this.name)}, dto.${majStart(this.name)});
              {{tab}}AddRangeTimeOfDay(e => e.${majStart(this.name)}, dto.${majStart(this.name)}Min, dto.${majStart(this.name)}Max);
              {{elseIf this.isNumeric or this.isDate or this.isTime or this.isDateTime or this.isInterval}}
              {{tab}}AddRange(e => e.${majStart(this.name)},  dto.${majStart(this.name)}Min,  dto.${majStart(this.name)}Max);
              {{tab}}AddEquals(e => e.${majStart(this.name)}, dto.${majStart(this.name)});
              {{elseIf this.isText}}
              {{tab}}AddLike(e => e.${majStart(this.name)}, dto.${majStart(this.name)});
              {{tab}}{{else}}
              {{tab}}AddEquals(e => e.${majStart(this.name)}, dto.${majStart(this.name)});{{/if}}{{#if !@last}}{{newline}}{{/if}}
              {{tab}}{{/each}}
                  return this;
              }
          }
        destinationPath: "${destinationFolder}/Specification/"
      - fileType: "View Model File"
        fileName: "${majStart(className)}ViewModel"
        extension: "cs"
        content: |
          namespace ${majStart(projectName)}.ViewModels;
          
          using System.ComponentModel.DataAnnotations;
          using Models;
          using Models.Dto;
          using ${majStart(projectName)}.Utils;
          using Microsoft.AspNetCore.Mvc.Rendering;
          using Microsoft.AspNetCore.Http;

          public class ${majStart(className)}ViewModel
          {
              public ${majStart(className)}? ${majStart(className)} { get; set; }
            {{#each fields}}{{#if this.type = byte[]}}
            public IFormFile? ${majStart(this.name)}File { get; set; }
            {{else}}{{removeLine}}{{/if}}{{/each}}
              public ${majStart(className)}Dto? Search${majStart(className)}Criteria { get; set; }

              {{#each fieldsFK}}public string ${majStart(this.type)}DisplayColumn { get; set; } = string.Empty;
              public string ${majStart(this.type)}PkColumn { get; set; } = string.Empty;{{#if !@last}}{{newline}}{{/if}}{{/each}}

              {{#each fields}}{{#if this.columnType = json}}
              [Display(Name = "${majStart(this.name)} (JSON)")]
              public string? ${majStart(this.name)}Json { get; set; }
              {{elseIf this.columnType = jsonb}}
              [Display(Name = "${majStart(this.name)} (JSON)")]
              public string? ${majStart(this.name)}Json { get; set; }
              {{elseIf this.columnType = xml}}
              public string? ${majStart(this.name)}Xml { get; set; }
              {{else}}{{removeLine}}{{/if}}
              {{/each}}{{removeLine}}
          
              public List<${majStart(className)}> ${majStart(className)}s { get; set; } = new List<${majStart(className)}>();
              public PageInfo Page { get; set; } = new PageInfo();

              {{#each fieldsFK}}public IEnumerable<SelectListItem> ${majStart(this.type)}sSelectList { get; set; } = new List<SelectListItem>();{{#if !@last}}{{newline}}{{/if}}{{/each}}
          
              public string CurrentSort { get; set; } = string.Empty;
              public string CurrentSortDisplay
              {
                  get
                  {
                      if (string.IsNullOrWhiteSpace(CurrentSort))
                      return "default";
                      
                      var criteria = CurrentSort
                          .Split(';', StringSplitOptions.RemoveEmptyEntries | StringSplitOptions.TrimEntries)
                          .Select(s => s.Trim())
                          .Where(s => s.Contains(","))
                          .Select(s =>
                          {
                              var parts = s.Split(',', 2);
                              if (parts.Length != 2) return s;
          
                              string field = parts[0].Trim();
                              string dir   = parts[1].Trim().ToLower();
          
                              string dirText  = dir == "asc" ? "asc" : (dir == "desc" ? "desc" : dir);
                                                                                                                                    
                              return $"{field} {dirText}";
                          });
              
                      return string.Join(" → ", criteria);
                  }
              }
          }
        destinationPath: "${destinationFolder}/ViewModels/"
