    - fileType: "ProgramFile"
      fileName: "Program"
      extension: "cs"
      content: |
        {{#if useAuthCookie}}using Microsoft.AspNetCore.Identity;
        using ${majStart(projectName)}.Services.Startup;
        using System.Text;{{else}}{{removeLine}}{{/if}}
        using System.Net;
        using Microsoft.OpenApi.Models;
        using Microsoft.EntityFrameworkCore;
        using ${majStart(projectName)}.Data;
        using ${majStart(projectName)}.Filters;
        using ${majStart(projectName)}.Models;
        using ${majStart(projectName)}.Repositories.Implementation;
        using ${majStart(projectName)}.Repositories.Interface;
        using ${majStart(projectName)}.Services.Implementation;
        using ${majStart(projectName)}.Services.Interface;
        using ${majStart(projectName)}.Utils;
        
        {{#if databaseType = PostgreSQL}}AppContext.SetSwitch("Npgsql.EnableLegacyTimestampBehavior", true);{{newline}}{{else}}{{removeLine}}{{/if}}
        var builder = WebApplication.CreateBuilder(args);
        
        // Add services to the container.
        var connectionString = builder.Configuration.GetConnectionString("DefaultConnection");
        builder.Services.AddDbContext<${majStart(projectName)}Context>(options =>
            options.Use${daoName}(connectionString${addOptions}));
        
        {{#if useAuthCookie}}builder.Services.AddHostedService<SqlSchemaBootstrapper>();
        // Add Identity
        builder.Services.AddIdentity<ApplicationUser, IdentityRole>(options =>
        {
            options.Password.RequireDigit = false;
            options.Password.RequireUppercase = false;
            options.Password.RequireLowercase = false;
            options.Password.RequireNonAlphanumeric = false;
            options.Password.RequiredLength = 6;
        })
        .AddEntityFrameworkStores<${majStart(projectName)}Context>()
        .AddDefaultTokenProviders();
        
        builder.Services.ConfigureApplicationCookie(options =>
        {
            options.LoginPath = "/Auth/Login";
            options.AccessDeniedPath = "/Auth/Login";
            options.Cookie.Name = "mvcAuthCookie";
            options.Cookie.HttpOnly = true;
            options.ExpireTimeSpan = TimeSpan.FromMinutes(30);
            options.SlidingExpiration = true;
        });{{else}}{{removeLine}}{{/if}}
        
        // Adding repositories ...
        {{#each entities}}
        builder.Services.AddScoped<I${this}Repository, ${this}Repository>();
        {{/each}}
        // Adding services ...
        {{#each entities}}
        builder.Services.AddScoped<I${this}Service, ${this}Service>();
        {{/each}}
        // Adding controllers ...
        builder.Services.AddControllersWithViews(options =>
        {
            // Adding the global exception filter to all controllers
            options.Filters.Add<GlobalExceptionFilter>();
        });
        
        builder.Services.AddScoped<EntityUtils>();  
        
        var app = builder.Build();
        
        app.UseStatusCodePagesWithReExecute("/Error/{0}");
        
        // Configure the HTTP request pipeline.
        if (!app.Environment.IsDevelopment())
        {
            app.UseExceptionHandler("/Error/500");
            app.UseHsts();
        }
        
        app.UseHttpsRedirection();
        app.UseStaticFiles();
        
        app.UseRouting();
        
        {{#if useAuthCookie}}app.UseAuthentication();{{/if}}
        app.UseAuthorization();
        
        app.MapControllerRoute(
            name: "default",
        {{#each allEntities}}
        {{#if @first}}    
        {{tab}}pattern: "{controller=${this.entityName}}/{action=Index}/{${this.pkColumn}?}");{{/if}}
        {{/each}}
        app.Run();

