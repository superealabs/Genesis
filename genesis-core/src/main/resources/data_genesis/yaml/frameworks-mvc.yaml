      {{tab}}def __str__(self):
      {{tab}}{{tab}}# Construire une représentation avec les champs les plus importants
      {{tab}}{{tab}}parts = []
      {{tab}}{{tab}}{{#each fields}}
      {{tab}}{{tab}}{{#if this.isPrimaryKey}}{{else}}
      {{tab}}{{tab}}if hasattr(self, '${this.name}') and self.${this.name}:
      {{tab}}{{tab}}    parts.append(str(self.${this.name}))
