      scriptSection: |
        <script>
            // Suppression
            document.addEventListener('DOMContentLoaded', function() {
              // Open modal and populate action/id when clicking a delete button
              document.querySelectorAll('.btn-delete').forEach(function(btn) {
                btn.addEventListener('click', function() {
                  var id = (this.dataset.id || '').toString().trim();
                  var action = this.dataset.action || '';
              
                  // Populate modal fields
                  var idField = document.getElementById('${lowerCase(className)}Id');
                  var idText = document.getElementById('${lowerCase(className)}IdText');
                  var bodyIdText = document.getElementById('body${lowerCase(className)}IdText');
                  var deleteForm = document.getElementById('deleteForm');
                  
                  if (idField) idField.value = id;
                  if (idText) idText.textContent = id;
                  if (bodyIdText) bodyIdText.textContent = id;
                  if (deleteForm && action) deleteForm.action = action;
                  
                  var modal = document.getElementById('customModal');
                  if (modal) modal.style.display = 'block';
                });
              });
          
              // Close modal buttons
              ['deleteCloseBtn', 'deleteCancelBtn'].forEach(function(id) {
                var el = document.getElementById(id);
                if (el) el.addEventListener('click', function() {
                  var modal = document.getElementById('customModal');
                  if (modal) modal.style.display = 'none';
                });
              });
          
              // Validate before submit
              var deleteForm = document.getElementById('deleteForm');
              if (deleteForm) {
                deleteForm.addEventListener('submit', function(e) {
                  var idField = document.getElementById('${lowerCase(className)}Id');
                  if (!idField || !idField.value.trim()) {
                    e.preventDefault();
                    alert('Erreur: ID non trouvé');
                  }
                });
              }
          });
        </script>
