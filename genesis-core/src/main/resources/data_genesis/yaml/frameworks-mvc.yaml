      {{tab}}                catch (JsonException)
      {{tab}}                {
      {{tab}}                    ModelState.AddModelError("${majStart(this.name)}Json", "The JSON format is invalid.");
      {{tab}}                    return View(vm);
      {{tab}}                }
      {{tab}}            }
      {{tab}}            {{else}}{{removeLine}}{{/if}}
      {{tab}}            {{/each}}{{removeLine}}
      {{tab}}            await _service.UpdateAsync(vm.${majStart(className)});
      {{tab}}            return RedirectToAction(nameof(Index));
      {{tab}}        }
      {{tab}}        catch (Exception ex)
      {{tab}}        {
      {{tab}}            string detailedMessage = GlobalExceptionFilter.GetInnermostMessage(ex);
      {{tab}}            ModelState.AddModelError("", detailedMessage);
      {{tab}}        }
      {{tab}}    }
      
      {{tab}}    var reloadedVm = await BuildFormViewModel(vm.${majStart(className)});
      {{tab}}    return View(reloadedVm);
      {{tab}}}
      
      
      {{tab}}// POST: /${majStart(className)}/Delete/${pkColumn}
      {{tab}}{{#if useJWT}}[Authorize]{{/if}}
      {{tab}}[HttpPost, ActionName("Delete")]
      {{tab}}[ValidateAntiForgeryToken]
      {{tab}}public async Task<IActionResult> Delete(${pkColumnType} ${pkColumn})
      {{tab}}{
      {{tab}}    await _service.DeleteAsync(${pkColumn});
      {{tab}}    return RedirectToAction(nameof(Index));
      {{tab}}}{{else}}{{removeLine}}{{/if}}
      
      {{tab}}private async Task<${majStart(className)}ViewModel> BuildFormViewModel(${majStart(className)} ${minStart(className)})
      {{tab}}{
      {{tab}}    {{#each fieldsFK}}
      {{tab}}    string ${minStart(this.type)}DisplayColumn = await _detector.DetectBestDisplayColumnAsync<${this.type}>();
      {{tab}}    string ${minStart(this.type)}PkColumn = _detector.GetPrimaryKeyName<${this.type}>();
      {{tab}}    var ${minStart(this.type)}s = await _${minStart(this.type)}Service.GetAllAsync(0, int.MaxValue, null);
      {{tab}}    {{/each}}{{removeLine}}
      {{tab}}    return new ${majStart(className)}ViewModel
      {{tab}}    {
      {{tab}}        ${majStart(className)} = ${minStart(className)},
      {{tab}}        {{#each fieldsFK}}${majStart(this.type)}DisplayColumn = ${minStart(this.type)}DisplayColumn,
      {{tab}}        ${majStart(this.type)}PkColumn = ${minStart(this.type)}PkColumn,
      {{tab}}        ${majStart(this.type)}s = new SelectList(${minStart(this.type)}s?.Content ?? new List<${this.type}>(), ${minStart(this.type)}PkColumn, ${minStart(this.type)}DisplayColumn),
      {{tab}}        {{/each}}{{removeLine}}
      {{tab}}        {{#each fields}}
      {{tab}}        {{#if this.columnType = json}}${majStart(this.name)}Json = ${minStart(className)}?.${majStart(this.name)},
      {{tab}}        {{elseIf this.columnType = jsonb}}${majStart(this.name)}Json = ${minStart(className)}?.${majStart(this.name)},
      {{tab}}        {{else}}{{removeLine}}{{/if}}
      {{tab}}        {{/each}}{{removeLine}}
      {{tab}}    };
      {{tab}}}
