    controllerName: "${majStart(className)}Controller"
    controllerFieldContent: |
      {{tab}}private readonly I${majStart(className)}Service _service;
      {{tab}}{{#each fieldsFK}}private readonly I${majStart(this.type)}Service _${minStart(this.type)}Service;
      {{tab}}{{#if @last}}private readonly EntityUtils _detector;{{newline}}{{/if}}{{/each}}
    controllerConstructors: |
      {{tab}}public ${majStart(className)}Controller(I${majStart(className)}Service service{{#each fieldsFK}}, I${majStart(this.type)}Service ${minStart(this.type)}Service{{#if @last}}, EntityUtils detector{{/if}}{{/each}})
      {{tab}}{
      {{tab}}   _service = service;
      {{tab}}   {{#each fieldsFK}}_${minStart(this.type)}Service = ${minStart(this.type)}Service;
      {{tab}}   {{#if @last}}_detector = detector;{{newline}}{{/if}}{{/each}}
      {{tab}}}
    controllerMethodContent: |
      {{tab}}{{#if useAuthCookie}}[Authorize]{{else}}{{removeLine}}{{/if}}
      {{tab}}// POST: /${majStart(className)}/ExportToCsv
      {{tab}}[HttpPost]
      {{tab}}[ValidateAntiForgeryToken]
      {{tab}}public async Task<IActionResult> ExportToCsvAsync(${majStart(className)}Dto dto, int page = 0, int pageSize = 10, string? sortOrder = null)
      {{tab}}{
      {{tab}}    var results = await _service.SearchAsync(dto, page, pageSize, sortOrder);

      {{tab}}    {{#each fieldsFK}}
      {{tab}}    // 2. On détecte la colonne d'affichage pour la FK
      {{tab}}    string ${minStart(this.type)}DisplayColumn = await _detector.DetectBestDisplayColumnAsync<${this.type}>();
      {{tab}}    {{/each}}{{removeLine}}

      {{tab}}    // 3. On aplatit les données dans une liste de dictionnaires
      {{tab}}    var exportData = (results.Content ?? new List<${majStart(className)}>()).Select(item => new Dictionary<string, object>
      {{tab}}    {
      {{#each fields}}{{#if this.isForeignKey}}
      {{tab}}        { "${this.type}", item.${majStart(this.name)}?.GetType().GetProperty(${minStart(this.type)}DisplayColumn)?.GetValue(item.${majStart(this.name)}) },
      {{else}}
      {{tab}}        { "${majStart(this.name)}", item.${majStart(this.name)} },
      {{/if}}{{removeLine}}
      {{/each}}{{removeLine}}
      {{tab}}    }).ToList();

      {{tab}}    var csvContent = await _service.ExportToCsvAsync(exportData);
      {{tab}}    var bytes = Encoding.UTF8.GetBytes(csvContent);

      {{tab}}    Response.Headers["Content-Disposition"] = "attachment; filename=${majStart(className)}.csv";

      {{tab}}    return File(bytes, "text/csv; charset=utf-8");
      {{tab}}}
      
      {{tab}}{{#if useAuthCookie}}[Authorize]{{else}}{{removeLine}}{{/if}}
      {{tab}}// GET: /${majStart(className)}
      
      {{tab}}{{#if useAuthCookie}}[Authorize]{{else}}{{removeLine}}{{/if}}
      {{tab}}// GET: /${majStart(className)}
      {{tab}}public async Task<IActionResult> Index(int page = 0, int pageSize = 10, string? sortOrder = null, string? sortBy = null)
      {{tab}}{
      {{tab}}    string finalSortOrder = !string.IsNullOrEmpty(sortBy)
      {{tab}}        ? WebUtils.AddSort(sortOrder, sortBy)
      {{tab}}        : sortOrder;
      
      {{tab}}    var results = await _service.GetAllAsync(page, pageSize, finalSortOrder{{#each fieldsFK}}, e => e.${majStart(this.name)}{{/each}});
      
      {{tab}}    {{#each fieldsFK}}
      {{tab}}    string ${minStart(this.type)}DisplayColumn = await _detector.DetectBestDisplayColumnAsync<${this.type}>();
      {{tab}}    string ${minStart(this.type)}PkColumn = _detector.GetPrimaryKeyName<${this.type}>();
      {{tab}}    var ${minStart(this.type)}s = await _${minStart(this.type)}Service.GetAllAsync(0, int.MaxValue, null);
      {{tab}}    {{/each}}{{removeLine}}
      
      {{tab}}    var vm = new ${majStart(className)}ViewModel
      {{tab}}    {
      {{tab}}        ${majStart(className)}s = results.Content ?? new List<${majStart(className)}>(),
      {{tab}}        Page = results.Page ?? new PageInfo { Number = page, Size = pageSize },
      {{tab}}        {{#each fieldsFK}}${majStart(this.type)}DisplayColumn = ${minStart(this.type)}DisplayColumn,
      {{tab}}        ${majStart(this.type)}PkColumn = ${minStart(this.type)}PkColumn,
      {{tab}}        ${majStart(this.type)}sSelectList = new SelectList(${minStart(this.type)}s?.Content ?? new List<${this.type}>(), ${minStart(this.type)}PkColumn, ${minStart(this.type)}DisplayColumn),
      {{tab}}        {{/each}}{{removeLine}}
      {{tab}}        CurrentSort = finalSortOrder
      {{tab}}    };
      
      {{tab}}    return View(vm);
      {{tab}}}
      
      {{tab}}{{#if useAuthCookie}}[Authorize]{{else}}{{removeLine}}{{/if}}
      {{tab}}// POST: /${majStart(className)}/Search
      {{tab}}[HttpPost]
