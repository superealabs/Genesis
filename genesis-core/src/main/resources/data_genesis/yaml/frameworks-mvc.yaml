    - fileType: "Display Column Detector For Foreign Key Values"
      fileName: "EntityUtils"
      extension: "cs"
      content: |
        namespace ${majStart(projectName)}.Utils;
        
        using Microsoft.EntityFrameworkCore;
        using System;
        using System.Collections.Generic;
        using System.Linq;
        using System.Threading.Tasks;
        using Data;
        
        public class EntityUtils
        {
          private readonly ${majStart(projectName)}Context _context;
      
          public EntityUtils(${majStart(projectName)}Context context)
          {
            _context = context;
          }
      
          /// <summary>
          /// Detect the best column to display for an entity
          /// </summary>
          public async Task<string> DetectBestDisplayColumnAsync<TEntity>() where TEntity : class
          {
            var entityType = _context.Model.FindEntityType(typeof(TEntity));
            var tableName = entityType.GetTableName();
    
            var candidates = entityType.GetProperties()
            .Where(p => p.ClrType == typeof(string))
            .Select(p => p.Name)
            .ToList();
    
            if (!candidates.Any())
            {
              return entityType.FindPrimaryKey().Properties.First().Name;
            }
    
            string bestColumn = candidates.First();
            int bestScore = int.MinValue;
            
            foreach (var col in candidates)
            {
              var sample = await _context.Set<TEntity>()
              .Select(e => EF.Property<string>(e, col))
              .Where(s => s != null && s != "")
              .Take(50)
              .ToListAsync();
              
              if (!sample.Any())
              continue;
              
              int total = sample.Count;
              int distinctCount = sample.Distinct().Count();
              double avgLength = sample.Average(s => s.Length);
              
              int score = 0;
              
              double diversity = (double)distinctCount / total;
              score += (int)(diversity * 50);
              
              if (avgLength >= 3 && avgLength <= 50) score += 30;
              else if (avgLength > 50) score -= 10;
              else score -= 20;
              
              if (sample.All(s => s.All(char.IsLetterOrDigit)))
              score += 20;
              
              if (score > bestScore)
              {
                bestScore = score;
                bestColumn = col;
              }
            }
    
            if (bestScore == int.MinValue)
            {
              return entityType.FindPrimaryKey().Properties.First().Name;
            }
    
            return bestColumn;
          }
        
          /// <summary>
          /// Detect the primary column for an entity
          /// </summary>
          public string GetPrimaryKeyName<TEntity>() where TEntity : class
          {
            var entityType = _context.Model.FindEntityType(typeof(TEntity));
            var primaryKey = entityType.FindPrimaryKey();
        
            if (primaryKey == null)
            throw new InvalidOperationException($"Entity {typeof(TEntity).Name} has no primary key defined.");
        
            // Return the first column of the primary key
            return primaryKey.Properties.First().Name;
          }
        }
