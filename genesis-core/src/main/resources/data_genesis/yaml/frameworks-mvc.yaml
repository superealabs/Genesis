    - fileType: "Exception Handler"
      fileName: "GlobalExceptionHandler"
      extension: "java"
      content: |
        package ${groupLink}.${lowerCase(projectName)}.exception.handler;
        import lombok.extern.slf4j.Slf4j;
        import ${groupLink}.${lowerCase(projectName)}.exception.InternalServerErrorException;
        import ${groupLink}.${lowerCase(projectName)}.exception.ResourceNotFoundException;
        import org.springframework.http.HttpStatus;
        import org.springframework.ui.Model;
        import org.springframework.web.bind.annotation.ControllerAdvice;
        import org.springframework.web.bind.annotation.ExceptionHandler;
        import org.springframework.web.bind.annotation.ResponseStatus;
        @Slf4j
        @ControllerAdvice
        public class GlobalExceptionHandler {
        
            @ExceptionHandler(ResourceNotFoundException.class)
            @ResponseStatus(HttpStatus.NOT_FOUND)
            public String handleResourceNotFoundException(ResourceNotFoundException ex,Model model) {
                log.info("Resource not found: {}", ex.getMessage());
                model.addAttribute("errorMessage", ex.getMessage());
                return "error/error";
            }
            @ExceptionHandler(IllegalArgumentException.class)
            @ResponseStatus(HttpStatus.BAD_REQUEST)
            public String handleIllegalArgumentException(IllegalArgumentException ex, Model model) {
                log.warn("Illegal argument provided: {}", ex.getMessage());
                model.addAttribute("errorMessage", ex.getMessage());
                return "error/error";
            }

            @ExceptionHandler(InternalServerErrorException.class)
            @ResponseStatus(HttpStatus.INTERNAL_SERVER_ERROR)
            public String handleInternalServerErrorException(InternalServerErrorException ex,Model model) {
                log.error("An internal error occurred", ex);
                model.addAttribute("errorMessage", ex.getMessage());
                return "error/error";
            }
            @ExceptionHandler(Exception.class)
            @ResponseStatus(HttpStatus.INTERNAL_SERVER_ERROR)
            public String handleGenericException(Exception ex, Model model) {
                log.error("An unexpected error occurred", ex);
                model.addAttribute("errorMessage", "Une erreur inattendue est survenue.");
                return "error/error";
            }
      
        }

