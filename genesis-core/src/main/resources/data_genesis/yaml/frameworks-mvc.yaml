      # AJAX search endpoint for Select2
      {{#if enableAuth}}
      @login_required
      {{/if}}
      def ${lowerCase(className)}_search(request):
          from django.http import JsonResponse
          from django.db.models import Q
          
          query = (request.GET.get('q') or '').strip()
          qs = ${majStart(className)}.objects.all()
          if query:
              filters = Q()
              # Recherche par ID si numérique
              if query.isdigit():
                  filters = filters | Q(id=int(query))
              # Recherche dans tous les champs texte de l'entité
              # Cette approche recherche dans tous les champs CharField et TextField
              for field in ${majStart(className)}._meta.fields:
                  if hasattr(field, 'max_length') or field.__class__.__name__ in ['CharField', 'TextField']:
                      filters = filters | Q(**{f"{field.name}__icontains": query})
              qs = qs.filter(filters)

          results = []
          for obj in qs[:20]:
              # Utiliser la méthode __str__ du modèle pour l'affichage
              label = f"{obj.id} - {str(obj)}"
              results.append({
                  'id': obj.id,
                  'text': label
              })

          return JsonResponse(results, safe=False)
