- fileType: "Docker compose"
  fileName: "docker-compose"
  extension: "yml"
  content : |
    services:
      {{#if isFrontendDockerized}}${frontendContainer}:
        build:
          context: ./${frontendDir}
          dockerfile: Dockerfile
        container_name: frontend
        ports:
          - "${frontendPort}:${frontendPort}"{{/if}}
        {{#if isFrontendDockerized and hasFrontendVolume}}volumes:{{/if}}
          {{#if isFrontendDockerized and frontendNeedVolume}}- ./${frontendDir}:/app
          {{/if}}{{#if isFrontendDockerized}}{{#each frontendVolumes}}
          - ${this.name}:${this.dir}
          {{/each}}{{removeLine}}
        {{/if}}{{#if isFrontendDockerized and hasFrontendEnvironments}}environment:
          {{#each frontendEnvironments}}
          - ${this.name}${this.separator}${this.value}
        {{/each}}{{removeLine}}
        {{/if}}{{#if isFrontendDockerized and isBackendDockerized}}depends_on:
          - backend{{/if}}
      {{#if isBackendDockerized}}${backendContainer}:
        build:
          context: ./${backendDir}
          dockerfile: Dockerfile
        container_name: backend
        ports:
          - "${backendPort}:${backendPort}"{{/if}}
        {{#if isBackendDockerized and backendHasVolume}}volumes:{{/if}}
          {{#if isBackendDockerized and backendNeedVolume}}- ./${backendDir}:/app
          {{/if}}{{#if isBackendDockerized}}{{#each backendVolumes}}
          - ${this.name}:${this.dir}
          {{/each}}{{removeLine}}
        {{/if}}{{#if isBackendDockerized and hasBackendEnvironments}}environment:
          {{#each backendEnvironments}}
          - ${this.name}${this.separator}${this.value}
          {{/each}}{{removeLine}}
        {{/if}}{{#if isBackendDockerized}}extra_hosts:
          - "host.docker.internal:host-gateway"{{/if}}
    {{#if hasVolumes}}volumes:{{/if}}
      {{#if isBackendDockerized and hasVolumes}}{{#each backendVolumes}}
      ${this.name}:
      {{/each}}{{/if}}{{#if isFrontendDockerized and hasVolumes}}{{#each frontendVolumes}}
      ${this.name}:
      {{/each}}{{/if}}
  destinationPath: ""