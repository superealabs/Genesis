- id: 1
  name: "Maven"
  coreFrameworks:
    - "Spring Boot"
  projectFilesEdits:
    - fileType: "Xml"
      fileName: "pom"
      extension: "xml"
      content: |
        <?xml version="1.0" encoding="UTF-8"?>
        <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
        xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <parent>
                <groupId>org.springframework.boot</groupId>
                <artifactId>spring-boot-starter-parent</artifactId>
                <version>${frameworkVersion}</version>
                <relativePath/>
            </parent>
            <groupId>${groupLink}</groupId>
            <artifactId>${projectName}</artifactId>
            <version>0.0.1-SNAPSHOT</version>
            <name>${projectName}</name>
            <description>${projectDescription}</description>
            <url/>
            <licenses>
                <license/>
            </licenses>
            <developers>
                <developer/>
            </developers>
            <scm>
                <connection/>
                <developerConnection/>
                <tag/>
                <url/>
            </scm>
            <properties>
                <java.version>${languageVersion}</java.version>
                {{#if useCloud}}<spring-cloud.version>2023.0.3</spring-cloud.version>{{/if}}
            </properties>
            <dependencies>
                {{#each dependencies}}
                <dependency>
                    <groupId>${this.groupId}</groupId>
                    <artifactId>${this.artifactId}</artifactId>
                    <version>${this.version}</version>
                    <scope>${this.scope}</scope>
                </dependency>{{#if !@last}}{{newline}}        {{/if}}
                {{/each}}
                {{#if useDB}}<dependency>
                    <groupId>${DBgroupId}</groupId>
                    <artifactId>${DBartifactId}</artifactId>
                    <version>${DBversion}</version>
                </dependency>
        {{else}}{{removeLine}}
        {{removeLine}}
        {{removeLine}}
        {{removeLine}}
        {{removeLine}}{{/if}}
                {{#if useEurekaServer}}<dependency>
                    <groupId>org.springframework.cloud</groupId>
                    <artifactId>spring-cloud-starter-netflix-eureka-client</artifactId>
                </dependency>
                <dependency>
                    <groupId>org.springframework.boot</groupId>
                    <artifactId>spring-boot-starter-actuator</artifactId>
                </dependency>{{/if}}
            </dependencies>
        {{#if useCloud}}
            <dependencyManagement>
                <dependencies>
                    <dependency>
                        <groupId>org.springframework.cloud</groupId>
                        <artifactId>spring-cloud-dependencies</artifactId>
                        <version>$[spring-cloud.version]</version>
                        <type>pom</type>
                        <scope>import</scope>
                    </dependency>
                </dependencies>
            </dependencyManagement>{{/if}}        
        
            <build>
                <plugins>
                    <plugin>
                        <groupId>org.springframework.boot</groupId>
                        <artifactId>spring-boot-maven-plugin</artifactId>
                    </plugin>
                </plugins>
            </build>
        </project>

      destinationPath: "${destinationFolder}/${majStart(projectName)}/"
  projectFiles:
    - fileType: "Script"
      fileName: "mvnw"
      sourcePath: "data_genesis/maven/"
      destinationPath: "${destinationFolder}/${majStart(projectName)}/"

    - fileType: "ScriptWin"
      fileName: "mvnw.cmd"
      sourcePath: "data_genesis/maven/"
      destinationPath: "${destinationFolder}/${majStart(projectName)}/"
  projectFolders:
    - folderType: "MavenFolder"
      folderName: ".mvn"
      sourcePath: "data_genesis/maven/.mvn"
      destinationPath: "${destinationFolder}/${majStart(projectName)}/"

- id: 2
  name: "MSBuild for .NET "
  coreFrameworks:
    - ".NET"
  projectFilesEdits:
    - fileType: "HttpFile"
      fileName: "${majStart(projectName)}"
      extension: "http"
      content: |
        @TestDbCRUD_HostAddress = http://localhost:${projectPort}

        {{#each entities}}
        GET {{TestDbCRUD_HostAddress}}/${this}s
        Accept: application/json
        
        ###{{#if !@last}}{{newline}}{{/if}}{{/each}}

      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/"

    - fileType: "AppSettings"
      fileName: "appsettings"
      extension: "json"
      content: |
        {
          "Logging": {
            "LogLevel": {
              "Default": "${loggingLevel}",
              "Microsoft.AspNetCore": "${loggingLevel}"
            }
          },
          {{#if useJWT}}
          "Jwt": {
            "SecretKey": "Bel0Y8TSTrZyicQgAJdcabCbaMQo3s3BkBmP925Wb3g=",
            "ExpirationMinutes": 30
          },{{/if}}
          "AllowedHosts": "*"{{#if useDB}},
          "ConnectionStrings": {
            "DefaultConnection": "${connectionString}"
          }{{/if}},
          "PathBase": "/${toKebabCase(projectName)}"{{#if useEurekaServer}},
          "spring": {
            "application": {
              "name": "${projectName}"
            }
          },
          "eureka": {
            "client": {
              "serviceUrl": "${eurekaServerURL}",
              "shouldFetchRegistry": "false",
              "shouldRegisterWithEureka": true,
              "validateCertificates": false
            },
            "instance": {
              "appName": "${projectName}",
              "port": "${projectPort}",
              "hostname": "$[HOSTNAME]",
              "preferIpAddress": true
            },
            "Management": {
              "Endpoints": {
                "Actuator": {
                  "Exposure": {
                    "Include": [
                      "health",
                      "info",
                      "*"
                    ]
                  }
                },
                "Health": {
                  "ShowDetails": "Always"
                },
                "Info": {
                  "Application": {
                    "name": "${projectName}",
                    "description": "${projectDescription}",
                    "version": "0.0.1-SNAPSHOT"
                  }
                }
              }
            }
          }{{/if}}
        
        }

      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/"

    - fileType: "ProjectFile"
      fileName: "${majStart(projectName)}"
      extension: "csproj"
      content: |
        <Project Sdk="Microsoft.NET.Sdk.Web">
            <PropertyGroup>
                <TargetFramework>net${frameworkVersion}</TargetFramework>
                <Nullable>enable</Nullable>
                <ImplicitUsings>enable</ImplicitUsings>
                <DockerDefaultTargetOS>Linux</DockerDefaultTargetOS>
                <RootNamespace>${projectName}</RootNamespace>
                <Description>${projectDescription}</Description>
            </PropertyGroup>
        
            <ItemGroup>
                {{#if useDB}}<PackageReference Include="Microsoft.EntityFrameworkCore.Design" Version="${frameworkVersion}.0">
                    <IncludeAssets>runtime; build; native; contentfiles; analyzers; buildtransitive</IncludeAssets>
                    <PrivateAssets>all</PrivateAssets>
                </PackageReference>
                <PackageReference Include="${DBartifactId}" Version="${frameworkVersion}.0"/>{{/if}}
                <PackageReference Include="Swashbuckle.AspNetCore" Version="6.9.0"/>
                <PackageReference Include="Swashbuckle.AspNetCore.Annotations" Version="6.9.0"/>
                {{#if useEurekaServer}}<PackageReference Include="Steeltoe.Discovery.Eureka" Version="3.2.0"/>{{/if}}
                <PackageReference Include="Steeltoe.Management.Endpoint.Info" Version="1.1.0" />
                <PackageReference Include="Steeltoe.Management.Endpoint.Health" Version="1.1.0" />
                <PackageReference Include="Steeltoe.Management.EndpointCore" Version="3.2.0" />
                <PackageReference Include="Steeltoe.Management.TracingCore" Version="3.2.0" />
                {{#if useJWT}}
                <PackageReference Include="Microsoft.AspNetCore.Identity.EntityFrameworkCore" Version="8.0.18" />
                <PackageReference Include="System.IdentityModel.Tokens.Jwt" Version="8.13.0" />
                <PackageReference Include="Microsoft.AspNetCore.Authentication.JwtBearer" Version="8.0.18" />
                {{/if}}
            </ItemGroup>
        </Project>

      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/"

    - fileType: "SolutionFile"
      fileName: "${majStart(projectName)}"
      extension: "sln"
      content: |
        Microsoft Visual Studio Solution File, Format Version 12.00
        
        Project("{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}") = "${majStart(projectName)}", "${majStart(projectName)}\${majStart(projectName)}.csproj", "{B06BF436-528B-4DF7-9F86-6F86B6A77E84}"
        EndProject
        Global
            GlobalSection(SolutionConfigurationPlatforms) = preSolution
                Debug|Any CPU = Debug|Any CPU
                Release|Any CPU = Release|Any CPU
            EndGlobalSection
            GlobalSection(ProjectConfigurationPlatforms) = postSolution
                {B06BF436-528B-4DF7-9F86-6F86B6A77E84}.Debug|Any CPU.ActiveCfg = Debug|Any CPU
                {B06BF436-528B-4DF7-9F86-6F86B6A77E84}.Debug|Any CPU.Build.0 = Debug|Any CPU
                {B06BF436-528B-4DF7-9F86-6F86B6A77E84}.Release|Any CPU.ActiveCfg = Release|Any CPU
                {B06BF436-528B-4DF7-9F86-6F86B6A77E84}.Release|Any CPU.Build.0 = Release|Any CPU
            EndGlobalSection
        EndGlobal
      destinationPath: "${destinationFolder}/${majStart(projectName)}/"

    - fileType: "LaunchSettingsFile"
      fileName: "launchSettings"
      extension: "json"
      content: |
        {
          "$schema": "http://json.schemastore.org/launchsettings.json",
          "iisSettings": {
            "windowsAuthentication": false,
            "anonymousAuthentication": true,
            "iisExpress": {
              "applicationUrl": "http://localhost:53034/${toKebabCase(projectName)}",
              "sslPort": 44349
            }
          },
          "profiles": {
            "http": {
              "commandName": "Project",
              "dotnetRunMessages": true,
              "launchBrowser": true,
              "launchUrl": "swagger",
              "applicationUrl": "http://localhost:${projectPort}/${toKebabCase(projectName)}",
              "environmentVariables": {
                "ASPNETCORE_ENVIRONMENT": "Development"
              }
            },
            "https": {
              "commandName": "Project",
              "dotnetRunMessages": true,
              "launchBrowser": true,
              "launchUrl": "swagger",
              "applicationUrl": "https://localhost:7273/${toKebabCase(projectName)};http://localhost:${projectPort}",
              "environmentVariables": {
                "ASPNETCORE_ENVIRONMENT": "Development"
              }
            },
            "IIS Express": {
              "commandName": "IISExpress",
              "launchBrowser": true,
              "launchUrl": "swagger",
              "environmentVariables": {
                "ASPNETCORE_ENVIRONMENT": "Development"
              }
            }{{#if useEurekaServer}},
            "${projectName}": {
              "commandName": "Project",
              "launchBrowser": true,
              "launchUrl": "swagger",
              "applicationUrl": "http://localhost:${projectPort}/${toKebabCase(projectName)}",
              "environmentVariables": {
                "ASPNETCORE_ENVIRONMENT": "Development"
              }
            }
            {{/if}}
          }
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/Properties/"

    - fileType: "TestProjectFile"
      fileName: "${majStart(projectName)}.Tests"
      extension: "csproj"
      content: |
        <Project Sdk="Microsoft.NET.Sdk">

          <PropertyGroup>
            <TargetFramework>net${frameworkVersion}.0</TargetFramework>
            <ImplicitUsings>enable</ImplicitUsings>
            <Nullable>enable</Nullable>

            <IsPackable>false</IsPackable>
            <IsTestProject>true</IsTestProject>
          </PropertyGroup>

          <ItemGroup>
            <PackageReference Include="Microsoft.AspNetCore.Mvc.Testing" Version="${frameworkVersion}.1" />
            <PackageReference Include="Microsoft.NET.Test.Sdk" Version="17.14.0" />
            <PackageReference Include="xunit" Version="2.9.3" />
            <PackageReference Include="xunit.runner.visualstudio" Version="3.1.0">
              <IncludeAssets>runtime; build; native; contentfiles; analyzers; buildtransitive</IncludeAssets>
              <PrivateAssets>all</PrivateAssets>
            </PackageReference>
          </ItemGroup>

          <ItemGroup>
            <Using Include="Xunit" />
          </ItemGroup>

          <ItemGroup>
            <ProjectReference Include="..\${majStart(projectName)}\${majStart(projectName)}.csproj" />
          </ItemGroup>

        </Project>
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}.Tests/"

  projectFiles:
    - fileType: "appSettingsDeveloppement"
      fileName: "appsettings.Development.json"
      sourcePath: "data_genesis/csharp/"
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/"
  projectFolders: [ ]
- id: 3
  name: "Node js"
  coreFrameworks:
    - "Express JS"
  projectFilesEdits:
    - fileType: "env"
      fileName: ".env"
      extension: ""
      content: |
        DB_HOST=${host}
        DB_PORT=${databasePort}
        DB_USERNAME=${databaseUsername}
        DB_PASSWORD=${databasePassword}
        DB_DATABASE=${databaseName}
        APP_PORT=${projectPort}
      destinationPath: "${ destinationFolder }/${ majStart(projectName) }"
    - fileType: "Json"
      fileName: "package"
      extension: "json"
      content: |
        {
          "name": "${projectName}",
          "version": "0.0.1",
          "description": "${projectDescription}",
          "type": "commonjs",
          "scripts": {
            "start": "ts-node src/index.ts",
            "dev": "nodemon --watch src --exec ts-node src/index.ts",
            "typeorm": "typeorm-ts-node-commonjs -d src/config/data-source.ts",
            "test": "jest"
          },
          "dependencies": {
            "express": "^5.1.0",
            "reflect-metadata": "^0.2.2",
            "typeorm": "0.3.25",
            {{#if useDB}}
            "${DBartifactId}": "^${DBversion}",
            {{/if}}
            "body-parser": "^2.2.0",
            "class-validator": "^0.14.0",
            "class-transformer": "^0.5.1",
            "swagger-jsdoc": "^6.2.8",
            "swagger-ui-express": "^5.0.1",
            "json2csv": "^6.0.0-alpha.2",
            "jspdf": "^3.0.1",
            "jspdf-autotable": "^5.0.2",
            "pdf-lib": "^1.17.1",
            "pdfkit": "^0.17.1",
            "node-cache": "^5.1.2"
          },
          "devDependencies": {
            "typescript": "^5.8.2",
            "ts-node": "^10.9.2",
            "ts-node-dev": "^2.0.0",
            "nodemon": "^3.1.10",
            "@types/node": "^22.13.10",
            "@types/express": "^5.0.3",
            "@types/jest": "^30.0.0",
            "@types/json2csv": "^5.0.7",
            "@types/pdfkit": "^0.17.2",
            "@types/supertest": "^6.0.3",
            "@types/swagger-ui-express": "^4.1.8",
            "jest": "^30.0.5",
            "supertest": "^7.1.4",
            "ts-jest": "^29.4.1"
          }
        }
      destinationPath: "${destinationFolder}/${projectName}/"
    - fileType: "Json"
      fileName: "tsconfig"
      extension: "json"
      content: |
        {
          "compilerOptions": {
          "lib": [
            "es2021"
          ],
            "target": "es2021",
            "moduleResolution": "node",
            "emitDecoratorMetadata": true,
            "experimentalDecorators": true,
            "sourceMap": true,
            "module": "commonjs",
            "strict": true,
            "esModuleInterop": true,
            "outDir": "./dist",
            "rootDir": "./src",
            "types": ["jest"]
          },
          "include": ["src/**/*.ts", "tests/**/*.test.ts"]
        }
      destinationPath: "${destinationFolder}/${projectName}/"
  projectFiles: [ ]
  projectFolders: [ ]
