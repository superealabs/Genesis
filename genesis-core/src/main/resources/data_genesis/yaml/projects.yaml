- id: 1
  name: "Maven"
  coreFrameworks:
    - "Spring Boot"
    - "Spring MVC"
  projectFilesEdits:
    - fileType: "Xml"
      fileName: "pom"
      extension: "xml"
      content: |
        <?xml version="1.0" encoding="UTF-8"?>
        <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
        xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <parent>
                <groupId>org.springframework.boot</groupId>
                <artifactId>spring-boot-starter-parent</artifactId>
                <version>${frameworkVersion}</version>
                <relativePath/>
            </parent>
            <groupId>${groupLink}</groupId>
            <artifactId>${projectName}</artifactId>
            <version>0.0.1-SNAPSHOT</version>
            <name>${projectName}</name>
            <description>${projectDescription}</description>
            <url/>
            <licenses>
                <license/>
            </licenses>
            <developers>
                <developer/>
            </developers>
            <scm>
                <connection/>
                <developerConnection/>
                <tag/>
                <url/>
            </scm>
            <properties>
                <java.version>${languageVersion}</java.version>
                {{#if useCloud}}<spring-cloud.version>2023.0.3</spring-cloud.version>{{/if}}
            </properties>
            <dependencies>
                {{#each dependencies}}
                <dependency>
                    <groupId>${this.groupId}</groupId>
                    <artifactId>${this.artifactId}</artifactId>
                    <version>${this.version}</version>
                    <scope>${this.scope}</scope>
                </dependency>{{#if !@last}}{{newline}}        {{/if}}
                {{/each}}
                {{#if useDB}}<dependency>
                    <groupId>${DBgroupId}</groupId>
                    <artifactId>${DBartifactId}</artifactId>
                    <version>${DBversion}</version>
                </dependency>
        {{else}}{{removeLine}}
        {{removeLine}}
        {{removeLine}}
        {{removeLine}}
        {{removeLine}}{{/if}}
                {{#if useEurekaServer}}<dependency>
                    <groupId>org.springframework.cloud</groupId>
                    <artifactId>spring-cloud-starter-netflix-eureka-client</artifactId>
                </dependency>
                <dependency>
                    <groupId>org.springframework.boot</groupId>
                    <artifactId>spring-boot-starter-actuator</artifactId>
                </dependency>{{/if}}
            </dependencies>
        {{#if useCloud}}
            <dependencyManagement>
                <dependencies>
                    <dependency>
                        <groupId>org.springframework.cloud</groupId>
                        <artifactId>spring-cloud-dependencies</artifactId>
                        <version>$[spring-cloud.version]</version>
                        <type>pom</type>
                        <scope>import</scope>
                    </dependency>
                </dependencies>
            </dependencyManagement>{{/if}}        
        
            <build>
                <plugins>
                    <plugin>
                        <groupId>org.springframework.boot</groupId>
                        <artifactId>spring-boot-maven-plugin</artifactId>
                    </plugin>
                </plugins>
            </build>
        </project>

      destinationPath: "${destinationFolder}/${majStart(projectName)}/"
  projectFiles:
    - fileType: "Script"
      fileName: "mvnw"
      sourcePath: "data_genesis/maven/"
      destinationPath: "${destinationFolder}/${majStart(projectName)}/"

    - fileType: "ScriptWin"
      fileName: "mvnw.cmd"
      sourcePath: "data_genesis/maven/"
      destinationPath: "${destinationFolder}/${majStart(projectName)}/"
  projectFolders:
    - folderType: "MavenFolder"
      folderName: ".mvn"
      sourcePath: "data_genesis/maven/.mvn"
      destinationPath: "${destinationFolder}/${majStart(projectName)}/"

- id: 2
  name: "MSBuild for .NET "
  coreFrameworks:
    - ".NET"
  projectFilesEdits:
    - fileType: "HttpFile"
      fileName: "${majStart(projectName)}"
      extension: "http"
      content: |
        @TestDbCRUD_HostAddress = http://localhost:${projectPort}

        {{#each entities}}
        GET {{TestDbCRUD_HostAddress}}/${this}s
        Accept: application/json
        
        ###{{#if !@last}}{{newline}}{{/if}}{{/each}}

      destinationPath: "{{#if isMvcProject}}${destinationFolder}/{{else}}${destinationFolder}/${majStart(projectName)}/{{/if}}"

    - fileType: "AppSettings"
      fileName: "appsettings"
      extension: "json"
      content: |
        {
          "Logging": {
            "LogLevel": {
              "Default": "${loggingLevel}",
              "Microsoft.AspNetCore": "${loggingLevel}"
            }
          },
          {{#if useJWT}}
          "Jwt": {
            "SecretKey": "Bel0Y8TSTrZyicQgAJdcabCbaMQo3s3BkBmP925Wb3g=",
            "ExpirationMinutes": 30
          },{{/if}}
          "AllowedHosts": "*"{{#if useDB}},
          "ConnectionStrings": {
            "DefaultConnection": "${connectionString}"
          }{{/if}},
          "PathBase": "/${toKebabCase(projectName)}"{{#if useEurekaServer}},
          "spring": {
            "application": {
              "name": "${projectName}"
            }
          },
          "eureka": {
            "client": {
              "serviceUrl": "${eurekaServerURL}",
              "shouldFetchRegistry": "false",
              "shouldRegisterWithEureka": true,
              "validateCertificates": false
            },
            "instance": {
              "appName": "${projectName}",
              "port": "${projectPort}",
              "hostname": "$[HOSTNAME]",
              "preferIpAddress": true
            },
            "Management": {
              "Endpoints": {
                "Actuator": {
                  "Exposure": {
                    "Include": [
                      "health",
                      "info",
                      "*"
                    ]
                  }
                },
                "Health": {
                  "ShowDetails": "Always"
                },
                "Info": {
                  "Application": {
                    "name": "${projectName}",
                    "description": "${projectDescription}",
                    "version": "0.0.1-SNAPSHOT"
                  }
                }
              }
            }
          }{{/if}}{{#if isMvcProject}},
          "Kestrel": {
            "Endpoints": {
              "Http": {
                "Url": "http://localhost:${projectPort}"
              }
            }
          }{{/if}}
        
        }

      destinationPath: "{{#if isMvcProject}}${destinationFolder}/{{else}}${destinationFolder}/${majStart(projectName)}/{{/if}}"

    - fileType: "ProjectFile"
      fileName: "${majStart(projectName)}"
      extension: "csproj"
      content: |
        <Project Sdk="Microsoft.NET.Sdk.Web">
            <PropertyGroup>
                <TargetFramework>net${frameworkVersion}</TargetFramework>
                <Nullable>enable</Nullable>
                <ImplicitUsings>enable</ImplicitUsings>
                <DockerDefaultTargetOS>Linux</DockerDefaultTargetOS>
                <RootNamespace>${projectName}</RootNamespace>
                <Description>${projectDescription}</Description>
            </PropertyGroup>
        
            <ItemGroup>
                {{#if useDB}}<PackageReference Include="Microsoft.EntityFrameworkCore.Design" Version="${frameworkVersion}.0">
                    <IncludeAssets>runtime; build; native; contentfiles; analyzers; buildtransitive</IncludeAssets>
                    <PrivateAssets>all</PrivateAssets>
                </PackageReference>
                <PackageReference Include="${DBartifactId}" Version="${frameworkVersion}.0"/>{{/if}}
                {{#if useMicrosoftExtensionsCachingMemory}}<PackageReference Include="Microsoft.Extensions.Caching.Memory" Version="9.0.7" />{{else}}{{removeLine}}{{/if}}
                <PackageReference Include="Swashbuckle.AspNetCore" Version="6.9.0"/>
                <PackageReference Include="Swashbuckle.AspNetCore.Annotations" Version="6.9.0"/>
                {{#if useEurekaServer}}<PackageReference Include="Steeltoe.Discovery.Eureka" Version="3.2.0"/>{{/if}}
                <PackageReference Include="Steeltoe.Management.Endpoint.Info" Version="1.1.0" />
                <PackageReference Include="Steeltoe.Management.Endpoint.Health" Version="1.1.0" />
                <PackageReference Include="Steeltoe.Management.EndpointCore" Version="3.2.0" />
                <PackageReference Include="Steeltoe.Management.TracingCore" Version="3.2.0" />
                {{#if useJWT or useAuthCookie}}
                <PackageReference Include="Microsoft.AspNetCore.Identity.EntityFrameworkCore" Version="8.0.18" />
                <PackageReference Include="System.IdentityModel.Tokens.Jwt" Version="8.13.0" />
                <PackageReference Include="Microsoft.AspNetCore.Authentication.JwtBearer" Version="8.0.18" />
                {{/if}}
                {{#if isMvcProject}}<Content Update="wwwroot\**" CopyToOutputDirectory="Always" />{{/if}}
            </ItemGroup>
        </Project>

      destinationPath: "{{#if isMvcProject}}${destinationFolder}/{{else}}${destinationFolder}/${majStart(projectName)}/{{/if}}"

    - fileType: "SolutionFile"
      fileName: "${majStart(projectName)}"
      extension: "sln"
      content: |
        Microsoft Visual Studio Solution File, Format Version 12.00
        
        Project("{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}") = "${majStart(projectName)}", "${majStart(projectName)}\${majStart(projectName)}.csproj", "{B06BF436-528B-4DF7-9F86-6F86B6A77E84}"
        EndProject
        Global
            GlobalSection(SolutionConfigurationPlatforms) = preSolution
                Debug|Any CPU = Debug|Any CPU
                Release|Any CPU = Release|Any CPU
            EndGlobalSection
            GlobalSection(ProjectConfigurationPlatforms) = postSolution
                {B06BF436-528B-4DF7-9F86-6F86B6A77E84}.Debug|Any CPU.ActiveCfg = Debug|Any CPU
                {B06BF436-528B-4DF7-9F86-6F86B6A77E84}.Debug|Any CPU.Build.0 = Debug|Any CPU
                {B06BF436-528B-4DF7-9F86-6F86B6A77E84}.Release|Any CPU.ActiveCfg = Release|Any CPU
                {B06BF436-528B-4DF7-9F86-6F86B6A77E84}.Release|Any CPU.Build.0 = Release|Any CPU
            EndGlobalSection
        EndGlobal
      destinationPath: "${destinationFolder}/"

    - fileType: "LaunchSettingsFile"
      fileName: "launchSettings"
      extension: "json"
      content: |
        {
          {{#if isMvcProject}}"$schema": "http://json.schemastore.org/launchsettings.json",
          "iisSettings": {
            "windowsAuthentication": false,
            "anonymousAuthentication": true,
            "iisExpress": {
              "applicationUrl": "http://localhost:53034",
              "sslPort": 44349
            }
          }{{else}}"$schema": "http://json.schemastore.org/launchsettings.json",
          "iisSettings": {
            "windowsAuthentication": false,
            "anonymousAuthentication": true,
            "iisExpress": {
              "applicationUrl": "http://localhost:53034/${toKebabCase(projectName)}",
              "sslPort": 44349
            }
          }{{/if}},
          "profiles": {
            {{#if isMvcProject}}"http": {
              "commandName": "Project",
              "dotnetRunMessages": true,
              "launchBrowser": true,
              "launchUrl": "",
              "applicationUrl": "http://localhost:${projectPort}",
              "environmentVariables": {
                "ASPNETCORE_ENVIRONMENT": "Development"
              }
            }{{else}}"http": {
              "commandName": "Project",
              "dotnetRunMessages": true,
              "launchBrowser": true,
              "launchUrl": "swagger",
              "applicationUrl": "http://localhost:${projectPort}/${toKebabCase(projectName)}",
              "environmentVariables": {
                "ASPNETCORE_ENVIRONMENT": "Development"
              }
            }{{/if}},
            {{#if isMvcProject}}"https": {
                "commandName": "Project",
                "dotnetRunMessages": true,
                "launchBrowser": true,
                "launchUrl": "",
                "applicationUrl": "https://localhost:7273;http://localhost:${projectPort}",
                "environmentVariables": {
                  "ASPNETCORE_ENVIRONMENT": "Development"
                }
              }{{else}}"https": {
              "commandName": "Project",
              "dotnetRunMessages": true,
              "launchBrowser": true,
              "launchUrl": "swagger",
              "applicationUrl": "https://localhost:7273/${toKebabCase(projectName)};http://localhost:${projectPort}",
              "environmentVariables": {
                "ASPNETCORE_ENVIRONMENT": "Development"
              }
            }{{/if}},
            {{#if isMvcProject}}"IIS Express": {
              "commandName": "IISExpress",
              "launchBrowser": true,
              "launchUrl": "",
              "environmentVariables": {
                "ASPNETCORE_ENVIRONMENT": "Development"
              }
            }{{else}}"IIS Express": {
              "commandName": "IISExpress",
              "launchBrowser": true,
              "launchUrl": "swagger",
              "environmentVariables": {
                "ASPNETCORE_ENVIRONMENT": "Development"
              }
            }{{/if}}{{#if useEurekaServer}},
            "${projectName}": {
              "commandName": "Project",
              "launchBrowser": true,
              "launchUrl": "swagger",
              "applicationUrl": "http://localhost:${projectPort}/${toKebabCase(projectName)}",
              "environmentVariables": {
                "ASPNETCORE_ENVIRONMENT": "Development"
              }
            }
            {{/if}}
          }
        }
      destinationPath: "{{#if isMvcProject}}${destinationFolder}/Properties/{{else}}${destinationFolder}/${majStart(projectName)}/Properties/{{/if}}"

    - fileType: "TestProjectFile"
      fileName: "${majStart(projectName)}.Tests"
      extension: "csproj"
      content: |
        <Project Sdk="Microsoft.NET.Sdk">

          <PropertyGroup>
            <TargetFramework>net${frameworkVersion}.0</TargetFramework>
            <ImplicitUsings>enable</ImplicitUsings>
            <Nullable>enable</Nullable>

            <IsPackable>false</IsPackable>
            <IsTestProject>true</IsTestProject>
          </PropertyGroup>

          <ItemGroup>
            <PackageReference Include="Microsoft.AspNetCore.Mvc.Testing" Version="${frameworkVersion}.1" />
            <PackageReference Include="Microsoft.NET.Test.Sdk" Version="17.14.0" />
            <PackageReference Include="xunit" Version="2.9.3" />
            <PackageReference Include="xunit.runner.visualstudio" Version="3.1.0">
              <IncludeAssets>runtime; build; native; contentfiles; analyzers; buildtransitive</IncludeAssets>
              <PrivateAssets>all</PrivateAssets>
            </PackageReference>
          </ItemGroup>

          <ItemGroup>
            <Using Include="Xunit" />
          </ItemGroup>

          <ItemGroup>
            <ProjectReference Include="{{#if isMvcProject}}..\${majStart(projectName)}.csproj{{else}}..\${majStart(projectName)}\${majStart(projectName)}.csproj{{/if}}" />
          </ItemGroup>

        </Project>
      destinationPath: "${destinationFolder}/${majStart(projectName)}.Tests/"

  projectFiles:
    - fileType: "appSettingsDeveloppement"
      fileName: "appsettings.Development.json"
      sourcePath: "data_genesis/csharp/"
      destinationPath: "{{#if isMvcProject}}${destinationFolder}/{{else}}${destinationFolder}/${majStart(projectName)}/{{/if}}"
  projectFolders: [ ]
- id: 3
  name: "NodeJS"
  coreFrameworks:
    - "NestJS"
  projectFilesEdits:
    - fileType: "docker"
      fileName: ".dockerignore"
      extension: ""
      content: |
        node_modules
        npm-debug.log
        dist
        .git
        *.md
        .gitignore
      destinationPath: "${destinationFolder}/${majStart(projectName)}"
    - fileType: "docker"
      fileName: "Dockerfile"
      extension: ""
      content: |
        FROM node:20.4
        WORKDIR /usr/src/app
        
        # Copy package.json and package-lock.json
        COPY package*.json ./
        
        # Install dependencies
        RUN npm install
        
        # Copy the rest of the application code
        COPY . .
        
        # Build the application
        RUN npm run build
        
        # Run the application
        CMD ["node", "dist/main.js"]
      destinationPath: "${destinationFolder}/${majStart(projectName)}"
    - fileType: "env"
      fileName: ".env"
      extension: ""
      content: |
        APP_PORT=${projectPort}
        {{#if useJWT}}JWT_SECRET=ecadf03942ea050f90abc4ce66eadda7b4183e98ac36a518820f78b0b020d02d
        JWT_EXPIRES_IN=48h
        BCRYPT_SALT_ROUNDS=12{{/if}}
      destinationPath: "${destinationFolder}/${majStart(projectName)}"

    - fileType: "Json"
      fileName: "package"
      extension: "json"
      content: |
        {
          "name": "${projectName}",
          "version": "0.0.1",
          "description": "${projectDescription}",
          "scripts": {
            "start": "nest start",
            "start:dev": "nest start --watch",
            "build": "nest build",
            "test": "jest",
            "lint": "eslint '{src,tests}/**/*.ts' --fix"
          },
          "dependencies": {
            "@nestjs/common": "^10.0.0",
            "@nestjs/core": "^10.0.0",
            "@nestjs/config": "^4.0.2",
            "@nestjs/platform-express": "^10.0.0",
            "@nestjs/swagger": "^7.2.0",
            "@nestjs/typeorm": "^11.0.0",
            {{#if useDB}}"${DBartifactId}": "^${DBversion}",{{/if}}
            "reflect-metadata": "^0.2.2",
            "typeorm": "0.3.25",
            "typeorm-naming-strategies": "^4.1.0",
            "class-validator": "^0.14.0",
            "class-transformer": "^0.5.1",
            "dotenv": "^16.3.0",
            "body-parser": "^2.2.0",
            "json2csv": "^6.0.0-alpha.2",
            "jspdf": "^3.0.1",
            "jspdf-autotable": "^5.0.2",
            "puppeteer": "^24.19.0",
            "node-cache": "^5.1.2"
            {{#if useJWT}},"@nestjs/jwt": "^11.0.0",
            "@nestjs/passport": "^11.0.5",
            "bcryptjs": "^3.0.2",
            "passport": "^0.7.0",
            "passport-jwt": "^4.0.1",
            "passport-local": "^1.0.0"{{/if}}
            {{#if useBuiltInNestCacheManager}}, "@nestjs/cache-manager": "^3.0.1",
            "cache-manager": "^7.2.4"{{/if}}
            {{#if useNestRedisCaching}}, "@keyv/redis": "^5.1.3"{{/if}}
          },
          "devDependencies": {
  
            "@nestjs/cli": "^10.0.0",
            "@nestjs/schematics": "^10.0.0",
            "@nestjs/testing": "^10.4.20",
            "typescript": "^5.8.2",
            "ts-node": "^10.9.2",
            "ts-node-dev": "^2.0.0",
            "nodemon": "^3.1.10",
            "@types/node": "^22.13.10",
            "@types/jest": "^30.0.0",
            "@types/json2csv": "^5.0.7",
            "@types/supertest": "^6.0.3",
            "@types/express": "^5.0.3",
            "jest": "^30.0.5",
            "supertest": "^7.1.4",
            "ts-jest": "^29.4.1",
            "eslint": "^8.50.0",
            "@typescript-eslint/eslint-plugin": "^6.0.0",
            "@typescript-eslint/parser": "^6.0.0"
            {{#if useJWT}}, "@types/bcryptjs": "^2.4.6",
            "@types/passport-jwt": "^4.0.1",
            "@types/passport-local": "^1.0.38"{{/if}}
          }
        }
      destinationPath: "${destinationFolder}/${projectName}/"

    - fileType: "Json"
      fileName: "tsconfig"
      extension: "json"
      content: |
        {
          "compilerOptions": {
            "lib": ["es2021", "dom"],
            "target": "es2021",
            "moduleResolution": "node",
            "emitDecoratorMetadata": true,
            "experimentalDecorators": true,
            "sourceMap": true,
            "module": "commonjs",
            "strict": true,
            "esModuleInterop": true,
            "outDir": "./dist",
            "rootDir": ".",
            "types": ["node", "jest"]
          },
          "include": ["src/**/*.ts", "tests/**/*.test.ts", "test/**/*.spec.ts",]
        }
      destinationPath: "${destinationFolder}/${projectName}/"
    - fileType: "Test config file"
      fileName: "jest.config"
      extension: "js"
      content: |
        const { createDefaultPreset } = require("ts-jest");

        const tsJestTransformCfg = createDefaultPreset().transform;

        /** @type {import("jest").Config} **/
        module.exports = {
          preset: "ts-jest",
          testEnvironment: "node",
          rootDir: ".",
          moduleFileExtensions: ["js", "json", "ts"],
          testRegex: ".*\\.(spec|e2e-spec)\\.ts$", 
          transform: {
            ...tsJestTransformCfg,
          },
          collectCoverageFrom: [
            "src/**/*.(t|j)s", 
          ],
          coverageDirectory: "./coverage",
        };
      destinationPath: "${destinationFolder}/${projectName}/"
  projectFiles: [ ]
  projectFolders: [ ]

- id: 4
  name: "Django"
  coreFrameworks:
    - "Django"
  projectFilesEdits:
    - fileType: "Requirements"
      fileName: "requirements"
      extension: "txt"
      content: |
        Django==${frameworkVersion}
        {{#if useDB}}${DBdriver}{{/if}}
        {{#each dependencies}}
        ${this.artifactId}==${this.version}
        {{/each}}
      destinationPath: "${destinationFolder}/${projectName}/"

    - fileType: "Manage"
      fileName: "manage"
      extension: "py"
      content: |
        #!/usr/bin/env python
        """Django's command-line utility for administrative tasks."""
        import os
        import sys


        def main():
            """Run administrative tasks."""
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', '${projectName}.settings')
            try:
                from django.core.management import execute_from_command_line
            except ImportError as exc:
                raise ImportError(
                    "Couldn't import Django. Are you sure it's installed and "
                    "available on your PYTHONPATH environment variable? Did you "
                    "forget to activate a virtual environment?"
                ) from exc
            execute_from_command_line(sys.argv)


        if __name__ == '__main__':
            main()
      destinationPath: "${destinationFolder}/${projectName}/"

  projectFiles: []

  projectFolders: []