    modelFieldContent: |
      {{tab}}{{#each fields}}
      {{tab}}{{#if this.isPrimaryKey}}
      {{tab}}@Id
      {{tab}}@GeneratedValue(strategy=GenerationType.IDENTITY)
      {{tab}}@Column(name="${this.columnName}"){{elseIf this.isForeignKey}}
