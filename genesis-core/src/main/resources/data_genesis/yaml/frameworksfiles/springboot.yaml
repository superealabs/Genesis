  controller:
    toGenerate: true
    controllerImports: |
      import io.swagger.v3.oas.annotations.Operation;
      import io.swagger.v3.oas.annotations.Parameter;
      import io.swagger.v3.oas.annotations.media.Content;
      import io.swagger.v3.oas.annotations.media.Schema;
      import io.swagger.v3.oas.annotations.responses.ApiResponse;
      import io.swagger.v3.oas.annotations.responses.ApiResponses;
      import io.swagger.v3.oas.annotations.tags.Tag;
      import org.springframework.http.HttpStatus;
      import org.springframework.http.ResponseEntity;
      import ${groupLink}.${lowerCase(projectName)}.models.${majStart(className)};
      import org.springframework.web.bind.annotation.*;
      import ${groupLink}.${lowerCase(projectName)}.services.interfaces.${majStart(className)}Service;
      import ${groupLink}.${lowerCase(projectName)}.utils.WebUtils;
      import org.springframework.data.domain.Page;
      import org.springframework.data.domain.PageRequest;
      import org.springframework.data.domain.Pageable;
      import org.springframework.data.domain.Sort;
      import ${groupLink}.${lowerCase(projectName)}.dto.RestResponse;

    controllerAnnotations: |
      @RestController
      @RequestMapping("/${lowerCase(classNameLink)}")
      @Tag(name = "${formatReadable(className)}", description = "${formatReadable(className)} Management APIs")
    controllerExtends: ""
    controllerName: "${majStart(className)}Controller"
    controllerFieldContent: |
      {{tab}}private final ${majStart(className)}Service ${lowerCase(className)}Service;
    controllerConstructors: |
      {{tab}}public ${majStart(className)}Controller(${majStart(className)}Service ${lowerCase(className)}Service) {
      {{tab}}   this.${lowerCase(className)}Service = ${lowerCase(className)}Service;
      {{tab}}}
    controllerMethodContent: |
      {{tab}}@Operation(
      {{tab}}    summary = "Retrieve all ${formatReadableLowerCase(className)}",
      {{tab}}    description = "Get a paginated and sorted list of ${formatReadableLowerCase(className)} items. Returns an empty list if no data is found."
      {{tab}})
      {{tab}}@ApiResponses({
      {{tab}}    @ApiResponse(
      {{tab}}        responseCode = "200",
      {{tab}}        description = "Successfully retrieved the paginated list of ${formatReadableLowerCase(className)}",
      {{tab}}        content = @Content(mediaType = "application/json", schema = @Schema(implementation = ApiResponse.class))
      {{tab}}    ),
      {{tab}}    @ApiResponse(
      {{tab}}        responseCode = "204",
      {{tab}}        description = "No ${formatReadableLowerCase(className)} found"
      {{tab}}    )
      {{tab}}})
      {{tab}}@GetMapping
      {{tab}}public ResponseEntity<RestResponse<Page<${majStart(className)}>>> getAll${majStart(classNameLink)}(
      {{tab}}    @Parameter(description = "Page number (0-indexed)", example = "0")
      {{tab}}    @RequestParam(defaultValue = "0") int page,
      {{tab}}
      {{tab}}    @Parameter(description = "Size of the page", example = "10")
      {{tab}}    @RequestParam(defaultValue = "10") int size,
      {{tab}}
      {{tab}}    @Parameter(
      {{tab}}        description = "Sorting criteria in the format: property,(asc|desc). "
      {{tab}}                + "Multiple sort criteria can be passed using semicolon separator. "
      {{tab}}                + "Example: id,asc;name,desc",
      {{tab}}        example = "id,asc"
      {{tab}}    )
      {{tab}}    @RequestParam(defaultValue = "id,asc") String sortParam) {
      {{tab}}
      {{tab}}    Sort sortObj = WebUtils.createSortObject(sortParam);
      {{tab}}    Pageable pageable = PageRequest.of(page, size, sortObj);
      {{tab}}    Page<${majStart(className)}> ${lowerCase(classNameLink)} = ${lowerCase(className)}Service.getAll${majStart(className)}(pageable);
      {{tab}}
