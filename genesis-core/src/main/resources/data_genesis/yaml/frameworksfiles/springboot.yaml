          application:
            name: ${toKebabCase(projectName)}
        {{#if useDB}}
          datasource:
            url: ${connectionString}
            username: ${databaseUsername}
            password: ${databasePassword}
          jpa:
            database-platform : org.hibernate.dialect.${databaseType}Dialect
            hibernate:
              ddl-auto: ${hibernateDdlAuto}
            properties:
              hibernate.format_sql: true
        {{/if}}
        
        server:
          port: ${projectPort}
          servlet:
            context-path: /${toKebabCase(projectName)}
        
        # Logs Configuration
        logging:
          level:
            root: ${loggingLevel}
            {{#if useDB}}org.hibernate.SQL: ${loggingLevel}{{/if}}
        
        {{#if useEurekaServer}}
        eureka:
          client:
            service-url:
              defaultZone: ${eurekaServerURL}
          instance:
            prefer-ip-address: true
            ip-address: $[spring.cloud.client.ip-address]
        management:
          endpoints:
            web:
              exposure:
                include: health,info
          endpoint:
            health:
              show-details: always
            info:
              enabled: true
          info:
            env:
              enabled: true
            java:
              enabled: true
            build:
              enabled: true
        info:
          app:
            name: $[spring.application.name]
            description: "${projectDescription}"
            version: "0.0.1-SNAPSHOT"
            technical:
              spring-boot:
                version: "${frameworkVersion}"
              server:
                port: $[server.port]
              database:
                url: $[spring.datasource.url]
                type: "${databaseType}"
        {{/if}}

