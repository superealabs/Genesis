      folderName: ".mvn"
      sourcePath: "data_genesis/maven/MVC/.mvn"
      destinationPath: "${destinationFolder}/#{majStart(projectName)}/"

    - folderType: "resourceFolder"
      folderName: "resources"
      sourcePath: "data_genesis/maven/MVC/src/main/resources"
      destinationPath: "${destinationFolder}/#{majStart(projectName)}/src/main/"

    - folderType: "staticAssetsFolder"
      folderName: "assets"
      sourcePath: "data_genesis/ui-template/thymeleaf/assets"
      destinationPath: "${destinationFolder}/#{majStart(projectName)}/src/main/resources/static/"

    - folderType: "compiledAssetsFolder"
      folderName: "compiled"
      sourcePath: "data_genesis/ui-template/thymeleaf/compiled"
      destinationPath: "${destinationFolder}/#{majStart(projectName)}/src/main/resources/static/"

    - folderType: "errorTemplateFolder"
      folderName: "error"
