- id: 1
  frameworkMvcId: 5
  name: "Razor"
  viewExtension: "cshtml"
  layout:
    name: "_Layout"
    destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/Views/Shared/"
    navLink: "class=\"@(currentController == \"${majStart(this.entityName)}\" ? \"active\" : \"\")\" asp-area=\"\" asp-controller=\"${majStart(this.entityName)}\" asp-action=\"Index\""
    pageName: "@ViewData[\"Title\"] -"
    rootPath: " ~/css/style.css\" asp-append-version=\"true "
    callContent: "@RenderBody()"
    currentViewContext: |
      @{
          var currentController = ViewContext.RouteData.Values["controller"]?.ToString();
      }
  list:
    modelType : |
      @model IEnumerable<${majStart(className)}>
    dataValue: "@${lowerCase(className)}.${majStart(this.name)}"
    dataForeignValue: "@${lowerCase(className)}.${majStart(this.name)}?.GetType().GetProperty((string)ViewBag.${majStart(this.type)}Column)?.GetValue(@${lowerCase(className)}.${majStart(this.name)})"
    inlineLoopStatement: |
    blockLoopStatementStart: |
      @foreach (var ${lowerCase(className)} in Model) {
    blockLoopStatementEnd: |
      }
    detailsLink: "@Url.Action(\"Details\", new { ${pkColumn} = @${lowerCase(className)}.${majStart(pkColumn)} })"
    deleteTagHelper: "data-id=\"@${lowerCase(className)}.${majStart(pkColumn)}\""
    deleteLink: "asp-action=\"Delete\""
    createLink: "@Url.Action(\"Create\")"
    updateLink: "@Url.Action(\"Update\")"
    backLink: "@Url.Action(\"Index\")"
    assetsImportLink: "~"
  detail:
    modelType: |
      @model ${majStart(className)}
    dataValue: "@Model.${majStart(this.name)}"
    dataForeignValue: "@Model.${majStart(this.name)}?.GetType().GetProperty((string)ViewBag.${majStart(this.type)}Column)?.GetValue(@Model.${majStart(this.name)})"
    deleteLink: "data-id=\"@Model.${majStart(pkColumn)}\""
    updateLink: "@Url.Action(\"Update\")"
    backLink: "@Url.Action(\"Index\")"

  create:
    modelType: |
      @model ${majStart(className)}
    backLink: "@Url.Action(\"Index\")"
    inputTagHelper: "asp-for=\"${majStart(this.name)}\""
    selectTagHelper: "asp-for=\"${majStart(this.columnNameField)}\" asp-items=\"ViewBag.${majStart(this.type)}s\""
    createLink: "asp-action=\"Create\" asp-controller=\"${className}\""
  edit:
    modelType: |
      @model ${majStart(className)}
    backLink: "@Url.Action(\"Index\")"
    inputTagHelper: "asp-for=\"${majStart(this.name)}\""
    selectTagHelper: "asp-for=\"${majStart(this.name)}\" asp-items=\"ViewBag.${majStart(this.type)}s\""

  templateEngineFilesEdits:
    - fileType : "ViewImports"
      fileName: "_ViewImports"
      extension: "cshtml"
      content: |
        @using ${majStart(projectName)}
        @using ${majStart(projectName)}.Models
        @addTagHelper *, Microsoft.AspNetCore.Mvc.TagHelpers
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/Views/"
    - fileType : "ViewStart"
      fileName: "_ViewStart"
      extension: "cshtml"
      content: |
        @{
            Layout = "_Layout";
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/Views/"

  templateEngineFiles: []
  templateEngineFolders:
    - folderType: "wwwroot"
      folderName: "wwwroot"
      sourcePath: "data_genesis/template_engine_folders/wwwroot"
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/"
