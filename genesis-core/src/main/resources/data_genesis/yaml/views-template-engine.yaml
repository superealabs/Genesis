- id: 1
  frameworkMvcId: 5
  name: "Razor"
  viewExtension: "cshtml"
  layout:
    name: "_Layout"
    destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/Views/Shared/"
    navLink: "class=\"@(currentController == \"${majStart(this.entityName)}\" ? \"active\" : \"\")\" asp-area=\"\" asp-controller=\"${majStart(this.entityName)}\" asp-action=\"Index\""
    pageName: "@ViewData[\"Title\"] -"
    rootPath: " ~/css/style.css\" asp-append-version=\"true "
    callContent: |
      @RenderBody()
      @RenderSection("Scripts", required: false)
      @await Html.PartialAsync("_PopupError")

    currentViewContext: |
      @{
          var currentController = ViewContext.RouteData.Values["controller"]?.ToString();
      }
  list:
    modelType : |
      @model PagedResponse<${majStart(className)}>
      @{
         string currentSort = Context.Request.Query["sortOrder"];
      }
    assetsImportLink: "~"
    filterLink: "asp-action=\"Search\" asp-controller=\"${majStart(className)}\""
    inputTagHelper: "name=\"${majStart(this.name)}\""
    selectTagHelper: "name=\"${majStart(this.columnNameField)}\" asp-items=\"ViewBag.${majStart(this.type)}s\""
    dataValue: "@${lowerCase(className)}.${majStart(this.name)}"
    dataForeignValue: "@${lowerCase(className)}.${majStart(this.name)}?.GetType().GetProperty((string)ViewBag.${majStart(this.type)}Column)?.GetValue(@${lowerCase(className)}.${majStart(this.name)})"
    inlineLoopStatement: |
    blockLoopStatementStart: |
      @foreach (var ${lowerCase(className)} in Model.Content) {
    blockLoopStatementEnd: |
      }
    backLink: "@Url.Action(\"Index\")"
    sortLink: "asp-action=\"Index\" asp-route-page=\"@Model.Page.Number\" asp-route-pageSize=\"@Model.Page.Size\" asp-route-sortOrder=\"@WebUtils.AddSort(currentSort, \"${this.name},asc\")\""
    detailsLink: "@Url.Action(\"Details\", new { ${pkColumn} = @${lowerCase(className)}.${majStart(pkColumn)} })"
    createLink: "@Url.Action(\"Create\")"
    updateLink: "@Url.Action(\"Edit\", new { ${pkColumn} = @${lowerCase(className)}.${majStart(pkColumn)} })"
    deleteLink: "asp-action=\"Delete\""
    deleteTagHelper: "data-id=\"@${lowerCase(className)}.${majStart(pkColumn)}\""
    pageSizeChangeLink: "'@Url.Action(\"Index\")?page=1&pageSize='+this.value"
    pageSizeTagHelper: "selected=\"@(Model.Page.Size == ${this})\""
    previousPageLink: "@Url.Action(\"Index\", new { page = Model.Page.Number - 1, pageSize = Model.Page.Size, sortOrder=currentSort })"
    previousClassCondition: " @(Model.Page.Number == 1 ? \"disabled\" : \"\")"
    pagesListLoop: |
      @for (int i = 1; i <= Model.Page.TotalPages; i++)
      {{tab}}{{tab}}{{tab}}{
      {{tab}}{{tab}}{{tab}}{{tab}}<a href="@Url.Action("Index", new { page = i, pageSize = Model.Page.Size, sortOrder=currentSort })"
      {{tab}}{{tab}}{{tab}}{{tab}}class="@(i == Model.Page.Number ? "active" : "")">
      {{tab}}{{tab}}{{tab}}{{tab}}{{tab}}@i
      {{tab}}{{tab}}{{tab}}{{tab}}</a>
      {{tab}}{{tab}}{{tab}}}
    nextPageLink: "@Url.Action(\"Index\", new { page = Model.Page.Number + 1, pageSize = Model.Page.Size, sortOrder=currentSort })"
    nextClassCondition: " @(Model.Page.Number == Model.Page.TotalPages ? \"disabled\" : \"\")"
    onGoingPageLink: "@Url.Action(\"Index\")"
    onGoingPageTagHelper: "value=\"@Model.Page.Size\""
    onGoingPagesLoop: |
      @for (int i = 1; i <= Model.Page.TotalPages; i++)
      {{tab}}{{tab}}{{tab}}{{tab}}{{tab}}{
      {{tab}}{{tab}}{{tab}}{{tab}}{{tab}}{{tab}}<option value="@i" selected="@(i == Model.Page.Number)">
      {{tab}}{{tab}}{{tab}}{{tab}}{{tab}}{{tab}}@i
      {{tab}}{{tab}}{{tab}}{{tab}}{{tab}}{{tab}}</option>
      {{tab}}{{tab}}{{tab}}{{tab}}{{tab}}}
  detail:
    modelType: |
      @model ${majStart(className)}
    dataValue: "@Model.${majStart(this.name)}"
    dataForeignValue: "@Model.${majStart(this.name)}?.GetType().GetProperty((string)ViewBag.${majStart(this.type)}Column)?.GetValue(@Model.${majStart(this.name)})"
    deleteLink: "data-id=\"@Model.${majStart(pkColumn)}\""
    updateLink: "@Url.Action(\"Edit\", new { ${pkColumn} = @Model.${majStart(pkColumn)} })"
    backLink: "@Url.Action(\"Index\")"

  create:
    modelType: |
      @model ${majStart(className)}
    validationSection: |
      @if (!ViewData.ModelState.IsValid)
      {{tab}}{
      {{tab}}{{tab}}<!-- Validation Summary -->
      {{tab}}{{tab}}<div asp-validation-summary="All" class="error-message"></div>
      {{tab}}}
    backLink: "@Url.Action(\"Index\")"
    validationTagHelper: "asp-validation-for=\"${majStart(this.name)}\""
    selectValidationTagHelper: "asp-validation-for=\"${majStart(this.columnNameField)}\""
    inputTagHelper: "name=\"${majStart(this.name)}\" id=\"${majStart(this.name)}\" asp-for=\"${majStart(this.name)}\""
    selectTagHelper: "name=\"${majStart(this.columnNameField)}\" id=\"${majStart(this.columnNameField)}\" asp-for=\"${majStart(this.columnNameField)}\" asp-items=\"ViewBag.${majStart(this.type)}s\""
    createLink: "asp-action=\"Create\" asp-controller=\"${className}\""
  edit:
    modelType: |
      @model ${majStart(className)}
    validationSection: |
      @if (!ViewData.ModelState.IsValid)
      {{tab}}{
      {{tab}}{{tab}}<!-- Validation Summary -->
      {{tab}}{{tab}}<div asp-validation-summary="All" class="error-message"></div>
      {{tab}}}
    backLink: "@Url.Action(\"Index\")"
    validationTagHelper: "asp-validation-for=\"${majStart(this.name)}\""
    selectValidationTagHelper: "asp-validation-for=\"${majStart(this.columnNameField)}\""
    inputTagHelper: "name=\"${majStart(this.name)}\" id=\"${majStart(this.name)}\" asp-for=\"${majStart(this.name)}\""
    selectTagHelper: "name=\"${majStart(this.columnNameField)}\" id=\"${majStart(this.columnNameField)}\" asp-for=\"${majStart(this.columnNameField)}\" asp-items=\"ViewBag.${majStart(this.type)}s\""
    updateLink: "asp-action=\"Edit\" asp-controller=\"${className}\""
  error:
    name: "Error"
    destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/Views/Shared/"
    viewAnnotations: |
      @{
          ViewData["Title"] = "Error";
          var previousUrl = Context.Request.Headers["Referer"].ToString();
          if (string.IsNullOrEmpty(previousUrl))
          {
              previousUrl = "/";
          }
      }
    backLink: "@previousUrl"
    errorMessage: "@ViewData[\"ErrorMessage\"]"

  templateEngineFilesEdits:
    - fileType : "ViewImports"
      fileName: "_ViewImports"
      extension: "cshtml"
      content: |
        @using ${majStart(projectName)}
        @using ${majStart(projectName)}.Models
        @using ${majStart(projectName)}.Utils
        @addTagHelper *, Microsoft.AspNetCore.Mvc.TagHelpers
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/Views/"
    - fileType : "ViewStart"
      fileName: "_ViewStart"
      extension: "cshtml"
      content: |
        @{
            Layout = "_Layout";
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/Views/"
    - fileType : "Validation Scripts Partial"
      fileName: "_ValidationScriptsPartial"
      extension: "cshtml"
      content: |
        <script src="~/lib/jquery-validation/dist/jquery.validate.min.js"></script>
        <script src="~/lib/jquery-validation-unobtrusive/jquery.validate.unobtrusive.min.js"></script>
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/Views/Shared/"
    - fileType : "Popup Error"
      fileName: "_PopupError"
      extension: "cshtml"
      content: |
        @if (TempData["PopupError"] != null)
        {
            <script>
                window.onload = function () {
                    alert("@TempData["PopupError"]");
                };  
            </script>
        }
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/Views/Shared/"

  templateEngineFiles: []
  templateEngineFolders:
    - folderType: "wwwroot"
      folderName: "wwwroot"
      sourcePath: "data_genesis/template_engine_folders/wwwroot"
      destinationPath: "${destinationFolder}/${majStart(projectName)}/${majStart(projectName)}/"
