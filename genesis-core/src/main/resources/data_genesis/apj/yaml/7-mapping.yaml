id : 7
name : "Mapping"
template : "mapping"
extension : "java"
imports : |
  package ${packageMapping};
  
  import bean.${superclasse};
  import java.sql.Connection;
  {{#each packageImports}}
  import ${this.package};
  {{/each}}{{removeLine}}

body : |
  public class ${mapping} extends ${superclasse} {
      {{#each champs}}
      private ${this.type} ${this.nom};
      {{/each}}{{removeLine}}
  
      {{#each champs}}
      public ${this.type} get${majStart(this.nom)}() {
          return ${this.nom};
      }
  
      public void set${majStart(this.nom)}(${this.type} ${this.nom}) {
          this.${this.nom} = ${this.nom};
      }
  
      {{/each}}{{removeLine}}
  
      public ${mapping}() {
          this.setNomTable("${nomTable}");
      }
  
      @Override
      public void construirePK(Connection c) throws Exception {
          this.preparePk("","");
          this.set${majStart(pk)}(makePK(c));
      }
  
      @Override
      public String getTuppleID() {
          return ${pk};
      }
  
      @Override
      public String getAttributIDName() {
          return "${pk}";
      }
  }
