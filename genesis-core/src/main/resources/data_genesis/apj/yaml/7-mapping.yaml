id : 7
name : "Mapping"
template : "mapping"
extension : "java"
imports : |
  package ${packageMapping};
  
  import bean.${superclasse};
  import java.sql.Connection;
  {{#each packageImports}}
  import ${this.package};
  {{/each}}{{removeLine}}

body : |
  public class ${majStart(mapping)} extends ${superclasse} {
      {{#each champs}}
      private ${this.type} ${this.nom};
      {{/each}}{{removeLine}}
  
      {{#each champs}}
      public ${this.type} get${majStart(this.nom)}() {
          return ${this.nom};
      }
  
      public void set${majStart(this.nom)}(${this.type} ${this.nom}) {
          this.${this.nom} = ${this.nom};
      }
  
      {{/each}}{{removeLine}}
  
      {{#if isFille}}{{removeLine}}
      @Override
      public String getNomClasseMere() {
          return "${classeLiaison}";
      }
  
      @Override
      public String getLiaisonMere() {
          return "${liaison}";
      }
      {{/if}}{{removeLine}}
  
      public ${majStart(mapping)}() throws Exception {
          this.setNomTable("${nomTable}");
          {{#if isMere}}{{removeLine}}
          this.setNomClasseFille("${classeLiaison}");
          this.setLiaisonFille("${liaison}");
          {{/if}}{{removeLine}}
          {{#if isFille}}{{removeLine}}
          this.setNomClasseMere("${classeLiaison}");
          this.setLiaisonMere("${liaison}");
          {{/if}}{{removeLine}}
      }
  
      @Override
      public void construirePK(Connection c) throws Exception {
          this.preparePk("${indicePK}","${pSeq}");
          this.set${majStart(pk)}(makePK(c));
      }
  
      @Override
      public String getTuppleID() {
          return ${pk};
      }
  
      @Override
      public String getAttributIDName() {
          return "${pk}";
      }
  }
