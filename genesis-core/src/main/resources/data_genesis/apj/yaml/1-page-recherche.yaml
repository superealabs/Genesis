id : 1
name : "PageRecherche"
template : "page"
extension : "jsp"
imports : |
  <%@ page pageEncoding="UTF-8" contentType="text/html; charset=UTF-8" %>
  <%@ page import="affichage.PageRecherche"%>
  <%@ page import="${packageMapping}" %>
  {{#if isWithListe}}{{removeLine}}
  <%@ page import="affichage.Liste"%>
  {{#each packageImports}}
  <%@ page import="${this.package}" %>
  {{/each}}{{removeLine}}
  {{/if}}{{removeLine}}
jspBlock : |
  <% try{ 
      ${mapping} o = new ${mapping}();
      o.setNomTable("${nomTable}");
      String[] listeCrt = {${listeCrt}};
      String[] listeInt = {${listeInt}};
      String[] libEntete = {${libEntete}};
      PageRecherche pr = new PageRecherche(o, request, listeCrt, listeInt, 4, libEntete, libEntete.length);
      pr.setTitre("${titre}");
      pr.setUtilisateur((user.UserEJB) session.getValue("u"));
      pr.setLien((String) session.getValue("lien"));
      pr.setApres("${apres}");
  
      {{#if isWithListe}}{{removeLine}}
      Liste[] liste = new Liste[${listeSize}];
      {{#each listes}}
      {{#if this.isOuiNon}}
      liste[${this.index}] = new Liste("${this.nom}");
      liste[${this.index}].makeListeOuiNon();
  
      {{elseIf this.isListeString}}
      String[] aff${this.index} = {${this.col}};
      String[] val${this.index} = {${this.val}};
      liste[${this.index}] = new Liste("test",aff${this.index}, val${this.index});
  
      {{else}}
      ${this.mapping} liste${this.index} = new ${this.mapping}();
      liste${this.index}.setNomTable("${this.nomTable}");
      liste[${this.index}] = new Liste("${this.nom}",liste${this.index},"${this.col}","${this.val}");
  
      {{/if}}{{removeLine}}
      {{/each}}{{removeLine}}{{removeLine}}
      pr.getFormu().changerEnChamp(liste);
      {{/if}}{{removeLine}}
  
      {{#each champs}}
      pr.getFormu().getChamp("${this.nom}").setLibelle("${this.libelle}");
      {{/each}}{{removeLine}}

      String[] colSomme = ${colSomme};
      pr.creerObjetPage(libEntete, colSomme);
      {{#if isWithColSomme}}
      String[] enteteRecap = {${enteteRecap}};
      pr.getTableauRecap().setLibeEntete(enteteRecap);
      {{else}}{{removeLine}}{{/if}}{{removeLine}}

      String[] libEnteteAffiche = {${libEnteteAffiche}};
      pr.getTableau().setLibelleAffiche(libEnteteAffiche);
  %>

html : |
  <div class="content-wrapper">
      <section class="content-header">
          <h1><%= pr.getTitre() %></h1>
      </section>
      <section class="content">
          <form action="<%=pr.getLien()%>?but=<%= pr.getApres() %>" method="post">
              <%
                  out.println(pr.getFormu().getHtmlEnsemble());
              %>
          </form>
          <%
              out.println(pr.getTableauRecap().getHtml());
          %>
          <br>
          <%
              out.println(pr.getTableau().getHtml());
              out.println(pr.getBasPage());
          %>
      </section>
  </div>
basPage : |
  <% } catch (Exception e) {
    e.printStackTrace();
  %>
  <script language="JavaScript"> alert('<%=e.getMessage()%>');
      history.back();
  </script>
  <% }%>
