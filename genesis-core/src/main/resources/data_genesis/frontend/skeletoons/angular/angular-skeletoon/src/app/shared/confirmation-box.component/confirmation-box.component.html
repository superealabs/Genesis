<div class="overlay">
  <div class="modal">
    <button class="close-btn" (click)="cancel()">✕</button>

    <div class="icon" style="text-align:center; margin-top: 5px; margin-bottom: 2px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="0.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L3 5v6c0 5 4 9 9 9s9-4 9-9V5l-9-3z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <circle cx="12" cy="17" r="0.6" fill="#000000"/>
      </svg>
    </div>

    <p [innerHTML]="message" style="margin: 1% 0 2% 0; line-height: 1.1;"></p>
    <small class="undo-warning" style="display: block; margin: 0 0 8px 0; line-height: 1.1;">This cannot be undone.</small>

    <div class="button-container" style="text-align:center;">
      <button class="confirm-btn action-btn" (click)="confirm()">Delete</button>
    </div>
  </div>
</div>
