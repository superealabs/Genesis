        function RowActions({ row }: { row: ${majStart(className)} }) {
            const navigate = useNavigate();
            const handleDelete = useDelete(${toCamelCase(className)}Service.delete, () => window.location.reload());

            return (
                <ActionButtons
                    actions={[
