        label: "${formatReadable(classNameLink)}"
      importFile: |
        import { Edit, Delete } from '@mui/icons-material';
        import { useNavigate } from 'react-router-dom';
        
        import {${majStart(className)}, ${toCamelCase(className)}Meta, ${toCamelCase(className)}Columns, ${toCamelCase(className)}Filters} from '@/models/${toKebabCase(className)}/${toKebabCase(className)}.model';
        import { ${toCamelCase(className)}Service } from '@/models/${toKebabCase(className)}/${toKebabCase(className)}.service';
      importComponent: |
        import GenericListPage from '@/components/GenericListPage/GenericListPage';
