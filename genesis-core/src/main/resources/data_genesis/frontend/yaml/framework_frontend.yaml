                  this.id=${minStart(className)}Id;
                  this.formUpdate=true
                  this.load${majStart(className)}(${minStart(className)}Id);
                }
                this.isLoading = true;
                forkJoin([
                    {{#each fieldsFK}}{{removeLine}}
