- id: 1
  languageId: 1
  coreFramework: "Angular"
  name: "Angular App"
  template: "Angular-template"
  initPath: "angular/angular-skeletoon"
  componentExtension: "ts"
  additionalFiles:
    - fileType: "App-files"
      fileName: "app.component"
      extension: "ts"
      content: |
        import { Component } from '@angular/core';
        import { RouterOutlet,RouterModule } from '@angular/router';
        
        import { SidebarComponent } from './shared/sidebar/sidebar.component';
        
        @Component({
          selector: 'app-root',
          standalone: true,
          imports: [RouterOutlet,RouterModule,SidebarComponent],  
          templateUrl: './app.component.html',
          styleUrls: ['./app.component.css']      
        })
        
        export class AppComponent {
          title = 'first-angular-project';

          entities={
          {{tab}}{{#each entities}}{{removeLine}}
          {{#if !this.isView}}'${formatReadable(this.className)}s': '/${toKebabCase(this.className)}s'{{/if}}
          {{tab}}{{#if !@last  and !this.isView}},{{/if}}{{/each}}{{removeLine}}
          } 
          views={
          {{tab}}{{#each entities}}{{removeLine}}
          {{#if this.isView}}'${formatReadable(this.className)}': '/${toKebabCase(this.className)}s',{{/if}}
          {{tab}}{{#if @last}}'end':''{{/if}}{{/each}}{{removeLine}}
          } 
        }
      destinationPath: "${destinationFolder}/src/app/"
    - fileType: "App-files"
      fileName: "app.routes"
      extension: "ts"
      content: |
        import { Routes } from '@angular/router';
        
        {{#each entities}}{{removeLine}}
        import { ${minStart(this.className)}Routes } from './features/${toKebabCase(this.className)}/${toKebabCase(this.className)}.routes'
        {{/each}}{{removeLine}}
      
        export const routes: Routes = [
          {{#each entities}}{{removeLine}}
          ...${minStart(this.className)}Routes
          {{#if !@last}},{{/if}}{{/each}}{{removeLine}}
        ];
      destinationPath: "${destinationFolder}/src/app/"
    - fileType: "App-files"
      fileName: "app.component"
      extension: "html"
      content: |
        <div class="app-layout">
          <app-sidebar [entities]="entities" [views]="views"></app-sidebar>
            <div class="main-content">
              <router-outlet></router-outlet>
            </div>
        </div>
      destinationPath: "${destinationFolder}/src/app/"
    - fileType: "App-files"
      fileName: "app.component"
      extension: "css"
      content: |
        .app-layout {
          display: flex;
          height: 100vh;
          font-family: sans-serif;
        }

        app-sidebar {
          width: 220px;
          flex-shrink: 0;
          border-right: 1px solid #e5e7eb;
          background-color: #fff;
          height: 100vh;
          padding: 1rem;
        }

        .main-content {
          flex-grow: 1;
          padding: 0.5rem 2rem 2rem 2rem;
          background-color: #f9fafb;
          overflow-y: auto;

        }
      destinationPath: "${destinationFolder}/src/app/"
    - fileType: "Environment-file"
      fileName: "environment"
      extension: "ts"
      content: |
          export const environment = {
          {{tab}}production: false,
          {{tab}}apiUrl: 'http://localhost:8070/${toKebabCase(projectName)}'
          };
      destinationPath: "${destinationFolder}/src/environments/"
    - fileType: "Environment-file"
      fileName: "environment.prod"
      extension: "ts"
      content: |
        export const environment = {
        {{tab}}production: true,
        {{tab}}apiUrl: 'http://localhost:8070/${toKebabCase(projectName)}'
        };
      destinationPath: "${destinationFolder}/src/environments/"
    - fileType: "Utilities"
      fileName: "utilities"
      extension: "ts"
      content: |
        import Swal from 'sweetalert2';


        export function warnMeUp(title:string,text:string,color:string='#ff0000',icon: 'success' | 'error' | 'warning' | 'info' | 'question' = 'error')
          {
            Swal.fire({
            title: title,
            text: text,
            icon: icon,
            confirmButtonText: 'close',
            confirmButtonColor: color
          });
        }
        export function objectToRecord<T extends object>(obj: T): Record<string, any> {
          const record: Record<string, any> = {};
        
          Object.entries(obj).forEach(([key, value]) => {
            if (value && typeof value === 'object' && !Array.isArray(value)) {
              const entries = Object.entries(value);
              if (entries.length >= 2) {
                record[key] = entries[1][1];
              } else if (entries.length === 1) {
                record[key] = entries[0][1];
              } else {
              record[key] = '';
              }
            } else {
            record[key] = value;
            }
          });
          return record;
        }
        export  function expandSeparatorNotation(flatObj: Record<string, any>,separator:string): any {
          const result: any = {};
        
          for (const key in flatObj) {
            if (!flatObj.hasOwnProperty(key)) continue;
            
              const value = flatObj[key];
              const keys = key.split(separator);
              let current = result;
              
              keys.forEach((part, index) => {
                if (index === keys.length - 1) {
                current[part] = value;
                } else {
                if (!current[part]) current[part] = {};
                current = current[part];
                }
              });
            }
          return result;
        }
        export function recursiveObjectsTo2DArray(data: Record<string, any>[]): any[][] {
          if (data.length === 0) return [];
        
          const allKeys: string[] = [];
          for (let i = 0; i < data.length; i++) {
            const obj = data[i];
            for (const key in obj) {
              if (!allKeys.includes(key)) {
                allKeys.push(key);
              }
            }
          }
          const result: any[][] = [];
          for (let i = 0; i < data.length; i++) {
            const row: any[] = [];
            const obj = data[i];
          
            for (let j = 0; j < allKeys.length; j++) {
              const key = allKeys[j];
              const value = obj[key];
              row.push(extractSecondValueIfObject(value));
            }
            result.push(row);
          }
          return result;
        }
        
        function extractSecondValueIfObject(value: any): any {
            if (value !== null && typeof value === 'object' && !Array.isArray(value)) {
            const values = Object.values(value);
            return values.length >= 2 ? values[1] : values[0];
          }
          return value;
        }

        
        export  function expandDotNotation(flatObj: Record<string, any>): any {
          const result: any = {};

          for (const key in flatObj) {
            if (!flatObj.hasOwnProperty(key)) continue;

            const value = flatObj[key];
            const keys = key.split('.');
            let current = result;

            keys.forEach((part, index) => {
              if (index === keys.length - 1) {
                current[part] = value;
              } else {
                if (!current[part]) current[part] = {};
                current = current[part];
              }
            });
          }

          return result;
        }
        export function cleanObject<T>(obj: Partial<T>): Partial<T> {
          if (typeof obj !== 'object' || obj === null) {
            return obj;
          }

          const entries = Object.entries(obj)
            .map(([key, value]) => {
              if (value && typeof value === 'object' && !Array.isArray(value)) {
                const cleanedValue = cleanObject(value);
                if (Object.keys(cleanedValue).length === 0) {
                  return null;
                }
                return [key, cleanedValue];
              }
              if (value !== '' && value !== undefined && value !== null) {
                return [key, value];
              }
              return null;
            })
            .filter((entry): entry is [string, any] => entry !== null);

          return Object.fromEntries(entries) as Partial<T>;
        }
      destinationPath: "${destinationFolder}/src/utilities/"
  components:
    - componentType: "list"
      generateForView: true
      router:
        link: "/${toKebabCase(className)}s"
        label: "${formatReadable(classNameLink)}"
      importFile: |
        import { Component, OnInit, OnDestroy } from '@angular/core';
        import { CommonModule } from '@angular/common';
        import { HttpClientModule } from '@angular/common/http';
        import { takeUntil } from 'rxjs/operators';
        import { Subject ,forkJoin} from 'rxjs';
        
        import { expandDotNotation,recursiveObjectsTo2DArray,warnMeUp } from '../../../../utilities/utilities';
        
        import { DynamicSearchFormComponent, SearchField } from '../../../shared/dynamic-search-form/dynamic-search-form.component';
        import { TableauComponent } from '../../../shared/tableau/tableau.component';
        import { PaginationComponent } from '../../../shared/pagination/pagination.component';
        import { PageHeaderComponent } from '../../../shared/page-header/page-header.component';
        import { LoadingIconComponent } from '../../../shared/loading-icon/loading-icon.component';
        
        import { ${className} } from '../models/${toKebabCase(className)}.model'
        import { ${className}Service } from '../services/${toKebabCase(className)}.service'
        
        {{#each fieldsFK}}
        import {${toPascalCase(this.type)}} from '../../${toKebabCase(this.type)}/models/${toKebabCase(this.type)}.model'
        import {${toPascalCase(this.type)}Service} from '../../${toKebabCase(this.type)}/services/${toKebabCase(this.type)}.service'
        {{/each}}
      selector: "app-${toKebabCase(className)}-list"
      standalone: true
      importComponent: "[CommonModule, HttpClientModule, DynamicSearchFormComponent, PaginationComponent,TableauComponent,PageHeaderComponent,LoadingIconComponent]"
      template: "./${toKebabCase(className)}-list.component.html"
      style: "./${toKebabCase(className)}-list.component.css"
      export: |
        export class ${majStart(className)}ListComponent implements OnInit, OnDestroy {
            
            private destroy$ = new Subject<void>();
            
            data:any[][]=[];
            
            sortOrientation: boolean=true;
            sortColumn=0;
        
            columns =[{{#each fields}}{{#if this.isNotForeignKey}}'${this.name}'{{elseIf this.isForeignKey}}'${this.type}'{{/if}}{{#if !@last}},{{/if}}{{/each}}];
        
            ${minStart(className)}s: ${majStart(className)}[] = [];
            
            {{#each fieldsFK}}{{removeLine}}
            ${minStart(this.type)}s: ${majStart(this.type)}[] = []; 
            {{/each}}{{removeLine}}
            
            totalItems: number = 1000;
            currentPage: number=1;
            itemNumber: number=12;
        
            formValueAttribute: Record<string, any> = {};
            isLoading: boolean = false;
        
            searchFields: SearchField[] = [
            {{tab}}{{tab}}{{#each fieldsFK}}
                {
                  key: '${this.name}.${this.referencedColumn}',
                  label: '${this.type}',
                  type: 'select',
                  options: []
                },
            {{tab}}{{tab}}{{/each}}{{removeLine}}
            {{tab}}{{tab}}{{#each fieldsNotFK}}
                {{#if this.isPrimaryKey}}
                { key: '${this.name}', label: '${formatReadableLowerCase(this.name)}', type: 'text' }{{elseIf this.isText}}
                { key: '${this.name}', label: '${formatReadableLowerCase(this.name)}', type: 'text' }{{elseIf this.isNumeric }}
                { key: '${this.name}Min', label: '${formatReadableLowerCase(this.name)}Min', type: 'number' },{ key: '${this.name}Max', label: '${formatReadableLowerCase(this.name)}Max', type: 'number' }{{elseIf this.isDate }}
                { key: '${this.name}Min', label: '${formatReadableLowerCase(this.name)}Min', type: 'date' },{ key: '${this.name}Max', label: '${formatReadableLowerCase(this.name)}Max', type: 'date' }{{/if}}
            {{tab}}{{tab}}{{#if !@last}},{{/if}}{{/each}}
            ];
        
            sort(columnIndex:number,sortOrientation:boolean){
                this.sortOrientation=sortOrientation;
                this.sortColumn=columnIndex;
                const mappedValue = expandDotNotation(this.formValueAttribute);
                const sortParam=this.columns[this.sortColumn]+','+(this.sortOrientation?'asc':'desc');
                this.load${majStart(className)}s(mappedValue,sortParam);
            }
        
            onNumberRowChange(lineNumber:number):void
            {
              this.itemNumber=Number(lineNumber);
              this.onSearch(this.formValueAttribute);
            }
            onPageRangeChange(page:number): void {
                  this.currentPage =page;
                  this.onSearch(this.formValueAttribute);
            }
        
            onSearch(formValue: any): void {
              this.formValueAttribute=formValue
              const mappedValue = expandDotNotation(formValue);
              this.load${majStart(className)}s(mappedValue);
            }
             
             constructor(
                {{#each fieldsFK}}{{removeLine}}
                 private ${minStart(this.type)}Service: ${majStart(this.type)}Service ,
                {{/each}}{{removeLine}}
                private ${minStart(className)}Service: ${majStart(className)}Service
             ) {}
        
            load${majStart(className)}s(criteria: Partial<${majStart(className)}> = {},sortParam:string=this.columns[this.sortColumn]+',asc;'): void {
                this.isLoading = true;
                this.${minStart(className)}Service.search${majStart(className)}s(criteria, this.currentPage-1, this.itemNumber,sortParam).pipe(takeUntil(this.destroy$)).subscribe({
                next: (${minStart(className)}s: ${majStart(className)}[]) => {
                        this.${minStart(className)}s = ${minStart(className)}s;
                        this.data=recursiveObjectsTo2DArray(${minStart(className)}s);
                        this.isLoading = false;
              },
                error: (err) => {
                  console.error('error while searching data :', err);
                  warnMeUp('error','error while fetching data');
                  this.isLoading = false;
              }
              });
            }
            {{#if !isView}}{{removeLine}}
            delete${majStart(className)} = (line: any[]) => {
              const id = line[0];
              this.${minStart(className)}Service.delete${majStart(className)}ById(id.toString()).pipe(takeUntil(this.destroy$)).subscribe({
                  next: () => {
                      this.data = this.data.filter(d => d[0] !== id);
                      this.${minStart(className)}s = this.${minStart(className)}s.filter(c => c.{{#each fieldsPK}}${this.name}{{/each}} !== id);
                      warnMeUp('success','line of data deleted successfully','#28a745','success')  
                  },
                    error: (err) => {
                      console.error('error while deleting data :', err);
                      warnMeUp('error','error while deleting data');
                  }
                });
            }
            {{/if}}
            
            {{#if containsForeignKey}}
            ngOnInit(): void {
                  this.load${majStart(className)}s();
                  this.isLoading = true;
                  forkJoin([
                      {{#each fieldsFK}}{{removeLine}}
                      this.${minStart(this.type)}Service.get${majStart(this.type)}s(),
                      {{/each}}{{removeLine}}
                  ]).pipe(takeUntil(this.destroy$)).subscribe({
                      next: ([{{#each fieldsFK}}${minStart(this.type)}s,{{/each}}]) => {
                          {{#each fieldsFK}}
                          this.${minStart(this.type)}s = ${minStart(this.type)}s;
                          const ${minStart(this.type)}Field = this.searchFields.find(f => f.key === '${this.name}.${this.referencedColumn}');
                          if (${minStart(this.type)}Field) {
                            ${minStart(this.type)}Field.options = this.${minStart(this.type)}s.map(d => {const entries = Object.entries(d); return {value: d.${this.referencedColumn},label: entries[1][1]};}); 
                          }
                          {{/each}}
                          this.isLoading = false;
                      },
                      error: (err) => {
                          warnMeUp('error','error while collecting datas');
                          this.isLoading = false;
                      }
                  });
            }
            {{else}}{{removeLine}}
            ngOnInit(): void {
                  this.load${majStart(className)}s();
            }
            {{/if}}{{removeLine}}
            
            ngOnDestroy() {
                this.destroy$.next();
                this.destroy$.complete();
            } 
        
        }
      destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(className)}/${toKebabCase(className)}-list"
      componentName: "${toKebabCase(className)}-list.component"
      componentAdditionalFiles:
        - fileType: "html template"
          fileName: "${toKebabCase(className)}-list.component"
          extension: "html"
          content: |
            <app-page-header name="${formatReadable(classNameLink)}" [isView]=${isView}></app-page-header>
            <app-dynamic-search-form [searchFields]="searchFields" [onSubmitFn]="onSearch.bind(this)" [onRowsChange]="onNumberRowChange.bind(this)"></app-dynamic-search-form>
            <br>
            <app-tableau [sortFn]="sort.bind(this)" [colonnes]="columns" [donnees]="data" {{#if !isView}}[deleteFn]="delete${majStart(className)}"{{/if}} [isView]=${isView} {{#if !isView}}routeToDetail="${toKebabCase(className)}s/details" routeToModify="${toKebabCase(className)}s/modify"{{/if}}></app-tableau>
            <app-loading-icon [isLoading]="isLoading"></app-loading-icon>
            <app-pagination [totalItems]="totalItems" [currentPage]="currentPage"  [itemsPerPage]="itemNumber" [onPageRangeChange]="onPageRangeChange.bind(this)"> </app-pagination>
          destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(className)}/${toKebabCase(className)}-list"
        - fileType: "css template"
          fileName: "${toKebabCase(className)}-list.component"
          extension: "css"
          content: |
            {{newline}}
          destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(className)}/${toKebabCase(className)}-list"
        - fileType: "Entity Routes"
          fileName: "${toKebabCase(className)}.routes"
          extension: "ts"
          content: |
            import { Routes } from '@angular/router';
            export const ${minStart(className)}Routes: Routes = [
              {
                path: '${toKebabCase(className)}s',
                loadComponent: () => import('./${toKebabCase(className)}-list/${toKebabCase(className)}-list.component').then(m => m.${majStart(className)}ListComponent )
              }{{#if !isView}},
              {
                path: '${toKebabCase(className)}s/add',
                loadComponent: () => import('./${toKebabCase(className)}-form/${toKebabCase(className)}-form.component').then(m => m.${majStart(className)}FormComponent)
              },
              {
                path: '${toKebabCase(className)}s/details/:id',
                loadComponent: () => import('./${toKebabCase(className)}-details/${toKebabCase(className)}-details.component').then(m => m.${majStart(className)}DetailsComponent)
              },
              {
                path: '${toKebabCase(className)}s/modify/:id',
                loadComponent: () => import('./${toKebabCase(className)}-form/${toKebabCase(className)}-form.component').then(m => m.${majStart(className)}FormComponent)
              }{{/if}}
            ];
          destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(className)}"
    - componentType: "form"
      router:
        link: " "
        label: " "
      importFile: |
        import { Component, OnInit, OnDestroy } from '@angular/core';
        import { CommonModule } from '@angular/common';
        import { HttpClientModule } from '@angular/common/http';
        import { ReactiveFormsModule, FormGroup } from '@angular/forms';
        import { Subject, forkJoin, takeUntil } from 'rxjs';
        import { ActivatedRoute } from '@angular/router';
      
        import { DynamicFieldComponent, FieldConfig } from '../../../shared/dynamic-field/dynamic-field.component';
        import { DynamicFormComponent } from '../../../shared/dynamic-form/dynamic-form.component';
        import { LinkButtonComponent } from '../../../shared/link-button/link-button.component';
        import { PageHeaderComponent } from '../../../shared/page-header/page-header.component';
        import { LoadingIconComponent } from '../../../shared/loading-icon/loading-icon.component';
        import { warnMeUp } from '../../../../utilities/utilities';


        
        import { ${className} } from '../models/${toKebabCase(className)}.model'
        import { ${className}Service } from '../services/${toKebabCase(className)}.service'

        {{#each fieldsFK}}
        import {${toPascalCase(this.type)}} from '../../${toKebabCase(this.type)}/models/${toKebabCase(this.type)}.model'
        import {${toPascalCase(this.type)}Service} from '../../${toKebabCase(this.type)}/services/${toKebabCase(this.type)}.service'
        {{/each}}
      selector: "app-${toKebabCase(className)}-form"
      generateForView: false
      standalone: true
      importComponent: "[CommonModule, HttpClientModule, ReactiveFormsModule, DynamicFieldComponent, LoadingIconComponent, PageHeaderComponent, LinkButtonComponent, DynamicFormComponent]"
      template: "./${toKebabCase(className)}-form.component.html"
      style: "./${toKebabCase(className)}-form.component.css"
      export: |
        export class ${majStart(className)}FormComponent implements OnInit, OnDestroy 
        {
          private destroy$ = new Subject<void>();
          isLoading: boolean = false;
          form: FormGroup = new FormGroup({});
          formUpdate:boolean=false;
          validationErrors:any;
        
          id:string ='';
          ${minStart(className)}ToUpdate?: ${majStart(className)};
          {{#each fieldsFK}}{{removeLine}}
          ${minStart(this.type)}s: ${majStart(this.type)}[] = []; 
          {{/each}}{{removeLine}}
        
          fields: FieldConfig[] = [
            {{tab}}{{tab}}{{#each fieldsFK}}
              { type: 'select', name: '${this.name}', label: '${this.type}', options: [] },
            {{tab}}{{tab}}{{/each}}{{removeLine}}
            {{tab}}{{tab}}{{#each simpleFields}}
            {{#if this.isText}}{{removeLine}}
              { type: 'text', name: '${this.name}', label: '${formatReadableLowerCase(this.name)}' }{{elseIf this.isNumeric }}
              { type: 'number', name: '${this.name}', label: '${formatReadableLowerCase(this.name)}' }{{elseIf this.isDate }}
              { type: 'date', name: '${this.name}', label: '${formatReadableLowerCase(this.name)}' }{{/if}}{{#if !@last}},{{/if}}
              {{tab}}{{/each}}{{removeLine}}
          ];
  

          constructor(
                private route: ActivatedRoute,
                {{#each fieldsFK}}{{removeLine}}
                 private ${minStart(this.type)}Service: ${majStart(this.type)}Service ,
                {{/each}}{{removeLine}}
                private ${minStart(className)}Service: ${majStart(className)}Service
          ){}
          
          submit(): void {
              this.isLoading = true;
              {{#each fieldsFK}}{{removeLine}}
              this.form.value.${this.name}=JSON.parse(this.form.value.${this.name});
              {{/each}}{{removeLine}}
              var ${minStart(className)}: ${majStart(className)} = this.form.value;
              const serviceCall = this.formUpdate?this.${minStart(className)}Service.update${majStart(className)}(${minStart(className)} ,this.id):this.${minStart(className)}Service.create${majStart(className)}(${minStart(className)});
              serviceCall.pipe(takeUntil(this.destroy$))
              .subscribe({
                next: res => {
                  warnMeUp('Success', '${majStart(className)} created successfully','#28a745','success');
                  this.form.reset();
                  this.validationErrors={};
                  this.isLoading = false;
                },
                  error: err => {
                    warnMeUp('error', 'Error while making a move on ${minStart(className)} ');
                    const apiErrors = err.error?.errors;
                    this.validationErrors=apiErrors;
                    this.isLoading = false;
                }
              });
          }
          
            load${majStart(className)}(id: string): void {
                  this.isLoading = true;
                  this.${minStart(className)}Service.get${majStart(className)}ById(id)
                      .pipe(takeUntil(this.destroy$))
                      .subscribe({
                      next: (${minStart(className)}: ${majStart(className)}) => {
                          this.${minStart(className)}ToUpdate = ${minStart(className)};
                          this.isLoading = false;
                        },
                      error: (err) => {
                          console.error('Error while loading ${minStart(className)}:', err);
                          warnMeUp('error', 'Error while fetching ${minStart(className)}');
                          this.isLoading = false;
                        }
                    });
            }

            {{#if containsForeignKey}}
            ngOnInit(): void {
                const ${minStart(className)}Id = this.route.snapshot.paramMap.get('id');
                if (${minStart(className)}Id) {
                  this.id=${minStart(className)}Id;
                  this.formUpdate=true
                  this.load${majStart(className)}(${minStart(className)}Id);
                }
                this.isLoading = true;
                forkJoin([
                    {{#each fieldsFK}}{{removeLine}}
                    this.${minStart(this.type)}Service.get${majStart(this.type)}s(),
                     {{/each}}{{removeLine}}
                 ]).pipe(takeUntil(this.destroy$)).subscribe({
                      next: ([{{#each fieldsFK}}${minStart(this.type)}s,{{/each}}]) => {
                          {{#each fieldsFK}}
                          this.${minStart(this.type)}s = ${minStart(this.type)}s;
                          const ${minStart(this.type)}Field = this.fields.find(f => f.name === '${this.name}');
                          if (${minStart(this.type)}Field) {
                            ${minStart(this.type)}Field.options = this.${minStart(this.type)}s.map(d => {const entries = Object.entries(d); return {value: JSON.stringify(d),label: entries[1][1]};}); 
                          }
                          {{/each}}
                          this.isLoading = false;
                      },
                      error: (err) => {
                          warnMeUp('error','error while collecting data');
                          this.isLoading = false;
                      }
                  });
            }
            {{else}}{{removeLine}}
            ngOnInit(): void {
              const ${minStart(className)}Id = this.route.snapshot.paramMap.get('id');
