- id: 1
  languageId: 1
  coreFramework: "Angular"
  name: "Angular App"
  template: "Angular-template"
  initPath: "angular/angular-skeletoon"
  componentExtension: "ts"
  additionalFiles:
    - fileType: "App-files"
      fileName: "app.component"
      extension: "ts"
      content: | 
        content0
      destinationPath: "${destinationFolder}/src/app/"
    - fileType: "App-files"
      fileName: "app.component"
      extension: "html"
      content: |
        content1
      destinationPath: "${destinationFolder}/src/app/"
    - fileType: "App-files"
      fileName: "app.component"
      extension: "css"
