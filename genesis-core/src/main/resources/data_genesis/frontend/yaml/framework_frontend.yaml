              <!-- ${formatReadable(this.name)} FK -->
              <GenesisSelectSearch
                label="${formatReadable(this.name)}"
                v-if="${minStart(this.type)}SearchField?.selectSearch"
                :placeholder="'-- Search ${minStart(this.type)} by '+${majStart(this.type)}.getReferenceKey()"
                :default-value="${minStart(this.type)}DefaultValue"
                :search-function="${minStart(this.type)}SearchField?.selectSearch"
                @option-selected="(selectedValue) => (formModel.${minStart(this.name)} = selectedValue)"
              />
              {{else}}
              <!-- ${formatReadable(this.name)} -->
              <GenesisInput
                label="${formatReadable(this.name)}"
                placeholder="Entrer ${formatReadable(this.name)}"
                type="${this.uiType}"
                v-model="formModel.${minStart(this.name)}"
              />
              {{/if}}
              {{/each}}{{removeLine}}

              <!-- Action buttons -->
              <div class="flex justify-end gap-3 mt-6">
                <GenesisButton
                  type="submit"
                  class="btn btn-primary text-white"
                  :label="submitLabel"
                />
                <GenesisButton @click="cancelForm" class="btn btn-secondary" label="Cancel" />
              </div>
            </form>
          </div>
        </div>
      style: "{{removeLine}}"
      export: |
        const props = defineProps<{
          ${minStart(EntityName)}?: ${majStart(EntityName)},
          submitLabel?: string
        }>();

        const emit = defineEmits<{
          (e: 'submit', payload: Partial<${majStart(EntityName)}FormDTO>): void,
          (e: 'cancel', payload: Partial<${majStart(EntityName)}FormDTO>): void
        }>();

        const formModel = ref<Partial<${majStart(EntityName)}FormDTO>>({ ...${majStart(EntityName)}FormDTO.parse(props.${minStart(EntityName)}) });

        {{#each fieldsFK}}
        const ${minStart(this.type)}SearchField = ${majStart(EntityName)}.getSearchFieldByKey('${minStart(this.name)}');
        const ${minStart(this.type)}DefaultValue = props.${minStart(EntityName)}
        ? (props.${minStart(EntityName)}?.${this.name}?.getReferenceValue?.() ?? '')
        : ''
        {{/each}}

        function handleSubmit() {
          emit('submit', formModel.value);
        }

        function cancelForm() {
          emit('cancel', formModel.value);
        }
      destinationPath: "${destinationFolder}/src/entities/${minStart(EntityName)}"
      componentAdditionalFiles: [ ]

    - componentType: "Update View"
      generateForView: false
      router:
        link: "/${minPluralize(EntityName)}/update/:id"
        label: "{{removeLine}}"
      componentName: "${majStart(EntityName)}UpdateView"
      importFile: |
        import { ref, onMounted } from "vue";
        import { useRoute } from "vue-router";
        import ${majStart(EntityName)}Form from "@/entities/${minStart(EntityName)}/${majStart(EntityName)}Form.vue";
        import AlertPopup from "@/core/popup/AlertPopup.vue";
        import { use${majPluralize(EntityName)} } from "@/composables/use${majPluralize(EntityName)}";
        import { ${majStart(EntityName)}, ${majStart(EntityName)}FormDTO } from "@/models/${majStart(EntityName)}Model";
        import { usePopup } from "@/composables/usePopup";
        import GenesisButton from "@/core/button/GenesisButton.vue";
        import LeftArrowIcon from "@/core/icons/LeftArrowIcon.vue";
        import { useFreezeScreen } from '@/stores/useFreezeScreen.ts'
      selector: "${majStart(EntityName)}UpdateView"
      standalone: true
      importComponent: "{{removeLine}}"
      template: |
          <div class="w-full">
            <!-- Header -->
            <div class="flex items-center justify-between mb-6">
              <h3 class="text-xl font-semibold">
                ${majStart(EntityName)} /
                <span class="text-gray-500 font-normal">Update</span>
              </h3>
              <GenesisButton title="Back to list" @click="goToListView" class="btn-primary">
                <LeftArrowIcon />
                Back to list
              </GenesisButton>
            </div>

            <!-- Form -->
            <div v-if="entity">
              <${minStart(EntityName)}-form
                :${minStart(EntityName)}="entity"
                submit-label="Update ${majStart(EntityName)}"
                @submit="updateHandler"
                @cancel="cancelHandler"
              />
            </div>

            <!-- Alert -->
            <AlertPopup
              :message="message ?? undefined"
              title="Error 500"
              :visible="alertPopup"
              @close="closePopup"
            />
          </div>
      style: "{{removeLine}}"
      export: |
        /** Route params */
        const route = useRoute()
        const pathId = Number(route.params.id)

        /** Alert popup */
        const { closePopup, openPopup, visible: alertPopup } = usePopup()

        /** Composable */
        const { get${majStart(EntityName)}ById, goToListView, update${majStart(EntityName)}, view${majStart(EntityName)}, message } = use${majPluralize(EntityName)}()

        /** Entity reference */
        const entity = ref<${majStart(EntityName)} | null>(null)

        const freezeStore = useFreezeScreen()
        /** Update handler */
        const updateHandler = async (formDTO: Partial<${majStart(EntityName)}FormDTO>) => {        
          freezeStore.freeze('Updating ${minStart(EntityName)} '+pathId+' ...')
          try {
            const data = await update${majStart(EntityName)}(pathId, formDTO)
            if (data && !message.value) view${majStart(EntityName)}(data)
            else throw new Error(String(message.value))
          } catch (error:unknown) {
            console.error(error)
            openPopup()
          } finally {
            freezeStore.unfreeze()
          }
        }
        
        /** On cancel Handler */
        const cancelHandler = () => {
          if (entity.value){
            view${majStart(EntityName)}(entity.value)
          }
        }

        /** Fetch entity on mount */
        onMounted(async () => {
          const result = await get${majStart(EntityName)}ById(pathId)
          if (result.data){
              entity.value = result.data
          }
          else {
            openPopup()
          }
        
        })
      destinationPath: "${destinationFolder}/src/views/${minStart(EntityName)}"
      componentAdditionalFiles: [ ]

    - componentType: "Create View"
      generateForView: false
      router:
        link: "/${minPluralize(EntityName)}/create"
        label: "Create ${majStart(EntityName)}"
      componentName: "${majStart(EntityName)}CreateView"
      importFile: |
        import ${majStart(EntityName)}Form from "@/entities/${minStart(EntityName)}/${majStart(EntityName)}Form.vue";
        import AlertPopup from "@/core/popup/AlertPopup.vue";
        import GenesisButton from "@/core/button/GenesisButton.vue";
        import LeftArrowIcon from "@/core/icons/LeftArrowIcon.vue";
        import { ${majStart(EntityName)}FormDTO } from "@/models/${majStart(EntityName)}Model";
        import { use${majPluralize(EntityName)} } from "@/composables/use${majPluralize(EntityName)}";
        import { usePopup } from "@/composables/usePopup";
        import { useFreezeScreen } from "@/stores/useFreezeScreen";
      selector: "${majStart(EntityName)}CreateView"
      standalone: true
      importComponent: "{{removeLine}}"
      template: |
        <div class="w-full">
          <div class="flex items-center justify-between mb-6">
            <h3 class="text-xl font-semibold">
              ${majStart(EntityName)} /
              <span class="text-gray-500 font-normal">New</span>
            </h3>
            <GenesisButton title="Back to list" @click="goToListView" class="btn-primary">
              <LeftArrowIcon />
              Back to list
            </GenesisButton>
          </div>

          <${minStart(EntityName)}-form
            submit-label="Save ${majStart(EntityName)}"
            @submit="createHandler"
            @cancel="goToListView"
          />

          <AlertPopup
            :message="message ?? undefined"
            title="Error 500"
            :visible="alertPopup"
            @close="closePopup"
          />
        </div>
      style: "{{removeLine}}"
      export: |
        const { create${majStart(EntityName)}, goToListView, message, view${majStart(EntityName)} } = use${majPluralize(EntityName)}()
        const { openPopup, closePopup, visible: alertPopup } = usePopup()
        const freezeStore = useFreezeScreen()

        const createHandler = async (formDTO: Partial<${majStart(EntityName)}FormDTO>) => {
          freezeStore.freeze("Creating a new ${majStart(EntityName)} ...")
          try {
            const data = await create${majStart(EntityName)}(formDTO)
            if (data && !message.value) view${majStart(EntityName)}(data)
            else throw new Error(String(message.value))
          } catch (error: unknown) {
            console.error(error)
            openPopup()
          } finally {
            freezeStore.unfreeze()
          }
        }
      destinationPath: "${destinationFolder}/src/views/${minStart(EntityName)}"
      componentAdditionalFiles: [ ]

  serviceComponent:
    name: "${majStart(EntityName)}Service"
    destinationPath: "${destinationFolder}/src/services"
    imports: |
      import useRestApi from "@/composables/useRestApi";
      import RestResponse from "@/models/api/RestResponseModel";
      import { type IPageResponse } from "@/models/api/PageResponseModel";
      import {
        PaginationRequestParameter,
        RequestModel,
        SortFieldParameter,
      } from "@/models/api/RequestModel";
      import { ${majStart(EntityName)} } from "@/models/${majStart(EntityName)}Model";
      import type { DataResponse, PagedDataResponse } from "@/models/api/DataResponseModel";
    methods: |
      const restApiWithPage = useRestApi<IPageResponse<${majStart(EntityName)}>>();
      const restApi = useRestApi<${majStart(EntityName)}>();
      const BASE_URL = "/${lowerCase(classNameLink)}";

      /** Helper to wrap response data in ${majStart(EntityName)} instances */
      function wrap${majStart(EntityName)}(
        response: DataResponse<${majStart(EntityName)}> | PagedDataResponse<${majStart(EntityName)}>
      ) {
        if (Array.isArray(response.data)) {
          response.data = response.data.map((r) => new ${majStart(EntityName)}(r));
        } else if (response.data && typeof response.data === "object") {
          response.data = new ${majStart(EntityName)}(response.data);
        }
        return response;
      }

      /** GET all with pagination */
      export async function getAll(
        pagination?: PaginationRequestParameter,
        sortFields?: SortFieldParameter[]
      ) {
        const request = new RequestModel(BASE_URL, pagination, sortFields);
        const response = await restApiWithPage.GET(request.buildRequestUrl());
        return wrap${majStart(EntityName)}(RestResponse.handlePagedResponse<${majStart(EntityName)}>(response)) as PagedDataResponse<${majStart(EntityName)}>;
      }
      
      /** POST search with pagination */
      export async function search(
        data: Partial<${majStart(EntityName)}>,
        pagination?: PaginationRequestParameter,
        sortFields?: SortFieldParameter[]
      ) {
        const request = new RequestModel(BASE_URL+'/search', pagination, sortFields);
        const response = await restApiWithPage.POST(request.buildRequestUrl(), data);
        return wrap${majStart(EntityName)}(RestResponse.handlePagedResponse<${majStart(EntityName)}>(response)) as PagedDataResponse<${majStart(EntityName)}>;
      }

      /** GET by ID */
      export async function getById(id: number | string | undefined) {
        if (!id) throw new Error("getById: id is required");
        const response = await restApi.GET(BASE_URL+'/'+id);
        return wrap${majStart(EntityName)}(RestResponse.handleDataResponse<${majStart(EntityName)}>(response)) as DataResponse<${majStart(EntityName)}>;
      }
      {{#if isView}}
      {{removeLine}}
      {{else}}
      /** POST create */
      export async function create(data: Partial<${majStart(EntityName)}>) {
        const response = await restApi.POST(BASE_URL, data);
        return wrap${majStart(EntityName)}(RestResponse.handleDataResponse<${majStart(EntityName)}>(response)) as DataResponse<${majStart(EntityName)}>;
      }

      /** PUT update */
      export async function update(id: number | string | undefined, data: Partial<${majStart(EntityName)}>) {
        if (!id) throw new Error("update: id is required");
        const response = await restApi.PUT(BASE_URL+'/'+id, data);
        return wrap${majStart(EntityName)}(RestResponse.handleDataResponse<${majStart(EntityName)}>(response)) as DataResponse<${majStart(EntityName)}>;
      }

      /** DELETE remove */
      export async function remove(id: number | string | undefined) {
        if (!id) throw new Error("remove: id is required");
        const response = await restApi.DELETE(BASE_URL+'/'+id);
        return {
          success: response.returnCode === 1,
          error: response.returnCode !== 1 ? response.message : null,
        };
      }
      {{/if}}

  modelComponent:
    imports: |
      import { BaseModel } from "./BaseModel";
      import { type EntitySearchField } from './EntityModel'
      {{#each fieldsFK}}
      import { ${majStart(this.type)} } from "./${majStart(this.type)}Model";
      import * as ${minStart(this.type)}Service from "@/services/${majStart(this.type)}Service";
      {{/each}}
      {{#if containsForeignKey}}
      import { createSelectSearchFunction } from './SelectOption'
      {{/if}}
    exports: |
      export interface I${majStart(EntityName)} {
        {{#each fields}}
        {{#if this.isForeignKey}}
        ${minStart(this.name)}?: ${majStart(this.type)};
        {{elseIf this.isPrimaryKey}}
        ${minStart(this.name)}?: ${this.typeBase};
        {{else}}
        ${minStart(this.name)}?: ${this.typeBase};
        {{/if}}{{removeLine}}
        {{/each}}
      }

      export class ${majStart(EntityName)} extends BaseModel implements I${majStart(EntityName)} {
        {{#each fields}}
        {{#if this.isForeignKey}}
        ${minStart(this.name)}?: ${majStart(this.type)};
        {{elseIf this.isPrimaryKey}}
        ${minStart(this.name)}?: ${this.typeBase};
        {{else}}
        ${minStart(this.name)}?: ${this.typeBase};
        {{/if}}{{removeLine}}
        {{/each}}

        constructor(data?: Partial<I${majStart(EntityName)}>) {
          super();
          {{#each fields}}
          {{#if this.isForeignKey}}
          this.${minStart(this.name)} = new ${majStart(this.type)}(data?.${minStart(this.name)});
          {{else}}
          this.${minStart(this.name)} = data?.${minStart(this.name)};
          {{/if}}{{removeLine}}
          {{/each}}
        }
        
        {{#each fieldsPK}}
        {{#if @first}}
        static override getKey(): string {
            return '${this.name}'
        }

        public override getKeyValue(): string {
            return String(this.${this.name})
        }
        {{/if}}
        {{/each}}
      
        static override getReferenceKey(): string {
          {{#each simpleFields}}
          {{#if @first}}return '${this.name}'{{else}}{{removeLine}}{{/if}}
          {{/each}}{{removeLine}}
        }
  
        public override getReferenceValue(): string {
          {{#each simpleFields}}
          {{#if @first}}return String(this.${this.name}){{else}}{{removeLine}}{{/if}}
          {{/each}}{{removeLine}}
        }

        protected static override searchDaoMetadata: EntitySearchField[] = [
          {{#each fields}}
          {{#if this.isForeignKey}}
          {
            key: "${this.name}",
            label: "${formatReadable(this.name)}",
            type: "select",
            searchKey: ${majStart(this.type)}.getKey(),
            sortable: false,
            selectSearch: createSelectSearchFunction(${majStart(this.type)}, ${minStart(this.type)}Service),
          },
          {{elseIf this.isPrimaryKey}}
          { key: "${this.name}", label: "${formatReadable(this.name)}", type: "${this.uiType}", sortable: true },
          {{elseIf this.isNumeric or this.isDate}}
          { key: "${this.name}", label: "${formatReadable(this.name)}", type: "${this.uiType}", sortable: true },
          { key: "${this.name}Min", label: "${formatReadable(this.name)} Min", type: "${this.uiType}", sortable: true },
          { key: "${this.name}Max", label: "${formatReadable(this.name)} Max", type: "${this.uiType}", sortable: true },
          {{else}}
          { key: "${this.name}", label: "${formatReadable(this.name)}", type: "${this.uiType}", sortable: true },
          {{/if}}{{removeLine}}
          {{/each}}
        ];
      }
      
      {{#if isView}}
      {{removeLine}}
      {{else}}
      export class ${majStart(EntityName)}FormDTO {
        {{#each fields}}
        {{#if this.isForeignKey}}
        ${minStart(this.name)}?: string;
        {{else}}
        ${minStart(this.name)}?: ${this.typeBase};
        {{/if}}{{removeLine}}
        {{/each}}

        constructor(data?: Partial<${majStart(EntityName)}FormDTO>) {
          {{#each fields}}
          {{#if this.isForeignKey}}
          this.${minStart(this.name)} = data?.${minStart(this.name)} ?? "";
          {{else}}
          this.${minStart(this.name)} = data?.${minStart(this.name)};
          {{/if}}{{removeLine}}
          {{/each}}
        }

        static parse(data?: Partial<I${majStart(EntityName)}> | I${majStart(EntityName)} | null) {
          const instance = new ${majStart(EntityName)}FormDTO();
          {{#each fields}}
          {{#if this.isForeignKey}}
          instance.${minStart(this.name)} = data?.${minStart(this.name)}?.getKeyValue()?.toString();
          {{else}}
          instance.${minStart(this.name)} = data?.${minStart(this.name)};
          {{/if}}{{removeLine}}
          {{/each}}
          return instance;
        }

        async toEntity(): Promise<Partial<${majStart(EntityName)}>> {
          const entity: Partial<${majStart(EntityName)}> = new ${majStart(EntityName)}({
            {{#each fieldsNotFK}}
            ${minStart(this.name)}: this.${minStart(this.name)},
            {{/each}}
          });

          {{#each fieldsFK}}
          if (this.${minStart(this.name)}) {
            const related = await ${minStart(this.type)}Service.getById(Number(this.${minStart(this.name)}));
            entity.${minStart(this.name)} = related.data as ${majStart(this.type)};
          }
          {{/each}}

          return entity;
        }
      }{{/if}}
    exportsComponents: |
    destinationPath: "${destinationFolder}/src/models"
    name: "${majStart(EntityName)}Model"

