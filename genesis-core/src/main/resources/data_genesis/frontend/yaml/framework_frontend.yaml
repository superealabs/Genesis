    - fileType: "Env File"
      fileName: "{{removeLine}}"
      extension: "env"
      content: |
        VITE_APP_API_URL=http://${apiUrl}:${port}/${toKebabCase(projectName)}
        VITE_APP_PORT=${frontendPort}
      destinationPath: "${destinationFolder}"

    - fileType: "Index File"
      fileName: "index"
      extension: "html"
      content: |
        <!doctype html>
        <html lang="">
          <head>
            <meta charset="UTF-8" />
            <link rel="icon" href="{{#if useFaviconLink}}${faviconUrl}{{else}}/favicon.ico{{/if}}" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>${formatReadable(projectName)}</title>
          </head>
          <body>
            <div id="app"></div>
            <div id="freeze-screen"></div>
            <script type="module" src="/src/main.ts"></script>
          </body>
        </html>
      destinationPath: "${destinationFolder}"

    - fileType: "Home View"
      fileName: "HomeView"
      extension: "vue"
      content: |
        <template>
          <div class="w-full">
            <!-- Header -->
            <div class="items-center mb-6">
              <h2 class="text-xl font-bold text-primary">{{ t('greet') }} Developer 👋</h2>
              <span class="text-gray-500">Welcome on ${upperCase(projectName)} frontend app</span>
            </div>

            <h2 class="text-xl font-bold text-neutral">List of entities</h2>
            <hr class="border-gray-200 mb-4" />
            <!-- Quick Actions -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
              {{#each entities}}
              {{#if this.isView }}
              {{removeLine}}
              {{else}}
              <div
                class="p-4 bg-base-100 shadow-md rounded-xl flex flex-col border border-gray-200 items-start"
              >
                <h3 class="font-semibold text-lg mb-2">${majStart(this.className)}s</h3>
                <ul class="menu w-full">
                  <li @click="use${majStart(this.className)}.goToListView()">
                    <span>
                      <LinkIcon />
                      View list of ${majStart(this.className)}
                    </span>
                  </li>

                  <li @click="use${majStart(this.className)}.goToCreateFormView()">
                    <span>
                      <LinkIcon />
                      Add new ${majStart(this.className)}
                    </span>
                  </li>
                </ul>
              </div>
              {{/if}}
              {{/each}}
            </div>
          </div>
        </template>

        <script setup lang="ts">
        import { useI18n } from 'vue-i18n'
        import LinkIcon from '@/core/icons/LinkIcon.vue'
        {{#each entities}}
        {{#if this.isView }}
        {{removeLine}}
        {{else}}
        import { use${majStart(this.className)}s } from '@/composables/use${majStart(this.className)}s'
        {{/if}}
        {{removeLine}}
        {{/each}}
        const { t } = useI18n({ useScope: 'global' })

        {{#each entities}}
        {{#if this.isView }}
        {{removeLine}}
        {{else}}
        const use${majStart(this.className)} = use${majStart(this.className)}s()
        {{/if}}
        {{removeLine}}
        {{/each}}{{removeLine}}
        </script>
      destinationPath: "${destinationFolder}/src/views"

    - fileType: "Navbar"
      fileName: "GenesisNavbar"
      extension: "vue"
      content: |
        <template>
          <nav
            id="sidebar"
            class="sticky top-0 h-full w-2/12 p-4 flex flex-col bg-base-100 shadow-md"
          >
            <!-- Brand -->
            <div class="text-center flex justify-center gap-2 items-center mb-6 uppercase">
              <LogoIcon
                {{#if useLogoLink}}
                src="${logoUrl}"
                {{else}}
                :src="logo"
                {{/if}}
                alt="Branding Logo"
                width="60"
              />
              <h1 class="text-2xl font-semibold">
                ${majStart(projectName)}
                <span class="text-primary">App</span>
              </h1>
            </div>

            <!-- Navigation -->
            <ul class="menu flex-col flex flex-nowrap w-full overflow-y-auto">
              <li
                v-for="section in navigations"
                :key="section.sectionName"
                class="mb-2"
              >
                <span
                  class="menu-title font-semibold text-neutral uppercase opacity-30"
                >
                  <font-awesome-icon
                    v-if="section.icon"
                    :icon="section.icon"
                    class="mr-2"
                  />
                  {{ section.sectionName }}
                </span>
                <GenesisNavList :items="section.navChilds" />
              </li>
            </ul>

            <!-- Footer part -->
            <div class="mt-auto pt-4">
              <UserNavProfile name="John Doe" />
            </div>
          </nav>
        </template>

        <script setup lang="ts">
        import { storeToRefs } from 'pinia'
        import { useNavigationsStore } from '@/stores/useNavigationsStore'

        // Components
        import UserNavProfile from '../user/UserNavProfile.vue'
        import GenesisNavList from './GenesisNavList.vue'
        import LogoIcon from '@/core/icons/LogoIcon.vue'
        {{#if useLogoLink}}
        {{removeLine}}
        {{elseIf hasLogo}}
        import logo from '@/assets/images${logoUrl}'
        {{else}}
        import logo from '@/assets/images/logo.png'
        {{/if}}

        // Store
        const navigationsStore = useNavigationsStore()
        const { navigations } = storeToRefs(navigationsStore)
        </script>

        <style scoped>
        #sidebar {
          position: fixed; /* sticky ne peut pas dépasser le parent scrollable */
        }
        </style>

      destinationPath: "${destinationFolder}/src/core/navbar"

    - fileType: "App-Vue"
      fileName: "App"
      extension: "vue"
      content: |
        <template>
          <!-- FreezeScreen -->
          <teleport to="#freeze-screen">
            <FreezeScreen />
          </teleport>
          <div class="md:flex flex-col md:flex-row md:min-h-screen w-full">
            <!-- Sidebar -->
            <aside class="w-2/12 h-screen overflow-y-auto">
              <GenesisNavbar />
            </aside>

            <!-- Main content -->
            <main class="flex-1 overflow-y-auto bg-base-100 p-4">
              <router-view />
            </main>
          </div>
        </template>

        <script setup lang="ts">
        import GenesisNavbar from './core/navbar/GenesisNavbar.vue'
        import FreezeScreen from './core/loading/FreezeScreen.vue'
        </script>

        <style scoped>
        /* keep styling here */
        </style>
      destinationPath: "${destinationFolder}/src"

    - fileType: "Router Index"
      fileName: "index"
      extension: "ts"
      content: |
        import { createRouter, createWebHistory } from 'vue-router'
        import routes from './routes'
        import { useFreezeScreen } from '@/stores/useFreezeScreen'

        const router = createRouter({
          history: createWebHistory(import.meta.env.BASE_URL),
          routes,
        })

        router.beforeEach((to, from, next) => {
          const loading = useFreezeScreen()
          loading.freeze('Loading')
          next()
        })

        router.afterEach(() => {
          const loading = useFreezeScreen()
          setTimeout(() => loading.unfreeze(), 150) // small delay to prevent flicker
        })

        export default router
      destinationPath: "${destinationFolder}/src/router"

    - fileType: "Router Routes"
      fileName: "routes"
      extension: "ts"
      content: |
        import type { RouteRecordRaw } from 'vue-router'
        import HomeView from '@/views/HomeView.vue'
        import CustomisationView from '@/views/settings/CustomisationView.vue'

        // Entity routes
        {{#each entities}}
        import ${minStart(this.className)}Routes from './entities/${minStart(this.className)}Routes'
        {{/each}}

        const routes: Array<RouteRecordRaw> = [
          { path: '/', name: 'home', component: HomeView },
          { path: '/customisation', name: 'customisation', component: CustomisationView },
          {{#each entities}}
          ...${minStart(this.className)}Routes
          {{#if !@last}},{{/if}}
          {{/each}}
        ]
        export default routes

      destinationPath: "${destinationFolder}/src/router"

    - fileType: "Navigation Store"
      fileName: "useNavigationsStore"
      extension: "ts"
      content: |
        import { defineStore } from "pinia";
        export const useNavigationsStore = defineStore("navigations", {
          state: () => ({
            navigations: [
              // CORE NAVIGATION
              {
                icon: 'fas fa-microchip',
                sectionName: "Core",
                navChilds: [
                  {
                    navLink: "/",
                    navTitle: "Home",
                  },
                ],
              },
              // ENTITIES NAVIGATION
              {
                icon: 'fas fa-layer-group',
                sectionName: "Entities",
                navChilds: [
                  {{#each entities}}
                  {{#if this.isView = false}}
                  {
                    navTitle:"${majStart(this.className)}",
                    navChilds:[
                      {
                        navTitle: "${majStart(this.className)} List",
                        navLink: "/${minStart(this.className)}s",
                      },
                      {
                        navTitle: "Create ${majStart(this.className)}",
                        navLink: "/${minStart(this.className)}s/create",
                      },
                    ]
                  },
                  {{removeLine}}
                  {{/if}}
                  {{/each}}
                ],
              },
              // VIEWS NAVIGATION
              {
                icon: 'fas fa-box',
                sectionName: 'Views',
                navChilds: [
                  {{#each entities}}
                  {{#if this.isView}}
                  {
                    navTitle:"${majStart(this.className)}",
                    navLink: "/${minStart(this.className)}s",
                  },
                  {{removeLine}}
                  {{/if}}
                  {{/each}}
                ],
              },
              // SETTINGS NAVIGATION
              {
                icon: 'fas fa-gear',
                sectionName: 'Settings',
                navChilds: [
                  {
                    navTitle: 'Customisation',
                    navLink: '/customisation',
                  },
                ],
              },
            ],
          }),
          actions: {},
        })
      destinationPath: "${destinationFolder}/src/stores"

    - fileType: "Style Css"
      fileName: "index"
      extension: "css"
      content: |
        @import 'tailwindcss';

        @plugin "daisyui";

        /* Thème custom Genesis */
        @plugin "daisyui/theme" {
          name: 'genesis-light';
          default: true;
          prefersdark: false;
          color-scheme: light;

          --color-base-100: #fcfcfc;
          --color-base-200: oklch(98% 0 0);
          --color-base-300: oklch(95% 0 0);
          --color-base-content: oklch(21% 0.006 285.885);

          --color-primary: ${primaryColor};
          --color-primary-content: oklch(93% 0.034 272.788);

          --color-secondary: color-mix(in oklch, var(--color-primary) 15%, white);
          /* --color-secondary: ${secondaryColor}; */
          --color-secondary-content: var(--color-base-content);

          --color-accent: oklch(87% 0.15 154.449);
          --color-accent-content: oklch(38% 0.063 188.416);

          --color-neutral: #404040;
          --color-neutral-content: oklch(92% 0.004 286.32);

          --color-info: #3abff8;
          --color-info-content: oklch(29% 0.066 243.157);

          --color-success: oklch(76% 0.177 163.223);
          --color-success-content: oklch(37% 0.077 168.94);

          --color-warning: oklch(82% 0.189 84.429);
          --color-warning-content: oklch(41% 0.112 45.904);

          --color-error: #f87272;
          --color-error-content: oklch(27% 0.105 12.094);

          /* Radius & UI tokens */
          --radius-selector: 0.5rem;
          --radius-field: 0.25rem;
          --radius-box: 0.25rem;

          --size-selector: 0.25rem;
          --size-field: 0.25rem;

          --border: 1px;
          --depth: 1;
          --noise: 0;
        }

        @plugin "daisyui/theme" {
          name: 'genesis-dark';
          default: false;
          prefersdark: true;
          color-scheme: 'dark';
          --color-base-100: #1c1c1c;
          --color-base-200: #2a2a2a;
          --color-base-300: #333;
          --color-base-content: #f0f0f0;
          --color-primary: #537cc2;
          --color-primary-content: #f5f7ff;
          --color-secondary: rgba(107, 142, 214, 0.2);
          --color-secondary-content: oklch(21% 0.006 285.885);
          --color-accent: #57d9a3;
          --color-accent-content: #163229;
          --color-neutral: #d6d6d6;
          --color-neutral-content: #111;
          --color-info: #0ea5e9;
          --color-info-content: oklch(29% 0.066 243.157);
          --color-success: #22c55e;
          --color-success-content: oklch(97% 0.021 166.113);
          --color-warning: oklch(82% 0.189 84.429);
          --color-warning-content: oklch(41% 0.112 45.904);
          --color-error: oklch(71% 0.194 13.428);
          --color-error-content: oklch(27% 0.105 12.094);
          --radius-selector: 0.5rem;
          --radius-field: 0.25rem;
          --radius-box: 0.25rem;
          --size-selector: 0.25rem;
          --size-field: 0.25rem;
          --border: 1px;
          --depth: 1;
          --noise: 0;
        }
        
        ${additionalCss}

      destinationPath: "${destinationFolder}/src/assets/styles/css"
  components:
    - componentType: "Entity Row"
      generateForView: true
      router:
        label: "{{removeLine}}"
        link: ""
      importFile: |
        import type { PropType } from "vue";
        import { ${majStart(EntityName)} } from "@/models/${majStart(EntityName)}Model";
        import EntityRowActions from "@/core/table/EntityRowActions.vue";
      selector: "${majStart(EntityName)}Row"
      standalone: true
      importComponent: "{{removeLine}}"
      template: |
        <tr class="hover:bg-gray-50">
          {{#each fields}}
          {{#if this.isForeignKey}}
          <td class="px-3 py-2">{{ ${minStart(EntityName)}.${this.name}?.getReferenceValue() }}</td>
          {{else}}
          <td class="px-3 py-2">{{ ${minStart(EntityName)}.${this.name} }}</td>
          {{/if}}
          {{/each}}

