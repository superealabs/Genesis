                          const ${minStart(this.type)}Field = this.fields.find(f => f.name === '${this.name}');
                          if (${minStart(this.type)}Field) {
                            ${minStart(this.type)}Field.options = this.${minStart(this.type)}s.map(d => {const entries = Object.entries(d); return {value: JSON.stringify(d),label: entries[1][1]};}); 
