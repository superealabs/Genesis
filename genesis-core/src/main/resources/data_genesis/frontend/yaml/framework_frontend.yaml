              <div>
                <h3>${majStart(EntityName)} / <span class="text-muted">Update</span></h3>
              </div>
            </div>

            <div v-if="entity">
              <${minStart(EntityName)}-form
                :${minStart(EntityName)}="entity"
                submit-label="Update ${majStart(EntityName)}"
                @submit="updateHandler"
                @cancel="view${majStart(EntityName)}"
              ></${minStart(EntityName)}-form>
            </div>

            <AlertPopup
              :message="message ?? undefined"
              title="Error 500"
              :visible="alertPopup"
              @close="closePopup"
            ></AlertPopup>
          </div>
        </template>
      style: |
        <style scoped></style>
      export: |
        setup() {
          const route = useRoute();
          const pathId = Number(route.params.id);
          const { loading, startLoading, stopLoading } = useLoading();
          const { closePopup, openPopup, visible: alertPopup } = usePopup();

          const { get${majStart(EntityName)}ById, goToListView, update${majStart(EntityName)}, view${majStart(EntityName)}, message } = use${majPluralize(EntityName)}();
          const entity = ref<${majStart(EntityName)}FormDTO | null>(null);

          const updateHandler = async (formDTO: Partial<${majStart(EntityName)}FormDTO>) => {
            startLoading();
            const data = await update${majStart(EntityName)}(pathId, formDTO);
            if (data && !message.value) {
              view${majStart(EntityName)}(data);
            } else {
              openPopup();
            }
            stopLoading();
          };

          onMounted(async () => {
            const result = await get${majStart(EntityName)}ById(pathId);
            entity.value = ${majStart(EntityName)}FormDTO.parse(result.data) || null;
          });

          return {
            entity,
            route,
            goToListView,
            update${majStart(EntityName)},
            view${majStart(EntityName)},
            updateHandler,
            loading,
            message,
            closePopup,
            alertPopup,
          };
        }
      destinationPath: "${destinationFolder}/src/views/${minStart(EntityName)}"
      componentAdditionalFiles: [ ]

