        label: "Create ${majStart(EntityName)}"
      componentName: "${majStart(EntityName)}CreateView"
      importFile: |
        import { defineComponent } from "vue";
        import { use${majPluralize(EntityName)} } from "@/composables/use${majPluralize(EntityName)}";
        import ${majStart(EntityName)}Form from "@/entities/${minStart(EntityName)}/${majStart(EntityName)}Form.vue";
