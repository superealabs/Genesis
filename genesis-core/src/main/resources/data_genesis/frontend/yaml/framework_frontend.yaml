- id: 2
  languageId: 1
  coreFramework: "VueJs"
  name: "Vue3 + Typescript App"
  template: "Vue3TS-template"
  initPath: "vue/vue-3-ts-skeletoon"
  componentExtension: "vue"
  additionalFiles:
    - fileType: "App-Vue"
      fileName: "App"
      extension: "vue"
      content: |
        <template>
          <div class="d-flex" id="app-layout">
            <GenesisSidebar />
            <!-- Main content -->
            <div class="bg-light flex-grow-1 p-4">
              <router-view />
            </div>
          </div>
        </template>
        
        <script setup lang="ts">
        import GenesisSidebar from "./core/navbar/GenesisSidebar.vue";
        </script>
        
        <style scoped></style>
      destinationPath: "${destinationFolder}/src"

    - fileType: "Router Index"
      fileName: "index"
      extension: "ts"
      content: |
        import { createRouter, createWebHistory, RouteRecordRaw } from "vue-router";
        import HomeView from "../views/HomeView.vue";
        {{#each routes}}
        import ${this.componentName} from "${this.componentImport}";
        {{/each}}

        const routes: Array<RouteRecordRaw> = [
          {
            path: "/",
            name: "home",
            component: HomeView,
          },
          {{#each routes}}
          {
            path: "${this.routerLink}",
            name: "${lowerCase(this.componentName)}",
            component: ${this.componentName},
          },
          {{/each}}
        ];

        const router = createRouter({
          history: createWebHistory(process.env.BASE_URL),
          routes,
        });

        export default router;
      destinationPath: "${destinationFolder}/src/router"

  components:
    - componentType : "List Component"
      componentName : "${majStart(EntityName)}ListComponent"
      importFile: |
        import GenesisButton from "@/core/button/GenesisButton.vue";
        import { ${majStart(EntityName)} } from "@/shared/models/${majStart(EntityName)}Model";
        import { defineComponent, PropType } from "vue";
      selector: "${majStart(EntityName)}List"
      standalone : true
      routerLink: ""
      importComponent : |
        GenesisButton,${majStart(EntityName)}{{removeLine}}
      template : |

      style : |

      export : |
        props: {
          {{tab}}${minPluralize(EntityName)}: {
          {{tab}} required: true,
          {{tab}} type: Array as PropType<${majStart(EntityName)}[]>,
          },
        },
        setup(props) {
          return {};
        }
      destinationPath : "${destinationFolder}/src/entities/${minStart(EntityName)}"
      componentAdditionalFiles :
        - fileType: "List Vue"
          fileName: "${majStart(EntityName)}List"
          extension: "vue"
          content: |
            <template>
              <table class="table align-middle table-rounded text-nowrap">
                <thead class="table-light">
                  <tr>
                    {{#each fields}}
                    <th >${majStart(this.columnName)}</th>{{newline}}
                    {{/each}}
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="${minStart(EntityName)} in ${minPluralize(EntityName)}" :key="product.id" class="border-bottom">
                    {{#each fields}}
                    <td>{{ ${minStart(EntityName)}.${minStart(this.columnName)} }}</td>{{newline}}
                    {{/each}}
                    <td class="text-end">
                      <div class="d-inline-flex gap-2">
                      <GenesisButton icon="fas fa-eye" class="btn-light shadow-sm" />
                      <GenesisButton icon="fas fa-edit" class="btn-light shadow-sm" />
                      <GenesisButton icon="fas fa-trash" class="btn-light shadow-sm" />
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </template>
            
            <script src="./${majStart(EntityName)}ListComponent.ts" lang="ts"></script>
            
            <style scoped>
            .table thead th {
              background-color: #537cc226;
              color: #4e4e4e;
              font-weight: 600;
              vertical-align: middle;
              border-bottom: 2px solid #dee2e6;
            }
              
            .table td,
            .table th {
              vertical-align: middle;
              padding: 0.75rem;
            }
              
            .btn-light {
              border-radius: 0.5rem;
              transition: background 0.2s ease-in-out;
            }
              
            .btn-light:hover {
              background-color: #f1f3f5;
            }
            </style>
          destinationPath: "${destinationFolder}/src/entities/${minStart(EntityName)}"

    - componentType: "List View Component"
      routerLink: "/${minPluralize(EntityName)}"
      componentName: "${majStart(EntityName)}ListViewComponent"
      importFile: |
        import { computed, defineComponent, ref } from "vue";
        import { ${majStart(EntityName)} } from "@/shared/models/${majStart(EntityName)}Model";
        import ${majStart(EntityName)}List from "@/entities/${minStart(EntityName)}/${majStart(EntityName)}List.vue";
        import GenesisSearch from "@/core/search/GenesisSearch.vue";
        import GenesisAddButton from "@/core/button/GenesisAddButton.vue";
        import PaginationLayout from "@/core/pagination/PaginationLayout.vue";
      selector: "${majStart(EntityName)}ListView"
      standalone: true
      importComponent: |
        ${majStart(EntityName)}List,
        GenesisSearch,
        GenesisAddButton,
        PaginationLayout,
      template: |

      style: |

      export: |
        setup() {
          const ${minPluralize(EntityName)} = ref<${majStart(EntityName)}[]>([]);
          const model = new ${majStart(EntityName)}();
          const filters = ref();
      
          const filtered${majPluralize(EntityName)} = computed(() => {
            if (!filters.value) {
              console.log("Initial Values");
              return ${minPluralize(EntityName)}.value;
            }
            console.log("Filfil");
            
            return [...${minPluralize(EntityName)}.value];
          });
      
          const handleSearch = (filterValues: Record<string, any>) => {
            filters.value = filterValues;
          };
      
          return { filtered${majPluralize(EntityName)}, handleSearch, model };
        },
      destinationPath: "${destinationFolder}/src/views/${minStart(EntityName)/list}"
      componentAdditionalFiles:
        - fileType: "List View Vue"
          fileName: "${majStart(EntityName)}ListView"
          extension: "vue"
          content: |
            <template>
              <div class="">
                <div class="d-flex justify-content-between align-items-center">
                  <div>
                    <h3>${majStart(EntityName)} / <span class="text-muted">List</span></h3>
                  </div>
                  <div>
                    <GenesisAddButton>
                      <span>Add ${majStart(EntityName)}</span>
                    </GenesisAddButton>
                  </div>
                </div>
                <div class="mt-3">
                  <GenesisSearch :model="model" @search="handleSearch" />
                </div>
                <${majStart(EntityName)}List :${minPluralize(EntityName)}="filtered${majPluralize(EntityName)}" />

                <PaginationLayout start="1" end="100" />
              </div>
            </template>

            <script lang="ts" src="./${majStart(EntityName)}ListViewComponent.ts"></script>

          destinationPath: "${destinationFolder}/src/views/${minStart(EntityName)/list}"


  serviceComponent:
    imports: |
    methods: |
    destinationPath: "${destinationFolder}/src/shared/services"
    name: "${majStart(EntityName)}Service"
  modelComponent:
    imports: |
    exports: |
      export interface I${majStart(EntityName)} {
        {{#each fields}}
        ${minStart(this.columnName)}: ${this.typeBase};
        {{/each}}
      }
      
      export class ${majStart(EntityName)} implements I${majStart(EntityName)} {
        {{#each fields}}
        ${minStart(this.columnName)}: ${lowerCase(this.typeBase)};
        {{/each}}
        
        constructor();
        constructor(
          {{#each fields}}
            ${minStart(this.columnName)}: ${lowerCase(this.typeBase)}{{#if !@last}},{{/if}}
          {{/each}});
        constructor(
          {{#each fields}}
            ${minStart(this.columnName)}?: ${lowerCase(this.typeBase)}{{#if !@last}},{{/if}}
          {{/each}}
        ) {
          {{#each fields}}
            this.${minStart(this.columnName)} = ${minStart(this.columnName)} ?? {{#if this.typeBase=number}}0{{else}}""{{/if}};
          {{/each}}
        }
      }
    exportsComponents: |
    destinationPath: "${destinationFolder}/src/shared/models"
    name: "${majStart(EntityName)}Model"

