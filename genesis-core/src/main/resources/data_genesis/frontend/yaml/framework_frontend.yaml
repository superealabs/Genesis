          <!-- Delete confirmation popup -->
          <DeleteConfirmationPopup
            :visible="deletePopup"
            :message="`Êtes-vous sûr de vouloir supprimer ${majStart(EntityName)} \${minStart(EntityName)}.id} ?`"
            subMessage="Cette action est irréversible."
            @confirm="confirmDelete"
            @cancel="closePopup"
          />
        </template>
      style: |
        <style scoped></style>
      export: |
        props: {
          ${minStart(EntityName)}: {
            required: true,
            type: Object as PropType<${majStart(EntityName)}>,
          },
        },
        setup(props) {
          const { closePopup, openPopup, visible: deletePopup } = usePopup(false);
          const { delete${majStart(EntityName)}, goToListView, goToUpdateFormView } = use${majPluralize(EntityName)}();

          function openDeletePopup(entity: ${majStart(EntityName)}) {
            if (!entity) return;
            openPopup();
          }

          async function confirmDelete() {
            const { success, error } = await delete${majStart(EntityName)}(props.${minStart(EntityName)});
            if (!success) {
              console.error(error);
            }
            closePopup();
            goToListView();
          }

          return {
            deletePopup,
            openDeletePopup,
            confirmDelete,
            closePopup,
            goToUpdateFormView,
          };
        },
      destinationPath: "${destinationFolder}/src/entities/${minStart(EntityName)}"
      componentAdditionalFiles: [ ]

