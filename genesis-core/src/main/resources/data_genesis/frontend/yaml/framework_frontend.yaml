        {{else}}no ts{{/if}}
      destinationPath: "${destinationFolder}/src/app/features/authentication"
    - fileType: "authentication files"
      fileName: "authentication.service"
      extension: "ts"
      content: |
        {{#if useJWT}}
        import { Injectable } from '@angular/core';
        import { HttpClient, HttpErrorResponse } from '@angular/common/http';
        import { BehaviorSubject, Observable, throwError } from 'rxjs';
        import { catchError, tap } from 'rxjs/operators';
        import { environment } from '../../../../environments/environment';

        interface LoginResponse {
          status: number;
          message: string;
          returnCode: number;
          data: any;
          errors: any;
          timestamp: string;
        }

        @Injectable({ providedIn: 'root' })
        export class AuthService {

           private readonly apiUrl = environment.apiUrl+'/auth';
           constructor(private http: HttpClient) {}  

           private loggedIn = new BehaviorSubject<boolean>(false);

          isLoggedIn$ = this.loggedIn.asObservable();

            login(email: string, password: string): Observable<LoginResponse> {
                const payload = {
                username: email,
                password: password
                };

                return this.http.post<LoginResponse>(this.apiUrl+"/login" ,payload)
                .pipe(
                    tap(response => {
                    if (response.status === 200) {
                        this.loggedIn.next(true);
                    } else {
                        this.loggedIn.next(false);
                    }
                    })
                );
            }
          logout(): void {
            this.loggedIn.next(false);
          }
        }
        {{else}}no ts{{/if}}
      destinationPath: "${destinationFolder}/src/app/features/authentication/services"
    - fileType: "authentication files"
      fileName: "login.component"
      extension: "ts"
      content: |
        {{#if useJWT}}
          import { Component } from '@angular/core';
          import { CommonModule } from '@angular/common';
          import { FormsModule } from '@angular/forms';
          import { AuthService } from '../services/authentication.service';
          import { warnMeUp } from '../../../../utilities/utilities';
          import { Router } from '@angular/router';
          
          @Component({
            selector: 'app-login',
            standalone: true,
            imports: [CommonModule, FormsModule],
            templateUrl: './login.component.html',
            styleUrls: ['./login.component.css']
            })
          export class LoginComponent {
              email: string = '';
              password: string = '';
              
              logoPath: string="assets/icon/logo.jpg"
                logoAvailable = true;
              
                onLogoError() {
                this.logoAvailable = false;
              }
              
              loading: boolean = false;
              
              constructor(private authService: AuthService, private router: Router) {}
              
                  onSubmit() {
                    if (!this.email || !this.password) return;
                
                    this.loading = true; // start loading
                    this.authService.login(this.email, this.password).subscribe({
                        next: (res) => {
                          this.loading = false; // stop loading
                          if (res.status === 200) {
                          localStorage.setItem('authToken', res.data);
                          this.router.navigate(['/welcome']);
                          } else {
                          warnMeUp('error', res.message || 'Unknown error');
                          }
                      },
                        error: (err) => {
                          this.loading = false; // stop loading
                          if (err.status === 401) {
                          warnMeUp('error', err.error?.message || 'Authentication failed');
                          } else {
                          warnMeUp('error', err.message || 'Unexpected error');
                          }
                        }
                    });
                  }
              }
        {{else}}no html{{/if}}
