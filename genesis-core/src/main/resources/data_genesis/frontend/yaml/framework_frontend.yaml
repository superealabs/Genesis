                      class="btn-outline-danger"
                      label="Delete"
                    />
                  </div>
                  <div class="col-auto">
                    <GenesisButton
                      icon="bi bi-pen me-2"
                      @click="goToUpdateFormView(${minStart(EntityName)})"
                      class="btn-outline-dark"
                      label="Update"
                    />
                  </div>
                </div>
