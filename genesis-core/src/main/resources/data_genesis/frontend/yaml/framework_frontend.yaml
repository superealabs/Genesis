- id: 2
  languageId: 1
  coreFramework: "Vue"
  name: "Vue App"
  template: "VueJs"
  additionalFiles:
    - fileType: "App-files"
      fileName: "App"
      extension: "vue"
      content: |
        <template>
          <div id="app">
            <HelloWorld msg="Welcome to Your Vue.js + TypeScript App"/>
          </div>
        </template>

        <script lang="ts" setup>
          import HelloWorld from './components/HelloWorld.vue';
        </script>

        <style>
          #app {
            font-family: Avenir, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-align: center;
            color: #2c3e50;
            margin-top: 60px;
          }
        </style>
      destinationPath: "src/"
    - fileType: "Main-files"
      fileName: "main"
      extension: "ts"
      content: |
        import { createApp } from 'vue';
        import App from './App.vue';
      
        createApp(App).mount('#app');
      destinationPath: "src/"

  components:
    - componentType : "list"
      importFile: |
        import { defineComponent } from 'vue';
      selector: "HelloWorld"
      standalone: true
      importComponent: |
        import HelloWorld from './components/HelloWorld.vue';
      template: |
        <div>
          <h1>{{ msg }}</h1>
        </div>
      style: |
        <style>
          h1 {
            color: #42b983;
          }
        </style>
      export: |
        export default defineComponent({
          name: 'HelloWorld',
          props: {
            msg: String
          }
        });
      componentAdditionalFiles: [ ]

    - componentType: "form"
      importFile: |
        import { defineComponent } from 'vue';
      selector: "HelloWorld"
      standalone: true
      importComponent: |
        import HelloWorld from './components/HelloWorld.vue';
      template: |
        <div>
          <h1>{{ msg }}</h1>
        </div>
      style: |
        <style>
          h1 {
            color: #42b983;
          }
        </style>
      export: |
        export default defineComponent({
          name: 'HelloWorld',
          props: {
            msg: String
          }
        });
      componentAdditionalFiles: [ ]

  serviceComponent:
    import: |
      import axios from 'axios';
    methods: |
      export async function fetchData() {
        return await axios.get('/api/data');
      }
  modelComponent:
    exports: |
      export interface User {
        id: number;
        name: string;
        email: string;
      }

  
  




      
      
      




  
  
