        import { use${majPluralize(EntityName)} } from "@/composables/use${majPluralize(EntityName)}";
        {{#if isView}} {{removeLine}}
        {{else}}
        import GenesisButton from "@/core/button/GenesisButton.vue";
        import PlusIcon from "@/core/icons/PlusIcon.vue";{{/if}}
        import EntityTable from "@/core/table/EntityTable.vue";
      selector: "${majStart(EntityName)}ListView"
      standalone: true
      importComponent: "{{removeLine}}"
      template: |
        <div class="w-full">
          <!-- Header -->
          <div class="flex items-center justify-between mb-6">
            <h3 class="text-xl font-semibold">
              ${majStart(EntityName)} /
              <span class="text-gray-500 font-normal">List</span>
            </h3>
            {{#if isView}}{{removeLine}}
            {{else}}
            <GenesisButton title="Create new ${minStart(EntityName)}" @click="goToCreateFormView" class="btn-primary">
              <PlusIcon />
              Add new ${minStart(EntityName)}
            </GenesisButton>{{/if}}
