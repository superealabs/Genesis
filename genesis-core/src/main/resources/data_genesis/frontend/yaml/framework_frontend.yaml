  serviceComponent:
    name: "${majStart(className)}Service"
    destinationPath: "${destinationFolder}/src/services"
    imports: |
      import api from '@/services/api'
      import {getFilenameFromHeaders, triggerFileDownload} from "@/utils/download.ts";
      import RestResponse from '@/models/api/RestResponseModel'
      import { type IPageResponse } from '@/models/api/PageResponseModel'
      import {
        PaginationRequestParameter,
        RequestModel,
        SortFieldParameter,
      } from '@/models/api/RequestModel'
      import { ${majStart(className)} } from '@/models/${majStart(className)}Model'
      import type { DataResponse, PagedDataResponse } from '@/models/api/DataResponseModel'{{#if isParentTable}}
      {{#each children}}import type { ${majStart(this.className)} } from '@/models/${majStart(this.className)}Model'{{/each}}
      {{/if}}
    methods: |
      const restApiWithPage = api<IPageResponse<${majStart(className)}>>()
      const restApi = api<${majStart(className)}>()
      const BASE_URL = '/${lowerCase(classNameLink)}'

      /** Helper to wrap response data in ${majStart(className)} instances */
      function wrap${majStart(className)}(response: DataResponse<${majStart(className)}> | PagedDataResponse<${majStart(className)}>) {
        if (Array.isArray(response.data)) {
          response.data = response.data.map((r) => new ${majStart(className)}(r))
        } else if (response.data && typeof response.data === 'object') {
          response.data = new ${majStart(className)}(response.data)
        }
        return response
      }

      /** GET all with pagination */
      export async function getAll(
        pagination?: PaginationRequestParameter,
        sortFields?: SortFieldParameter[],
      ) {
        const request = new RequestModel(BASE_URL, pagination, sortFields)
        const response = await restApiWithPage.GET(request.buildRequestUrl())
        return wrap${majStart(className)}(RestResponse.handlePagedResponse<${majStart(className)}>(response)) as PagedDataResponse<${majStart(className)}>
      }
      
      /** POST search with pagination */
      export async function search(
        data: Partial<${majStart(className)}>,
        pagination?: PaginationRequestParameter,
        sortFields?: SortFieldParameter[],
      ) {
        const request = new RequestModel(BASE_URL + '/search', pagination, sortFields)
        const response = await restApiWithPage.POST(request.buildRequestUrl(), data)
        return wrap${majStart(className)}(RestResponse.handlePagedResponse<${majStart(className)}>(response)) as PagedDataResponse<${majStart(className)}>
      }

      /** GET by ID */
      export async function getById(id: number | string | undefined) {
        if (!id) throw new Error('getById: id is required')
        const response = await restApi.GET(BASE_URL + '/' + id)
        return wrap${majStart(className)}(RestResponse.handleDataResponse<${majStart(className)}>(response)) as DataResponse<${majStart(className)}>
      }
      
      /** POST create */
      {{#if notViewAndParent}}export async function create(data: { ${minStart(className)}: Partial<${majStart(className)}>{{#each children}}; ${minStart(this.className)}s: Partial<${majStart(this.className)}>[]{{/each}} }){{else}}export async function create(data: Partial<${majStart(className)}>){{/if}}{{#if !view}}{
        const response = await restApi.POST(BASE_URL, data)
        return wrap${majStart(className)}(RestResponse.handleDataResponse<${majStart(className)}>(response)) as DataResponse<${majStart(className)}>
      }{{/if}}

      {{#if notViewAndParent}}
      /** PUT update */
      export async function update(
        id: number | string | undefined,
        data: {
          ${minStart(className)}: Partial<${majStart(className)}>
          {{#each children}} ${minStart(this.className)}s: Partial<${majStart(this.className)}>[]{{/each}} 
        }
      ) {
        if (!id) throw new Error('update: id is required')
        const response = await restApi.PUT(BASE_URL + '/' + id, data)
        return wrap${majStart(className)}(RestResponse.handleDataResponse<${majStart(className)}>(response)) as DataResponse<${majStart(className)}>
      }
      {{elseIf !isView}}/** PUT update */
      export async function update(id: number | string | undefined, data: Partial<${majStart(className)}>) {
        if (!id) throw new Error("update: id is required")
        const response = await restApi.PUT(BASE_URL + '/' + id, data)
        return wrap${majStart(className)}(RestResponse.handleDataResponse<${majStart(className)}>(response)) as DataResponse<${majStart(className)}>
      }{{/if}}

      {{#if !isView}}/** DELETE remove */
      export async function remove(id: number | string | undefined) {
        if (!id) throw new Error("remove: id is required")
        const response = await restApi.DELETE(BASE_URL + '/' + id)
        return {
          success: response.returnCode === 1,
          error: response.returnCode !== 1 ? response.message : null,
        };
      }{{/if}}
      export async function exportCsv(
        ${minStart(className)}s: Partial<${majStart(className)}[]>,
      ): Promise<{ success: boolean; error: string | null }> {
           const url = import.meta.env.VITE_APP_API_URL+BASE_URL+'/export/csv'
           
           try {
           const response = await fetch(url, {
                            method: 'POST',
                            headers: {
                              'Content-Type': 'application/json',
                            },
                            body: JSON.stringify(${minStart(className)}s),
         })
           if (!response.ok) {
           const errorText = await response.text()
           console.error('CSV Export Failed - Server Error:', response.status, errorText)
                            throw new Error(`CSV export failed: ${response.statusText}. Status: ${response.status}.`)
         }
            const blob = await response.blob()
            const contentDisposition = response.headers.get('content-disposition');
            triggerFileDownload(blob,getFilenameFromHeaders(contentDisposition,"${majStart(className)}.csv"));
            return {
              success: true,
              error: null,
         }
         
          } catch (error) {
            console.error('Error during CSV export:', error)
            return {
              success: false,
              error: error instanceof Error ? error.message : 'An unknown error occurred during export.',
            }
          }
        }{{#if isChildTable}}
        {{#each parents}}
        export async function getAllBy${majStart(this.className)}Id(
          id: number | string | undefined,
          pagination?: PaginationRequestParameter,
          sortFields?: SortFieldParameter[],
        ) {
          if (!id) throw new Error('getAllBy${majStart(this.className)}Id: id of ${minStart(this.className)} is required')
          const request = new RequestModel('/${minStart(this.className)}s/' + id + BASE_URL, pagination, sortFields)
          const response = await restApiWithPage.GET(request.buildRequestUrl())
          return wrap${majStart(className)}(
            RestResponse.handlePagedResponse<${majStart(className)}>(response),
          ) as PagedDataResponse<${majStart(className)}>
        }{{/each}}{{/if}}
        

  modelComponent:
    imports: |
      import { BaseModel } from './BaseModel'
      import { type EntitySearchField } from './EntityModel'{{#if containsForeignKey}}
      import { createSelectSearchFunction, createMulticriteriatSearchFunction } from './SelectOption'{{/if}}
      {{#each fieldsFK}}
      import { ${majStart(this.type)} } from './${majStart(this.type)}Model'
      import * as ${minStart(this.type)}Service from '@/services/${majStart(this.type)}Service'
      {{/each}}{{removeLine}}
    exports: |
      export interface I${majStart(className)} {
        {{#each fields}}{{#if this.isForeignKey}}
        ${minStart(this.name)}?: ${majStart(this.type)}
        {{elseIf this.isPrimaryKey}}${minStart(this.name)}?: ${this.typeBase}
        {{elseIf this.isDate}}${minStart(this.name)}?: string
        {{else}}${minStart(this.name)}?: ${this.typeBase}{{/if}}
        {{/each}}{{removeLine}}
      }

      export class ${majStart(className)} extends BaseModel implements I${majStart(className)} {
        {{#each fields}}{{#if this.isForeignKey}}
        ${minStart(this.name)}?: ${majStart(this.type)}
        {{elseIf this.isPrimaryKey}}${minStart(this.name)}?: ${this.typeBase}
        {{elseIf this.isDate}}${minStart(this.name)}?: ${this.typeBase}
        {{else}}${minStart(this.name)}?: ${this.typeBase}{{/if}}
        {{/each}}{{removeLine}}

        constructor(data?: Partial<I${majStart(className)}>) {
          super()
          {{#each fields}}
          {{#if this.isForeignKey}}
          this.${minStart(this.name)} = data?.${minStart(this.name)}
            ? new ${majStart(this.type)}(data?.${minStart(this.name)})
            : undefined{{else}}
          this.${minStart(this.name)} = data?.${minStart(this.name)}{{/if}}
          {{/each}}{{removeLine}}
        }

        {{#each fieldsPK}}
        {{#if @first}}
        static override getKey(): string {
          return '${this.name}'
        }

        public override getKeyValue(): string {
          return String(this.${this.name})
        }{{/if}}
        {{/each}}{{removeLine}}
      
        static override getReferenceKey(): string {
          {{#each simpleFields}}
          {{#if @first}}return '${this.name}'{{else}}{{removeLine}}{{/if}}
          {{/each}}{{removeLine}}
        }
  
        public override getReferenceValue(): string {
          {{#each simpleFields}}
          {{#if @first}}return String(this.${this.name}){{else}}{{removeLine}}{{/if}}
          {{/each}}{{removeLine}}
        }

        protected static override searchDaoMetadata: EntitySearchField[] = [
          {{#each fields}}{{#if this.isForeignKey}}
          {
            key: '${this.name}',
            label: '${formatReadable(this.name)}',
            type: 'select',
            searchKey: ${majStart(this.type)}.getKey(),
            sortable: false,
            selectSearch: createSelectSearchFunction(${majStart(this.type)}, ${minStart(this.type)}Service),
            multicriteriaSelect: {
              filters: ${majStart(this.type)}.getAllSearchFieldsMetadata(),
              searchFunction: createMulticriteriatSearchFunction(${minStart(this.type)}Service),
            },
            showInTable: true,
            showInFilter: true,
          },
          {{elseIf this.isPrimaryKey}}{
            key: '${this.name}',
            label: '${formatReadable(this.name)}',
            type: '${this.uiType}',
            sortable: true,
            showInTable: true,
            showInFilter: true,
            identifier: true 
          },
          {{elseIf this.isNumeric or this.isDate}}{ 
            key: '${this.name}',
            label: '${formatReadable(this.name)}',
            type: '${this.uiType}',
            sortable: true,
            showInTable: true,
            showInFilter: true 
          },
          { 
            key: '${this.name}Min',
            label: '${formatReadable(this.name)} Min',
            type: '${this.uiType}',
            sortable: false,
            showInTable: false,
            showInFilter: true 
          },
          { 
            key: '${this.name}Max',
            label: '${formatReadable(this.name)} Max',
            type: '${this.uiType}',
            sortable: false,
            showInTable: false,
            showInFilter: true 
          },
          {{else}}{ 
            key: '${this.name}',
            label: '${formatReadable(this.name)}',
            type: '${this.uiType}',
            sortable: true,
            showInTable: true,
            showInFilter: true 
          },{{/if}}
          {{/each}}{{removeLine}}
        ]
      }
      
      {{#if !isView}}
      export class ${majStart(className)}FormDTO {
        {{#each fields}}
        {{#if this.isForeignKey}}
        ${minStart(this.name)}?: string
        {{elseIf this.isDate}}${minStart(this.name)}?: string{{else}}
        ${minStart(this.name)}?: ${this.typeBase}{{/if}}
        {{/each}}{{removeLine}}

        constructor(data?: Partial<${majStart(className)}FormDTO>) {
          {{#each fields}}
          {{#if this.isForeignKey}}this.${minStart(this.name)} = data?.${minStart(this.name)} ?? ""
          {{elseIf this.isDate}}this.${minStart(this.name)} = data?.${minStart(this.name)} ? data.${minStart(this.name)} : undefined
          {{else}}this.${minStart(this.name)} = data?.${minStart(this.name)}{{/if}}
          {{/each}}{{removeLine}}
        }

        static parse(data?: Partial<I${majStart(className)}> | I${majStart(className)} | null) {
          const instance = new ${majStart(className)}FormDTO()
          {{#each fields}}
          {{#if this.isForeignKey}}instance.${minStart(this.name)} = data?.${minStart(this.name)}?.getKeyValue()?.toString()
          {{else}}instance.${minStart(this.name)} = data?.${minStart(this.name)}{{/if}}
          {{/each}}{{removeLine}}
          return instance
        }
      
        static parseList(data?: ${majStart(className)}[] | null): ${majStart(className)}FormDTO[] {
          if (!data || data.length === 0) return []
          return data.map((item) => ${majStart(className)}FormDTO.parse(item))
        }
  
        async toEntity(): Promise<Partial<${majStart(className)}>> {
          const entity: Partial<${majStart(className)}> = new ${majStart(className)}({
            {{#each fieldsNotFK}}
            ${minStart(this.name)}: this.${minStart(this.name)},
            {{/each}}{{removeLine}}
          })

          {{#each fieldsFK}}
          if (this.${minStart(this.name)} && this.${minStart(this.name)}.length > 0) {
            const related = await ${minStart(this.type)}Service.getById(Number(this.${minStart(this.name)}));
            entity.${minStart(this.name)} = related.data as ${majStart(this.type)};
          }
          {{/each}}{{removeLine}}
          return entity
        }
      
        static async toEntities(data?: ${majStart(className)}FormDTO[] | null){
            const entities: Promise<Partial<${majStart(className)}>>[] = []
            data?.forEach(async (item) => {
              entities.push(item.toEntity())
            })
            return Promise.all(entities)
          }
      }{{/if}}
    exportsComponents: |
    destinationPath: "${destinationFolder}/src/models"
    name: "${majStart(className)}Model"
  mereFiles: [ ]
  filleFiles:
    - fileType: "Row Form"
      fileName: "${majStart(className)}RowForm"
      extension: "vue"
      content: |
        <script setup lang="ts">
        import GenesisSelectSearchCriteria from '@/components/form/GenesisSelectSearchCriteria.vue'
        import GenesisInput from '@/components/form/GenesisInput.vue'
        import { ref } from 'vue'
        import { ${majStart(className)}, ${majStart(className)}FormDTO } from '@/models/${majStart(className)}Model'
        import TrashIcon from '@/components/icons/TrashIcon.vue'

        const props = defineProps<{
          internalId: number
          ${minStart(className)}: ${majStart(className)}
          violations?: Record<string, string> | null
        }>()

        const emit = defineEmits<{
          (e: 'request:remove'): void
          (e: 'udpate:model-value', value: ${majStart(className)}FormDTO): void
        }>()

        const formModel = ref<${majStart(className)}FormDTO>({majStart(className)}FormDTO.parse(props.${minStart(className)}))
        {{#each fieldsFK}}
        {{#if this.isParentForeignKey}}{{removeLine}}
        {{else}}const ${minStart(this.name)}SearchField = ${majStart(className)}.getSearchFieldByKey('${minStart(this.name)}'){{/if}}
        const ${minStart(this.name)}DefaultValue = props.${minStart(className)}
        ? (props.${minStart(className)}?.${this.name}?.getReferenceValue?.() ?? undefined)
        : undefined        
        {{/each}}

        function removeRow() {
          emit('request:remove')
        }

        function updateModel() {
          emit('udpate:model-value', formModel.value)
        }
        </script>

        <template>
          <tr>
            <td>
              {{ internalId }}
            </td>
            {{#each fields}}
            {{#if this.isPrimaryKey}}{{removeLine}}
            {{elseIf this.isParentForeignKey}}{{removeLine}}
            {{elseIf this.isForeignKey}}
            <td>
              <GenesisSelectSearchCriteria
                v-if="${minStart(this.name)}SearchField?.multicriteriaSelect"
                :violation="violations ? violations['${minStart(this.name)}'] : undefined"
                placeholder="Select ${formatReadable(this.name)}"
                key="${majStart(className)}${majStart(this.name)}"
                :search-function="${minStart(this.name)}SearchField?.multicriteriaSelect.searchFunction"
                :filters="${minStart(this.name)}SearchField?.multicriteriaSelect.filters"
                :default-value="${minStart(this.name)}DefaultValue"
                @option-selected="
                  (selectedValue) => {
                    formModel.${minStart(this.name)} = String(selectedValue)
                    updateModel()
                  }
                "
              />
            </td>
            {{else}}
            <td>
              <GenesisInput
                :violation="violations ? violations['${minStart(this.name)}'] : undefined"
                placeholder="Enter ${formatReadable(this.name)}"
                type="${this.uiType}"
                v-model="formModel.${minStart(this.name)}"
                :value="formModel.${minStart(this.name)}"
                @update:model-value="(newVal) => updateModel()"
              />
            </td>
            {{/if}}
            {{/each}}
            <td class="text-center">
              <button type="button" title="delete row" @click="removeRow" class="btn btn-error btn-outline">
                <TrashIcon />
              </button>
            </td>
          </tr>
        </template>

        <style scoped></style>
      destinationPath: "${destinationFolder}/src/entities/${minStart(className)}"

    - fileType: "Table Form"
      fileName: "${majStart(className)}TableForm"
      extension: "vue"
      content: |
        <template>
          <div class="w-full bg-base-100 border rounded border-base-300 p-4">
            <h3 class="text-lg font-semibold mb-4 text-gray-700">${formatReadable(className)}</h3>

            <div class="">
              <table class="table w-full">
                <thead>
                  <tr class="text-primary-focus">
                    <th class="">#</th>
                    {{#each fields}}{{#if this.isPrimaryKey}}{{removeLine}}
                    {{elseIf this.isParentForeignKey}}{{removeLine}}
                    {{else}}
                    <th class="">${formatReadable(this.name)}</th>
                    {{/if}}{{/each}}{{removeLine}}  
                    <th class=""></th>
                  </tr>
                </thead>
                <tbody>
                  <template v-for="(row, index) in rows" :key="row._internalId + '-' + index">
                    <${majStart(className)}RowForm
                      :internalId="index + 1"
                      :${minStart(className)}="row.data"
                      :violations="violations ? violations[index] : undefined"
                      @request:remove="removeRowHandler(row._internalId)"
                      @udpate:model-value="(rowData) => (row.rowValue = rowData)"
                    />
                  </template>
                </tbody>
                <tfoot>
                  <tr></tr>
                </tfoot>
              </table>
            </div>
            <div class="mt-4 gap-2 flex justify-end">
              <div class="w-25">
                <GenesisInput min="1" type="number" v-model="rowToAdd" :value="rowToAdd" />
              </div>
              <GenesisAddButton type="button" @click="addRowHandler"><PlusIcon /></GenesisAddButton>
            </div>
          </div>
        </template>

        <script setup lang="ts">
        import { onMounted, ref, watch } from 'vue'
        import { useTableForm } from '@/composables/useTableForm'
        import { ${majStart(className)}, ${majStart(className)}FormDTO } from '@/models/${majStart(className)}Model'
        import GenesisAddButton from '@/components/button/GenesisAddButton.vue'
        import ${majStart(className)}RowForm from '@/entities/${minStart(className)}/${majStart(className)}RowForm.vue'
        import GenesisInput from '@/components/form/GenesisInput.vue'
        import PlusIcon from '@/components/icons/PlusIcon.vue'

        const rowToAdd = ref(10)
        const props = defineProps<{
          getTableDataCallback: (data: ${majStart(className)}FormDTO[]) => void
          initialData?: ${majStart(className)}[]
          violations?: Record<string, string>[]
        }>()

        const { rows, addRow, removeRow, getTableData } = useTableForm<${majStart(className)}, ${majStart(className)}FormDTO>(
          props.initialData,
        )

        const addRowHandler = () => {
          addRow(rowToAdd.value)
          props.getTableDataCallback(getTableData())
        }

        const removeRowHandler = (internalId: number) => {
          removeRow(internalId)
          props.getTableDataCallback(getTableData())
        }

        onMounted(() => {
          props.getTableDataCallback(getTableData())
        })
        watch(
          () => rows.value,
          () => {
            props.getTableDataCallback(getTableData())
          },
          { deep: true },
        )
        </script>

        <style scoped>
        .table :where(th, td) {
          padding: 0.5rem 0.5rem;
        }
        </style>
      destinationPath: "${destinationFolder}/src/entities/${minStart(className)}"

