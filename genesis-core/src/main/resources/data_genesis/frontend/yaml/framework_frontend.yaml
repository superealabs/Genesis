                { key: '${this.name}', label: '${formatReadableLowerCase(this.name)}', type: 'text' }{{elseIf this.isNumeric }}
                { key: '${this.name}Min', label: '${formatReadableLowerCase(this.name)}Min', type: 'number' },{ key: '${this.name}Max', label: '${formatReadableLowerCase(this.name)}Max', type: 'number' }{{elseIf this.isDate }}
                { key: '${this.name}Min', label: '${formatReadableLowerCase(this.name)}Min', type: 'date' },{ key: '${this.name}Max', label: '${formatReadableLowerCase(this.name)}Max', type: 'date' }{{elseIf this.isDateTime}}
                { key: '${this.name}Min', label: '${formatReadableLowerCase(this.name)}Min', type: 'datetime-local' },{ key: '${this.name}Max', label: '${formatReadableLowerCase(this.name)}Max', type: 'datetime-local' }{{elseIf this.isTime}}
                { key: '${this.name}Min', label: '${formatReadableLowerCase(this.name)}Min', type: 'time' },{ key: '${this.name}Max', label: '${formatReadableLowerCase(this.name)}Max', type: 'time' }{{/if}}
            {{tab}}{{tab}}{{#if !@last}},{{/if}}{{/each}}
            ];
        
            sort(columnIndex:number,sortOrientation:boolean){
                this.sortOrientation=sortOrientation;
                this.sortColumn=columnIndex;
                const mappedValue = expandDotNotation(this.formValueAttribute);
                const sortParam=(this.columns[this.sortColumn]).fieldName+','+(this.sortOrientation?'asc':'desc');
                this.load${majStart(className)}s(mappedValue,sortParam);
            }
             
             constructor(
                {{#each fieldsFK}}{{removeLine}}
                 private ${minStart(this.type)}Service: ${majStart(this.type)}Service ,
                {{/each}}{{removeLine}}
                private ${minStart(className)}Service: ${majStart(className)}Service
             ) {}
        
            load${majStart(className)}s(criteria: Partial<${majStart(className)}> = {},sortParam:string=(this.columns[this.sortColumn]).fieldName+',asc;'): void {
                this.isLoading = true;
                this.${minStart(className)}Service.search${majStart(className)}s(criteria, this.currentPage-1, this.itemNumber,sortParam).pipe(takeUntil(this.destroy$)).subscribe({
                next: (${minStart(className)}s: ${majStart(className)}[]) => {
                        this.${minStart(className)}s = ${minStart(className)}s;
                        this.totalItems=this.${minStart(className)}Service.elementNumber;  
                        this.data=recursiveObjectsTo2DArray(${minStart(className)}s);
