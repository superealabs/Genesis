        {{/each}}{{removeLine}}
        
        const routes: Array<RouteRecordRaw> = [
          {
            path: '/',
            redirect: '/home',
          },
          {
            path: '/',
            component: MainLayout,
            children: [
              { path: 'home', name: 'home', component: HomeView{{#if useJWT}}, meta: { requiresAuth: true }{{/if}} },
              { path: 'settings', name: 'settings', component: SettingsView{{#if useJWT}}, meta: { requiresAuth: true }{{/if}} },{{#if useJWT}}
