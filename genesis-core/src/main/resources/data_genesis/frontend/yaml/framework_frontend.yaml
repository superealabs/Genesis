  components:
    - componentType: "Entity Row"
      generateForView: true
      router:
        label: "{{removeLine}}"
        link: ""
      importFile: |
        import { computed, type PropType } from 'vue'
        import { ${majStart(className)} } from '@/models/${majStart(className)}Model'
        import EntityRowActions from '@/components/table/EntityRowActions.vue'
      selector: "${majStart(className)}Row"
      standalone: true
      importComponent: "{{removeLine}}"
      template: |    
        <template>
          <tr class="hover:bg-base-200">
            <template v-for="field in ${majStart(className)}.getAllSearchFieldsMetadata()" :key="field.key">
              <td
                v-show="field.showInTable"
                class="px-3 py-2"
                :class="{
                  'sticky left-0 bg-base-200 font-semibold': field.identifier,
                }"
              >
                <template v-if="field.type === 'date'">
                  {{ ${minStart(className)}Data[field.key] ? $d(${minStart(className)}Data[field.key], 'long') : '--/--/--' }}
                </template>
    
                <template v-else-if="field.type === 'number'">
                  {{ ${minStart(className)}Data[field.key] != null ? $n(${minStart(className)}Data[field.key], 'decimal') : '--' }}
                </template>
        
                <template v-else-if="field.type === 'select'">
                  {{ ${minStart(className)}Data[field.key] != null ? ${minStart(className)}Data[field.key].getReferenceValue() : '--' }}
                </template>
    
                <template v-else>
                  {{ ${minStart(className)}Data[field.key] ?? '--' }}
                </template>
              </td>
            </template>

            <!-- Actions -->
            <td class="px-3 py-2 bg-base-200 sticky right-0 text-end">
              <div class="rounded-md inline-flex">
                <EntityRowActions
                  :view="viewAction"
                  :remove="removeAction"
                  :edit="editAction"
                  @delete-row="deleteRow" 
                  @view-row="viewRow" 
                  @edit-row="updateRow" />
              </div>
            </td>
          </tr>
        </template>
      style: "<style scoped></style>"
      export: |
        const props = defineProps({
          ${minStart(className)}: {
            type: Object as PropType<${majStart(className)}>,
            required: true,
          },
          viewAction: {
            type: Boolean,
            default: true,
          },
          editAction: {
            type: Boolean,
            default: true,
          },
          removeAction: {
            type: Boolean,
            default: true,
          },
        })
        
        const ${minStart(className)}Data = computed(() => {
          return props.${minStart(className)} as Record<string, any>
        })

        const emit = defineEmits<{
          (e: 'request-delete', ${minStart(className)}: ${majStart(className)}): void
          (e: 'request-view', ${minStart(className)}: ${majStart(className)}): void
          (e: 'request-update', ${minStart(className)}: ${majStart(className)}): void
        }>()

        const deleteRow = () => emit('request-delete', props.${minStart(className)})
        const viewRow = () => emit('request-view', props.${minStart(className)})
        const updateRow = () => emit('request-update', props.${minStart(className)})
      componentName: "${majStart(className)}Row"
      destinationPath: "${destinationFolder}/src/entities/${minStart(className)}"
      componentAdditionalFiles: [ ]

    - componentType: "List Component"
      generateForView: true
      router:
        label: "{{removeLine}}"
        link: ""
      componentName: "${majStart(className)}List"
      importFile: |
        import ${majStart(className)}Row from './${majStart(className)}Row.vue'
        import { use${majStart(className)}s } from '@/composables/use${majStart(className)}s'
        import { ${majStart(className)} } from '@/models/${majStart(className)}Model'{{#if !isView}}
        import DeleteConfirmationPopup from '@/components/popup/DeleteConfirmationPopup.vue'
        import { ref } from 'vue'
        import type { PropType } from 'vue'{{/if}}
        import { SortFieldParameter } from '@/models/api/RequestModel'
        import SortButton from '@/components/button/SortButton.vue'
        import type { PropType } from 'vue'
      selector: "${majStart(className)}List"
      standalone: true
      importComponent: "{{removeLine}}"
      template: |
        <template>
          <table class="table table-auto relative">
            <thead>
              <tr>
                <template v-for="field in ${majStart(className)}.getAllSearchFieldsMetadata()" :key="field">
                  <th
                    v-show="field.showInTable"
                    class="sticky top-0 bg-primary text-primary-content px-3 py-2 font-bold min-w-35 z-1"
                    :class="{ 'left-0 z-2': field.identifier }"
                  >
                    <div class="flex items-center justify-between gap-1">
                      <span>{{ field.label }}</span>
        
                      <!-- Sort Buttons -->
                      <SortButton v-show="field.sortable" :field-key="field.key" @sort="sortBy" />
                    </div>
                  </th>
                </template>
                <!-- Right sticky column -->
                <th
                  class="sticky top-0 right-0 bg-primary text-primary-content px-3 py-2 font-bold min-w-35 z-2"
                ></th>
              </tr>
            </thead>
            <tbody class="bg-base-100">
              <!-- Empty message -->
              <tr v-if="!loading && message">
                <td colspan="100" class="text-center py-4 text-gray-500">
                  {{ message }}
                </td>
              </tr>

              <!-- Entity rows -->
              <${majStart(className)}Row
                v-else
                v-for="${minStart(className)} in data"
                :key="${minStart(className)}.getKeyValue()"
                :${minStart(className)}="${minStart(className)}"
                :view-action="viewAction"
                :edit-action="editAction"
                :remove-action="removeAction"
                @request-view="view${majStart(className)}"{{#if !isView}}
                @request-delete="openDeletePopup"
                @request-update="goToUpdateFormView"{{/if}}
              />
            </tbody>
          </table>{{#if !isView}}
          <!-- Delete confirmation popup -->
          <DeleteConfirmationPopup
            :visible="deletePopup"
            :message="$t('confirmation.delete')"
            @confirm="confirmDelete"
            @cancel="closePopup"
          />{{/if}}
        </template>
      style: "<style scoped></style>"
      export: |
        defineProps({
          data: {
            type: Array as PropType<${majStart(className)}[]>,
            required: true,
          },
          message: String,
          loading: {
            type: Boolean,
            default: false,
          },
          viewAction: {
            type: Boolean,
            default: true,
          },
          editAction: {
            type: Boolean,
            default: true,
          },
          removeAction: {
            type: Boolean,
            default: true,
          },
        })
        const emit = defineEmits<{
          (e: 'request:refresh'): void
          (e: 'sortby', sortData: SortFieldParameter): void
        }>()
        
        function sortBy(sortData: SortFieldParameter): void {
          emit('sortby', sortData)
        }

        {{#if isView}}
        const { view${majStart(className)} } = use${majStart(className)}s()
        {{else}}
        const selectedEntity = ref()

        const { visible: deletePopup, closePopup } = usePopup(false)
        const { delete${majStart(className)}, view${majStart(className)}, goToUpdateFormView } = use${majStart(className)}s()

        function openDeletePopup(entity: ${majStart(className)}) {
          if (!entity) return
          selectedEntity.value = entity
          deletePopup.value = true
        }

        async function confirmDelete() {
          const { success, error } = await delete${majStart(className)}(selectedEntity.value)
          if (success) {
            deletePopup.value = false
            emit('request:refresh')
          } else {
            console.error(error)
          }
        }
        {{/if}}
      destinationPath: "${destinationFolder}/src/entities/${minStart(className)}"
      componentAdditionalFiles: [ ]

    - componentType: "List View"
      generateForView: true
      router:
        link: "/${minPluralize(className)}"
        label: "${majStart(className)}"
      componentName: "${majStart(className)}ListView"
      importFile: |
        import { ref } from 'vue'
        import type { EntitySearchField } from '@/models/EntityModel'
        import { ${majStart(className)} } from '@/models/${majStart(className)}Model'
        import ${majStart(className)}List from '@/entities/${minStart(className)}/${majStart(className)}List.vue'
        import EntityTable from '@/components/table/EntityTable.vue'
        import { use${majPluralize(className)} } from '@/composables/use${majPluralize(className)}'{{#if !isView}}
        import GenesisButton from '@/components/button/GenesisButton.vue'
        import PlusIcon from '@/components/icons/PlusIcon.vue'{{/if}}
      selector: "${majStart(className)}ListView"
      standalone: true
      importComponent: "{{removeLine}}"
      template: |
        <template>
          <div class="w-full">
            <!-- Header -->
            <div class="flex items-center justify-between mb-6">
              <h3 class="text-xl font-semibold text-base-content">
                {{ $t('entity.nav', { entity: '${majStart(className)}' }) }}
                <span class="text-base-content/50 font-normal"> {{ $t('entity.list.nav') }}</span>
              </h3>{{#if !isView}}
              <GenesisButton title="Create new ${minStart(className)}" @click="goToCreateFormView" class="btn-secondary">
                <PlusIcon />
                {{ $t('button.addEntity', { entity: '${majStart(className)}' }) }}
              </GenesisButton>{{/if}}
            </div>
  
            <!-- Table -->
            <EntityTable
              :entity-model="{}"
              :entity-search-fields="searchFields"
              :searchFn="search${majPluralize(className)}"
              :getPaginationData="getPaginationData"
              :listComponent="${majStart(className)}List"
              :entities="${minPluralize(className)}"
              :message="message"{{#if isView}}
              :remove-action="false"
              :edit-action="false"{{/if}}
              @export:csv="onExport"
            />
          </div>
        </template>
      style: "<style scoped></style>"
      destinationPath: "${destinationFolder}/src/views/${minStart(className)}"
      export: |
        // Composable for managing entities
        const {${minPluralize(className)}, search${majPluralize(className)}, message, getPaginationData{{#if !isView}}, goToCreateFormView{{/if}}, export${majStart(className)}sToCsv } = use${majPluralize(className)}()

        // Reactive search fields
        const searchFields = ref<EntitySearchField[]>(${majStart(className)}.getAllSearchFieldsMetadata());
        
        const onExport = async () => {
          await export${majStart(className)}sToCsv(${minPluralize(className)}.value)
        }
      componentAdditionalFiles:
        - fileType: "Entity Composable"
          fileName: "use${majPluralize(className)}"
          extension: "ts"
          content: |
            import { ref } from 'vue'
            import { ${majStart(className)}, {{#if !isView}}${majStart(className)}FormDTO{{/if}} } from '@/models/${majStart(className)}Model'
            import * as ${minStart(className)}Service from '@/services/${majStart(className)}Service'
            import { useLoading } from './useLoading'
            import { PaginationRequestParameter, SortFieldParameter } from '@/models/api/RequestModel'
            import { PaginationData } from '@/models/api/PageResponseModel'
            import { useRouter } from 'vue-router'{{#if isParentTable}}
            {{#each children}}
            import { ${majStart(this.className)}, ${majStart(this.className)}FormDTO } from '@/models/${majStart(this.className)}Model'
            {{/each}}
            {{/if}}

            /**
             * Composable to manage ${majStart(className)} entities including CRUD operations,
             * search, pagination, foreign key loading, and navigation.
             */
            export function use${majStart(className)}s() {
              /** List of all ${minStart(className)}s */
              const ${minStart(className)}s = ref<${majStart(className)}[]>([])

              /** Loading state management */
              const { loading, startLoading, stopLoading } = useLoading()

              /** Pagination information returned by API */
              const paginationData = ref(new PaginationData())

              /** Message for errors or notifications */
              const message = ref<string | null>()

              /** Vue router instance for navigation */
              const router = useRouter()

              /**
                * Handles API response by updating the ${minStart(className)}s and pagination
                * @param data Array of ${majStart(className)} returned by the API
                * @param err Optional error message
                * @param pagination Optional pagination data
              */
              const handleResponse = (
                data: ${majStart(className)}[],
                err: string | undefined,
                pagination?: PaginationData,
                concatData: boolean = false,
              ) => {
                if (err) {
                  message.value = err
                }
                if (concatData) {
                  ${minStart(className)}s.value = ${minStart(className)}s.value.concat(data)
                } else {
                  ${minStart(className)}s.value = data
                }
                if (pagination !== undefined) {
                  paginationData.value = new PaginationData(pagination)
                }
              }

              // Navigation functions
              /** Navigate to ${minStart(className)} detail view */
              const view${majStart(className)} = (${minStart(className)}: ${majStart(className)}) => {
                router.push({ name: "${minStart(className)}detailsview", params: { id: ${minStart(className)}.getKeyValue() } })
              }

              /** Navigate to ${minStart(className)} list view */
              const goToListView = () => {
                router.push({ path: "/${minStart(className)}s" })
              }{{#if !isView}}

              /** Navigate to ${minStart(className)} create form */
              const goToCreateFormView = () => {
                router.push({ path: "/${minStart(className)}s/create" })
              }

              /** Navigate to ${minStart(className)} update form */
              const goToUpdateFormView = (${minStart(className)}: ${majStart(className)}) => {
                router.push({ name: "${minStart(className)}updateview", params: { id: ${minStart(className)}.getKeyValue() } })
              }

              /**
               * Delete a ${minStart(className)} by id
               * @param ${minStart(className)} ${majStart(className)} object to delete
               */
              const delete${majStart(className)} = async (${minStart(className)}: ${majStart(className)}) => {
                const result = await ${minStart(className)}Service.remove(${minStart(className)}.getKeyValue())
                if (result.error) {
                  message.value = result.error
                }
                return result
              }{{/if}}

              {{#if notViewAndParent}}/**
               * Create a new ${minStart(className)}
               * @param fullData Object containing ${minStart(className)} and his details
               */
              const create${majStart(className)} = async (fullData: { ${minStart(className)}: Partial<${majStart(className)}FormDTO>{{#each children}}; ${minStart(this.className)}s: ${majStart(this.className)}FormDTO[]{{/each}} })=> {
                const dto = new ${majStart(className)}FormDTO(fullData.${minStart(className)})
                const ${minStart(className)}: Partial<${majStart(className)}> = await dto.toEntity()
                {{#each children}}
                const ${minStart(this.className)}s: Partial<${majStart(this.className)}>[] = await ${majStart(this.className)}FormDTO.toEntities(fullData.${minStart(this.className)}s)
                {{/each}}
                const { data, error, errors } = await ${minStart(className)}Service.create({ ${minStart(className)}{{#each children}}, ${minStart(this.className)}s{{/each}} })
                if (error) {
                  message.value = error
                }
                return { data, errors }
              }
              {{elseIf !isView}}
              /**
               * Create a new ${minStart(className)}
               * @param ${minStart(className)}FormDTO ${majStart(className)} object to create
               */
              const create${majStart(className)} = async (${minStart(className)}FormDTO: Partial<${majStart(className)}FormDTO>) => {
                const dto = new ${majStart(className)}FormDTO(${minStart(className)}FormDTO)
                const ${minStart(className)}: Partial<${majStart(className)}> = await dto.toEntity()
                const { data, error, errors } = await ${minStart(className)}Service.create(${minStart(className)})
                if (error) {
                  message.value = error
                }
                return { data, errors }
              }
              {{/if}}
              {{#if notViewAndParent}}/**
              * Update an existing ${minStart(className)} with full details
              * @param id ${majStart(className)} ID to update
              * @param fullData Object containing ${minStart(className)} and its details
              */
              const update${majStart(className)} = async (
                id: number | string,
                fullData: {
                  ${minStart(className)}: Partial<${majStart(className)}FormDTO>
                  {{#each children}}; ${minStart(this.className)}s: ${majStart(this.className)}FormDTO[]{{/each}} 
                },
              ) => {
                const dto = new ${majStart(className)}FormDTO(fullData.${minStart(className)})
                const ${minStart(className)}: Partial<${majStart(className)}> = await dto.toEntity()

                {{#each children}}
                const ${minStart(this.className)}s: Partial<${majStart(this.className)}>[] = await ${majStart(this.className)}FormDTO.toEntities(
                  fullData.${minStart(this.className)}s,
                )
                {{/each}}
                const { data, error, errors } = await ${minStart(className)}Service.update(
                id, 
                { 
                  ${minStart(className)}
                  {{#each children}}
                  , ${minStart(this.className)}s
                  {{/each}} 
                }
               )
               if (error) {
                message.value = error
               }
               return { data, errors }
              }
              {{elseIf !isView}}
              /**
               * Update an existing ${minStart(className)}
               * @param ${minStart(className)}FormDTO ${majStart(className)} object to update
               */
              const update${majStart(className)} = async (id: number | string,${minStart(className)}FormDTO: Partial<${majStart(className)}FormDTO>) => {
                const dto = new ${majStart(className)}FormDTO(${minStart(className)}FormDTO)
                const ${minStart(className)}: Partial<${majStart(className)}> = await dto.toEntity()
                const { data, error } = await ${minStart(className)}Service.update(id, ${minStart(className)})
                if (error) {
                  message.value = error
                }
                return data
              }{{/if}}

              // API Requests
              /** Load all ${minStart(className)}s from the API */
              const load${majStart(className)}s = async (
                unpagined: boolean = false,
                pagination?: PaginationRequestParameter,
                sortFields?: SortFieldParameter[],
              ): Promise<void> => {
                message.value = null
                startLoading()
                const {
                  data,
                  error: err,
                  pagination: paginationresult,
                } = await ${minStart(className)}Service.getAll(pagination, sortFields)
                handleResponse(data, err, paginationresult)

                if (unpagined && ${minStart(className)}s.value.length > 0) {
                  while (paginationData.value.hasNext()) {
                    paginationData.value.nextPage()
                    const {
                      data: nextData,
                      error: nextErr,
                      pagination: nextPagination,
                    } = await ${minStart(className)}Service.getAll(paginationData.value.toParameter(), sortFields)
                    handleResponse(nextData, nextErr, nextPagination, true)
                  }
                }
                stopLoading()
              }
            
              /**
               * Get a single ${minStart(className)} by id
               * @param id ${majStart(className)} ID
               */
              const get${majStart(className)}ById = async (id: number | string) => {
                const result = await ${minStart(className)}Service.getById(id)
                if (result.error) {
                  message.value = result.error
                }
                return result
              }

              /**
               * Search ${minStart(className)}s with filters, pagination, and sorting
               * @param filters Partial ${majStart(className)} object containing search filters
               * @param pagination Pagination request parameters
               * @param sortFields Array of fields to sort
               */
              const search${majStart(className)}s = async (
                unpagined: boolean = false,
                filters: Partial<${majStart(className)}>,
                pagination: PaginationRequestParameter,
                sortFields: SortFieldParameter[],
              ) => {
                message.value = null
                startLoading()
                const {
                  data,
                  error: err,
                  pagination: paginationresult,
                } = await ${minStart(className)}Service.search(filters, pagination, sortFields)
                handleResponse(data, err, paginationresult)

                if (unpagined) {
                  while (paginationData.value.hasNext()) {
                    paginationData.value.nextPage()
                    const {
                      data: nextData,
                      error: nextErr,
                      pagination: nextPagination,
                    } = await ${minStart(className)}Service.search(filters, paginationData.value.toParameter(), sortFields)
                    handleResponse(nextData, nextErr, nextPagination, true)
                  }
                }
                stopLoading()
              }
              const export${majStart(className)}sToCsv = async (data: Partial<${majStart(className)}[]>) => {
                console.log('Exporting ${majStart(className)} to CSV', data)
                await ${minStart(className)}Service.exportCsv(data)
              }
              {{#if isChildTable}}
              {{#each parents}}
              const getAll${majStart(className)}sBy${majStart(this.className)}Id = async (
                ${minStart(this.className)}Id: number | string | undefined,
                unpagined: boolean = false,
                pagination: PaginationRequestParameter,
                sortFields: SortFieldParameter[],
              ) => {
                message.value = null
                startLoading()
                const {
                  data,
                  error: err,
                  pagination: paginationresult,
                } = await ${minStart(className)}Service.getAllBy${majStart(this.className)}Id(${minStart(this.className)}Id, pagination, sortFields)
                handleResponse(data, err, paginationresult)
                
                if (unpagined) {
                  while (paginationData.value.hasNext() && ${minStart(className)}s.value.length > 0) {
                    paginationData.value.nextPage()
                    const {
                      data: nextData,
                      error: nextErr,
                      pagination: nextPagination,
                    } = await ${minStart(className)}Service.getAllBy${majStart(this.className)}Id(
                      ${minStart(this.className)}Id,
                      paginationData.value.toParameter(),
                      sortFields,
                    )
                    handleResponse(nextData, nextErr, nextPagination, true)
                  }
                }
                stopLoading()
              }
              {{/each}}{{/if}}
              /** Getter for pagination data */
              const getPaginationData = () => paginationData.value

              return {
                ${minStart(className)}s,
                loading,
                message,
                paginationData,
                getPaginationData,
                export${majStart(className)}sToCsv,
                load${majStart(className)}s,
                search${majStart(className)}s,
                get${majStart(className)}ById,
                view${majStart(className)},
                goToListView,{{#if !isView}}
                goToCreateFormView,
                goToUpdateFormView,
                delete${majStart(className)},
                create${majStart(className)},
                update${majStart(className)},{{/if}}
              }
            }
          destinationPath: "${destinationFolder}/src/composables"

        - fileType: "Entity Routes"
          fileName: "${minStart(className)}Routes"
          extension: "ts"
          content: |
            import type { RouteRecordRaw } from 'vue-router'

            const ${minStart(className)}Routes: Array<RouteRecordRaw> = [
              {
                path: '${minStart(className)}s',
                name: '${minStart(className)}listview',
                component: () => import('@/views/${minStart(className)}/${majStart(className)}ListView.vue'),
                {{#if useJWT}}meta: { requiresAuth: true },{{/if}}
              },
              {
                path: '${minStart(className)}s/:id',
                name: '${minStart(className)}detailsview',
                component: () => import('@/views/${minStart(className)}/${majStart(className)}DetailsView.vue'),
                {{#if useJWT}}meta: { requiresAuth: true },{{/if}}
              },{{#if isView=false and useJWT=true}}
              {
                path: '${minStart(className)}s/update/:id',
                name: '${minStart(className)}updateview',
                component: () => import('@/views/${minStart(className)}/${majStart(className)}UpdateView.vue'),
                meta: { requiresAuth: true },
              },
              {
                path: '${minStart(className)}s/create',
                name: '${minStart(className)}createview',
                component: () => import('@/views/${minStart(className)}/${majStart(className)}CreateView.vue'),
                meta: { requiresAuth: true },
              },{{elseIf !isView}}
              {
                path: '${minStart(className)}s/update/:id',
                name: '${minStart(className)}updateview',
                component: () => import('@/views/${minStart(className)}/${majStart(className)}UpdateView.vue'),
              },
              {
                path: '${minStart(className)}s/create',
                name: '${minStart(className)}createview',
                component: () => import('@/views/${minStart(className)}/${majStart(className)}CreateView.vue'),
              },{{/if}}
            ]

            export default ${minStart(className)}Routes

          destinationPath: "${destinationFolder}/src/router/entities"

    - componentType: "Details Component"
      generateForView: true
      router:
        link: ""
        label: "{{removeLine}}"
      componentName: "${majStart(className)}Details"
      importFile: |
        import type { PropType } from 'vue'
        import type { ${majStart(className)} } from '@/models/${majStart(className)}Model'{{#if !isView}}
        import GenesisButton from '@/components/button/GenesisButton.vue'
        import { usePopup } from '@/composables/usePopup'
        import { use${majPluralize(className)} } from '@/composables/use${majPluralize(className)}'
        import DeleteConfirmationPopup from '@/components/popup/DeleteConfirmationPopup.vue'
        import TrashIcon from '@/components/icons/TrashIcon.vue'
        import EditIcon from '@/components/icons/EditIcon.vue'{{/if}}
      selector: "${majStart(className)}Details"
      standalone: true
      importComponent: "{{removeLine}}"
      template: |
        <template>
          <div class="card bg-base-100">
            <div class="card-body">
              <div v-if="${minStart(className)}">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {{#each fields}}
                  <div>
                    <label for="${minStart(className)}${majStart(this.name)}" class="block text-sm font-medium mb-1">${formatReadable(this.name)}</label>
                    <div id="${minStart(className)}${majStart(this.name)}" class="input w-full bg-base-100 cursor-default">
                      <span>{{ ${minStart(className)}.${this.name}{{#if this.isForeignKey}}?.getReferenceValue() ?? ''{{elseIf this.isDate}}? $d(${minStart(className)}.${this.name}, 'long'):'--/--/--' {{elseIf this.isNumeric}}? $n(${minStart(className)}.${this.name}, 'decimal'): '--'{{else}} ?? ''{{/if}} }}</span>
                    </div>
                  </div>
                  {{/each}}{{removeLine}}
                </div>
                {{removeLine}}{{#if !isView}}
                <div class="flex justify-end gap-3 mt-6">
                  <GenesisButton @click="goToUpdateFormView(${minStart(className)})" class="btn btn-outline btn-neutral">
                    <EditIcon class="mr-2" />
                    <span>{{ $t('button.update') }}</span>
                  </GenesisButton>
                  <GenesisButton 
                    @click="openDeletePopup(${minStart(className)})" 
                    class="btn-outline btn-error hover:text-white"
                  >
                    <TrashIcon class="mr-2" />
                    <span>{{ $t('button.delete') }}</span>
                  </GenesisButton>
                </div>{{/if}}
              </div>
            </div>
          </div>{{#if !isView}}
          <DeleteConfirmationPopup
            :visible="deletePopup"
            :message="`Êtes-vous sûr de vouloir supprimer ${majStart(className)} ${minStart(className)}?.id ?`"
            subMessage="Cette action est irréversible."
            @confirm="confirmDelete"
            @cancel="closePopup"
          />{{/if}}
        </template>
      export: |
        {{#if isView}}
        defineProps({
          ${minStart(className)}: {
            type: Object as PropType<${majStart(className)}>,
            required: true,
          },
        }){{else}}
        const props = defineProps({
          ${minStart(className)}: {
            type: Object as PropType<${majStart(className)}>,
            required: true,
          },
        })
        // Stores
        const { closePopup, openPopup, visible: deletePopup } = usePopup(false)
        const { delete${majStart(className)}, goToListView, goToUpdateFormView } = use${majPluralize(className)}()
        
        // Methods
        const openDeletePopup = (entity: ${majStart(className)}) => {
          if (!entity) return
          openPopup()
        }

        const confirmDelete = async () => {
          const { success, error } = await delete${majStart(className)}(props.${minStart(className)})
          if (!success) console.error(error)
          closePopup()
          goToListView()
        }{{/if}}
      style: "<style scoped></style>"
      destinationPath: "${destinationFolder}/src/entities/${minStart(className)}"
      componentAdditionalFiles: [ ]

    - componentType: "Details View"
      generateForView: true
      router:
        link: "/${minPluralize(className)}/:id"
        label: "{{removeLine}}"
      componentName: "${majStart(className)}DetailsView"
      importFile: |
        import { ref, onMounted } from 'vue'
        import { useRoute } from 'vue-router'
        import ${majStart(className)}Details from '@/entities/${minStart(className)}/${majStart(className)}Details.vue'
        import { use${majPluralize(className)} } from '@/composables/use${majPluralize(className)}'
        import { ${majStart(className)} } from '@/models/${majStart(className)}Model'
        import GenesisButton from '@/components/button/GenesisButton.vue'
        import LeftArrowIcon from '@/components/icons/LeftArrowIcon.vue'{{#if isParentTable}}
        import EntityTable from '@/components/table/EntityTable.vue'
        import type { EntitySearchField } from '@/models/EntityModel'
        import type { PaginationRequestParameter, SortFieldParameter } from '@/models/api/RequestModel'
        {{#each children}}
        import { use${majStart(this.className)}s } from '@/composables/use${majStart(this.className)}s'
        import { ${majStart(this.className)} } from '@/models/${majStart(this.className)}Model'
        import ${majStart(this.className)}List from '@/entities/${minStart(this.className)}/${majStart(this.className)}List.vue'
        {{/each}}{{/if}}
      selector: "${majStart(className)}DetailsView"
      standalone: true
      importComponent: "{{removeLine}}"
      template: |
        <template>
          <div class="w-full">
            <!-- Header -->
            <div class="flex items-center justify-between mb-6">
              <h3 class="text-xl font-semibold text-base-content">
                {{ $t('entity.nav', { entity: '${majStart(className)}' }) }}
                <span class="text-base-content/50 font-normal">{{ $t('entity.details.nav') }}</span>
              </h3>
  
              <!-- Back button -->
              <GenesisButton
                :title="$t('button.backToListDescription')"
                @click="goToListView"
                class="btn-secondary"
              >
                <LeftArrowIcon />
                {{ $t('button.backToList') }}
              </GenesisButton>
            </div>
            <!-- Entity details -->
            <${majStart(className)}Details v-if="entity" :${minStart(className)}="entity" />
            {{#if isParentTable}}
            {{#each children}}
            <div class="card bg-base-100 border border-base-300">
              <div class="card-body">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-base-300">
                  <div class="flex items-center gap-3">
                    <div>
                      <div class="flex items-center gap-2">
                        <h2 class="text-lg font-semibold text-base-content">
                          {{ $t('entities.${minStart(className)}.nav.title') }}
                        </h2>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="mt-4">
                  <EntityTable
                    :entity-model="${minStart(this.className)}Entity"
                    :entity-search-fields="${minStart(this.className)}SearchFields"
                    :default-active-filters="['${minStart(this.parentName)}']"
                    :searchFn="get{majStart(this.className)}sData"
                    :getPaginationData="${minStart(this.className)}GetPaginationData"
                    :listComponent="${majStart(this.className)}List"
                    :entities="${minStart(this.className)}s"
                    :message="${minStart(this.className)}Message"
                    :show-filters="false"
                    :edit-action="false"
                    :remove-action="false"
                  />
                </div>
              </div>
            </div>            
            {{/each}}
            {{/if}}
          </div>
        </template>

      style: "<style scoped></style>"
      export: |
        const route = useRoute()
        const pathId = Number(route.params.id)
        const { get${majStart(className)}ById, goToListView } = use${majPluralize(className)}()
        const entity = ref<${majStart(className)} | null>(null)
        {{#if isParentTable}}
        {{#each children}}
        const {
          ${minStart(this.className)}s,
