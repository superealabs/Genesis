    - fileType: "Auth composable"
      fileName: "useAuth"
      extension: "ts"
      content: |
        import { useRouter } from 'vue-router'
        import * as authService from '@/services/AuthService.ts'
        import { useAuthenticationStore } from '@/stores/useAuthenticationStore.ts'
        import { computed } from 'vue'

        export function useAuth() {
          const router = useRouter()
          const goToLoginView = () => {
            router.push({ path: '/auth/login' })
          }
          const goToProfileView = () => {
            router.push({ path: '/profile' })
          }

          const loginUser = async (token: string) => {
            useAuthenticationStore().setToken(token)
            const responseData = await authService.currentUser()
            if (responseData.success && responseData.data) {
              useAuthenticationStore().setCurrentUser(responseData.data)
            } else {
              throw new Error('Authentcation succed but the token is invalid')
            }
          }

          const isLoggedIn = computed(() => {
            const token = useAuthenticationStore().getToken()
            return token != null && token.length > 0
          })

          const getAuthorizationHeader = () => {
            if (
              useAuthenticationStore().getToken() == null ||
              useAuthenticationStore().getToken().length == 0
            )
              return {}
            return {
              Authorization: 'Bearer ' + useAuthenticationStore().getToken(),
            }
          }

          const getCurrentUser = () => {
            const user = useAuthenticationStore().getCurrentUser()
            return user
          }

          const logout = async () => {
            const responseData = await authService.logout()
            if (!responseData.success) {
              console.error('Logout failed:', responseData.error)
            }
            useAuthenticationStore().clear()
            goToLoginView()
          }

          return {
            goToLoginView,
            goToProfileView,
            loginUser,
            getAuthorizationHeader,
            getCurrentUser,
            logout,
            isLoggedIn,
          }
        }
      destinationPath: "${destinationFolder}/src/composables"

    - fileType: "Auth store"
      fileName: "useAuthenticationStore"
      extension: "ts"
      content: |
        import { defineStore } from 'pinia'
        import { computed, ref } from 'vue'
        import { User } from '@/models/auth/UserModel.ts'

        export const useAuthenticationStore = defineStore('authenticationStore', () => {
          // Try to load from localStorage
          const storedUser = localStorage.getItem('currentUser')
          const storedToken = localStorage.getItem('userToken')

          const currentUser = ref<User>(storedUser ? JSON.parse(storedUser) : User.voidUser())
          const userToken = ref<string>(storedToken ?? '')

          const setToken = (token: string) => {
            userToken.value = token
            localStorage.setItem('userToken', token)
          }

          const getToken = () => {
            return userToken.value
          }

          const setCurrentUser = (user: User) => {
            currentUser.value = user
            localStorage.setItem('currentUser', JSON.stringify(user))
          }

          const getCurrentUser = () => {
            return currentUser.value
          }

          const getCurrentUsername = computed((): string => {
            const user = getCurrentUser()
            return user?.username || 'John Doe'
          })

          // Optional: a clear function (logout)
          const clear = () => {
            currentUser.value = User.voidUser()
            userToken.value = ''
            localStorage.removeItem('currentUser')
            localStorage.removeItem('userToken')
          }

          return {
            setToken,
            getToken,
            getCurrentUser,
            setCurrentUser,
            getCurrentUsername,
            clear,
          }
        })
      destinationPath: "${destinationFolder}/src/stores"

    - fileType: "Login Form"
      fileName: "LoginForm"
      extension: "vue"
      content: |
        <template>
          <form class="space-y-4 text-base-content" @submit.prevent="handleLogin">
            <div v-if="isBadCredentials" class="text-center">
              <ErrorMessage :message="$t('authentication.invalid')" />
            </div>
            <div>
              <GenesisInput
                v-model="login"
                required
                :mandatory="true"
                :violation="usernameError"
                :label="$t('authentication.username')"
                placeholder="ex: JohnDoe"
                type="text"
              />
            </div>
            <div>
              <PasswordInput
                v-model="password"
                :violation="passwordError"
                :label="$t('authentication.password')"
              />
            </div>
            <button
              type="submit"
              class="mt-3 btn btn-primary text-primary-content w-full"
              :disabled="isLoading"
            >
              <span v-if="isLoading" class="loading loading-spinner"></span>
              <span v-else>{{ $t('authentication.submit') }}</span>
            </button>
          </form>
        </template>

        <script setup lang="ts">
        import GenesisInput from '@/components/form/GenesisInput.vue'
        import { ref } from 'vue'
        import * as authService from '@/services/AuthService.ts'
        import { LoginValidator } from '@/models/validators/LoginValidator.ts'
        import { validators } from '@/utils/validators.ts'
        import ErrorMessage from '@/components/common/ErrorMessage.vue'
        import type { DataResponse } from '@/models/api/DataResponseModel.ts'
        import { useRouter } from 'vue-router'
        import { useAuth } from '@/composables/useAuth.ts'
        import PasswordInput from '@/components/form/PasswordInput.vue'

        const authentication = useAuth()
        const router = useRouter()
        const login = ref('')
        const password = ref('')
        const usernameError = ref<string | undefined>('')
        const passwordError = ref<string | undefined>('')
        const isLoading = ref(false)
        const isBadCredentials = ref(false)

        const handleLogin = async () => {
          usernameError.value = undefined
          passwordError.value = undefined
          let valid = true
          usernameError.value = validators.checkRules(login.value, LoginValidator.usernameRules)
          if (usernameError.value) valid = false

          passwordError.value = validators.checkRules(password.value, LoginValidator.passwordRules)
          if (passwordError.value) valid = false

          if (!valid) return

          isLoading.value = true

          try {
            const loginData: DataResponse<string> = await authService.login(login.value, password.value)
            if (loginData.success) {
              await authentication.loginUser(loginData.data as string)
              router.push({ name: 'home' })
            } else {
              throw new Error(loginData.error)
            }
          } catch (e: unknown) {
            isBadCredentials.value = true
          } finally {
            isLoading.value = false
          }
        }
        </script>
      destinationPath: "${destinationFolder}/src/components/auth"

