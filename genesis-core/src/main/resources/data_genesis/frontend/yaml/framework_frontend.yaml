    - componentType: "details"
      router:
        link: " "
        label: " "
      importFile: |
        import { Component, OnInit, OnDestroy } from '@angular/core';
        import { CommonModule } from '@angular/common';
        import { HttpClientModule } from '@angular/common/http';
        import { ActivatedRoute,Router } from '@angular/router';
        import { takeUntil } from 'rxjs/operators';
        import { Subject } from 'rxjs';
        
        import { warnMeUp } from '../../../../utilities/utilities';

        import { PageHeaderComponent } from '../../../shared/page-header/page-header.component';
        import { LoadingIconComponent } from '../../../shared/loading-icon/loading-icon.component';
        import { DetailViewComponent } from '../../../shared/detail-view/detail-view.component';

        import { ${majStart(className)} } from '../models/${toKebabCase(className)}.model';
        import { ${majStart(className)}Service } from '../services/${toKebabCase(className)}.service';
      selector: "app-${toKebabCase(className)}-details"
      generateForView: false
      standalone: true
      importComponent: "[CommonModule, HttpClientModule, PageHeaderComponent, LoadingIconComponent, DetailViewComponent]"
      template: "./${toKebabCase(className)}-details.component.html"
      style: "./${toKebabCase(className)}-details.component.css"
      export: |
        export class ${majStart(className)}DetailsComponent implements OnInit, OnDestroy
        {
            private destroy$ = new Subject<void>();
            
            ${minStart(className)}?: ${majStart(className)};
            id?:string ;
            isLoading = false;
            
            constructor(
              private route: ActivatedRoute,
              private navigator: Router,
              private ${minStart(className)}Service: ${majStart(className)}Service
            ) {}
            
            ngOnInit(): void {
                const ${minStart(className)}Id = this.route.snapshot.paramMap.get('id');
                if (${minStart(className)}Id) {
                this.id=${minStart(className)}Id;
                this.load${majStart(className)}(${minStart(className)}Id);
              }
            }
              load${majStart(className)}(id: string): void {
                  this.isLoading = true;
                  this.${minStart(className)}Service.get${majStart(className)}ById(id)
                  .pipe(takeUntil(this.destroy$))
                  .subscribe({
                  next: (${minStart(className)}: ${majStart(className)}) => {
                          this.${minStart(className)} = ${minStart(className)};
                          this.isLoading = false;
                },
                  error: (err) => {
                    console.error('Error loading product:', err);
                    warnMeUp('error', 'Error while fetching ${minStart(className)}');
                    this.isLoading = false;
                }
                });
              }
        
            ngOnDestroy(): void {
                this.destroy$.next();
                this.destroy$.complete();
            }
            
            delete${majStart(className)} = (id:string) => {
                this.${minStart(className)}Service.delete${majStart(className)}ById(id.toString()).pipe(takeUntil(this.destroy$)).subscribe({
                next: () => {
                  warnMeUp('success','line of data deleted successfully','#28a745','success') ;
                  this.navigator.navigate(['${toKebabCase(className)}s']);
              },
                error: (err) => {
                  console.error('error while deleting ${minStart(className)} :', err);
                  warnMeUp('error','error while deleting ${minStart(className)}');
              }
              });
            }
            
        }
      destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(className)}/${toKebabCase(className)}-details"
      componentName: "${toKebabCase(className)}-details.component"
      componentAdditionalFiles:
        - fileType: "html template"
          fileName: "${toKebabCase(className)}-details.component"
          extension: "html"
          content: |
            <app-page-header name="${majStart(className)}s" context="Details" [isView]=true [isDetail]=true></app-page-header>

            <app-loading-icon [isLoading]="isLoading"></app-loading-icon>

            <div *ngIf="!isLoading && ${minStart(className)}">
              <app-detail-view [object]="${minStart(className)}" [deletfn]="delete${majStart(className)}.bind(this)" [id]="this.id"></app-detail-view>
            </div>
          destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(className)}/${toKebabCase(className)}-details"
        - fileType: "css template"
          fileName: "${toKebabCase(className)}-details.component"
          extension: "css"
          content: |
            {{newline}}
          destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(className)}/${toKebabCase(className)}-details"
  serviceComponent:
    imports: |
      import { Injectable } from '@angular/core';
