- id: 1
  languageId: 1
  coreFramework: "Angular"
  name: "Angular App"
  template: "Angular-template"
  initPath: "angular/angular-skeletoon"
  componentExtension: "ts"
  additionalFiles:
    - fileType: "App-files"
      fileName: "app.component"
      extension: "ts"
      content: | 
        content0
      destinationPath: "${destinationFolder}"
    - fileType: "App-files"
      fileName: "app.component"
      extension: "html"
      content: |
        content1
      destinationPath: "${destinationFolder}"
    - fileType: "App-files"
      fileName: "app.component"
      extension: "css"
      content: |
        content2
      destinationPath: "${destinationFolder}"
  components:
    - componentType : "list"
      importFile: | 
         allImport
      selector: "test1"
      standalone: "true"
      importComponent: |
        allImport
      template: |
        templateURL
      style: |
        styleURL
      export: |
        export
      destinationPath: "${destinationFolder}"
      componentName : "${EntityName}ListTest"
      componentAdditionalFiles:
        - fileType: "html template"
          fileName: "${EntityName}test1.component"
          extension: "html"
          content: |
            content
          destinationPath: "${destinationFolder}"
        - fileType: "css template"
          fileName: "${EntityName}test2.component"
          extension: "css"
          content: |
            content
          destinationPath: "${destinationFolder}"
    - componentType: "form"
      importFile: |
        allImport
      selector: "test2"
      standalone: "true"
      importComponent: |
        allImport
      template: |
        templateURL
      style: |
        styleURL
      export: |
        export
      destinationPath: "${destinationFolder}"
      componentName: "${EntityName}FormTest"
      componentAdditionalFiles:
        - fileType: "html template"
          fileName: "${EntityName}Form.component"
          extension: "html"
          content: |
            content1
          destinationPath: "${destinationFolder}"
        - fileType: "css template"
          fileName: "$${EntityName}Form.component"
          extension: "css"
          content: |
            content2
          destinationPath: "${destinationFolder}"
  serviceComponent:
    imports: |
       importService
    methods: |
      methodService
    destinationPath: "${destinationFolder}"
    name: "${EntityName}Service"
  modelComponent:
    imports: |
      importsComponents
    exports : |
      exportsComponents
    destinationPath: "${destinationFolder}"
    name: "${EntityName}Model"

- id: 2
  languageId: 1
  coreFramework: "VueJs"
  name: "Vue3 + Typescript App"
  template: "Vue3TS-template"
  initPath: "vue/vue-3-ts-skeletoon"
  componentExtension: "ts"
  additionalFiles:
    - fileType: "App-Vue"
      fileName: "App"
      extension: "vue"
      content: |
        <template>
          <div class="d-flex" id="app-layout">
            <GenesisSidebar />
            <!-- Main content -->
            <div class="bg-light flex-grow-1 p-4">
              <router-view />
            </div>
          </div>
        </template>
        
        <script setup lang="ts">
        import GenesisSidebar from "./core/navbar/GenesisSidebar.vue";
        </script>
        
        <style scoped></style>
      destinationPath: "${webapp}/src"

    - fileType: "Router Index"
      fileName: "index"
      extension: "ts"
      content: |
        import { createRouter, createWebHistory, RouteRecordRaw } from "vue-router";
        import HomeView from "../views/HomeView.vue";
        {{#each fields}}
        import ${majStart(EntityName)}ListView from "@/views/${minStart(EntityName)}/list/${majStart(EntityName)}ListView.vue";{{newline}}
        {{/each}}

        const routes: Array<RouteRecordRaw> = [
          {
            path: "/",
            name: "home",
            component: HomeView,
          },
          {{#each fields}}
          import Routes from "./${minStart(EntityName)}.router";
          {
              path: "/${minPluralize(EntityName)}",
              name: "${majStart(EntityName)}ListView",
              component: ${majStart(EntityName)}ListView,
          },{{newline}}
          {{/each}}
        ];

        const router = createRouter({
          history: createWebHistory(process.env.BASE_URL),
          routes,
        });

        export default router;
      destinationPath: "${webapp}/src/router"

  components:
    - componentType : "List Component"
      componentName : "${majStart(EntityName)}ListComponent"
      importFile: |
        import GenesisButton from "@/core/button/GenesisButton.vue";
        import { ${majStart(EntityName)} } from "@/shared/models/${majStart(EntityName)}Model";
        import { defineComponent, PropType } from "vue";
      selector: "${majStart(EntityName)}List"
      standalone : true
      importComponent : |
        GenesisButton,${majStart(EntityName)}
      template : |

      style : |

      export : |
        props: {
          ${minPluralize(EntityName)}: {
            required: true,
            type: Array as PropType<${majStart(EntityName)}[]>,
          },
        },
        setup(props) {
          return {};
        }
      destinationPath : "${webapp}/src/entities/${minStart(EntityName)}"
      componentAdditionalFiles :
        - fileType: "List Vue"
          fileName: "${majStart(EntityName)}List"
          extension: "vue"
          content: |
            <template>
              <table class="table align-middle table-rounded text-nowrap">
                <thead class="table-light">
                  <tr>
                    {{#each fields}}
                    <th >${majStart(this.columnName)}</th>{{newline}}
                    {{/each}}
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="${minStart(EntityName)} in ${minPluralize(EntityName)}" :key="product.id" class="border-bottom">
                    {{#each fields}}
                    <td>{{ ${minStart(EntityName)}.${minStart(this.columnName)} }}</td>{{newline}}
                    {{/each}}
                    <td class="text-end">
                      <div class="d-inline-flex gap-2">
                      <GenesisButton icon="fas fa-eye" class="btn-light shadow-sm" />
                      <GenesisButton icon="fas fa-edit" class="btn-light shadow-sm" />
                      <GenesisButton icon="fas fa-trash" class="btn-light shadow-sm" />
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </template>
            
            <script src="./${majStart(EntityName)}ListComponent.ts" lang="ts"></script>
            
            <style scoped>
            .table thead th {
              background-color: #537cc226;
              color: #4e4e4e;
              font-weight: 600;
              vertical-align: middle;
              border-bottom: 2px solid #dee2e6;
            }
              
            .table td,
            .table th {
              vertical-align: middle;
              padding: 0.75rem;
            }
              
            .btn-light {
              border-radius: 0.5rem;
              transition: background 0.2s ease-in-out;
            }
              
            .btn-light:hover {
              background-color: #f1f3f5;
            }
            </style>
          destinationPath: "${webapp}/src/entities/${minStart(EntityName)}"

  serviceComponent:
    imports: |
    methods: |
    destinationPath: "${webapp}/src/shared/services"
    name: "${majStart(EntityName)}Service"
  modelComponent:
    imports: |
    exports: |
      export interface I${majStart(EntityName)} {
        id: string;
        name: string;
        price: number;
      }
      
      export class ${majStart(EntityName)} implements I${majStart(EntityName)} {
        {{#each fields}}
        ${minStart(this.columnName)}: ${lowerCase(this.typeBase)};{{newline}}
        {{/each}}
      
        constructor(
          {{#each fields}}
            ${minStart(this.columnName)}: ${lowerCase(this.typeBase)}{{#if !@last}},{{/if}}{{newline}}
          {{/each}}
        ) {
          {{#each fields}}
            this.${minStart(this.columnName)} = ${minStart(this.columnName)};{{newline}}
          {{/each}}
        }
      }

    exportsComponents: |
    destinationPath: "${webapp}/src/shared/modelss"
    name: "${majStart(EntityName)}Model"

