      fileName: "app.component"
      extension: "html"
      content: |
        content1
      destinationPath: "${destinationFolder}"
    - fileType: "App-files"
      fileName: "app.component"
      extension: "css"
      content: |
        content2
      destinationPath: "${destinationFolder}"
  components:
    - componentType : "list"
      importFile: | 
         allImport
