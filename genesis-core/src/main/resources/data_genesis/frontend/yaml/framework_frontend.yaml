                    {{/if}}{{removeLine}}
                ],
                tabs: [
                    //Example use of tab
                    //{
                        //label: 'Tab1',
                        //render: (row: ${majStart(className)}) => (
                            //<Typography>Content for ${majStart(className)} ID #{row.{{#each fieldsPK}}${this.name}{{/each}} }.</Typography>
                        //),
                    //},
                ],
            })();
        }
      destinationPath: "${destinationFolder}/src/pages/${toKebabCase(className)}"
      componentName: "${toKebabCase(className)}-detail"
      componentAdditionalFiles: [ ]
    - componentType: "Add"
      router:
        link: "/${toKebabCase(className)}s/create"
        label: "Create ${formatReadable(classNameLink)}"
      importFile: |
        import {${majStart(className)}, ${toCamelCase(className)}Meta, formFields} from '@/models/${toKebabCase(className)}/${toKebabCase(className)}.model';
        import { ${toCamelCase(className)}Service } from '@/models/${toKebabCase(className)}/${toKebabCase(className)}.service';
      selector: "Create${majStart(className)}"
