            content1
          destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(EntityName)}/${toKebabCase(EntityName)}-list"
        - fileType: "css template"
          fileName: "${toKebabCase(EntityName)}-list.component"
          extension: "css"
          content: |
            content2
          destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(EntityName)}/${toKebabCase(EntityName)}-list"
    - componentType: "form"
      router:
        link: "/${minPluralize(EntityName)}"
        label: "${majStart(EntityName)}"
      importFile: |
        allImport
      selector: "app-${toKebabCase(EntityName)}-form"
      generateForView: true
      standalone: true
      importComponent: |
        allImport
      template: |
        templateURL
      style: |
        styleURL
      export: |
        export
      destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(EntityName)}/${toKebabCase(EntityName)}-form"
      componentName: "${toKebabCase(EntityName)}-form.component"
      componentAdditionalFiles:
        - fileType: "html template"
          fileName: "${toKebabCase(EntityName)}-form.component"
          extension: "html"
          content: |
            content1
          destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(EntityName)}/${toKebabCase(EntityName)}-form"
        - fileType: "css template"
          fileName: "${toKebabCase(EntityName)}-form.component"
          extension: "css"
          content: |
            content2
          destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(EntityName)}/${toKebabCase(EntityName)}-form"
  serviceComponent:
    imports: |
      import { Injectable } from '@angular/core';
      import { HttpClient, HttpParams  } from '@angular/common/http';
      import { Observable, catchError, throwError, map,of } from 'rxjs';
      import { cleanObject } from '../../../../utilities/utilities';
      import { environment } from '../../../../environments/environment';
      import { ${toPascalCase(EntityName)}ListDTO,${toPascalCase(EntityName)}DTO,${toPascalCase(EntityName)} } from '../models/${toKebabCase(EntityName)}.model'
    methods: |
      export class ${toPascalCase(EntityName)}Service{
      {{tab}}private readonly apiUrl = environment.apiUrl+'/${lowerCase(classNameLink)}';
      {{tab}}constructor(private http: HttpClient) {}
      
        search${majStart(classNameLink)}(
            criteria: Partial<${majStart(className)}>,
            page: number = 0,
            size: number = 10,
            sortParam: string = '{{#each fieldsPK}}${this.name},asc;{{/each}}'
          ): Observable<${majStart(className)}[]> {
            const cleanedCriteria = cleanObject(criteria);
            const url = this.apiUrl+'/search';
      
            const params = new HttpParams()
            .set('page', page.toString())
            .set('size', size.toString())
            .set('sortParam', sortParam);
      
            return this.http.post<${majStart(className)}ListDTO>(url, cleanedCriteria, { params }).pipe(
              map((response) => response.data?.content ?? []),
              catchError(err => {
                const isNotFound = err.status === 404 ;
                if (isNotFound) {
                  return of([]);
                }
                else{
                  console.error('Error while searching ${lowerCase(classNameLink)}', err);
                  return throwError(() => err);
                }
              })
            );
        }
      
      
      {{tab}}get${toPascalCase(EntityName)}ById(id: string): Observable<${toPascalCase(EntityName)}> {
      {{tab}}{{tab}}const url = this.apiUrl+'/'+id;
      {{tab}}{{tab}}return this.http.get<${toPascalCase(EntityName)}DTO>(url).pipe(
      {{tab}}{{tab}}{{tab}}map((response) => response.data ?? []),
      {{tab}}{{tab}}{{tab}}catchError(err => {
      {{tab}}{{tab}}{{tab}}{{tab}}console.error(`Error while collecting data of ${toPascalCase(EntityName)} with id: ${id}`, err);
      {{tab}}{{tab}}{{tab}}{{tab}}return throwError(() => new Error('API calling error'));
      {{tab}}{{tab}}{{tab}}})
      {{tab}}{{tab}});
      {{tab}}}
      
      {{tab}}get${toPascalCase(EntityName)}s(page: number = 0,size: number = 10,sortParam: string = '{{#each fieldsPK}}${this.name},asc;{{/each}}'): Observable<${toPascalCase(EntityName)}[]> {
      {{tab}}{{tab}}const params = new HttpParams()
      {{tab}}{{tab}}{{tab}}.set('page', page.toString())
      {{tab}}{{tab}}{{tab}}.set('size', size.toString())
      {{tab}}{{tab}}{{tab}}.set('sortParam', sortParam);
      {{tab}}{{tab}}return this.http.get<${toPascalCase(EntityName)}ListDTO>(this.apiUrl, { params }).pipe(
      {{tab}}{{tab}}{{tab}}map(response => response.data?.content ?? []),
      {{tab}}{{tab}}{{tab}}catchError(err => {
      {{tab}}{{tab}}{{tab}}{{tab}}const isNotFound = err.status === 404 ;
      {{tab}}{{tab}}{{tab}}{{tab}}if (isNotFound) {
      {{tab}}{{tab}}{{tab}}{{tab}}{{tab}}return of([]);
      {{tab}}{{tab}}{{tab}}{{tab}}} else {
      {{tab}}{{tab}}{{tab}}{{tab}}{{tab}}console.error('Error while collecting  ${lowerCase(classNameLink)}', err);
      {{tab}}{{tab}}{{tab}}{{tab}}{{tab}}return throwError(() => err);
      {{tab}}{{tab}}{{tab}}{{tab}}}
      {{tab}}{{tab}}{{tab}}})
      {{tab}}{{tab}});
      {{tab}}}
      }
    destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(EntityName)}/services"
    name: "${toKebabCase(EntityName)}.service"
  modelComponent:
    imports: |
      {{#each fieldsFK}}
        import {${toPascalCase(this.type)}} from '../../${toKebabCase(this.type)}/models/${toKebabCase(this.type)}.model'
      {{/each}}
    exports : |
      export interface ${toPascalCase(EntityName)}
      {
      {{tab}}{{#each fields}}
      {{tab}}{{#if this.isForeignKey}}${this.name}: ${toPascalCase(this.type)}{{else}}
      {{tab}}${this.name}: ${this.typeBase}{{/if}}
      {{tab}}{{/each}}{{removeLine}}
      }
      
      export interface ${toPascalCase(EntityName)}DTO{
      {{tab}}status: number;
      {{tab}}message: string;
      {{tab}}returnCode: number;
      {{tab}}data: ${toPascalCase(EntityName)};
      {{tab}}timestamp: string;
      }
      
      export interface ${toPascalCase(EntityName)}ListDTO{
      {{tab}}status: number;
      {{tab}}message: string;
      {{tab}}returnCode: number;
      {{tab}}data: {
      {{tab}}{{tab}}content: ${toPascalCase(EntityName)}[];
      {{tab}}{{tab}}page: {
      {{tab}}{{tab}}{{tab}}size: number;
      {{tab}}{{tab}}{{tab}}number: number;
      {{tab}}{{tab}}{{tab}}totalElements: number;
      {{tab}}{{tab}}{{tab}}totalPages: number;
      {{tab}}{{tab}}};
      {{tab}}};
      {{tab}}timestamp: string;
      }
    destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(EntityName)}/models"
    name: "${toKebabCase(EntityName)}.model"

- id: 2
  languageId: 1
  coreFramework: "VueJs"
  name: "Vue3 + Typescript App"
  template: "Vue3TS-template"
  initPath: "vue/vue-3-ts-skeletoon"
  componentExtension: "vue"
  additionalFiles:
    - fileType: "App-Vue"
      fileName: "App"
      extension: "vue"
      content: |
        <template>
          <div class="d-flex" id="app-layout">
            <GenesisSidebar />
            <!-- Main content -->
            <div class="bg-light flex-grow-1 p-4">
              <router-view />
            </div>
          </div>
        </template>
        
        <script setup lang="ts">
        import GenesisSidebar from "./core/navbar/GenesisSidebar.vue";
        </script>
        
        <style scoped></style>
      destinationPath: "${destinationFolder}/src"

    - fileType: "Router Index"
      fileName: "index"
      extension: "ts"
      content: |
        import { createRouter, createWebHistory, RouteRecordRaw } from "vue-router";
        import HomeView from "../views/HomeView.vue";
        {{#each routes}}
        import ${this.componentName} from "${this.componentImport}";
        {{/each}}

        const routes: Array<RouteRecordRaw> = [
          {
            path: "/",
            name: "home",
            component: HomeView,
          },
          {{#each routes}}
          {
            path: "${this.routerLink}",
            name: "${lowerCase(this.componentName)}",
            component: ${this.componentName},
          },
          {{/each}}
        ];

        const router = createRouter({
          history: createWebHistory(process.env.BASE_URL),
          routes,
        });

        export default router;
      destinationPath: "${destinationFolder}/src/router"
    - fileType: "Genesis Sidebar"
      fileName: "GenesisSidebar"
      extension: "vue"
      content: |
        <template>
          <!-- Sidebar -->
          <nav
          id="sidebar"
          class="d-flex flex-column bg-light border-end py-4 px-2 vh-100 shadow-sm"
          style="width: 250px; min-width: 250px"
          >
          <h3 class="px-3 nav-brand">
          <span class="text-dark">Genesis</span
          ><span class="text-primary">App</span>
          </h3>
          <ul class="nav flex-column flex-grow-1">
          <li class="nav-item">
          <span class="nav-group-title nav-link text-muted text-uppercase">
          core
          </span>
          </li>
          <ul class="nav flex-column">
          <li class="nav-item">
          <router-link class="nav-link text-dark" to="/">Home</router-link>
          </li>
          </ul>
          <li class="nav-item">
          <span class="nav-group-title nav-link text-muted text-uppercase">
          entities
          </span>
          </li>
          <ul class="nav flex-column">
          {{#each routes}}
            <li class="nav-item">
              <router-link class="nav-link text-dark" to="${this.routerLink}">
                ${this.routerLabel}
              </router-link>
            </li>
          {{/each}}
          </ul>
          <li class="nav-item">
          <span class="nav-group-title nav-link text-muted text-uppercase">
          views
          </span>
          </li>
          </ul>
          <UserNavProfile name="John Doe" />
          </nav>
        </template>
          
        <script lang="ts" src="./GenesisSidebarComponent.ts"></script>
          
        <style scoped>
        .nav-group-title {
          font-size: 14px;
        }
        </style>
      destinationPath: "${destinationFolder}/src/core/navbar"
  components:
    - componentType: "List Entity Component"
      router :
        link: ""
        label: ""
      componentName: "${majStart(EntityName)}List"
      importFile: |
        import GenesisButton from "@/core/button/GenesisButton.vue";
        import { ${majStart(EntityName)} } from "@/shared/models/${majStart(EntityName)}Model";
        import { defineComponent, PropType } from "vue";
      selector: "${majStart(EntityName)}List"
      standalone: true
      importComponent: |
        components: { GenesisButton }
      template: |
        <template>
          <table class="table align-middle table-rounded text-nowrap">
            <thead class="table-light">
              <tr>
                {{#each fields}}
                <th >${majStart(this.columnName)}</th>
                {{/each}}
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="${minStart(EntityName)} in ${minPluralize(EntityName)}" :key="${minStart(EntityName)}.id" class="border-bottom">
                {{#each fields}}
                <td>{{ ${minStart(EntityName)}.${minStart(this.columnName)} }}</td>
                {{/each}}
                <td class="text-end">
                  <div class="d-inline-flex gap-2">
                  <GenesisButton icon="fas fa-eye" class="btn-light shadow-sm" />
                  <GenesisButton icon="fas fa-edit" class="btn-light shadow-sm" />
                  <GenesisButton icon="fas fa-trash" class="btn-light shadow-sm" />
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </template>
      style: |
        <style scoped>
        .table thead th {
          background-color: #537cc226;
          color: #4e4e4e;
          font-weight: 600;
          vertical-align: middle;
          border-bottom: 2px solid #dee2e6;
        }

        .table td,
        .table th {
          vertical-align: middle;
          padding: 0.75rem;
        }

        .btn-light {
          border-radius: 0.5rem;
          transition: background 0.2s ease-in-out;
        }

        .btn-light:hover {
          background-color: #f1f3f5;
        }
        </style>
      export: |
        props: {
          ${minPluralize(EntityName)}: {
          {{tab}} required: true,
          {{tab}} type: Array as PropType<${majStart(EntityName)}[]>,
          },
        },
        setup(props) {
          return {};
        }
      destinationPath: "${destinationFolder}/src/entities/${minStart(EntityName)}"
      componentAdditionalFiles: [ ]

    - componentType: "List View"
      router:
        link: "/${minPluralize(EntityName)}"
        label: "${majStart(EntityName)}"
      componentName: "${majStart(EntityName)}ListView"
      importFile: |
        import { computed, defineComponent, ref } from "vue";
        import { ${majStart(EntityName)} } from "@/shared/models/${majStart(EntityName)}Model";
        import ${majStart(EntityName)}List from "@/entities/${minStart(EntityName)}/${majStart(EntityName)}List.vue";
        import GenesisSearch from "@/core/search/GenesisSearch.vue";
        import GenesisAddButton from "@/core/button/GenesisAddButton.vue";
        import PaginationLayout from "@/core/pagination/PaginationLayout.vue";
      selector: "${majStart(EntityName)}ListView"
      standalone: true
      importComponent: |
        components: {
          ${majStart(EntityName)}List,
          GenesisSearch,
          GenesisAddButton,
          PaginationLayout,
        }
      template: |
        <template>
          <div class="">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h3>${majStart(EntityName)} / <span class="text-muted">List</span></h3>
              </div>
              <div>
                <GenesisAddButton>
                  <span>Add ${majStart(EntityName)}</span>
                </GenesisAddButton>
              </div>
            </div>
            <div class="mt-3">
              <GenesisSearch :model="model" @search="handleSearch" />
            </div>
            <${majStart(EntityName)}List :${minPluralize(EntityName)}="filtered${majPluralize(EntityName)}" />
        
            <PaginationLayout :start="1" :end="100" />
          </div>
        </template>
      style: |
        <style scoped></style>
      export: |
        setup() {
          const ${minPluralize(EntityName)} = ref<${majStart(EntityName)}[]>([]);
          const model = new ${majStart(EntityName)}();
          const filters = ref();
        
          const filtered${majPluralize(EntityName)} = computed(() => {
            if (!filters.value) {
              console.log("Initial Values");
              return ${minPluralize(EntityName)}.value;
            }
            console.log("Filfil");
        
            return [...${minPluralize(EntityName)}.value];
          });
        
          const handleSearch = (filterValues: Record<string, any>) => {
            filters.value = filterValues;
          };
        
          return { filtered${majPluralize(EntityName)}, handleSearch, model };
        },
      destinationPath: "${destinationFolder}/src/views/${minStart(EntityName)/list}"
      componentAdditionalFiles: []


  serviceComponent:
    imports: |
    methods: |
    destinationPath: "${destinationFolder}/src/shared/services"
    name: "${majStart(EntityName)}Service"
  modelComponent:
    imports: |
    exports: |
      export interface I${majStart(EntityName)} {
        {{#each fields}}
        ${minStart(this.columnName)}: ${this.typeBase};
        {{/each}}
      }
      
      export class ${majStart(EntityName)} implements I${majStart(EntityName)} {
        {{#each fields}}
        ${minStart(this.columnName)}: ${this.typeBase};
        {{/each}}
        
        constructor();
        constructor(
          {{#each fields}}
            ${minStart(this.columnName)}: ${this.typeBase}{{#if !@last}},{{/if}}
          {{/each}});
        constructor(
          {{#each fields}}
            ${minStart(this.columnName)}?: ${this.typeBase}{{#if !@last}},{{/if}}
          {{/each}}
        ) {
          {{#each fields}}
            this.${minStart(this.columnName)} = ${minStart(this.columnName)} ?? {{#if this.typeBase=number}}0{{elseIf this.typeBase=Date}}new Date(){{else}}""{{/if}};
          {{/each}}
        }
      }
    exportsComponents: |
    destinationPath: "${destinationFolder}/src/shared/models"
    name: "${majStart(EntityName)}Model"
