        const { view${majStart(EntityName)} } = use${majStart(EntityName)}s()
        {{else}}
        /**
         * Emits
         */
        const emit = defineEmits<{
          /**
           * Triggered to request a refresh of the list
           */
          (e: 'request:refresh'): void
        }>()

        /**
