    - componentType: "List Entity Component"
      generateForView: true
      router:
        link: ""
        label: "{{removeLine}}"
      componentName: "${majStart(EntityName)}List"
      importFile: |
        import { defineComponent, PropType, ref } from "vue";
        import ${majStart(EntityName)}Row from "./${majStart(EntityName)}Row.vue";
        import { ${majStart(EntityName)} } from "@/models/${majStart(EntityName)}Model";
        import GenesisOverlay from "@/core/loading/GenesisOverlay.vue";
        import DeleteConfirmationPopup from "@/core/popup/DeleteConfirmationPopup.vue";
        import { usePopup } from "@/composables/usePopup";
        import { use${majStart(EntityName)}s } from "@/composables/use${majStart(EntityName)}s";
      selector: "${majStart(EntityName)}List"
      standalone: true
      importComponent: |
        components: { ${majStart(EntityName)}Row, GenesisOverlay, DeleteConfirmationPopup }
      template: |
        <template>
          <div>
            <table class="table align-middle table-rounded text-nowrap">
              <thead class="table-light">
                <tr>
                  {{#each fields}}
                  <th scope="col">${formatReadable(this.name)}</th>
                  {{/each}}
                  <th scope="col" class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody class="position-relative">
                <tr v-if="message && !loading">
                  <td colspan="10" class="text-muted text-center py-4">{{ message }}</td>
                </tr>
                <${majStart(EntityName)}Row
                  v-else
                  v-for="${minStart(EntityName)} in data"
                  :key="${minStart(EntityName)}.id"
                  :${minStart(EntityName)}="${minStart(EntityName)}"
                  @request-delete="openDeletePopup"
                  @request-view="view${majStart(EntityName)}"
                  @request-update="goToUpdateFormView"
                />
                <GenesisOverlay :visible="loading" />
              </tbody>
            </table>

            <DeleteConfirmationPopup
              :visible="deletePopup"
              :message="`Are you sure you want to delete ${majStart(EntityName)} ${selectedEntity?.id}?`"
              @confirm="confirmDelete"
              @cancel="closePopup"
            />
          </div>
        </template>
      style: |
        <style scoped></style>
      export: |
        props: {
          data: {
            required: true,
            type: Array as PropType<${majStart(EntityName)}[]>,
          },
          message: {
            required: false,
            type: String,
          },
          loading: {
            type: Boolean,
            required: false,
            default: false,
          },
        },
        emits: ["request:refresh"],
        setup(props, { emit }) {
          const selectedEntity = ref<Partial<${majStart(EntityName)}>>({});
          const { closePopup, visible: deletePopup } = usePopup(false);
          const { delete${majStart(EntityName)}, view${majStart(EntityName)}, goToUpdateFormView } = use${majStart(EntityName)}s();

          function openDeletePopup(entity: ${majStart(EntityName)}) {
            if (!entity) return;
            selectedEntity.value = entity;
            deletePopup.value = true;
          }

          async function confirmDelete() {
            const { success, error } = await delete${majStart(EntityName)}(selectedEntity.value);
            deletePopup.value = false;
            emit("request:refresh");
          }

          function jsonView(data: unknown): string {
            if (!data) return "";
            try { return JSON.stringify(data, null, 2); }
            catch { return "Invalid data"; }
          }

          return {
            deletePopup,
            selectedEntity,
            openDeletePopup,
            confirmDelete,
            closePopup,
            jsonView,
            view${majStart(EntityName)},
            goToUpdateFormView,
          };
        }
