- id: 1
  languageId: 1
  coreFramework: "Angular"
  name: "Angular App"
  template: "Angular-template"
  initPath: "angular/angular-skeletoon"
  componentExtension: "ts"
  additionalFiles:
    - fileType: "App-files"
      fileName: "app.component"
      extension: "ts"
      content: | 
        content0
      destinationPath: "${destinationFolder}/src/app/"
    - fileType: "App-files"
      fileName: "app.component"
      extension: "html"
      content: |
        content1
      destinationPath: "${destinationFolder}/src/app/"
    - fileType: "App-files"
      fileName: "app.component"
      extension: "css"
      content: |
        content2
      destinationPath: "${destinationFolder}/src/app/"
  components:
    - componentType: "list"
      generateForView: true
      router:
        link: "/${minPluralize(EntityName)}"
        label: "${majStart(EntityName)}"
      importFile: |
        allImport
      selector: "app-${toKebabCase(EntityName)}-list"
      standalone: true
      importComponent: |
        allImport
      template: |
        templateURL
      style: |
        styleURL
      export: |
        export
      destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(EntityName)}/${toKebabCase(EntityName)}-list"
      componentName: "${toKebabCase(EntityName)}-list.component"
      componentAdditionalFiles:
        - fileType: "html template"
          fileName: "${toKebabCase(EntityName)}-list.component"
          extension: "html"
          content: |
            content1
          destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(EntityName)}/${toKebabCase(EntityName)}-list"
        - fileType: "css template"
          fileName: "${toKebabCase(EntityName)}-list.component"
          extension: "css"
          content: |
            content2
          destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(EntityName)}/${toKebabCase(EntityName)}-list"
    - componentType: "form"
      router:
        link: "/${minPluralize(EntityName)}"
        label: "${majStart(EntityName)}"
      importFile: |
        allImport
      selector: "app-${toKebabCase(EntityName)}-form"
      generateForView: true
      standalone: true
      importComponent: |
        allImport
      template: |
        templateURL
      style: |
        styleURL
      export: |
        export
      destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(EntityName)}/${toKebabCase(EntityName)}-form"
      componentName: "${toKebabCase(EntityName)}-form.component"
      componentAdditionalFiles:
        - fileType: "html template"
          fileName: "${toKebabCase(EntityName)}-form.component"
          extension: "html"
          content: |
            content1
          destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(EntityName)}/${toKebabCase(EntityName)}-form"
        - fileType: "css template"
          fileName: "${toKebabCase(EntityName)}-form.component"
          extension: "css"
          content: |
            content2
          destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(EntityName)}/${toKebabCase(EntityName)}-form"
  serviceComponent:
    imports: |
       importService
    methods: |
      methodService
    destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(EntityName)}/services"
    name: "${toKebabCase(EntityName)}.service"
  modelComponent:
    imports: |
      importsComponents
    exports : |
      exportsComponents
    destinationPath: "${destinationFolder}/src/app/features/${toKebabCase(EntityName)}/models"
    name: "${toKebabCase(EntityName)}.model"

- id: 2
  languageId: 1
  coreFramework: "VueJs"
  name: "Vue3 + Typescript App"
  template: "Vue3TS-template"
  initPath: "vue/vue-3-ts-skeletoon"
  componentExtension: "vue"
  additionalFiles:
    - fileType: "Env File"
      fileName: ""
      extension: ".env"
      content: |
        VUE_APP_API_URL=http://localhost:8080/${lowerCase(toKebabCase(projectName))}
        VUE_APP_PORT=9000
      destinationPath: "${destinationFolder}"

    - fileType: "App-Vue"
      fileName: "App"
      extension: "vue"
      content: |
        <template>
          <div class="d-flex" id="app-layout">
            <GenesisSidebar />
            <!-- Main content -->
            <div class="bg-light flex-grow-1 p-4">
              <router-view />
            </div>
          </div>
        </template>
        
        <script setup lang="ts">
        import GenesisSidebar from "./core/navbar/GenesisSidebar.vue";
        </script>
        
        <style scoped></style>
      destinationPath: "${destinationFolder}/src"

    - fileType: "Router Index"
      fileName: "index"
      extension: "ts"
      content: |
        import { createRouter, createWebHistory, RouteRecordRaw } from "vue-router";
        import HomeView from "../views/HomeView.vue";
        {{#each routes}}
        import ${this.componentName} from "${this.componentImport}";
        {{/each}}

        const routes: Array<RouteRecordRaw> = [
          {
            path: "/",
            name: "home",
            component: HomeView,
          },
          {{#each routes}}
          {
            path: "${this.routerLink}",
            name: "${lowerCase(this.componentName)}",
            component: ${this.componentName},
          },
          {{/each}}
        ];

        const router = createRouter({
          history: createWebHistory(process.env.BASE_URL),
          routes,
        });

        export default router;
      destinationPath: "${destinationFolder}/src/router"

    - fileType: "Genesis Sidebar"
      fileName: "GenesisSidebar"
      extension: "vue"
      content: |
        <template>
          <!-- Sidebar -->
          <nav
          id="sidebar"
          class="d-flex flex-column bg-light border-end py-4 px-2 vh-100 shadow-sm"
          style="width: 250px; min-width: 250px"
          >
          <h3 class="px-3 nav-brand">
          <span class="text-dark">Genesis</span
          ><span class="text-primary">App</span>
          </h3>
          <ul class="nav flex-column flex-grow-1">
          <li class="nav-item">
          <span class="nav-group-title nav-link text-muted text-uppercase">
          core
          </span>
          </li>
          <ul class="nav flex-column">
          <li class="nav-item">
          <router-link class="nav-link text-dark" to="/">Home</router-link>
          </li>
          </ul>
          <li class="nav-item">
          <span class="nav-group-title nav-link text-muted text-uppercase">
          entities
          </span>
          </li>
          <ul class="nav flex-column">
          {{#each routes}}
            <li class="nav-item">
              <router-link class="nav-link text-dark" to="${this.routerLink}">
                ${this.routerLabel}
              </router-link>
            </li>
          {{/each}}
          </ul>
          <li class="nav-item">
          <span class="nav-group-title nav-link text-muted text-uppercase">
          views
          </span>
          </li>
          </ul>
          <UserNavProfile name="John Doe" />
          </nav>
        </template>
          
        <script lang="ts" src="./GenesisSidebarComponent.ts"></script>
          
        <style scoped>
        .nav-group-title {
          font-size: 14px;
        }
        </style>
      destinationPath: "${destinationFolder}/src/core/navbar"
  components:
    - componentType: "List Entity Component"
      generateForView: true
      router :
        link: ""
        label: ""
      componentName: "${majStart(EntityName)}List"
      importFile: |
        import { use${majStart(EntityName)}s } from "@/composables/use${majStart(EntityName)}s";
        import { defineComponent } from "vue";
        import ${majStart(EntityName)}Row from "./${majStart(EntityName)}Row.vue";
      selector: "${majStart(EntityName)}List"
      standalone: true
      importComponent: |
        components: { ${majStart(EntityName)}Row }
      template: |
        <template>
          <table class="table align-middle table-rounded text-nowrap">
            <thead class="table-light">
              <tr>
                {{#each fields}}
                <th >${formatReadable(this.name)}</th>
                {{/each}}
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr v-if="loading" class="py-4 text-center">
                <td colspan="10" class="text-muted text-center py-4">
                  <span>Loading...</span>
                </td>
              </tr>
        
              <tr v-else-if="error">
                <td colspan="10" class="text-muted text-center py-4">
                  {{ error }}
                </td>
              </tr>
              <${majStart(EntityName)}Row
              v-else
              v-for="${minStart(EntityName)} in ${minStart(EntityName)}s"
              :key="${minStart(EntityName)}.id"
              :${minStart(EntityName)}="${minStart(EntityName)}"
              >
              </${majStart(EntityName)}Row>
            </tbody>
          </table>
        </template>
      style: |
        <style scoped>
        .table thead th {
          background-color: #537cc226;
          color: #4e4e4e;
          font-weight: 600;
          vertical-align: middle;
          border-bottom: 2px solid #dee2e6;
        }

        .table td,
        .table th {
          vertical-align: middle;
          padding: 0.75rem;
        }

        .btn-light {
          border-radius: 0.5rem;
          transition: background 0.2s ease-in-out;
        }

        .btn-light:hover {
          background-color: #f1f3f5;
        }
        </style>
      export: |
        setup() {
          const { ${minStart(EntityName)}s, error, loading } = use${majStart(EntityName)}s();
            return {
            ${minStart(EntityName)}s,
            error,
            loading,
          };
        },
      componentAdditionalFiles:
        - fileType: "List Composable"
          fileName: "use${majPluralize(EntityName)}"
          extension: "ts"
          content: |
            import { ref, onMounted } from "vue";
            import type { ${majStart(EntityName)} } from "../models/${majStart(EntityName)}Model";
            import * as ${minStart(EntityName)}Service from "@/services/${majStart(EntityName)}Service";
            
            export function use${majStart(EntityName)}(autoLoad = true) {
              const ${minStart(EntityName)}s = ref<${majStart(EntityName)}[]>([]);
              const loading = ref(false);
              const error = ref<string | null>(null);
            
              const load${majStart(EntityName)}s = async () => {
                loading.value = true;
                const { data, error: err } = await ${minStart(EntityName)}Service.getAll();
                if (err) {
                  console.log("error values");
              
                  error.value = err;
                } else {
                  console.log("fetched values");
              
                  ${minStart(EntityName)}s.value = data;
                }
                loading.value = false;
              };
            
              if (autoLoad) onMounted(load${majStart(EntityName)}s);
            
              return {
                ${minStart(EntityName)}s,
                loading,
                error,
                refresh: load${majStart(EntityName)}s,
              };
            }

          destinationPath: "${destinationFolder}/src/composables"
      destinationPath: "${destinationFolder}/src/entities/${minStart(EntityName)}"

    - componentType: "List View"
      generateForView: true
      router:
        link: "/${minPluralize(EntityName)}"
        label: "${majStart(EntityName)}"
      componentName: "${majStart(EntityName)}ListView"
      importFile: |
        import { defineComponent, ref, computed } from "vue";
        import ${majStart(EntityName)}List from "@/entities/${minStart(EntityName)}/${majStart(EntityName)}List.vue";
        import GenesisAddButton from "@/core/button/GenesisAddButton.vue";
        import PaginationLayout from "@/core/pagination/PaginationLayout.vue";
        import ${majStart(EntityName)}Specification from "@/entities/${minStart(EntityName)}/${majStart(EntityName)}Specification.vue";
      selector: "${majStart(EntityName)}ListView"
      standalone: true
      importComponent: |
        components: {
          ${majStart(EntityName)}List,
          ${majStart(EntityName)}Specification,
          GenesisSearch,
          GenesisAddButton,
          PaginationLayout,
        }
      template: |
        <template>
          <div>
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h3>${majStart(EntityName)} / <span class="text-muted">List</span></h3>
              </div>
              <div>
                <GenesisAddButton>
                  <span>Add ${majStart(EntityName)}</span>
                </GenesisAddButton>
              </div>
            </div>
            <div class="mt-3">
              <${majStart(EntityName)}Specification @search="handleSearch" />
            </div>
            <${majStart(EntityName)}List />
        
            <PaginationLayout :start="1" :end="100" />
          </div>
        </template>
      style: |
        <style scoped></style>
      export: |
        setup() {
          const ${minPluralize(EntityName)} = ref<${majStart(EntityName)}[]>([]);
          const filters = ref<Record<string, any> | null>(null);
        
          const filtered${majPluralize(EntityName)} = computed(() => {
            if (!filters.value) return ${minPluralize(EntityName)}.value;
        
            return  ${minPluralize(EntityName)}.value.filter((item) =>
              Object.entries(filters.value!).every(([key, val]) =>
                item[key as keyof ${majStart(EntityName)}]
                  ?.toString()
                  .toLowerCase()
                  .includes(val.toString().toLowerCase())
              )
            );
          });
        
          const handleSearch = (filterValues: Record<string, any>) => {
            filters.value = filterValues;
          };
        
          return { filtered${majPluralize(EntityName)}, handleSearch, model };
        },
      destinationPath: "${destinationFolder}/src/views/${minStart(EntityName)/list}"
      componentAdditionalFiles: []

    - componentType: "Entity Specification"
      generateForView: true
      router:
        routerLink: ""
        routerLabel: ""
      componentName: "${majStart(EntityName)Specification}"
      importFile: |
        import { defineComponent, ref } from "vue";
        import { useSearch } from "@/composables/useSearch";
        import { ${majStart(EntityName)} } from "@/models/${majStart(EntityName)}Model";
        import GenesisInput from "@/core/form/GenesisInput.vue";
        import GenesisButton from "@/core/button/GenesisButton.vue";
      selector: "${majStart(EntityName)}Specification"
      standalone: true
      importComponent: |
        components: {
          GenesisInput,
          GenesisButton,
        }
      template: |
        <template>
          <div class="row gap-1 align-items-center justify">
            <div class="row col-auto">
              <!-- FIELDS SEARCH INPUTS -->
              {{#each fields}}
              <div class="col">
                <GenesisInput 
                  placeholder="${formatReadable(this.name)}" 
                  v-model="model.${this.name}"
                  type="text" />
              </div>
              {{/each}}
            </div>

            <!-- SEARCH BUTTON CONTROLS -->
            <div class="col d-flex gap-2 justify-content-end mb-3">
              <GenesisButton
                icon="fa fa-close"
                type="reset"
                class="bg-white text-dark"
                @click="resetFilters"
              />
              <GenesisButton
                icon="fa fa-filter"
                label="Filter"
                type="submit"
                class="bg-white text-dark"
                @click="emitSearch"
              />
            </div>
          </div>
        </template>
      style: "<style scoped></style>"
      export: |
        emits: ["search"],
        setup(_, { emit }) {
          const model = ref(new ${majStart(EntityName)}());
          const { emitSearch } = useSearch(model, emit);
          const resetFilters = function () {
            model.value = new ${majStart(EntityName)}();
          };
          return {
            model,
            emitSearch,
            resetFilters,
          };
        },
      destinationPath: "${destinationFolder}/src/entities/${minStart(EntityName)}"
      componentAdditionalFiles: [ ]

    - componentType: "Entity Row"
      generateForView: true
      router:
        routerLabel: ""
        routerLink: ""
      importFile: |
        import GenesisButton from "@/core/button/GenesisButton.vue";
        import { defineComponent } from "vue";
        import { ${majStart(EntityName)} } from "@/models/${majStart(EntityName)}Model";
      selector: "${majStart(EntityName)}Row"
      standalone: true
      importComponent: "components: { GenesisButton }"
      export: |
        props: {
          ${minStart(EntityName)}: {
            required: true,
            type: ${majStart(EntityName)},
          },
        },
        setup(props) {
          return {};
        },
      style: "<style scoped></style>"
      componentName: "${majStart(EntityName)}Row"
      destinationPath: "${destinationFolder}/src/entities/${minStart(EntityName)}"
      componentAdditionalFiles: [ ]

  serviceComponent:
    imports: |
      import useRestApi from "@/composables/useRestApi";
      import type { IPageResponse } from "@/models/api/PageResponseModel";
      import type { ${majStart(EntityName)} } from "@/models/majStart(EntityName)Model";
    methods: |
      const restApi = useRestApi<IPageResponse<${majStart(EntityName)}s>>();
      const BASE_URL = "/${minPluralize(EntityName)}";

      export async function getAll() {
        const response = await restApi.get(BASE_URL);
        return {
          data: response.returnCode === 1 ? response.data?.content || [] : [],
          error: response.returnCode !== 1 ? response.message : null,
        };
      }

      export async function getById(id: string) {
        const response = await restApi.get(`${BASE_URL}/${id}`);
        return {
          data: response.returnCode === 1 ? response.data : null,
          error: response.returnCode !== 1 ? response.message : null,
        };
      }

      export async function create(data: ${majStart(EntityName)}s) {
        const response = await restApi.post(BASE_URL, data);
        return {
          data: response.returnCode === 1 ? response.data : null,
          error: response.returnCode !== 1 ? response.message : null,
        };
      }

      export async function update(id: string, data: ${majStart(EntityName)}s) {
        const response = await restApi.put(`${BASE_URL}/${id}`, data);
        return {
          data: response.returnCode === 1 ? response.data : null,
          error: response.returnCode !== 1 ? response.message : null,
        };
      }

      export async function remove(id: string) {
        const response = await restApi.delete(`${BASE_URL}/${id}`);
        return {
          success: response.returnCode === 1,
          error: response.returnCode !== 1 ? response.message : null,
        };
      }

    destinationPath: "${destinationFolder}/src/services"
    name: "${majStart(EntityName)}Service"
  modelComponent:
    imports: |
    exports: |
      export interface I${majStart(EntityName)} {
        {{#each fields}}
        ${minStart(this.name)}: ${this.typeBase} | undefined;
        {{/each}}
      }
      
      export class ${majStart(EntityName)} implements I${majStart(EntityName)} {
        {{#each fields}}
        ${minStart(this.this.name)}: ${this.typeBase} | undefined;
        {{/each}}
      
        constructor(data?: Partial<I${majStart(EntityName)>) {
          {{#each fields}}
            this.${minStart(this.this.name)} = data?.${minStart(this.this.name)};
          {{/each}}
        }
      }
    exportsComponents: |
    destinationPath: "${destinationFolder}/src/shared/models"
    name: "${majStart(EntityName)}Model"
