- id: 2
  languageId: 1
  coreFramework: "VueJs"
  name: "Vue3 + Typescript App"
  template: "Vue3TS-template"
  initPath: "vue/vue-3-ts-skeletoon"
  componentExtension: "vue"
  additionalFiles:
    - fileType: "Env File"
      fileName: "{{removeLine}}"
      extension: "env"
      content: |
        VUE_APP_API_URL=http://localhost:8080/${lowerCase(projectName)}
        VUE_APP_PORT=9000
      destinationPath: "${destinationFolder}"

    - fileType: "App-Vue"
      fileName: "App"
      extension: "vue"
      content: |
        <template>
          <div class="d-flex" id="app-layout">
            <GenesisSidebar />
            <!-- Main content -->
            <div class="bg-light flex-grow-1 p-4">
              <router-view />
            </div>
          </div>
        </template>
        
        <script setup lang="ts">
        import GenesisSidebar from "./core/navbar/GenesisSidebar.vue";
        </script>
        
        <style scoped></style>
      destinationPath: "${destinationFolder}/src"

    - fileType: "Router Index"
      fileName: "index"
      extension: "ts"
      content: |
        import { createRouter, createWebHistory, RouteRecordRaw } from "vue-router";
        import HomeView from "../views/HomeView.vue";
        {{#each routes}}
        import ${this.componentName} from "${this.componentImport}";
        {{/each}}

        const routes: Array<RouteRecordRaw> = [
          {
            path: "/",
            name: "home",
            component: HomeView,
          },
          {{#each routes}}
          {
            path: "${this.routerLink}",
            name: "${lowerCase(this.componentName)}",
            component: ${this.componentName},
          },
          {{/each}}
        ];

        const router = createRouter({
          history: createWebHistory(process.env.BASE_URL),
          routes,
        });

        export default router;
      destinationPath: "${destinationFolder}/src/router"

    - fileType: "Navigation Store"
      fileName: "useNavigationsStore"
      extension: "ts"
      content: |
        import { defineStore } from "pinia";
        
        export const useNavigationsStore = defineStore("navigations", {
        state: () => ({
          navigations: [
            // CORE NAVIGATION
            {
              sectionName: "Core",
              navChilds: [
                {
                  navLink: "/",
                  navTitle: "Home",
                },
              ],
            },
            // ENTITITES NAVIGATION
            {
              sectionName: "Entities",
              navChilds: [
              {{#each routes}}
                {
                  navTitle: "${this.routerLabel}",
                  navLink: "${this.routerLink}",
                },
              {{/each}}
              ],
            },
            // VIEWS NAVIGATION
        
              // SETTINGS NAVIGATION
          ],
        }),
        actions: {},
        });
      destinationPath: "${destinationFolder}/src/store"
  components:
    - componentType: "List Entity Component"
      generateForView: true
      router :
        link: ""
        label: ""
      componentName: "${majStart(EntityName)}List"
      importFile: |
        import { defineComponent, PropType } from "vue";
        import ${majStart(EntityName)}Row from "./${majStart(EntityName)}Row.vue";
        import { ${majStart(EntityName)} } from "@/models/${majStart(EntityName)}Model";
      selector: "${majStart(EntityName)}List"
      standalone: true
      importComponent: |
        components: { ${majStart(EntityName)}Row }
      template: |
        <template>
          <table class="table align-middle table-rounded text-nowrap">
            <thead class="table-light">
              <tr>
                {{#each fields}}
                <th >${formatReadable(this.name)}</th>
                {{/each}}
                <th scope="col" class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr v-if="loading" class="py-4 text-center">
                <td colspan="10" class="text-muted text-center py-4">
                  <span>Loading...</span>
                </td>
              </tr>
            
              <tr v-else-if="message">
                <td colspan="10" class="text-muted text-center py-4">
                  {{ message }}
                </td>
              </tr>
              <${majStart(EntityName)}Row
                v-else
                v-for="${minStart(EntityName)} in data"
                :key="${minStart(EntityName)}.id"
                :${minStart(EntityName)}="${minStart(EntityName)}"
              >
              </${majStart(EntityName)}Row>
            </tbody>
          </table>
        </template>
      style: |
        <style scoped></style>
      export: |
        props: {
          data: {
            required: true,
            type: Array as PropType<${majStart(EntityName)}[]>,
          },
          message: {
            required: false,
            type: String,
          },
          loading: {
            type: Boolean,
            required: false,
            defauld: false,
          },
        },
        setup() {
          return {};
        },
      destinationPath: "${destinationFolder}/src/entities/${minStart(EntityName)}"
      componentAdditionalFiles: []

    - componentType: "List View"
      generateForView: true
      router:
        link: "/${minPluralize(EntityName)}"
        label: "${majStart(EntityName)}"
      componentName: "${majStart(EntityName)}ListView"
      importFile: |
        import { defineComponent, ref } from "vue";
        import EntityTable from "@/core/table/EntityTable.vue";
        import ${majStart(EntityName)}List from "@/entities/${minStart(EntityName)}/${majStart(EntityName)}List.vue";
        import { ${majStart(EntityName)} } from "@/models/${majStart(EntityName)}Model";
        import { use${majPluralize(EntityName)} } from "@/composables/use${majPluralize(EntityName)}";
        import { EntityListField } from "@/models/EntityModel";
        import GenesisButton from "@/core/button/GenesisButton.vue";
      selector: "${majStart(EntityName)}ListView"
      standalone: true
      importComponent: |
        components: {
          EntityTable,
          GenesisButton,
        }
      template: |
        <template>
          <div>
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h3>${majStart(EntityName)} / <span class="text-muted">List</span></h3>
              </div>
              <div>
                <GenesisButton icon="bi bi-plus me-2" title="Create new ${minStart(EntityName)}">
                  <span>Add new ${minStart(EntityName)}</span>
                </GenesisButton>
              </div>
            </div>
            <EntityTable
              :entity-model="new ${majStart(EntityName)}()"
              :entity-search-fields="searchFields"
              :searchFn="search${majPluralize(EntityName)}"
              :getPaginationData="getPaginationData"
              :listComponent="${majStart(EntityName)}List"
              :entities="${minPluralize(EntityName)}"
              :loading="loading"
              :message="message"
            />
          </div>
        </template>
      style: |
        <style scoped></style>
      export: |
        setup() {
          const {
            ${minPluralize(EntityName)},
            loading,
            search${majPluralize(EntityName)},
            paginationData,
            message,
            getPaginationData,
          } = use${majPluralize(EntityName)}();
          const searchFields = ref<EntityListField[]>(
            ${majStart(EntityName)}.getFieldListMetadata()
          );
          return {
            ${minPluralize(EntityName)},
            loading,
            search${majPluralize(EntityName)},
            paginationData,
            ${majStart(EntityName)}List,
            ${majStart(EntityName)},
            searchFields,
            getPaginationData,
            message,
          };
        },
      destinationPath: "${destinationFolder}/src/views/${minStart(EntityName)}/list"
      componentAdditionalFiles:
        - fileType: "Entity Composable"
          fileName: "use${majPluralize(EntityName)}"
          extension: "ts"
          content: |
            import { ref, onMounted } from "vue";
            import { ${majStart(EntityName)}, ${majStart(EntityName)}FormDTO } from "../models/${majStart(EntityName)}Model";
            import * as ${minStart(EntityName)}Service from "@/services/${majStart(EntityName)}Service";
            {{#each fieldsFK}}
            import * as ${minStart(this.type)}Service from "@/services/${majStart(this.type)}Service";
            {{/each}}{{removeLine}}
            import { useLoading } from "./useLoading";
            import {
              PaginationRequestParameter,
              SortFieldParameter,
            } from "@/models/api/RequestModel";
            import { PaginationData } from "@/models/api/PageResponseModel";
            import { useRouter } from "vue-router";

            /**
             * Composable to manage ${majStart(EntityName)} entities including CRUD operations,
             * search, pagination, foreign key loading, and navigation.
             *
             * @param autoLoad Automatically fetch all ${minStart(EntityName)}s on mounted (default: true)
             */
            export function use${majStart(EntityName)}s(autoLoad = true) {
              /** List of all ${minStart(EntityName)}s */
              const ${minStart(EntityName)}s = ref<${majStart(EntityName)}[]>([]);

              /** Loading state management */
              const { loading, startLoading, stopLoading } = useLoading();

              /** Pagination information returned by API */
              const paginationData = ref(new PaginationData());

              /** Message for errors or notifications */
              const message = ref<string | null>();

              /** Vue router instance for navigation */
              const router = useRouter();

              /**
               * Load foreign key data for forms (projets and employes)
               * @returns An object containing arrays of external data
               */
              const loadFkMapData = async () => {
                {{#each fieldsFK}}
                const { data: ${minStart(this.type)}s } = await ${minStart(this.type)}Service.getAll();
                {{/each}}
                return {
                {{#each fieldsFK}}
                {{tab}}${minStart(this.type)}s,
                {{/each}}{{removeLine}}
                }
              };

              /**
               * Handles API response by updating the ${minStart(EntityName)}s and pagination
               * @param data Array of ${majStart(EntityName)} returned by the API
               * @param err Optional error message
               * @param pagination Optional pagination data
               */
              const handleResponse = async (
                data: ${majStart(EntityName)}[],
                err: string | null,
                pagination?: PaginationData
              ) => {
                if (err) {
                  message.value = err;
                }
                ${minStart(EntityName)}s.value = data;
                if (pagination !== undefined) {
                  paginationData.value = pagination;
                }
              };

              // Navigation functions
              /** Navigate to ${minStart(EntityName)} detail view */
              const view${majStart(EntityName)} = (${minStart(EntityName)}: Partial<${majStart(EntityName)}>) => {
                router.push({ name: "${minStart(EntityName)}detailsview", params: { id: ${minStart(EntityName)}.id } });
              };

              /** Navigate to ${minStart(EntityName)} list view */
              const goToListView = () => {
                router.push({ path: "/${minStart(EntityName)}s" });
              };

              /** Navigate to ${minStart(EntityName)} create form */
              const goToCreateFormView = () => {
                router.push({ path: "/${minStart(EntityName)}s/create" });
              };

              /** Navigate to ${minStart(EntityName)} update form */
              const goToUpdateFormView = (${minStart(EntityName)}: Partial<${majStart(EntityName)}>) => {
                router.push({ name: "${minStart(EntityName)}updateview", params: { id: ${minStart(EntityName)}.id } });
              };

              // API Requests
              /** Load all ${minStart(EntityName)}s from the API */
              const load${majStart(EntityName)}s = async () => {
                message.value = null;
                startLoading();
                const { data, error: err } = await ${minStart(EntityName)}Service.getAll();
                handleResponse(data, err);
                stopLoading();
              };

              /**
               * Delete a ${minStart(EntityName)} by id
               * @param ${minStart(EntityName)} ${majStart(EntityName)} object to delete
               */
              const delete${majStart(EntityName)} = async (${minStart(EntityName)}: Partial<${majStart(EntityName)}>) => {
                return await ${minStart(EntityName)}Service.remove(${minStart(EntityName)}.id);
              };

              /**
               * Get a single ${minStart(EntityName)} by id
               * @param id ${majStart(EntityName)} ID
               */
              const get${majStart(EntityName)}ById = async (id: number | string) => {
                return ${minStart(EntityName)}Service.getById(id);
              };

              /**
               * Create a new ${minStart(EntityName)}
               * @param ${minStart(EntityName)}FormDTO ${majStart(EntityName)} object to create
               */
              const create${majStart(EntityName)} = async (${minStart(EntityName)}FormDTO: Partial<${majStart(EntityName)}FormDTO>) => {
                const dto = new ${majStart(EntityName)}FormDTO(${minStart(EntityName)}FormDTO);
                const ${minStart(EntityName)}: Partial<${majStart(EntityName)}> = await dto.to${majStart(EntityName)}();
                const { data, error } = await ${minStart(EntityName)}Service.create(${minStart(EntityName)});
                if (error) {
                  message.value = error;
                }
                return data;
              };

              /**
               * Update an existing ${minStart(EntityName)}
               * @param ${minStart(EntityName)}FormDTO ${majStart(EntityName)} object to update
               */
              const update${majStart(EntityName)} = async (
                id: number | string,
                ${minStart(EntityName)}FormDTO: Partial<${majStart(EntityName)}FormDTO>
              ) => {
                const dto = new ${majStart(EntityName)}FormDTO(${minStart(EntityName)}FormDTO);
                const ${minStart(EntityName)}: Partial<${majStart(EntityName)}> = await dto.to${majStart(EntityName)}();
                const { data, error } = await ${minStart(EntityName)}Service.update(id, ${minStart(EntityName)});
                if (error) {
                  message.value = error;
                }
                return data;
              };

              /**
               * Search ${minStart(EntityName)}s with filters, pagination, and sorting
               * @param filters Partial ${majStart(EntityName)} object containing search filters
               * @param pagination Pagination request parameters
               * @param sortFields Array of fields to sort
               */
              const search${majStart(EntityName)}s = async (
                filters: Partial<${majStart(EntityName)}>,
                pagination: PaginationRequestParameter,
                sortFields: SortFieldParameter[]
              ) => {
                message.value = null;
                startLoading();
                const {
                  data,
                  error: err,
                  pagination: paginationresult,
                } = await ${minStart(EntityName)}Service.search(filters, pagination, sortFields);
                handleResponse(data, err, paginationresult);
                stopLoading();
              };

              /** Getter for pagination data */
              const getPaginationData = () => paginationData.value;

              // Automatically load ${minStart(EntityName)}s on mount if autoLoad is true
              if (autoLoad) onMounted(load${majStart(EntityName)}s);

              return {
                ${minStart(EntityName)}s,
                loading,
                message,
                load${majStart(EntityName)}s,
                search${majStart(EntityName)}s,
                get${majStart(EntityName)}ById,
                delete${majStart(EntityName)},
                create${majStart(EntityName)},
                update${majStart(EntityName)},
                loadFkMapData,
                paginationData,
                getPaginationData,
                view${majStart(EntityName)},
                goToListView,
                goToCreateFormView,
                goToUpdateFormView,
              };
            }
          destinationPath: "${destinationFolder}/src/composables"

    - componentType: "Entity Row"
      generateForView: true
      router:
        label: ""
        link: ""
      importFile: |
        import { defineComponent, PropType } from "vue";
        import { ${majStart(EntityName)} } from "@/models/${majStart(EntityName)}Model";
        import EntityRowActions from "@/core/table/EntityRowActions.vue";
      selector: "${majStart(EntityName)}Row"
      standalone: true
      importComponent: "components: { EntityRowActions }"
      template: |
        <template>
          <tr class="border-bottom">
            {{#each fields}}
            <td>{{ ${minStart(EntityName)}.${this.name} }}</td>
            {{/each}}
    
            <td class="text-end">
              <div class="d-inline-flex rounded-3 shadow-sm overflow-hidden">
                <EntityRowActions />
              </div>
            </td>
          </tr>
        </template>
      style: "<style scoped></style>"
      export: |
        props: {
          ${minStart(EntityName)}: {
            required: true,
            type: Object as PropType<${majStart(EntityName)}>,
          },
        },
        setup(props) {
          return {};
        },
      componentName: "${majStart(EntityName)}Row"
      destinationPath: "${destinationFolder}/src/entities/${minStart(EntityName)}"
      componentAdditionalFiles: []

  serviceComponent:
    imports: |
      import useRestApi from "@/composables/useRestApi";
      import RestResponse from "@/models/api/RestResponseModel";
      import { type IPageResponse } from "@/models/api/PageResponseModel";
      import {
        PaginationRequestParameter,
        RequestModel,
        SortFieldParameter,
      } from "@/models/api/RequestModel";
      import type { ${majStart(EntityName)} } from "@/models/${majStart(EntityName)}Model";
    methods: |
      const restApiWithPage = useRestApi<IPageResponse<${majStart(EntityName)}>>();
      const BASE_URL = "/${minPluralize(EntityName)}";
  
      /** GET all avec pagination */
      export async function getAll(
        pagination?: PaginationRequestParameter,
        sortFields?: SortFieldParameter[]
      ) {
        const request = new RequestModel(BASE_URL, pagination, sortFields);
        const response = await restApiWithPage.GET(request.buildRequestUrl());
        return RestResponse.handleResponse<${majStart(EntityName)}[]>(response, true);
      }
  
      /** GET by ID */
      export async function getById(id: string) {
        const response = await restApiWithPage.GET(BASE_URL+`/`+id);
        return RestResponse.handleResponse<${majStart(EntityName)} | null>(response);
      }
  
      /** POST create */
      export async function create(data: Partial<${majStart(EntityName)}>) {
        const response = await restApiWithPage.POST(BASE_URL, data);
        return RestResponse.handleResponse<${majStart(EntityName)} | null>(response);
      }
  
      /** PUT update */
      export async function update(id: string, data: Partial<${majStart(EntityName)}>) {
        const response = await restApiWithPage.PUT(BASE_URL+`/`+id, data);
        return RestResponse.handleResponse<${majStart(EntityName)} | null>(response);
      }
  
      /** DELETE remove */
      export async function remove(id: string) {
        const response = await restApiWithPage.DELETE(BASE_URL+`/`+id);
        return {
          success: response.returnCode === 1,
          error: response.returnCode !== 1 ? response.message : null,
        };
      }
  
      /** POST search avec pagination */
      export async function search(
        data: Partial<${majStart(EntityName)}>,
        pagination?: PaginationRequestParameter,
        sortFields?: SortFieldParameter[]
      ) {
        const request = new RequestModel(BASE_URL+`/search`, pagination, sortFields);
        const response = await restApiWithPage.POST(request.buildRequestUrl(), data);
        return RestResponse.handleResponse<${majStart(EntityName)}[]>(response, true);
      }
    destinationPath: "${destinationFolder}/src/services"
    name: "${majStart(EntityName)}Service"
  modelComponent:
    imports: |
      import { EntityListField } from "./EntityModel";
    exports: |
      export interface I${majStart(EntityName)} {
        {{#each fields}}
        ${minStart(this.name)}: ${this.typeBase} | undefined;
        {{/each}}
      }

      export class ${majStart(EntityName)} implements I${majStart(EntityName)} {
        {{#each fields}}
        ${minStart(this.name)}: ${this.typeBase} | undefined;
        {{/each}}

        constructor(data?: Partial<I${majStart(EntityName)}>) {
          {{#each fields}}
            this.${minStart(this.name)} = data?.${minStart(this.name)};
          {{/each}}
        }

        static getFieldListMetadata(): EntityListField[] {
          return [
            {{#each fields}}
            { key: "${this.name}", label: "${formatReadable(this.name)}", type: "${this.uiType}", sortable: true },
            {{/each}}
          ];
        }
      }
    exportsComponents: |
    destinationPath: "${destinationFolder}/src/models"
    name: "${majStart(EntityName)}Model"

