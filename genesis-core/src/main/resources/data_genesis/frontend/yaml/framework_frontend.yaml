                    detailRedirect="/${toKebabCase(className)}s/:id"
                />
            );
        }
      destinationPath: "${destinationFolder}/src/pages/${toKebabCase(className)}"
      componentName: "${toKebabCase(className)}-update"
      componentAdditionalFiles: []
  serviceComponent:
    imports: |
      // src/models/${toKebabCase(className)}/${toKebabCase(className)}.service.ts
      import type { ${majStart(className)} } from './${toKebabCase(className)}.model';
      import type { FilterState } from '@/types/filter';
      import { getById, search {{#if !isView}},create,remove, update{{/if}} } from "@/services/api";
    methods: |
      export const ${toCamelCase(className)}Service = {
          search(params: {
              page: number;
              size: number;
              sort: `$[string],$['asc' | 'desc']`;
              filter: FilterState;
          }) {
              return search<${majStart(className)}>({
                  endpoint: '/${lowerCase(classNameLink)}/search',
                  ...params,
              });
          },

          async getById(id: number) {
              return getById<${majStart(className)}>('/${lowerCase(classNameLink)}', id);
          },

          create(${toCamelCase(className)}: Omit<${majStart(className)}, 'id'>) {
              return create<${majStart(className)}>('/${lowerCase(classNameLink)}', ${toCamelCase(className)});
          },

          async update(id: number, ${toCamelCase(className)}: Partial<${majStart(className)}>) {
              return update<${majStart(className)}>('/${lowerCase(classNameLink)}', id, ${toCamelCase(className)});
          },

          delete: (id: string | number) => remove('/${toKebabCase(className)}s', id),
      };
    destinationPath: "${destinationFolder}/src/models/${toKebabCase(className)}"
    name: "${toKebabCase(className)}.service"
  modelComponent:
    imports: |
      // src/models/${toKebabCase(className)}/${toKebabCase(className)}.model.ts
      import dayjs from "dayjs";
      import { format } from 'date-fns';
      import 'dayjs/plugin/utc'; 
      import utc from 'dayjs/plugin/utc'; 
      import { parseTimeString } from '@/utils/timeParser';
      import {formatDuration} from "@/utils/formatDuration";
      dayjs.extend(utc); // Utilise le plugin utc
    exports : |
      export interface ${majStart(className)} {
      {{tab}}{{#each fields}}
      {{tab}}{{#if this.isForeignKey}}${this.name}: ${this.referencedColumnType}{{else}}
      {{tab}}${this.name}: ${this.typeBase}{{/if}}
      {{tab}}{{/each}}{{removeLine}}
      {{tab}}[key: string]: unknown;
      }
      
      export const ${toCamelCase(className)}Meta = {
          entityName: '${majStart(className)}',
          endpoint: '/${toKebabCase(className)}s/search',
          defaultSort: '{{#each fieldsPK}}${this.name}{{/each}},asc' as const
      };
      
      export const ${toCamelCase(className)}Columns = [
          {{#each fieldsFK}}
          {
            header: '${this.type}',
            accessor: (row: ${majStart(className)}) => (row.${this.name} as any)?.${this.referencedPrimaryKeyColumn} ?? '-',
            sortKey: '${this.name}',
            link: (row: ${majStart(className)}) => `/${toKebabCase(this.type)}s/$[(row.${this.name} as any)?.${this.referencedPrimaryKeyColumn}]?from=/${toKebabCase(className)}s`
          },
          {{/each}}{{removeLine}}
          {{#each fieldsNotFK}}
          {{#if this.isPrimaryKey}}
          { header: '${formatReadable(this.name)}', accessor: '${this.name}', sortKey: '${this.name}' ,link: (row: ${majStart(className)}) => `/${toKebabCase(className)}s/$[row.${this.name}]`},
          {{elseIf this.isDate}}
          {
            header: '${formatReadable(this.name)}',
            accessor: (row: ${majStart(className)}) => {
              if (!row.${this.name}) return '-';
              const d = new Date(row.${this.name} as unknown as string);
              return isNaN(d.getTime())
                  ? '-'
                  : d.toLocaleDateString('fr-FR');  
            },
            sortKey: '${this.name}'
          },
          {{elseIf this.isDateTime }}
          {
            header: '${formatReadable(this.name)}',
            accessor: (row: ${majStart(className)} ) => {
               const date = row.${this.name};
               if (!date) return '-';
               const dateObject = new Date(date);
               return isNaN(dateObject.getTime()) ? '-' : format(dateObject, "dd/MM/yyyy HH:mm:ss");
            },
            sortKey: '${this.name}'
          },
          {{elseIf this.isTimeTz}} 
          {
            header: '${formatReadable(this.name)}',
              accessor: (row: ${majStart(className)}) => {
                  const timeStr = row.${this.name};
                  if (!timeStr) return '-';
      
                  const clean = timeStr.replace('Z', '');          
                  const parts = clean.split(':');
      
                  if (parts.length < 2) return '-';                  
                  const [h, m, s] = [...parts, '00'].map(Number);   
                  const d = dayjs.utc(`1970-01-01 $[h]:$[m]:$[s]`, 'YYYY-MM-DD HH:mm:ss');
                  return d.isValid() ? d.format('HH:mm:ss') : '-';
              },
            sortKey: '${this.name}'
          },
          {{elseIf this.isTime }}
          {
            header: '${formatReadable(this.name)}',
            accessor: (row: ${majStart(className)} ) => {
                const timeStr = row.${this.name};  
                if (!timeStr) return '-';
                const [h, m, s] = timeStr.replace('Z', '').split(':').map(Number);
                const dateObj = new Date(1970, 0, 1, h, m, s);
                return format(dateObj, 'HH:mm:ss');
            },
            sortKey: '${this.name}'
          },
          {{elseIf this.isInterval}}
          {
            header: '${formatReadable(this.name)}',
            accessor: (row: ${majStart(className)}) => formatDuration(row.${this.name}),
            sortKey: '${this.name}'
          },
          {{else}}
          { header: '${formatReadable(this.name)}', accessor: '${this.name}', sortKey: '${this.name}' },
          {{/if}}{{/each}}{{removeLine}}
      ]
      
      export const ${toCamelCase(className)}Filters = {
          {{#each fieldsFK}}
          ${this.name}: {
            label: '${formatReadable(this.type)}',
            type: '${this.referencedColumnType}' as const,
            nestedKey: '${this.referencedPrimaryKeyColumn}' as const
          },
          {{/each}}{{removeLine}}
          {{#each fieldsNotFK}}
          {{#if this.isPrimaryKey}}
          ${this.name}: { label: '${formatReadable(this.name)}', type: '${this.typeBase}' as const },
          {{elseIf this.isText}}
          ${this.name}: { label: '${formatReadable(this.name)}', type: 'text' as const },
          {{elseIf this.isNumeric }}
          ${this.name}: { label: '${formatReadable(this.name)}', type: 'number' as const },
          ${this.name}Min: { label: '${formatReadable(this.name)} Min', type: 'number' as const },
          ${this.name}Max: { label: '${formatReadable(this.name)} Max', type: 'number' as const },
          {{elseIf this.isDate}}
          ${this.name}: { label: '${formatReadable(this.name)}', type: 'Date' as const },
          ${this.name}Min: { label: '${formatReadable(this.name)} Min', type: 'Date' as const },
          ${this.name}Max: { label: '${formatReadable(this.name)} Max', type: 'Date' as const },
          {{elseIf this.isTimeTz}} 
          ${this.name}: { label: '${formatReadable(this.name)}', type: 'timeTz' as const },
          ${this.name}Min: { label: '${formatReadable(this.name)} Min', type: 'timeTz' as const },
          ${this.name}Max: { label: '${formatReadable(this.name)} Max', type: 'timeTz' as const },
          {{elseIf this.isDateTimeTz}}  
          ${this.name}: { label: '${formatReadable(this.name)}', type: 'DateTimeTZ' as const },
          ${this.name}Min: { label: '${formatReadable(this.name)} Min', type: 'DateTimeTZ' as const },
          ${this.name}Max: { label: '${formatReadable(this.name)} Max', type: 'DateTimeTZ' as const },
          {{elseIf this.isDateTime}}  
          ${this.name}: { label: '${formatReadable(this.name)}', type: 'DateTime' as const },
          ${this.name}Min: { label: '${formatReadable(this.name)} Min', type: 'DateTime' as const },
          ${this.name}Max: { label: '${formatReadable(this.name)} Max', type: 'DateTime' as const },
          {{elseIf this.isTime }}
          ${this.name}: { label: '${formatReadable(this.name)}', type: 'time' as const },
          ${this.name}Min: { label: '${formatReadable(this.name)} Min', type: 'time' as const },
          ${this.name}Max: { label: '${formatReadable(this.name)} Max', type: 'time' as const },
          {{elseIf this.isInterval}}
          ${this.name}: { label: '${formatReadable(this.name)}', type: 'interval' as const },
          ${this.name}Min: { label: '${formatReadable(this.name)} Min', type: 'interval' as const },
          ${this.name}Max: { label: '${formatReadable(this.name)} Max', type: 'interval' as const },
          {{/if}}{{/each}}{{removeLine}}
      };
      
      export const formFields = {
          {{#each fieldsFK}}
          ${this.name}: {
            label: '${this.type}',
            type: 'select' as const,
            required: ${this.isRequired},
            foreignKey: {
              endpoint: '/${toKebabCase(this.type)}s?page=0&size=1000',
              labelKey: '${this.referencedPrimaryKeyColumn}',
              valueKey: '${this.referencedPrimaryKeyColumn}'
            },
            transform: (value: any) => ({ ${this.referencedPrimaryKeyColumn}: Number(value) }),
          },
          {{/each}}{{removeLine}}
          {{#each fieldsNotFK}}
          {{#if this.isPrimaryKey}}
          {{removeLine}}
          {{elseIf this.isTimeTz}} 
          ${this.name}: {
                label: '${formatReadable(this.name)}',
                type: 'timeTz' as const,
                required: true,
                transform: (value: any) => {
                    if (!value || typeof value !== 'string') return null;
                    const d = dayjs.utc(`1970-01-01T$[value]`); 
                    return d.isValid() ? d.format('HH:mm:ss') + 'Z' : null;
                },
          },
          {{elseIf this.isDateTimeTz}}
          ${this.name}: {
            label: '${formatReadable(this.name)}',
            type: 'datetime' as const,
            required: ${this.isRequired},
            transform: (value: string) =>
                                 value ? dayjs(value).utc().format('YYYY-MM-DDTHH:mm:ss.SSS[Z]') : null
          },
          {{elseIf this.isDateTime}}
          ${this.name}: {
            label: '${formatReadable(this.name)}',
            type: 'datetime' as const,
            required: ${this.isRequired},
            transform: (value: string) =>
                                 value ? dayjs(value).format('YYYY-MM-DDTHH:mm:ss.SSS[Z]') : null,
          },
          {{elseIf this.isTime }}
          ${this.name}: {
            label: '${formatReadable(this.name)}',
            type: 'time' as const,
            required: ${this.isRequired},
            transform: (value: any) => {
                if (!value) return null;
                const parsed = parseTimeString(String(value));
                return parsed ? parsed.format('HH:mm:ss') : null;
            },
          },
          {{elseIf this.isInterval}}
          ${this.name}: {
            label: '${formatReadable(this.name)}',
            type: 'interval' as const,
            required: ${this.isRequired},
          },
          {{else}}
          ${this.name}: { label: '${formatReadable(this.name)}', type: '${this.typeBase}' as const, required: ${this.isRequired} },
          {{/if}}{{/each}}{{removeLine}}
      } as const;
      
      export const updateFormFields = {
          {{#each fieldsPK}}
          ${this.name}: {
            label: '${formatReadable(this.name)}',
            type: '${this.typeBase}' as const,
            required: true,
            readonly: true, 
          },
          {{/each}}{{removeLine}}
          ...formFields, 
      };
    destinationPath: "${destinationFolder}/src/models/${toKebabCase(className)}"
    name: "${toKebabCase(className)}.model"

