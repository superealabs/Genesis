    - fileType: "interceptor files"
      fileName: "interceptor.component"
      extension: "ts"
      content: |
        {{#if useJWT}}
        import { Injectable } from '@angular/core';
        import { HttpEvent, HttpHandler, HttpInterceptor, HttpRequest, HttpErrorResponse } from '@angular/common/http';
        import { Observable, throwError } from 'rxjs';
        import { catchError } from 'rxjs/operators';
        import { Router } from '@angular/router';
        import { environment } from '../../../environments/environment';

        @Injectable()
        export class AuthInterceptor implements HttpInterceptor {
        
          private readonly apiUrl = environment.apiUrl;
          constructor(private router: Router) {}
          
          intercept(req: HttpRequest<any>, next: HttpHandler): Observable<HttpEvent<any>> {
            if (req.url === this.apiUrl+"/auth/login") {
              return next.handle(req);
            }
            const token = localStorage.getItem('authToken'); 
            
            let authReq = req;
            if (token) {
              authReq = req.clone({
                setHeaders: {
                  Authorization: "Bearer "+token
                }
              });
            }
            return next.handle(authReq).pipe(
              catchError((error: HttpErrorResponse) => {
                if (error.status === 401) {
                  console.warn('forbidden, redirecting to login');
                  this.router.navigate(['']);
                } else if (error.status === 403) {
                  console.warn('access denied');
                }
                return throwError(() => error);
              })
            );
          }
        }
        {{else}}no ts{{/if}}
      destinationPath: "${destinationFolder}/src/app/features/authentication"
    - fileType: "authentication files"
      fileName: "authentication.route"
      extension: "ts"
      content: |
        {{#if useJWT}}
        import { Routes } from '@angular/router';
        export const loginRoutes: Routes = [
          {
            path: '',
            loadComponent: () => import('./login/login.component').then(m => m.LoginComponent)
