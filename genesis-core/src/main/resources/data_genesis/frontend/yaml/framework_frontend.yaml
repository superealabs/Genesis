      content: | 
        content0
      destinationPath: "${destinationFolder}/src/app/"
    - fileType: "App-files"
      fileName: "app.component"
      extension: "html"
      content: |
        content1
      destinationPath: "${destinationFolder}/src/app/"
    - fileType: "App-files"
      fileName: "app.component"
      extension: "css"
      content: |
        content2
      destinationPath: "${destinationFolder}/src/app/"
    - fileType: "Environment-file"
      fileName: "environment"
      extension: "ts"
      content: |
          export const environment = {
          {{tab}}production: false,
          {{tab}}apiUrl: 'http://localhost:8070/${toKebabCase(projectName)}'
          };
      destinationPath: "${destinationFolder}/src/environments/"
    - fileType: "Environment-file"
      fileName: "environment.prod"
      extension: "ts"
      content: |
        export const environment = {
        {{tab}}production: true,
        {{tab}}apiUrl: 'http://localhost:8070/${toKebabCase(projectName)}'
        };
      destinationPath: "${destinationFolder}/src/environments/"
    - fileType: "Utilities"
      fileName: "utilities"
      extension: "ts"
      content: |
        export function cleanObject<T>(obj: Partial<T>): Partial<T> {
          return Object.fromEntries(
            Object.entries(obj)
              .filter(([_, value]) => value !== '' && value !== undefined && value !== null)
          ) as Partial<T>;
        }
      destinationPath: "${destinationFolder}/src/utilities/"
  components:
