                path: 'profile',
                name: 'profile',
                component: () => import('@/views/auth/ProfileView.vue'),
              },
              {
                path: '/auth/update-profile',
                name: 'update-profile',
                component: () => import('@/views/auth/UpdateProfileView.vue'),
                meta: { requiresAuth: true },
              },
              {
                path: '/auth/change-password',
                name: 'change-password',
                component: () => import('@/views/auth/ChangePasswordView.vue'),
                meta: { requiresAuth: true },
              },{{/if}}
              {{#each entities}}
              ...${minStart(this.className)}Routes,
              {{/each}}{{removeLine}}
            ],
          },{{#if useJWT}}
          {
            path: '/auth',
            component: AuthLayout,
            children: [...authRoutes],
          },{{/if}}
          {
            path: '/:pathMatch(.*)*',
            name: 'not-found',
            component: NotFoundView,
          },
        ]
        export default routes
      destinationPath: "${destinationFolder}/src/router"

    - fileType: "Navigation Config"
      fileName: "navigations"
      extension: "ts"
      content: |
        const navigations = [
          // ENTITIES NAVIGATION
          {
            icon: 'fas fa-layer-group',
            sectionName: 'navbar.entities',
            navChilds: [
              {{#each entities}}
              {{#if this.isView = false}}
              {
                navTitle:'entities.${minStart(this.className)}.nav.title',
                navChilds:[
                  {
                    navTitle: 'entities.${minStart(this.className)}.nav.list',
                    navLink: '/${minStart(this.className)}s',
                  },
                  {
                    navTitle: 'entities.${minStart(this.className)}.nav.create',
                    navLink: '/${minStart(this.className)}s/create',
                  },
                ]
              },
              {{removeLine}}
              {{/if}}
              {{/each}}
            ],
          },
          // VIEWS NAVIGATION
          {
            icon: 'fas fa-box',
            sectionName: 'navbar.views',
            navChilds: [
              {{#each entities}}
              {{#if this.isView}}
              {
                navTitle:'views.${minStart(this.className)}.nav.title',
                navLink: '/${minStart(this.className)}s',
              },
              {{removeLine}}
              {{/if}}
              {{/each}}
            ],
          },
        ]
        export default navigations
      destinationPath: "${destinationFolder}/src/config"

    - fileType: "Layout Store"
      fileName: "useLayoutStore"
      extension: "ts"
      content: |
        import { defineStore } from 'pinia'
        import { ref, watch } from 'vue'

        export const useLayoutStore = defineStore('layout', () => {
          const currentLayout = ref(localStorage.getItem('layoutMode') || '${minStart(navbarPreference)}')

          function setLayout(mode: 'sidebar' | 'topbar') {
            currentLayout.value = mode
            localStorage.setItem('layoutMode', mode)
          }

          watch(
            currentLayout,
            (newVal) => {
            document.body.dataset.layout = newVal
          },
            { immediate: true },
          )

          return { currentLayout, setLayout }
        })
      destinationPath: "${destinationFolder}/src/stores"

    - fileType: "i18n Config"
      fileName: "i18n"
      extension: "ts"
      content: |
        /* Import lang Files */
        {{#each langList}}
        import ${lowerCase(this.name)} from '@/lang/${lowerCase(this.name)}'
        {{/each}}
        import { createI18n } from 'vue-i18n'
        const i18n = createI18n({
          legacy: false,
          {{#each langList}}
          {{#if @first}}
          locale: '${this.locale}',
          fallbackLocale: '${this.locale}',{{/if}}
        {{/each}}{{removeLine}}
          messages: {
            {{#each langList}}
            ${this.locale}: ${lowerCase(this.name)}.messages,
            {{/each}}{{removeLine}}
          },
          datetimeFormats: {
            {{#each langList}}
            ${this.locale}: ${lowerCase(this.name)}.dateTimeFormats,
            {{/each}}{{removeLine}}
          },
          numberFormats: {
            {{#each langList}}
            ${this.locale}: ${lowerCase(this.name)}.numberFormats,
            {{/each}}{{removeLine}}
          },
        })
        export default i18n
      destinationPath: "${destinationFolder}/src/config"

