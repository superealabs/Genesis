    - componentType: "Form Component"
      generateForView: false
      router:
        link: ""
        label: "{{removeLine}}"
      componentName: "${majStart(EntityName)}Form"
      importFile: |
        import { ref } from "vue";
        import { ${majStart(EntityName)}, ${majStart(EntityName)}FormDTO } from "@/models/${majStart(EntityName)}Model";
        import GenesisButton from "@/core/button/GenesisButton.vue";
        import GenesisInput from "@/core/form/GenesisInput.vue";
        import GenesisSelectSearch from "@/core/form/GenesisSelectSearch.vue";
        {{#each fieldsFK}}
