    - componentType: "Update"
      router:
        link: "/${toKebabCase(className)}s/:id/edit"
        label: "Update ${formatReadable(classNameLink)}"
      importFile: |
        import { ${majStart(className)}, ${toCamelCase(className)}Meta, updateFormFields } from '@/models/${toKebabCase(className)}/${toKebabCase(className)}.model';
        import { ${toCamelCase(className)}Service } from '@/models/${toKebabCase(className)}/${toKebabCase(className)}.service';
      selector: "Update${majStart(className)}"
      generateForView: false
      importComponent: |
        import GenericUpdateFormBuilder from '@/components/GenericForm/GenericUpdateFormBuilder';
      export: |
        export default function Update${majStart(className)}() {
            return (
                <GenericUpdateFormBuilder<${majStart(className)}>
