                          this.isLoading = false;
                      },
                      error: (err) => {
                          warnMeUp('error','error while collecting datas');
                          this.isLoading = false;
                      }
                  });
            }
            {{else}}{{removeLine}}
            ngOnInit(): void {
                  this.load${majStart(className)}s();
            }
            {{/if}}{{removeLine}}
            
            ngOnDestroy() {
                this.destroy$.next();
                this.destroy$.complete();
            } 
        
        }
