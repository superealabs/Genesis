          subMessage="Cette action est irréversible."
          @confirm="confirmDelete"
          @cancel="closePopup"
        />
        {{/if}}
      export: |
        // Props
        {{#if isView}}
        defineProps({
          ${minStart(EntityName)}: {
            type: Object as PropType<${majStart(EntityName)}>,
            required: true,
          },
        })
        {{else}}
        const props = defineProps({
          ${minStart(EntityName)}: {
            type: Object as PropType<${majStart(EntityName)}>,
            required: true,
          },
        })
        
        // Popup composable
        const { closePopup, openPopup, visible: deletePopup } = usePopup(false)

        // Entity composable for CRUD and navigation
        const { delete${majStart(EntityName)}, goToListView, goToUpdateFormView } = use${majPluralize(EntityName)}()

        // Open delete popup
        const openDeletePopup = (entity: ${majStart(EntityName)}) => {
          if (!entity) return
          openPopup()
        }

        // Confirm deletion
        const confirmDelete = async () => {
          const { success, error } = await delete${majStart(EntityName)}(props.${minStart(EntityName)})
          if (!success) console.error(error)
          closePopup()
          goToListView()
        }
