  components:
    - componentType: "List"
      generateForView: true
      router:
        link: "/${toKebabCase(className)}s"
        label: "${formatReadable(classNameLink)}"
      importFile: |
        import { Edit, Delete } from '@mui/icons-material';
        import { useNavigate } from 'react-router-dom';
        
        import {${majStart(className)}, ${toKebabCase(className)}Meta, ${toKebabCase(className)}Columns, ${toKebabCase(className)}Filters} from '@/models/${toKebabCase(className)}/${toKebabCase(className)}.model';
        import { ${className}Service } from '@/models/${toKebabCase(className)}/${toKebabCase(className)}.service';
      importComponent: |
        import GenericListPage from '@/components/GenericListPage/GenericListPage';
        import ActionButtons from '@/components/ActionButtons';
        import {useDelete} from "@/hooks/useDelete";
      selector: "app-${toKebabCase(className)}-list"
      export: |
        const columns = [
            ...${toKebabCase(className)}Columns,
            {{#if !isView}}
            {
                header: 'Actions',
                accessor: (row: ${majStart(className)}) => <RowActions row={row} />, // ✅ composant séparé
            },
            {{/if}}
        ];

        {{#if !isView}}
        function RowActions({ row }: { row: ${majStart(className)} }) {
            const navigate = useNavigate();
            const handleDelete = useDelete(${className}Service.delete, () => window.location.reload());

            return (
                <ActionButtons
                    actions={[
                        { icon: <Edit fontSize="small" />, onClick: () => navigate(`/${toKebabCase(className)}s/${row.{{#each fieldsPK}}${this.name}{{/each}}}/edit`) },
                        { icon: <Delete fontSize="small" />, onClick: () => handleDelete(row.{{#each fieldsPK}}${this.name}{{/each}}) },
                    ]}
                />
            );
        }
        {{/if}}
        export default function ${majStart(className)}List() {
            return GenericListPage<${majStart(className)}>({
                entityName: ${toKebabCase(className)}Meta.entityName,
                columns,
                availableFilters: ${toKebabCase(className)}Filters,
                defaultSort: ${toKebabCase(className)}Meta.defaultSort,
                searchFn: ${className}Service.search,
                pageTitle: '${majStart(className)} List'
            })();
        }
      destinationPath: "${destinationFolder}/src/pages/${toKebabCase(className)}"
      componentName: "${toKebabCase(className)}-list"
      componentAdditionalFiles: []
    - componentType: "Add"
      router:
        link: "/${toKebabCase(className)}s/create"
        label: "Create ${formatReadable(classNameLink)}"
      importFile: |
        import {${majStart(className)}, ${toKebabCase(className)}Meta, formFields} from '@/models/${toKebabCase(className)}/${toKebabCase(className)}.model';
        import { ${toKebabCase(className)}Service } from '@/models/${toKebabCase(className)}/${toKebabCase(className)}.service';
      selector: "app-${toKebabCase(className)}-form"
      generateForView: false
      importComponent: |
        import GenericFormBuilder from '@/components/GenericForm/GenericFormBuilder';
        import {ApiResponse} from "@/services/api";
      export: |
        export default function Create${majStart(className)}() {

            const handleSubmit = async (data: any): Promise<ApiResponse<${majStart(className)}>> => {
                return await ${toKebabCase(className)}Service.create(data);
            };

            return (
                <GenericFormBuilder
                    entityName={${toKebabCase(className)}Meta.entityName}
                    fields={formFields as any}
                    onSubmit={handleSubmit}
                    redirectTo="/${toKebabCase(className)}s"
                    title="Add ${toKebabCase(className)}"
                    mode="create"
                    idKey="{{#each fieldsPK}}${this.name}{{/each}}"
                    detailRedirect="/${toKebabCase(className)}s/:id"
                />
            );
        }
      destinationPath: "${destinationFolder}/src/pages/${toKebabCase(className)}"
      componentName: "${toKebabCase(className)}-create"
      componentAdditionalFiles: []
    - componentType: "Update"
      router:
        link: "/${toKebabCase(className)}s/:id/edit"
        label: "Update ${formatReadable(classNameLink)}"
      importFile: |
        import { ${majStart(className)}, ${toKebabCase(className)}Meta, updateFormFields } from '@/models/${toKebabCase(className)}Meta/${toKebabCase(className)}Meta.model';
        import { ${toKebabCase(className)}Service } from '@/models/${toKebabCase(className)}/${toKebabCase(className)}.service';
      selector: "app-${toKebabCase(className)}-form"
      generateForView: false
      importComponent: |
        import GenericUpdateFormBuilder from '@/components/GenericForm/GenericUpdateFormBuilder';
      export: |
        export default function Update${majStart(className)}() {
            return (
                <GenericUpdateFormBuilder<${majStart(className)}>
                    entityName={${toKebabCase(className)}Meta.entityName}
                    fields={updateFormFields}
                    getById={${toKebabCase(className)}Service.getById}
                    update={${toKebabCase(className)}Service.update}
                    title="Update ${toKebabCase(className)}"
                    detailRedirect="/${toKebabCase(className)}s/:id"
                />
            );
        }
      destinationPath: "${destinationFolder}/src/pages/${toKebabCase(className)}"
      componentName: "${toKebabCase(className)}-update"
      componentAdditionalFiles: []
  serviceComponent:
    imports: |
      // src/models/${toKebabCase(className)}/${toKebabCase(className)}.service.ts
      import type { ${majStart(className)} } from './${toKebabCase(className)}.model';
      import type { FilterState } from '@/types/filter';
      import { getById, search {{#if !isView}},create,remove, update{{/if}} } from "@/services/api";
    methods: |
      export const ${toKebabCase(className)}Service = {
          search(params: {
              page: number;
              size: number;
              sort: `${string},${'asc' | 'desc'}`;
              filter: FilterState;
          }) {
              return search<${majStart(className)}>({
                  endpoint: '/${toKebabCase(className)}s/search',
                  ...params,
              });
          },

          async getById(id: number) {
              return getById<${majStart(className)}>('/${toKebabCase(className)}s', id);
          },

          create(${toKebabCase(className)}: Omit<${majStart(className)}, 'id'>) {
              return create<${majStart(className)}>('/${toKebabCase(className)}s', ${toKebabCase(className)});
          },

          async update(id: number, ${toKebabCase(className)}: Partial<${majStart(className)}>) {
              return update<${majStart(className)}>('/${toKebabCase(className)}s', id, ${toKebabCase(className)});
          },

          delete: (id: string | number) => remove('/${toKebabCase(className)}s', id),
      };
    destinationPath: "${destinationFolder}/src/models/${toKebabCase(className)}"
    name: "${toKebabCase(className)}.service"
  modelComponent:
    imports: |
      // src/models/commande/commande.model.ts
      import dayjs from "dayjs";
      import { format } from 'date-fns';
      import 'dayjs/plugin/utc'; // Importe le plugin utc
      import utc from 'dayjs/plugin/utc'; // Importe le plugin utc
      dayjs.extend(utc); // Utilise le plugin utc
    exports : |
      export interface ${majStart(className)} {
      {{tab}}{{#each fields}}
      {{tab}}{{#if this.isForeignKey}}${this.name}: ${this.referencedColumnType}{{else}}
      {{tab}}${this.name}: ${this.typeBase}{{/if}}
      {{tab}}{{/each}}{{removeLine}}
      {{tab}}[key: string]: unknown;
      }
      
      export const ${toKebabCase(className)}Meta = {
          entityName: '${majStart(className)}',
          endpoint: '/${toKebabCase(className)}s/search',
          defaultSort: '{{#each fieldsPK}}${this.name}{{/each}},asc' as const
      };
      
      export const ${toKebabCase(className)}Columns = [
          {{#each fieldsFK}}
          {
            header: '${this.type}',
            accessor: (row: ${majStart(className)}) => (row.${this.name} as any)?.${this.referencedColumn} ?? '-',
            sortKey: '${this.name}.${this.referencedColumn}',
            link: (row: ${majStart(className)}) => `/${this.type}s/${(row.${this.name} as any)?.${this.referencedColumn}}?from=/${toKebabCase(className)}s`
          },
          {{/each}}
      
          {{#each fieldsNotFK}}
          {{#if this.isPrimaryKey}}
          { header: '${formatReadableLowerCase(this.name)}', accessor: '${this.name}', sortKey: '${this.name}' ,link: (row: ${majStart(className)}) => `/${toKebabCase(className)}s/${row.${this.name}}` },
          {{elseIf this.isDate}}
          {
            header: '${formatReadableLowerCase(this.name)}',
            accessor: (row: Commande) => {
               const date = row.${this.name};
               if (!date) return '-';
               const dateObject = new Date(date);
               return isNaN(dateObject.getTime()) ? '-' : format(dateObject, "dd/MM/yyyy HH:mm:ss");
            },
            sortKey: '${this.name}'
          },
         {{else}}
         { header: '${formatReadableLowerCase(this.name)}', accessor: '${this.name}', sortKey: '${this.name}' }
         {{tab}}{{tab}}{{#if !@last}},{{/if}}{{/each}}
      
        export const commandeFilters = {
            {{#each fieldsFK}}
            ${this.name}: {
              label: '${this.name}',
              type: 'text' as const,
              nestedKey: '${this.referencedColumn}' as const
            },
            {{/each}}
      
            {{#each fieldsNotFK}}
            {{#if this.isPrimaryKey}}
            ${this.name}: { label: '${formatReadableLowerCase(this.name)}', type: '${this.typeBase}' as const },
            {{elseIf this.isText}}
            ${this.name}: { label: '${formatReadableLowerCase(this.name)}', type: 'text' as const }
            {{elseIf this.isNumeric }}
            ${this.name}: { label: '${formatReadableLowerCase(this.name)}', type: 'number' as const },
            ${this.name}Min: { label: '${formatReadableLowerCase(this.name)}Min', type: 'number' as const },
            ${this.name}Max: { label: '${formatReadableLowerCase(this.name)}Max', type: 'number' as const },
            {{elseIf this.isDate }}
            ${this.name}: { label: '${formatReadableLowerCase(this.name)}', type: 'date' as const },
            ${this.name}Min: { label: '${formatReadableLowerCase(this.name)}Min', type: 'date' as const },
            ${this.name}Max: { label: '${formatReadableLowerCase(this.name)}Max', type: 'date' as const },
            {{tab}}{{tab}}{{#if !@last}},{{/if}}{{/each}}
        };
      
        export const formFields = {
            {{#each fieldsFK}}
            ${this.name}: {
              label: '${formatReadableLowerCase(this.name)}',
              type: 'select' as const,
              required: ${this.isNullable},
              foreignKey: {
                endpoint: '/${this.referencedColumnType}s?page=0&size=1000',
                labelKey: '${this.referencedColumn}',
                valueKey: '${this.referencedColumn}'
              },
              transform: (value: any) => ({ id: Number(value) }),
            },
            {{/each}}
            {{#each fieldsNotFK}}
            {{#if this.isPrimaryKey}}
            {{removeLine}}
            {{elseIf this.isDate }}
            ${this.name}: {
              label: '${formatReadableLowerCase(this.name)}',
              type: 'datetime' as const,
              required: ${this.isNullable},
              transform: (value: string) =>
                                   value ? dayjs(value).format('YYYY-MM-DDTHH:mm:ss.SSS[Z]') : '',
            },
            {{else}}
            ${this.name}: { label: '${formatReadableLowerCase(this.name)}', type: '${this.typeBase}' as const, required: ${this.isNullable} }
            {{tab}}{{tab}}{{#if !@last}},{{/if}}{{/each}}
        } as const;
      
        export const updateFormFields = {
            {{#each fieldsPK}}
            ${this.name}: {
              label: 'ID',
              type: '${this.typeBase}' as const,
              required: true,
              readonly: true, 
            },
            {{/each}} 
            ...formFields, 
        };
      ];
    destinationPath: "${destinationFolder}/src/models/${toKebabCase(className)}"
    name: "${toKebabCase(className)}.model"

