    - componentType: "Update View"
      generateForView: true
      router:
        link: "/${minPluralize(EntityName)}/update/:id"
        label: "{{removeLine}}"
      componentName: "${majStart(EntityName)}UpdateView"
      importFile: |
        import { defineComponent, ref, onMounted } from "vue";
        import { useRoute } from "vue-router";
        import ${majStart(EntityName)}Form from "@/entities/${minStart(EntityName)}/${majStart(EntityName)}Form.vue";
        import AlertPopup from "@/core/popup/AlertPopup.vue";
        import { use${majPluralize(EntityName)} } from "@/composables/use${majPluralize(EntityName)}";
        import { ${majStart(EntityName)}FormDTO } from "@/models/${majStart(EntityName)}Model";
        import { useLoading } from "@/composables/useLoading";
        import { usePopup } from "@/composables/usePopup";
      selector: "${majStart(EntityName)}UpdateView"
      standalone: true
      importComponent: |
        components: { ${majStart(EntityName)}Form, AlertPopup }
      template: |
        <template>
          <div class="container-fluid">
            <div class="d-flex mb-4 justify-content-between align-items-center">
              <div>
                <h3>${majStart(EntityName)} / <span class="text-muted">Update</span></h3>
              </div>
            </div>

            <div v-if="entity">
              <${minStart(EntityName)}-form
                :${minStart(EntityName)}="entity"
                submit-label="Update ${majStart(EntityName)}"
                @submit="updateHandler"
                @cancel="view${majStart(EntityName)}"
              ></${minStart(EntityName)}-form>
            </div>

            <AlertPopup
              :message="message ?? undefined"
              title="Error 500"
              :visible="alertPopup"
              @close="closePopup"
            ></AlertPopup>
          </div>
        </template>
      style: |
        <style scoped></style>
      export: |
        setup() {
          const route = useRoute();
          const pathId = Number(route.params.id);
          const { loading, startLoading, stopLoading } = useLoading();
          const { closePopup, openPopup, visible: alertPopup } = usePopup();

          const { get${majStart(EntityName)}ById, goToListView, update${majStart(EntityName)}, view${majStart(EntityName)}, message } = use${majPluralize(EntityName)}();
          const entity = ref<${majStart(EntityName)}FormDTO | null>(null);

          const updateHandler = async (formDTO: Partial<${majStart(EntityName)}FormDTO>) => {
            startLoading();
            const data = await update${majStart(EntityName)}(pathId, formDTO);
            if (data && !message.value) {
              view${majStart(EntityName)}(data);
            } else {
              openPopup();
            }
            stopLoading();
          };

          onMounted(async () => {
            const result = await get${majStart(EntityName)}ById(pathId);
            entity.value = ${majStart(EntityName)}FormDTO.parse(result.data) || null;
          });

          return {
            entity,
            route,
            goToListView,
            update${majStart(EntityName)},
            view${majStart(EntityName)},
            updateHandler,
            loading,
            message,
            closePopup,
            alertPopup,
          };
        }
      destinationPath: "${destinationFolder}/src/views/${minStart(EntityName)}"
      componentAdditionalFiles: [ ]

    - componentType: "Create View"
      generateForView: true
      router:
        link: "/${minPluralize(EntityName)}/create"
        label: "Create ${majStart(EntityName)}"
      componentName: "${majStart(EntityName)}CreateView"
      importFile: |
        import { defineComponent } from "vue";
        import { use${majPluralize(EntityName)} } from "@/composables/use${majPluralize(EntityName)}";
        import ${majStart(EntityName)}Form from "@/entities/${minStart(EntityName)}/${majStart(EntityName)}Form.vue";
        import { ${majStart(EntityName)}FormDTO } from "@/models/${majStart(EntityName)}Model";
        import AlertPopup from "@/core/popup/AlertPopup.vue";
        import { usePopup } from "@/composables/usePopup";
        import { useFreezeScreen } from "@/store/useFreezeScreen";
      selector: "${majStart(EntityName)}CreateView"
      standalone: true
      importComponent: |
        components: { ${majStart(EntityName)}Form, AlertPopup }
      template: |
        <template>
          <div class="container-fluid">
            <div class="d-flex mb-4 justify-content-between align-items-center">
              <div>
                <h3>${majStart(EntityName)} / <span class="text-muted">New</span></h3>
              </div>
            </div>

            <${minStart(EntityName)}-form
              submit-label="Save ${majStart(EntityName)}"
              :${minStart(EntityName)}="${minStart(EntityName)}FormDto"
              @submit="createHandler"
              @cancel="goToListView"
            />

            <AlertPopup
              :message="message ?? undefined"
              title="Error 500"
              :visible="alertPopup"
              @close="closePopup"
            />
          </div>
        </template>
      style: |
        <style scoped></style>
      export: |
        setup() {
          const ${minStart(EntityName)}FormDto = new ${majStart(EntityName)}FormDTO();
          const { create${majStart(EntityName)}, goToListView, message } = use${majPluralize(EntityName)}();
          const { openPopup, closePopup, visible: alertPopup } = usePopup();
          const { freeze, unfreeze } = useFreezeScreen();

          const createHandler = async (formDTO: Partial<${majStart(EntityName)}FormDTO>) => {
            freeze("Create a new ${majStart(EntityName)}...");
            try {
              const data = await create${majStart(EntityName)}(formDTO);
              if (data && !message.value) goToListView();
              else throw new Error();
            } catch (error) {
              openPopup();
            } finally {
              unfreeze();
            }
          };

          return {
            ${minStart(EntityName)}FormDto,
            createHandler,
            goToListView,
            message,
            alertPopup,
            closePopup,
          };
        }
      destinationPath: "${destinationFolder}/src/views/${minStart(EntityName)}"
      componentAdditionalFiles: [ ]

  serviceComponent:
    name: "${majStart(EntityName)}Service"
    destinationPath: "${destinationFolder}/src/services"
    imports: |
      import useRestApi from "@/composables/useRestApi";
      import RestResponse from "@/models/api/RestResponseModel";
      import { type IPageResponse } from "@/models/api/PageResponseModel";
      import {
        PaginationRequestParameter,
        RequestModel,
        SortFieldParameter,
      } from "@/models/api/RequestModel";
      import type { ${majStart(EntityName)} } from "@/models/${majStart(EntityName)}Model";
    methods: |
      const restApiWithPage = useRestApi<IPageResponse<${majStart(EntityName)}>>();
      const restApi = useRestApi<${majStart(EntityName)}>();
      const BASE_URL = "/${minPluralize(EntityName)}";

      /** GET all avec pagination */
      export async function getAll(
        pagination?: PaginationRequestParameter,
        sortFields?: SortFieldParameter[]
      ) {
        const request = new RequestModel(BASE_URL, pagination, sortFields);
        const response = await restApiWithPage.GET(request.buildRequestUrl());
        return RestResponse.handleResponse<${majStart(EntityName)}[]>(response, true);
      }

      /** GET by ID */
      export async function getById(id: number | string | undefined) {
        const response = await restApi.GET(BASE_URL + `/` + id);
        return RestResponse.handleResponse<${majStart(EntityName)} | null>(response);
      }

      /** POST create */
      export async function create(data: Partial<${majStart(EntityName)}>) {
        const response = await restApi.POST(BASE_URL, data);
        return RestResponse.handleResponse<${majStart(EntityName)} | null>(response);
      }

      /** PUT update */
      export async function update(
        id: number | string | undefined,
        data: Partial<${majStart(EntityName)}>
      ) {
        const response = await restApi.PUT(BASE_URL + `/` + id, data);
        return RestResponse.handleResponse<${majStart(EntityName)} | null>(response);
      }

      /** DELETE remove */
      export async function remove(id: number | string | undefined) {
        const response = await restApi.DELETE(BASE_URL + `/` + id);
        return {
          success: response.returnCode === 1,
          error: response.returnCode !== 1 ? response.message : null,
        };
      }

      /** POST search avec pagination */
      export async function search(
        data: Partial<${majStart(EntityName)}>,
        pagination?: PaginationRequestParameter,
        sortFields?: SortFieldParameter[]
      ) {
        const request = new RequestModel(BASE_URL + `/search`, pagination, sortFields);
        const response = await restApiWithPage.POST(request.buildRequestUrl(), data);
        return RestResponse.handleResponse<${majStart(EntityName)}[]>(response, true);
      }

  modelComponent:
    imports: |
      import { BaseModel } from "./BaseModel";
      import { EntitySearchField } from "./EntityModel";
      {{#each fieldsFK}}
      import { ${majStart(this.type)} } from "./${majStart(this.type)}Model";
      import * as ${minStart(this.type)}Service from "@/services/${majStart(this.type)}Service";
      {{/each}}
      import { createOptionsLoader } from "./SelectOption";
    exports: |
      export interface I${majStart(EntityName)} {
        {{#each fields}}
        {{#if this.isForeignKey}}
        ${minStart(this.name)}?: ${majStart(this.type)};
        {{else}}
        ${minStart(this.name)}?: ${this.typeBase};
        {{/if}}
        {{/each}}
      }

      export class ${majStart(EntityName)} extends BaseModel implements I${majStart(EntityName)} {
        {{#each fields}}
        {{#if this.isForeignKey}}
        ${minStart(this.name)}?: ${majStart(this.type)};
        {{else}}
        ${minStart(this.name)}?: ${this.typeBase};
        {{/if}}
        {{/each}}

        constructor(data?: Partial<I${majStart(EntityName)}>) {
          super();
          Object.assign(this, data);
        }

        protected static override searchDaoMetadata: EntitySearchField[] = [
          {{#each fields}}
          {{#if this.isForeignKey}}
          {
            key: "${this.name}",
            label: "${formatReadable(this.name)}",
            type: "select",
            searchKey: "id",
            sortable: true,
            optionsLoader: createOptionsLoader(${minStart(this.type)}Service.getAll),
          },
          {{elseIf this.isNumeric or this.isDate}}
          { key: "${this.name}", label: "${formatReadable(this.name)}", type: "${this.uiType}", sortable: true },
          { key: "${this.name}Min", label: "${formatReadable(this.name)} Min", type: "${this.uiType}", sortable: true },
          { key: "${this.name}Max", label: "${formatReadable(this.name)} Max", type: "${this.uiType}", sortable: true },
          {{else}}
          { key: "${this.name}", label: "${formatReadable(this.name)}", type: "${this.uiType}", sortable: true },
          {{/if}}
          {{/each}}
        ];
      }

      export class ${majStart(EntityName)}FormDTO {
        {{#each fields}}
        {{#if this.isForeignKey}}
        ${minStart(this.name)}?: string;
        {{else}}
        ${minStart(this.name)}?: ${this.typeBase};
        {{/if}}
        {{/each}}

        constructor(data?: Partial<${majStart(EntityName)}FormDTO>) {
          {{#each fields}}
          {{#if this.isForeignKey}}
          this.${minStart(this.name)} = data?.${minStart(this.name)} ?? "";
          {{else}}
          this.${minStart(this.name)} = data?.${minStart(this.name)};
          {{/if}}
          {{/each}}
        }

        static parse(data?: Partial<I${majStart(EntityName)}> | I${majStart(EntityName)} | null) {
          const instance = new ${majStart(EntityName)}FormDTO();
          {{#each fields}}
          {{#if this.isForeignKey}}
          instance.${minStart(this.name)} = data?.${minStart(this.name)}?.id?.toString();
          {{else}}
          instance.${minStart(this.name)} = data?.${minStart(this.name)};
          {{/if}}
          {{/each}}
          return instance;
        }

        async toEntity(): Promise<Partial<${majStart(EntityName)}>> {
          const entity: Partial<${majStart(EntityName)}> = new ${majStart(EntityName)}({
            {{#each fields}}
            {{#if this.isForeignKey}}{{removeLine}}
            {{else}}
            ${minStart(this.name)}: this.${minStart(this.name)},
            {{/if}}
            {{/each}}
          });

          {{#each fieldsFK}}
          if (this.${minStart(this.name)}) {
            const related = await ${minStart(this.type)}Service.getById(Number(this.${minStart(this.name)}));
            entity.${minStart(this.name)} = related.data as ${majStart(this.type)};
          }
          {{/each}}

          return entity;
        }
      }
    exportsComponents: |
    destinationPath: "${destinationFolder}/src/models"
    name: "${majStart(EntityName)}Model"