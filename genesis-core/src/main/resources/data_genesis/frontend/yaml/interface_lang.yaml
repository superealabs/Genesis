        },
    
        pagination: {
          // 'Showing :' -> 'Affichage :'
          sizeLabel: '@.capitalize:common.showing :',
          // 'previous page' -> 'Page précédente' (inversion de l'ordre pour la fluidité)
          previous: '@.capitalize:common.page @:common.previous',
          // 'next page' -> 'Page suivante' (inversion de l'ordre pour la fluidité)
          next: '@.capitalize:common.page @:common.next',
          // 'go to page :' -> 'Aller à la page :'
          goToLabel: '@.capitalize:common.go  @:common.la @:common.page :',
          // '{total} rows' -> '{total} lignes' (le total est placé en premier)
          totalRows: ' sur {total} @:common.rows',
        },
    
        search: {
          filters: '@.capitalize:common.no @:common.filter | @.capitalize:common.filter | @.capitalize:common.filter ({count})',
        },
    
        entity: {
          nav: '{entity} / ',
          list: {
            nav: '@.capitalize:common.list',
          },
          create: {
            nav: '@.capitalize:common.new',
            submitLabel: '@.capitalize:common.create {entity}',
          },
          update: {
            nav: '@.capitalize:common.update',
            submitLabel: '@.capitalize:common.update {entity}',
          },
          details: {
            nav: '@.capitalize:common.details',
          },
        },
    
        button: {
          // 'Add new {entity}' -> 'Ajouter une nouvelle {entity}'
          addEntity: '@.capitalize:common.add @:common.new @:common.entity',
          applySearch: '@.capitalize:common.apply',
          // 'Back to list' -> 'Retour à la liste'
          backToList: '@.capitalize:common.back à la @:common.list',
          backToListDescription: '@.capitalize:common.return à la @:common.view @:common.list',
          go: '@.capitalize:common.go',
          delete: '@.capitalize:common.delete',
          update: '@.capitalize:common.update',
          create: '@.capitalize:common.create',
          cancel: '@.capitalize:common.cancel',
        },
    
        settings: {
          layout: '@.capitalize:common.layout',
          theme: '@.capitalize:common.theme',
          general: '@.capitalize:common.general',
          language: '@.capitalize:common.language',
          pageTitle: '@.capitalize:common.settings',
        },

        // Définitions d’entités (scalable)
        entities: {
          {{#each entities}}
          {{#if !this.isView}}
          ${minStart(this.className)}: {
            name: '${minStart(this.className)} | ${minStart(this.className)}s',
            nav: {
              title: '@.capitalize:entities.${minStart(this.className)}.name',
              create: '@.capitalize:common.create @.capitalize:entities.${minStart(this.className)}.name',
              list: '@.capitalize:entities.${minStart(this.className)}.name @:common.list',
            },
          },{{/if}}
          {{/each}}
        },
        views: {
          {{#each entities}}
          {{#if this.isView}}
          ${minStart(this.className)}: {
            name: '${minStart(this.className)} | ${minStart(this.className)}s',
            nav: {
              title: '@.capitalize:views.${minStart(this.className)}.name',
              list: '@.capitalize:views.${minStart(this.className)}.name @:common.list',
            },
          },{{/if}}
          {{/each}}
        },

        error: {
          400: 'Requête invalide',
          403: 'Interdit',
          404: 'Introuvable',
          500: 'Erreur 500',
        },
      },

      // Formatage des dates
      dateTimeFormats: {
        short: { year: 'numeric', month: 'short', day: 'numeric' },
        long: { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' },
        time: { hour: '2-digit', minute: '2-digit' },
        full: {
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          weekday: 'long',
          hour: '2-digit',
          minute: '2-digit',
        },
      },

      // Formatage des nombres
      numberFormats: {
        currency: {
          style: 'currency',
          currency: 'EUR',
          currencyDisplay: 'symbol', // 1 234,56 €
        },
        decimal: {
          style: 'decimal',
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        },
        percent: {
          style: 'percent',
          useGrouping: true, // 88 %
        },
      },
    }

    export default french