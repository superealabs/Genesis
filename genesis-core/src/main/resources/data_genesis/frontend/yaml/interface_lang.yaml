- id: 1
  name: "English"
  locale: "en"
  content: |
    const english = {
      messages: {
        projectName: '${projectName}',
        common: {
          update: 'Update',
          delete: 'Delete',
          create: 'Create',
          details: 'Details',
          list: 'List',
          new: 'New',
          actions: 'Actions',
          back: 'Back',
        },

        navbar: {
          core: 'Core',
          entities: 'Entities',
          views: 'Views',
          settings: 'Settings',
          home: 'Home',
          entityName: '@.capitalize:{entity}',
        },

        authentication: {
          login: 'Login',
          logout: 'Logout',
          register: 'Register',
          profile: 'Profile',
          password: 'Password',
        },

        home: {
          greet: 'Hello',
          greetDeveloper: '@.capitalize:home.greet Developer',
          welcome: 'Welcome on @.capitalize:projectName frontend app',
          titles: {
            entities: 'List of entities',
            views: 'List of views',
          },
        },

        pagination: {
          sizeLabel: 'Showing :',
          previous: 'Previous',
          next: 'Next',
          goToLabel: 'Going to page:',
          pageOf: 'Page {page} of {total}',
        },

        search: {
          filters: 'No filter | Filters | Filters ({count})',
        },

        entity: {
          nav: '{entity} / ',
          list: {
            nav: '@:common.list',
          },
          create: {
            nav: '@:common.new',
            submitLabel: '@:common.create {entity}',
          },
          update: {
            nav: '@:common.update',
            submitLabel: '@:common.update {entity}',
          },
          details: {
            nav: '@:common.details',
          },
        },

        // Generic button labels
        button: {
          addEntity: 'Add new {entity}',
          applySearch: 'Apply',
          go: 'GO',
          backToList: 'Back to list',
          backToListDescription: 'Return to the list view',
        },

        // Entity definitions (scalable for many entities)
        entities: {
          {{#each entities}}
          {{#if !this.isView}}
          ${minStart(this.className)}: {
            name: '${minStart(this.className)} | ${minStart(this.className)}s',
            nav: {
              title: '@.capitalize:entities.${minStart(this.className)}.name',
              create: '@:common.create @.capitalize:entities.${minStart(this.className)}.name',
              list: '@.capitalize:entities.${minStart(this.className)}.name @:common.list',
            },
          },{{/if}}
          {{/each}}
        },
        views: {
          {{#each entities}}
          {{#if this.isView}}
          ${minStart(this.className)}: {
            name: '${minStart(this.className)} | ${minStart(this.className)}s',
            nav: {
              title: '@.capitalize:views.${minStart(this.className)}.name',
              list: '@.capitalize:views.${minStart(this.className)}.name @:common.list',
            },
          },{{/if}}
          {{/each}}
        },

        error: {
          400: 'Bad request',
          403: 'Forbidden',
          404: 'Not found',
          500: 'Error 500',
        },
      },

      // DateTime formatting
      dateTimeFormats: {
        short: { year: 'numeric', month: 'short', day: 'numeric' },
        long: { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' },
        time: { hour: '2-digit', minute: '2-digit' },
        full: {
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          weekday: 'long',
          hour: '2-digit',
          minute: '2-digit',
        },
      },

      // Number formatting
      numberFormats: {
        currency: {
          style: 'currency',
          currency: 'USD',
          currencyDisplay: 'symbol', // $1,234.56
        },
        decimal: {
          style: 'decimal',
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        },
        percent: {
          style: 'percent',
          useGrouping: true,
        },
      },
    }

    export default english
