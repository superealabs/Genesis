# ─────────────────────────────────────────────────────────────
#  Passerelle du site Genesis (conteneur « gateway »)
#   /               → site Nuxt
#   /siteback/      → Siteback  (lecture libre, écriture = mot de passe admin)
#   /genesis-api/   → genesis-api (seulement les routes du Playground)
#   /admin          → mot de passe (fichier deploy/.htpasswd)
# ─────────────────────────────────────────────────────────────

# 10 demandes / minute / adresse IP pour l'Assistant IA et la génération
limit_req_zone $binary_remote_addr zone=lourd:10m rate=10r/m;

# Adresse réelle du visiteur, transmise par le Nginx du VPS
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;          # photos, PDF de la charte, logo / favicon du Playground

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # ─── Administration ───
    location = /admin  { auth_basic "Administration Genesis"; auth_basic_user_file /etc/nginx/.htpasswd; proxy_pass http://web:3000; }
    location ^~ /admin/ { auth_basic "Administration Genesis"; auth_basic_user_file /etc/nginx/.htpasswd; proxy_pass http://web:3000; }

    # Envoi de fichiers et écriture des pages : réservés à l'admin
    location = /api/upload {
        auth_basic "Administration Genesis"; auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://web:3000;
    }
    location = /api/content-file {
        limit_except GET { auth_basic "Administration Genesis"; auth_basic_user_file /etc/nginx/.htpasswd; }
        proxy_pass http://web:3000;
    }
    # Choix d'un dossier du serveur : jamais en ligne
    location ^~ /api/folders { return 403; }

    # Génération du .zip (Playground) : limitée, peut durer
    location = /api/generate {
        limit_req zone=lourd burst=3 nodelay;
        proxy_read_timeout 300s;
        proxy_pass http://web:3000;
    }

    # ─── Siteback : tout le monde lit, seul l'admin modifie ───
    location ^~ /siteback/ {
        limit_except GET { auth_basic "Administration Genesis"; auth_basic_user_file /etc/nginx/.htpasswd; }
        proxy_pass http://siteback:9000;      # garde le chemin /siteback/...
    }

    # ─── genesis-api : routes dangereuses bloquées ───
    # (connexion à une base, SQL, Git, écriture sur le disque, génération directe, mode connecté)
    location ~ ^/genesis-api/api/(database/test-connection|databases/config|generator/database-config|database/|generator/sql/|generator/git/|generator/project-config|project/config|generator/launch|generator/script/launch|generator/generation-parameters|generator/relation-parameters|generator/profiles|generator/reset|tables_metadata|relations|generation/modes/select|generator/frontend/assets) {
        return 403;
    }
    # Assistant IA : coûte des appels à Groq
    location = /genesis-api/api/generator/script/generate-sql {
        limit_req zone=lourd burst=3 nodelay;
        proxy_read_timeout 120s;
        proxy_pass http://genesis-api:8081/api/generator/script/generate-sql;
    }
    # Sans « ^~ » : la liste des routes bloquées (regex ci-dessus) est vérifiée en premier
    location /genesis-api/ {
        proxy_pass http://genesis-api:8081/;  # /genesis-api/api/... → /api/...
    }

    # ─── Site ───
    location / {
        proxy_pass http://web:3000;
    }
}
