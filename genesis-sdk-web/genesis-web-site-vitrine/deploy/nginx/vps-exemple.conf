# ─────────────────────────────────────────────────────────────
#  À mettre dans le Nginx DÉJÀ installé sur le VPS (celui des autres sites),
#  par exemple /etc/nginx/sites-available/genesis.conf, puis :
#    sudo ln -s /etc/nginx/sites-available/genesis.conf /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d genesis.exemple.com        # HTTPS (Let's Encrypt)
#
#  Remplacer genesis.exemple.com par le domaine, et 8080 par HTTP_PORT du fichier .env
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name genesis.exemple.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;          # génération du .zip
    }
}
